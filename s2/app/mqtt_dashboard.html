<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดทั้งห้อง</title>
<style>
  /* ชุดสีและรูปแบบเดียวกันทั้งสามหน้าใน s2/app (farm_web, mqtt_dashboard, my_first_reader)
     แต่ละไฟล์เปิดเดี่ยว ๆ ได้ จึงใส่ CSS ไว้ในไฟล์เอง ไม่แยกเป็นไฟล์ .css */
  :root {
    color-scheme: light dark;
    --bg: #f3f6f2; --surface: #ffffff; --surface-2: #eef3ee; --line: #d9e1d8;
    --ink: #17211b; --dim: #5d6b62; --accent: #1e8a4c; --accent-ink: #ffffff;
    --water: #1f6fd1; --warn: #a86a12; --ok: #1e8a4c; --bad: #c0392b;
    --shadow: 0 1px 2px rgba(23, 33, 27, .06), 0 4px 14px rgba(23, 33, 27, .06);
    --radius: 14px; --radius-sm: 10px;
    --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", "Leelawadee UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --surface: #171e1a; --surface-2: #1f2823; --line: #2c3731;
      --ink: #e7eee9; --dim: #93a299; --accent: #4cc282; --accent-ink: #08170e;
      --water: #6aa8f0; --warn: #e3b341; --ok: #4cc282; --bad: #f08a80;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
  /* แถบบน: ชื่อหน้า + ทีม + สถานะการเชื่อมต่อ */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; }
  .sub { margin: 2px 0 0; color: var(--dim); font-size: 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  h2 .hint { font-size: 13px; font-weight: 400; color: var(--dim); }
  .conn { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  /* ชิปสถานะ: จุดสีตามสีตัวอักษร สคริปต์ตั้ง style.color อยู่แล้ว จุดจึงเปลี่ยนตามเอง */
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--dim); font-size: 14px; font-weight: 600;
    max-width: 100%; overflow-wrap: anywhere; }
  .chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .muted { color: var(--dim); }
  .small { font-size: 13px; }
  /* ปุ่มและช่องกรอก: สูงพอให้กดด้วยนิ้วบนมือถือ */
  button, input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); }
  button { min-height: 42px; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--surface-2); cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s, transform .05s; }
  button:hover { border-color: var(--dim); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.water { background: var(--water); border-color: var(--water); color: #fff; }
  button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  input[type="text"], input:not([type]), input[type="number"], select, textarea {
    min-height: 42px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--surface); max-width: 100%; }
  code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
  .log { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: var(--mono);
    font-size: 13px; padding: 10px 12px; overflow-wrap: anywhere; }
  /* ---- เฉพาะหน้านี้ ---- */
  .wrap > section, .split { margin-bottom: 16px; }
  .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 980px) { .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); } }
  #teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .team { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px;
    min-width: 0; overflow-wrap: anywhere; cursor: pointer; transition: opacity .3s, border-color .15s; }
  .team:hover { border-color: var(--accent); }
  .team.stale { opacity: .45; }
  .team h3 { margin: 0 0 8px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .team h3 > span:first-child::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: var(--ok); margin-right: 8px; vertical-align: middle; }
  .team.stale h3 > span:first-child::before { background: var(--dim); }
  .seen { font-size: 12px; color: var(--dim); font-weight: 400; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; }
  .kv .k { color: var(--dim); }
  .kv .v { font-weight: 600; font-family: var(--mono); overflow-wrap: anywhere; }
  .ev { margin-top: 8px; font-size: 12px; color: var(--dim); font-family: var(--mono); overflow-wrap: anywhere; }
  .empty { color: var(--dim); margin: 0; }
  #log { height: 320px; overflow-y: auto; }
  #log .row { padding: 3px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #log .t { color: var(--dim); }
  #log .tp { color: var(--water); }
  #log .row.out .tp { color: var(--ok); }
  textarea { width: 100%; min-height: 80px; font-family: var(--mono); font-size: 14px; }
  #sendMsg { font-size: 14px; overflow-wrap: anywhere; }
  #status { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </div>
    <div><h1>แดชบอร์ดทั้งห้อง</h1><p class="sub">ทุกทีมในห้องเดียว · คลิกการ์ดเพื่อเลือกทีมที่จะส่งคำสั่ง</p></div>
  </div>
  <div class="conn">
    <label class="bar" for="broker"><span class="muted small">โบรกเกอร์</span>
      <select id="broker">
        <option value="wss://broker.hivemq.com:8884/mqtt">HiveMQ (หลัก)</option>
        <option value="wss://test.mosquitto.org:8081/mqtt">Mosquitto (สำรอง)</option>
        <option value="wss://broker.emqx.io:8084/mqtt">EMQX (สำรองที่ 2)</option>
      </select>
    </label>
    <label class="bar" for="root"><span class="muted small">ROOT</span> <input id="root" value="bento-aiot" size="10" autocomplete="off"></label>
    <button id="connectBtn" class="primary">เชื่อมต่อ</button>
    <span id="status" class="chip" role="status">ยังไม่ได้ต่อ</span>
  </div>
</header>

<section class="panel" aria-labelledby="h-teams">
  <h2 id="h-teams">ทีม <span class="hint">การ์ดจางลงเมื่อบอร์ดเงียบเกิน 10 วินาที</span></h2>
  <div id="teams"><p class="empty">ยังไม่มีข้อมูล บอร์ดส่งค่าทุก 1-2 วินาที เปิดหน้าแล้วรอสักครู่</p></div>
</section>

<div class="split">
<section class="panel" aria-labelledby="h-send">
  <h2 id="h-send">ส่งคำสั่ง</h2>
  <div class="bar">
    <label class="bar" for="team"><span class="muted small">ทีม</span> <input id="team" value="teamXX" size="8" list="teamList" autocomplete="off"></label>
    <datalist id="teamList"></datalist>
    <button data-cmd='{"cmd":"beep"}'>บี๊บ</button>
    <label class="bar" for="ledN"><span class="muted small">LED</span> <input id="ledN" type="number" value="0" min="0" max="7" style="width:4.5em"></label>
    <button id="ledOn">เปิด</button>
    <button id="ledOff">ปิด</button>
  </div>
  <div class="bar" style="margin-top:10px">
    <input id="sayText" placeholder="ข้อความให้บอร์ดแสดง" style="flex:1; min-width:160px" maxlength="100">
    <button id="sayBtn">ส่งข้อความ (say)</button>
  </div>
  <p class="muted small" style="margin:14px 0 6px">หรือพิมพ์ JSON เอง</p>
  <textarea id="freeJson" spellcheck="false">{"cmd":"led","n":1,"on":1}</textarea>
  <div class="bar" style="margin-top:8px">
    <button id="freeBtn" class="primary">ส่ง JSON</button>
    <span id="sendMsg"></span>
  </div>
</section>

<section class="panel" aria-labelledby="h-log">
  <h2 id="h-log">ข้อความล่าสุด <span class="hint">(เก็บ 200 บรรทัดสุดท้าย)</span></h2>
  <div class="bar" style="margin-bottom:8px"><button id="clearLog">ล้าง</button>
    <label class="bar small"><input id="pause" type="checkbox"> หยุดเลื่อน</label></div>
  <div id="log" class="log"></div>
</section>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"
        integrity="sha384-9WWboT9UtuPFRlOLq4FygQkcJxzYcpz8SXGkNyCEXM+44n14xzjNlrRKYZwuF/A6" crossorigin="anonymous"></script>
<script>
// โบรกเกอร์สาธารณะ ใครก็ส่งอะไรมาก็ได้
// เพราะฉะนั้นทุกอย่างที่มาจากข้อความ ใส่หน้าเว็บด้วย textContent เท่านั้น ห้ามใช้ innerHTML
const MAX_LOG = 200;          // เก็บ log กี่บรรทัด
const MAX_SHOW = 300;         // ตัดข้อความยาวเกินกี่ตัวอักษร
const STALE_SEC = 10;         // เงียบเกินกี่วินาทีถึงจะทำให้การ์ดจาง
const TEAM_OK = /^team\d{2}$/;             // การ์ดรับเฉพาะชื่อทีมแบบที่ผู้สอนแจก team00..team99
const SEND_OK = /^(team\d{2}|all)$/;       // ส่งได้ถึงทีมเดียว หรือ all = ทุกบอร์ดในห้อง
const ROOT_OK = /^[A-Za-z0-9_-]{1,40}$/;

const $ = (id) => document.getElementById(id);
let client = null;
let root = "bento-aiot";
const teams = new Map();      // ชื่อทีม -> { card, kv, ev, seen, last }
// เปิดด้วย ?team=team05 จะเลือกทีมในช่องส่งคำสั่งให้เลย
const qsTeam = new URLSearchParams(location.search).get("team");
if (qsTeam && SEND_OK.test(qsTeam)) $("team").value = qsTeam;

function clip(s) { return s.length > MAX_SHOW ? s.slice(0, MAX_SHOW) + " ...(ตัด)" : s; }
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function setStatus(text, color) { $("status").textContent = text; $("status").style.color = color || ""; }

function connect() {
  if (client) client.end(true);
  root = $("root").value.trim() || "bento-aiot";
  if (!ROOT_OK.test(root)) { setStatus("ROOT ใช้ได้แค่ a-z 0-9 _ -", "var(--bad)"); return; }
  const url = $("broker").value;
  setStatus("กำลังต่อ " + url + " ...");
  // client id สุ่ม ไม่ให้ชนกับบอร์ดหรือแท็บอื่น
  client = mqtt.connect(url, { clientId: "web-" + Math.random().toString(16).slice(2, 10), reconnectPeriod: 3000 });
  client.on("connect", () => {
    setStatus("ต่อแล้ว", "var(--ok)");
    // ฟังเฉพาะ telemetry กับ event ของทุกทีม ไม่ subscribe '#'
    client.subscribe([root + "/+/telemetry", root + "/+/event"]);
  });
  client.on("reconnect", () => setStatus("กำลังต่อใหม่...", "var(--bad)"));
  client.on("close", () => setStatus("หลุด", "var(--bad)"));
  client.on("error", (err) => setStatus("ผิดพลาด: " + String(err.message).slice(0, 120), "var(--bad)"));
  client.on("message", onMessage);
}

function onMessage(topic, payload) {
  const text = payload.toString();
  addLog(topic, text, false);
  const parts = topic.split("/");
  if (parts.length !== 3 || parts[0] !== root || !TEAM_OK.test(parts[1])) return;
  const t = getTeam(parts[1]);
  t.last = Date.now();
  let data = null;
  try { data = JSON.parse(text); } catch (e) { /* ไม่ใช่ JSON */ }
  if (parts[2] === "telemetry") {
    t.kv.replaceChildren();
    if (data === null || typeof data !== "object" || Array.isArray(data)) data = { raw: text };
    let count = 0;
    for (const key of Object.keys(data)) {
      if (++count > 20) break;                 // กันคนส่ง key มาเป็นพัน
      const v = typeof data[key] === "object" ? JSON.stringify(data[key]) : String(data[key]);
      t.kv.append(el("span", "k", clip(key).slice(0, 24)), el("span", "v", clip(v).slice(0, 60)));
    }
  } else {
    t.ev.textContent = "event: " + clip(text);
  }
  refreshSeen();
}

function getTeam(name) {
  if (teams.has(name)) return teams.get(name);
  if (teams.size === 0) $("teams").replaceChildren();
  if (teams.size >= 60) return { kv: el("div"), ev: el("div"), seen: el("span") };   // กันการ์ดล้นจอ
  const card = el("div", "team");
  const h = el("h3");
  const seen = el("span", "seen");
  h.append(el("span", "", name), seen);
  const kv = el("div", "kv");
  const ev = el("div", "ev");
  card.append(h, kv, ev);
  card.addEventListener("click", () => { $("team").value = name; });
  // เรียงการ์ดตามชื่อทีม
  const after = [...teams.keys()].sort().find((k) => k > name);
  $("teams").insertBefore(card, after ? teams.get(after).card : null);
  const opt = el("option"); opt.value = name; $("teamList").append(opt);
  const t = { card, kv, ev, seen, last: 0 };
  teams.set(name, t);
  return t;
}

function refreshSeen() {
  const now = Date.now();
  for (const t of teams.values()) {
    if (!t.card) continue;
    const sec = Math.round((now - t.last) / 1000);
    t.seen.textContent = sec + " วินาทีก่อน";
    t.card.classList.toggle("stale", sec > STALE_SEC);
  }
}
setInterval(refreshSeen, 1000);

function addLog(topic, text, outgoing) {
  const row = el("div", outgoing ? "row out" : "row");
  row.append(el("span", "t", new Date().toLocaleTimeString("th-TH") + " "),
             el("span", "tp", (outgoing ? "ส่ง -> " : "") + clip(topic)), document.createTextNode(" " + clip(text)));
  const log = $("log");
  log.append(row);
  while (log.childElementCount > MAX_LOG) log.firstElementChild.remove();
  if (!$("pause").checked) log.scrollTop = log.scrollHeight;
}

function send(obj) {
  const team = $("team").value.trim();
  if (!SEND_OK.test(team)) { showSend("ใส่ทีมเป็น team ตามด้วยเลขสองหลัก เช่น team05 (หรือ all = ทุกบอร์ด)", true); return; }
  if (!client || !client.connected) { showSend("ยังไม่ได้เชื่อมต่อ", true); return; }
  const topic = root + "/" + team + "/cmd";
  const text = JSON.stringify(obj);
  // บอร์ดรับ payload ได้ไม่เกิน 255 ไบต์ ยาวกว่านั้นถูกตัด
  if (new TextEncoder().encode(text).length > 255) { showSend("ยาวเกิน 255 ไบต์ บอร์ดจะได้ไม่ครบ", true); return; }
  client.publish(topic, text);
  addLog(topic, text, true);
  showSend("ส่งแล้ว: " + text, false);
}
function showSend(msg, bad) { $("sendMsg").textContent = msg; $("sendMsg").style.color = bad ? "var(--bad)" : "var(--ok)"; }

function ledN() { return Math.max(0, parseInt($("ledN").value, 10) || 0); }
document.querySelectorAll("button[data-cmd]").forEach((b) =>
  b.addEventListener("click", () => send(JSON.parse(b.dataset.cmd))));
$("ledOn").addEventListener("click", () => send({ cmd: "led", n: ledN(), on: 1 }));
$("ledOff").addEventListener("click", () => send({ cmd: "led", n: ledN(), on: 0 }));
$("sayBtn").addEventListener("click", () => send({ cmd: "say", text: $("sayText").value }));
$("freeBtn").addEventListener("click", () => {
  let obj;
  // ตรวจ JSON ก่อนส่ง ถ้าพิมพ์ผิดจะบอก ไม่ส่งของเสียออกไป
  try { obj = JSON.parse($("freeJson").value); } catch (e) { showSend("JSON ไม่ถูกต้อง: " + e.message, true); return; }
  if (obj === null || typeof obj !== "object" || Array.isArray(obj)) { showSend("ต้องเป็น object เช่น {\"cmd\":\"beep\"}", true); return; }
  send(obj);
});
$("connectBtn").addEventListener("click", connect);
$("clearLog").addEventListener("click", () => $("log").replaceChildren());
connect();
</script>
</body>
</html>
