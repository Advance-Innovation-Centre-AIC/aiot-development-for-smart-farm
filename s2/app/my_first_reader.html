<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>อ่านค่าจากบอร์ด</title>
<style>
  /* ชุดสีและรูปแบบเดียวกันทั้งสามหน้าใน s2/app (farm_web, mqtt_dashboard, my_first_reader)
     แต่ละไฟล์เปิดเดี่ยว ๆ ได้ จึงใส่ CSS ไว้ในไฟล์เอง ไม่แยกเป็นไฟล์ .css */
  :root {
    color-scheme: light dark;
    --bg: #f3f6f2; --surface: #ffffff; --surface-2: #eef3ee; --line: #d9e1d8;
    --ink: #17211b; --dim: #5d6b62; --accent: #1e8a4c; --accent-ink: #ffffff;
    --water: #1f6fd1; --warn: #a86a12; --ok: #1e8a4c; --bad: #c0392b;
    --shadow: 0 1px 2px rgba(23, 33, 27, .06), 0 4px 14px rgba(23, 33, 27, .06);
    --radius: 14px; --radius-sm: 10px;
    --font: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", "Leelawadee UI", sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1412; --surface: #171e1a; --surface-2: #1f2823; --line: #2c3731;
      --ink: #e7eee9; --dim: #93a299; --accent: #4cc282; --accent-ink: #08170e;
      --water: #6aa8f0; --warn: #e3b341; --ok: #4cc282; --bad: #f08a80;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 16px; }
  /* แถบบน: ชื่อหน้า + ทีม + สถานะการเชื่อมต่อ */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; margin-bottom: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; }
  .sub { margin: 2px 0 0; color: var(--dim); font-size: 14px; }
  h2 { font-size: 17px; margin: 0 0 12px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  h2 .hint { font-size: 13px; font-weight: 400; color: var(--dim); }
  .conn { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  /* ชิปสถานะ: จุดสีตามสีตัวอักษร สคริปต์ตั้ง style.color อยู่แล้ว จุดจึงเปลี่ยนตามเอง */
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line); color: var(--dim); font-size: 14px; font-weight: 600;
    max-width: 100%; overflow-wrap: anywhere; }
  .chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 16px; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .muted { color: var(--dim); }
  .small { font-size: 13px; }
  /* ปุ่มและช่องกรอก: สูงพอให้กดด้วยนิ้วบนมือถือ */
  button, input, select, textarea { font: inherit; font-size: 15px; color: var(--ink); }
  button { min-height: 42px; padding: 8px 14px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--surface-2); cursor: pointer; font-weight: 600; transition: background .15s, border-color .15s, transform .05s; }
  button:hover { border-color: var(--dim); }
  button:active { transform: translateY(1px); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.water { background: var(--water); border-color: var(--water); color: #fff; }
  button.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  input[type="text"], input:not([type]), input[type="number"], select, textarea {
    min-height: 42px; padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--surface); max-width: 100%; }
  code { font-family: var(--mono); font-size: .92em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
  .log { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); font-family: var(--mono);
    font-size: 13px; padding: 10px 12px; overflow-wrap: anywhere; }
  /* ---- เฉพาะหน้านี้ ---- */
  .wrap > section { margin-bottom: 16px; }
  .conn { margin: 0; color: var(--dim); }
  #values { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-items: start; }
  #values:empty::before { content: "ยังไม่มีค่า รอบอร์ดส่งรอบถัดไป"; color: var(--dim); font-size: 14px; }
  .box { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px;
    overflow-wrap: break-word; min-width: 0; }
  .name { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .num { font-size: clamp(22px, 5vw, 30px); font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; overflow-wrap: break-word; }
  #event { overflow-wrap: anywhere; }
  #status { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/></svg>
    </div>
    <div><h1>บอร์ดของเรา</h1><p class="sub">ตัวอ่านค่าตัวแรก · ฟังค่าที่บอร์ดส่งมาแล้ววาดเป็นกล่อง</p></div>
  </div>
  <p class="conn">สถานะ: <b id="status" class="chip" role="status">กำลังต่อ...</b></p>
</header>

<section class="panel">
  <h2>ค่าจากบอร์ด</h2>
  <div id="values"></div>
</section>

<section class="panel">
  <h2>เหตุการณ์ล่าสุด</h2>
  <div id="event" class="log">(ยังไม่มี)</div>
</section>

<section class="panel">
  <h2>สั่งบอร์ด</h2>
  <p class="bar">
    <button onclick="send({ cmd: 'beep' })">ส่งเสียงบี๊บ</button>
    <button onclick="send({ cmd: 'led', n: 0, on: 1 })" class="primary">เปิดไฟ LED 0</button>
    <button onclick="send({ cmd: 'led', n: 0, on: 0 })">ปิดไฟ LED 0</button>
  </p>
</section>
</div>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.16.0/dist/mqtt.min.js"
        integrity="sha384-9WWboT9UtuPFRlOLq4FygQkcJxzYcpz8SXGkNyCEXM+44n14xzjNlrRKYZwuF/A6" crossorigin="anonymous"></script>
<script>
// ----- แก้ตรงนี้ -----
const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
// สำรอง ถ้าตัวบนต่อไม่ได้: "wss://test.mosquitto.org:8081/mqtt"
let TEAM = "teamXX";          // ทีมของคุณ ตามที่อาจารย์แจก เช่น "team05"
const ROOT = "bento-aiot";    // ชื่อนำหน้าของทั้งห้อง ไม่ต้องแก้
// ----------------------

// ถ้าเปิดจากเว็บ ใส่ทีมท้ายลิงก์ได้เลย เช่น my_first_reader.html?team=team05
const fromUrl = new URLSearchParams(location.search).get("team");
if (fromUrl) TEAM = fromUrl;
const statusEl = document.getElementById("status");
// รับเฉพาะ team01..team99 (team00 เป็นบอร์ดของอาจารย์) ไม่ใช่ก็หยุดตรงนี้ ไม่ต่อโบรกเกอร์เลย
if (!/^team\d{2}$/.test(TEAM) || TEAM === "team00") {
  statusEl.textContent = "ยังไม่รู้ว่าคุณทีมไหน ใส่ ?team=team05 ต่อท้ายลิงก์ (เปลี่ยน 05 เป็นเลขทีมคุณ) หรือแก้ TEAM ในไฟล์";
  statusEl.style.color = "var(--bad)";
  throw new Error("TEAM not set");
}
// client id สุ่มใหม่ทุกครั้ง ถ้าซ้ำกับบอร์ด โบรกเกอร์จะเตะบอร์ดหลุด
const client = mqtt.connect(BROKER_URL, { clientId: "web-" + Math.random().toString(16).slice(2, 10) });

client.on("connect", () => {
  statusEl.textContent = "ต่อแล้ว (" + ROOT + "/" + TEAM + ")";
  statusEl.style.color = "var(--ok)";
  client.subscribe(ROOT + "/" + TEAM + "/#");   // ฟังเฉพาะทีมเรา ไม่ฟัง # ของทั้งโบรกเกอร์
});
client.on("close", () => { statusEl.textContent = "หลุด กำลังต่อใหม่..."; statusEl.style.color = "var(--bad)"; });
client.on("error", (err) => { statusEl.textContent = "ผิดพลาด: " + err.message; });

client.on("message", (topic, payload) => {
  const text = payload.toString();
  let data = null;
  try { data = JSON.parse(text); } catch (e) { /* ไม่ใช่ JSON ก็แสดงเป็นข้อความดิบ */ }
  if (topic.endsWith("/telemetry")) showValues(data, text);
  else if (topic.endsWith("/event")) document.getElementById("event").textContent = text.slice(0, 200);
});

// วาดกล่องหนึ่งกล่องต่อหนึ่ง key จะเป็น knob, az, presses หรืออะไรก็ได้
function showValues(data, text) {
  const values = document.getElementById("values");
  values.replaceChildren();
  if (data === null || typeof data !== "object") data = { raw: text };
  for (const key of Object.keys(data).slice(0, 20)) {    // ไม่เกิน 20 ช่อง กันคนส่งมาเป็นพัน
    const box = document.createElement("div"), name = document.createElement("div"), num = document.createElement("div");
    box.className = "box"; name.className = "name"; num.className = "num";
    name.textContent = key;
    num.textContent = String(data[key]).slice(0, 40);   // textContent ปลอดภัย ใครส่งอะไรมาก็ไม่รันเป็นโค้ด
    box.append(name, num);
    values.append(box);
  }
}

function send(obj) {
  client.publish(ROOT + "/" + TEAM + "/cmd", JSON.stringify(obj));
}

/* ----- ตาคุณ -----
 1. ให้ตัวเลขเปลี่ยนเป็นสีแดงเมื่อค่าเกินเกณฑ์ เช่น knob เกิน 80
    ใบ้: ใน showValues ถ้า key === "knob" && data[key] > 80 ให้ตั้ง num.style.color
 2. แสดงว่า "ข้อความล่าสุดมาเมื่อ N วินาทีก่อน" เพื่อรู้ว่าบอร์ดเงียบไปแล้ว
    ใบ้: จำเวลาไว้ตอนได้ข้อความ แล้วใช้ setInterval อัปเดตทุกวินาที
    หมายเหตุ: เฟิร์มแวร์เก็บข้อความค้างไว้ที่โบรกเกอร์ไม่ได้ (ไม่มี retain)
    เปิดหน้าใหม่จะว่างจนกว่าบอร์ดจะส่งรอบถัดไป เป็นเรื่องปกติ
 3. เพิ่มปุ่มเปิด/ปิด LED ดวงอื่น เช่น n: 1
*/
</script>
</body>
</html>
