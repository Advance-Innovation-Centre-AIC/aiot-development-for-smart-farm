<li>เลือกเรื่องจาก <strong>ลิงก์ / QR Code ที่อาจารย์แจ้งในคาบ</strong> · <strong>ใครกดก่อนได้ก่อน</strong> เห็นผลทันทีทุกเครื่อง</li>
