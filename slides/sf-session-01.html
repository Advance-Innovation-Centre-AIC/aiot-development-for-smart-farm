<div style="background:#1565c0"><b>Cortex-M33 · ฝั่ง Non-secure</b> 200 MHz<br />WiFi · MQTT · TLS · OPTIGA</div>
<div style="background:#6a1b9a"><b>Cortex-M55</b> 400 MHz + NPU Ethos-U55<br />จอแสดงผล · Edge AI</div>
</div>
</div>
<div class="legend">
<p><strong>บอร์ดสองชั้น:</strong> บอร์ดฐาน TESAIoT + โมดูล (SoM) <strong>Infineon KIT_PSE84_AI</strong> ที่มีชิป <strong>PSoC™ Edge E84</strong> — ข้างในมี M33 (แบ่งสองฝั่งความปลอดภัย) + M55 + NPU</p>
<ul>
<li><span class="n g">1</span><b>จอสัมผัส 4.3 นิ้ว</b> — โมดูล <code>ui</code> · ทุกกิจกรรม</li>
<li><span class="n o">2</span><b>SoM</b> — ชิป PSoC Edge E84, หน่วยความจำ, วิทยุ WiFi</li>
<li><span class="n g">3</span><b>เซนเซอร์บน SoM</b> — SHT40 อุณหภูมิ/ความชื้น · DPS368 ความกด · BMI270 IMU · เข็มทิศ · เรดาร์ 60 GHz · ไมค์ · ลำโพง — กิจกรรม 1 2 4</li>
<li><span class="n o">4</span><b>mikroBUS ×3 + Arduino header</b> — ต่อเซนเซอร์เพิ่มในโปรเจกต์</li>
<li><span class="n o">5</span><b>CAN / RS-485</b> — สายสื่อสารของเครื่องจักรในงานจริง</li>
<li><span class="n g">6</span><b>CapSense + ลูกบิด VR1–VR4 + ปุ่ม SW5/SW6</b> — กิจกรรม 1 3 4 ภารกิจ</li>
<li><span class="n g">7</span><b>จอไฟ RGB 16×8 จุด</b> — ทุกกิจกรรม</li>
<li><span class="n o">8</span><b>OPTIGA™ Trust M</b> — ชิปเก็บกุญแจความปลอดภัย (โมดูลเสียบเพิ่ม)</li>
</ul>
</div>
</div>
</section>

<h2 id="%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89--%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B9%83%E0%B8%99%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1%E0%B9%84%E0%B8%AB%E0%B8%99">ของบนบอร์ดที่ใช้วันนี้ — ใช้ในกิจกรรมไหน</h2>

<table>
<thead>
<tr>
<th>ของบนบอร์ด</th>
<th>ในโค้ด</th>
<th>ในฟาร์มใช้ทำอะไร</th>
<th>กิจกรรม</th>
</tr>
</thead>
<tbody>
<tr>
<td><img class="emoji" draggable="false" alt="🌡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f321.svg" data-marp-twemoji=""/> เซนเซอร์อุณหภูมิ/ความชื้น <strong>SHT40</strong></td>
<td><code>sensors.sht40</code></td>
<td>อากาศในโรงเรือน</td>
<td>1 · 2 · ภารกิจ</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="⛅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/26c5.svg" data-marp-twemoji=""/> เซนเซอร์ความกดอากาศ <strong>DPS368</strong></td>
<td><code>sensors.dps368</code></td>
<td>เดาว่าฝนจะมา</td>
<td>1</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> IMU <strong>BMI270</strong> (ความเร่ง 3 แกน + ไจโร)</td>
<td><code>sensors.bmi270.motion()</code></td>
<td>มุมเอียง แรงกระแทก</td>
<td>4</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>จอไฟ RGB 16×8 จุด</strong> (dot matrix)</td>
<td><code>rgbmatrix</code></td>
<td>ไฟสถานะที่เห็นจากอีกฝั่งห้อง</td>
<td>ทุกกิจกรรม</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🎛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f39b.svg" data-marp-twemoji=""/> ลูกบิด <strong>VR1–VR4</strong></td>
<td><code>pots.read(0)</code> … <code>pots.read(3)</code></td>
<td>แทนเซนเซอร์ที่ยังไม่มี: ความชื้นดิน น้ำในถัง</td>
<td>3 · ภารกิจ</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔘" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f518.svg" data-marp-twemoji=""/> ปุ่ม <strong>SW5</strong> (ล่าง), <strong>SW6</strong> (บน) บนฐานบอร์ด</td>
<td><code>buttons.pressed(0)</code>, <code>buttons.pressed(1)</code></td>
<td>สั่งปั๊มเอง ตั้งศูนย์ ล้างตัวนับ</td>
<td>1 · 3 · 4 · ภารกิจ</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4a1.svg" data-marp-twemoji=""/> ไฟ LED สีบนโมดูล SoM (RGB_RED / RGB_BLUE)</td>
<td><code>gpio.led(...)</code></td>
<td>ไฟแดง = พืช/แท็งก์มีปัญหา · ไฟฟ้า = ปั๊มเดิน (คนละอย่างกับจอไฟ RGB 16×8)</td>
<td>2 · 3 · 4 · ภารกิจ</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🔊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50a.svg" data-marp-twemoji=""/> ลำโพง</td>
<td><code>ui.sfx(...)</code>, <code>ui.tone(...)</code></td>
<td>เสียงเตือน เสียงยืนยัน</td>
<td>ทุกกิจกรรม</td>
</tr>
<tr>
<td><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f5a5.svg" data-marp-twemoji=""/> จอสัมผัส</td>
<td><code>ui</code></td>
<td>แผงหน้าปัดฟาร์ม</td>
<td>ทุกกิจกรรม</td>
</tr>
</tbody>
</table>
<div class="src">SW5 (ปุ่มล่าง) = P17.5 · SW6 (ปุ่มบน) = P17.7 · VR1–VR4 = <code>pots.read(0)</code>–<code>pots.read(3)</code> ค่า 0–4095 · จอไฟ RGB = DFR0522 ที่ I²C 0x10 · ข้อมูลฮาร์ดแวร์: TESAIoT Dev Kit SDK — tesaiot.github.io/tesaiot-pse84-devkit-sdk</div>
<div class="warn">
<p><strong>SW2</strong> บนฐานบอร์ดคือ <strong>สวิตช์ตัดไฟ</strong> ไม่ใช่ปุ่มของเรา — <strong>ห้ามโยก</strong> · ลำโพงดังพร้อมกัน 20 กลุ่มจะรบกวนกัน โค้ดทุกไฟล์จึงส่งเสียง <strong>เฉพาะตอนมีเหตุการณ์</strong></p>
</div>
</section>

<h2 id="%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87-tesaiot-pse84-programmer--%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%99%E0%B8%97%E0%B8%B3%E0%B9%80%E0%B8%AD%E0%B8%87">ติดตั้ง TESAIoT PSE84 Programmer — ทุกคนทำเอง</h2>
<div class="cols">
<div class="c55">
<div class="step"><span class="num">1</span><div>
<p><strong>ดาวน์โหลด + ติดตั้ง</strong> TESAIoT PSE84 Programmer (รุ่นล่าสุด v1.0.2)<br />
<a href="https://github.com/wiroon/TESAIoT_PSE84_Programmer/releases">https://github.com/wiroon/TESAIoT_PSE84_Programmer/releases</a><br />
macOS → ไฟล์ <code>…_universal.dmg</code> · Windows → ไฟล์ <code>…_x64-setup.exe</code> (หรือ <code>.msi</code>)</p>
</div></div>
<div class="step"><span class="num">2</span><div>
<p><strong>เปิดแอปค้างไว้</strong> แล้วสลับเป็นโหมด <strong>Remote</strong> — หน้า IDE จะจับคู่กับแอปนี้เพื่อแฟลชบอร์ดผ่าน USB</p>
</div></div>
<div class="step"><span class="num">3</span><div>
<p><strong>เสียบ USB-C</strong> เข้าพอร์ต <strong>KitProg3</strong> ของบอร์ด (ใช้สายที่ส่งข้อมูลได้ · บอร์ดมี USB-C หลายช่อง — ผู้สอนจะชี้ช่อง KitProg3 บนบอร์ดจริง)</p>
</div></div>
<div class="warn">
<p><strong>เครื่องเตือนตอนเปิดแอป</strong> (macOS/Windows ถามว่าไว้ใจแอปนี้ไหม) → <strong>ยกมือเรียกผู้สอน</strong> อย่ากดข้ามเอง</p>
</div>
</div>
<div class="shot">
<p><img src="img/ide/remote_flash_step1.png" alt="" style="width:430px;" /></p>
<div class="cap">หน้าจอจริงของ BENTO IDE (ide.tesaiot.com) — Remote Flash ขั้นที่ 1: ต้องมี TESAIoT Programmer ก่อน</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-marpit-scope-sJGln9l3="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="remote-flash-v241--%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%A5%E0%B8%B0-1-%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">Remote Flash v2.4.1 — กลุ่มละ 1 บอร์ด</h2>
<div class="cols">
<div class="c45">
<div class="step"><span class="num">4</span><div>
<p>เปิด <strong>Chrome หรือ Edge</strong> → <a href="https://ide.tesaiot.com/">https://ide.tesaiot.com/</a> → หน้า <strong>Welcome</strong> → เลือก <strong>TESAIoT Dev Kit</strong> → แถบ <strong>BENTO Firmware — TESAIoT Dev Kit</strong> → <strong>Flash this board →</strong></p>
</div></div>
<div class="step"><span class="num">5</span><div>
<p><strong>I'm ready →</strong> จับคู่กับ Programmer → ตรวจว่าเป็น <strong>v2.4.1</strong> → <strong>Flash</strong> แล้วรอจนเสร็จ</p>
</div></div>
<div class="step"><span class="num">6</span><div>
<p>จอบอร์ดขึ้น <strong>v2.4.1</strong> → กด <strong>Connect</strong> ใน IDE <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/></p>
</div></div>
<div class="think">
<p><strong>แก้ปัญหาเร็ว</strong></p>
<ul>
<li>คอมไม่เห็นบอร์ด → <strong>เปลี่ยนสาย / เปลี่ยนพอร์ต USB</strong> (สายชาร์จอย่างเดียวใช้ไม่ได้)</li>
<li>จอดำหลังแฟลช/รันโค้ด → กด <strong>RESET</strong> หนึ่งครั้ง → ยังดำ: <strong>ถอดสาย USB แล้วเสียบใหม่</strong></li>
<li><strong>SW2</strong> บนฐานบอร์ด = <strong>สวิตช์ตัดไฟ</strong> ห้ามโยก/ห้ามกด</li>
</ul>
</div>
</div>
<div class="shot">
<p><img src="img/ide/ide_welcome_devkit.png" alt="" style="width:600px;" /></p>
<div class="cap">หน้าจอจริงของ BENTO IDE — หน้า Welcome เลือก TESAIoT Dev Kit แล้วกด "Flash this board →" (ภาพถ่ายเมื่อ 28 ก.ย. 2569)</div>
</div>
</div>
<blockquote>
<p>โปรแกรมแต่ละไฟล์เดิน 2–5 นาทีแล้ว <strong>จบเอง</strong> อยากเล่นต่อ กด Program to Device อีกครั้ง</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="bento-emulator--%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%88%E0%B8%B3%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%9C%E0%B8%B9%E0%B9%89%E0%B8%99%E0%B8%B3%E0%B8%97%E0%B8%B2%E0%B8%87-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99">BENTO Emulator — บอร์ดจำลองของผู้นำทาง (และการบ้าน)</h2>
<div class="cols">
<div class="c55 shot">
<p><img src="img/emu/sf1_03_auto_irrigation__dry_pump_on_full.png" alt="" style="width:450px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator ขณะรัน sf1_03 — ค่าเซนเซอร์ใน Emulator เป็นค่าจำลอง</div>
</div>
<div>
<p><strong>บนลงล่าง</strong></p>
<ol>
<li><strong>จอบอร์ด</strong> 800×480 — หน้าตาเหมือนบนบอร์ดจริง</li>
<li><strong>HARDWARE (SIMULATED)</strong> — กด <img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f50c.svg" data-marp-twemoji=""/> HW เพื่อเปิด
<ul>
<li><strong>ENVIRONMENT</strong> เลื่อน TEMP / HUMIDITY / PRESSURE แทนการเป่าลม</li>
<li><strong>TILT · BMI270</strong> ลากลูกบอลแทนการเอียงบอร์ด · ปุ่ม <strong>Shake</strong> แทนการกระแทก</li>
</ul>
</li>
<li><strong>TESAIoT DEV KIT</strong> (แถวล่างสุด) — <strong>ลูกบิด VR1–VR4, ปุ่มคู่ของฐานบอร์ด, จอไฟ RGB 16×8</strong><br />
<span class="src">แผง Emulator พิมพ์ชื่อปุ่มเป็น SW4 / SW5 — ปุ่มซ้ายของแผง = <b>SW5</b> (ปุ่มล่างบนบอร์ด) · ปุ่มขวา = <b>SW6</b> (ปุ่มบน)</span></li>
</ol>
<div class="warn">
<p>ใช้ <strong>VR1–VR4 แถวล่าง</strong> ไม่ใช่ลูกบิด <strong>POTEN</strong> ตัวใหญ่ (นั่นของบอร์ด Eva Kit)</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99-2-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5-%E0%B9%80%E0%B8%A1%E0%B8%99%E0%B8%B9-gpio--rgb-matrix-%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">เล่นก่อน 2 นาที: เมนู GPIO &amp; RGB Matrix บนบอร์ด</h2>
<div class="cols">
<div class="c45">
<ol>
<li>ที่หน้า <strong>Home</strong> ของบอร์ด แตะการ์ด <strong>GPIO &amp; RGB Matrix</strong></li>
<li><strong>หมุนลูกบิด VR1–VR4</strong> → แถบ 4 แถบบนจอขยับตาม</li>
<li><strong>แตะสี / เอฟเฟกต์</strong> บนจอ → <strong>จอไฟ RGB จริง</strong> บนฐานบอร์ดเปลี่ยนตาม</li>
<li><strong>กดปุ่มคู่บนฐานบอร์ด</strong> → ดูสถานะปุ่มบนจอ</li>
</ol>
<div class="think">
<p><strong>ปุ่มคู่บนฐานบอร์ด:</strong> <strong>SW5 = ปุ่มล่าง</strong> · <strong>SW6 = ปุ่มบน</strong><br />
ในโค้ดของเรา: <code>buttons.pressed(0)</code> = <strong>SW5</strong> (ล่าง) · <code>buttons.pressed(1)</code> = <strong>SW6</strong> (บน)</p>
</div>
<blockquote>
<p>ยังไม่ต้องเขียนโค้ดสักบรรทัด — แค่ให้มือคุ้นกับลูกบิดและปุ่ม ก่อนที่โค้ดของเราจะใช้มันแทนเซนเซอร์</p>
</blockquote>
</div>
<div>
<svg viewBox="0 0 560 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">

<div>
<p><span is="marp-span" data-auto-scaling="downscale-only" class="katex-display"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML" display="block"><semantics><mrow><mi mathvariant="normal">%</mi><mi>R</mi><mi>H</mi><mo>=</mo><mfrac><mtext>ไอน้ำที่มีจริง</mtext><mtext>ไอน้ำมากที่สุดที่รับได้ ณ อุณหภูมินั้น</mtext></mfrac><mo>×</mo><mn>100</mn></mrow><annotation encoding="application/x-tex">\%RH = \frac{\text{ไอน้ำที่มีจริง}}{\text{ไอน้ำมากที่สุดที่รับได้ ณ อุณหภูมินั้น}} \times 100
</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8056em;vertical-align:-0.0556em;"></span><span class="mord">%</span><span class="mord mathnormal" style="margin-right:0.0077em;">R</span><span class="mord mathnormal" style="margin-right:0.0813em;">H</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:2.0463em;vertical-align:-0.686em;"></span><span class="mord"><span class="mopen nulldelimiter"></span><span class="mfrac"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:1.3603em;"><span style="top:-2.314em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord brahmic_fallback">ไอน้ำมากที่สุดที่รับได้</span><span class="mord"> </span><span class="mord brahmic_fallback">ณ</span><span class="mord"> </span><span class="mord brahmic_fallback">อุณหภูมินั้น</span></span></span></span><span style="top:-3.23em;"><span class="pstrut" style="height:3em;"></span><span class="frac-line" style="border-bottom-width:0.04em;"></span></span><span style="top:-3.677em;"><span class="pstrut" style="height:3em;"></span><span class="mord"><span class="mord text"><span class="mord brahmic_fallback">ไอน้ำที่มีจริง</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.686em;"><span></span></span></span></span></span><span class="mclose nulldelimiter"></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">×</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">100</span></span></span></span></span></p><ul>
<li>อากาศ <strong>อุ่น</strong> รับไอน้ำได้ <strong>มากกว่า</strong> อากาศเย็นมาก</li>
<li>ไอน้ำเท่าเดิม แต่อากาศร้อนขึ้น → <strong>%RH ลดลง</strong> ทั้งที่น้ำไม่ได้หายไปไหน</li>
<li>ห้องแอร์มักแห้งกว่าที่มะเขือเทศชอบ (ต่ำกว่า 60 %RH) เพราะคอยล์เย็นของแอร์กลั่นน้ำออกจากอากาศ</li>
</ul>
<div class="think">
<p><strong>ในฟาร์ม:</strong> RH ค้างสูงเกือบ 100 % นาน ๆ + ใบเปียก = เชื้อราชอบมาก</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%94%E0%B8%AD%E0%B8%B2%E0%B8%81%E0%B8%B2%E0%B8%A8%E0%B8%9A%E0%B8%AD%E0%B8%81%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%80%E0%B8%81%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%A7%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%9D%E0%B8%99-dps368">เบื้องหลัง: ความกดอากาศบอกอะไรเกี่ยวกับฝน (DPS368)</h2>
<div class="cols">
<div class="c55">
<svg viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs><linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#5c6bc0" /><stop offset=".5" stop-color="#90a4ae" /><stop offset="1" stop-color="#ffb300" /></linearGradient>
  <marker id="ar2" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="20" markerHeight="20" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#3949ab" /></marker></defs>
  <rect x="30" y="70" width="500" height="34" rx="17" fill="url(#pg)" />
  <text x="40" y="58" font-size="20" fill="#3949ab">⛈️ 990 hPa</text>
  <text x="280" y="58" text-anchor="middle" font-size="20" fill="#455a64">☁️ 1013 hPa</text>
  <text x="520" y="58" text-anchor="end" font-size="20" fill="#ef6c00">☀️ 1030 hPa</text>
  <text x="40" y="132" font-size="18" fill="#3949ab">ความกดต่ำ: อากาศลอยขึ้น</text>
  <text x="40" y="154" font-size="18" fill="#3949ab">เย็นลง กลายเป็นเมฆฝน</text>
  <text x="520" y="132" text-anchor="end" font-size="18" fill="#ef6c00">ความกดสูง: อากาศจมลง</text>
  <text x="520" y="154" text-anchor="end" font-size="18" fill="#ef6c00">ฟ้าโปร่ง</text>
  <path d="M420 200 L160 200" stroke="#3949ab" stroke-width="6" marker-end="url(#ar2)" />
  <text x="290" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#3949ab">ลดลงเรื่อย ๆ หลายชั่วโมง = ฝนอาจมา</text>
</svg>
<ul>
<li>ตัวเลข &quot;ครั้งเดียว&quot; บอกไม่ได้มาก — <strong>แนวโน้ม</strong> ต่างหากที่สำคัญ</li>
<li><strong>ในเขตร้อนอย่างไทย</strong> ความกดอากาศลดลงทุกบ่ายราว 2–3 hPa เป็นปกติ (ขึ้น-ลงตามเวลาของวัน) → ต้อง <strong>เทียบกับเวลาเดียวกันของเมื่อวาน</strong></li>
<li>ขึ้นที่สูง ~8 เมตร ความกดลดราว 1 hPa → ย้ายบอร์ดขึ้นชั้นบนก็เห็นค่าต่าง</li>
<li>บอร์ดของผู้สอนวัดได้ <strong>1010.95 hPa</strong> (เช้าวันนี้)</li>
</ul>
</div>
<div>
<p><img src="img/weather_station_agri_field_commons.jpg" alt="" style="width:330px;" /></p>
<div class="cap">สถานีอากาศในแปลงเกษตร วัดอุณหภูมิ ความชื้น ความกด ฝน ลม — ภาพ: Noar 91 / Wikimedia Commons — CC BY-SA 3.0</div>

</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-scope-K9etG8Ct="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%AD%E0%B8%B8%E0%B8%93%E0%B8%AB%E0%B8%A0%E0%B8%B9%E0%B8%A1%E0%B8%B4-%E0%B8%A3%E0%B9%89%E0%B8%AD%E0%B8%99%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87--%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%AA%E0%B8%AD%E0%B8%9A%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%9A">ทำไมบอร์ดอ่านอุณหภูมิ &quot;ร้อนกว่าห้อง&quot; — เรื่องของการสอบเทียบ</h2>
<div class="cols">
<div class="c45">
<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <text x="280" y="26" text-anchor="middle" font-size="19" fill="#37474f">วัดจริงบน TESAIoT Dev Kit (firmware 2.4.1) เช้าวันนี้</text>
  <line x1="60" y1="240" x2="520" y2="240" stroke="#90a4ae" stroke-width="2" />
  <rect x="90" y="84" width="110" height="156" fill="#ff8a65" />
  <text x="145" y="74" text-anchor="middle" font-size="22" font-weight="700" fill="#d84315">35.4→36.0 °C</text>
  <text x="145" y="266" text-anchor="middle" font-size="18" fill="#37474f">SHT40 บนบอร์ด</text>
  <rect x="245" y="60" width="110" height="180" fill="#e53935" />
  <text x="300" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#b71c1c">37.2 °C</text>
  <text x="300" y="266" text-anchor="middle" font-size="18" fill="#37474f">ชิป IMU</text>
  <rect x="400" y="130" width="110" height="110" fill="#4fc3f7" stroke="#0277bd" stroke-dasharray="8 5" stroke-width="3" />
  <text x="455" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#0277bd">~25–28 °C</text>
  <text x="455" y="266" text-anchor="middle" font-size="18" fill="#37474f">ห้องแอร์ปกติ</text>
</svg>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">TEMP_OFFSET = <span class="hljs-number">0.0</span>    <span class="hljs-comment"># ... แล้วใส่ค่าชดเชย เช่น -9.5</span>
HUM_FIX = <span class="hljs-literal">True</span>       <span class="hljs-comment"># ... แปลงความชื้นเป็นของห้อง</span>
<span class="hljs-comment"># ... ใน read_climate()</span>
    t = <span class="hljs-literal">None</span> <span class="hljs-keyword">if</span> t_raw <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">else</span> t_raw + TEMP_OFFSET
    <span class="hljs-keyword">if</span> h <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> t <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> TEMP_OFFSET != <span class="hljs-number">0</span> <span class="hljs-keyword">and</span> HUM_FIX:
        h = room_humidity(h, t_raw, t)
</code></pre>
</div>
<div>
<ul>
<li>ชิปประมวลผล จอ และวงจรจ่ายไฟ <strong>อุ่นตัวเอง</strong> → เซนเซอร์บนบอร์ดอ่านความร้อนของบอร์ดปนเข้าไปด้วย</li>
<li>งานจริงแก้ด้วยการ <strong>สอบเทียบ</strong> (calibration): <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mtext mathvariant="monospace">TEMP_OFFSET</mtext><mo>=</mo><msub><mi>T</mi><mtext>ห้อง</mtext></msub><mo>−</mo><msub><mi>T</mi><mtext>บอร์ด</mtext></msub></mrow><annotation encoding="application/x-tex">\texttt{TEMP\_OFFSET} = T_{\text{ห้อง}} - T_{\text{บอร์ด}}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7063em;vertical-align:-0.0951em;"></span><span class="mord text"><span class="mord texttt">TEMP_OFFSET</span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">=</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">ห้อง</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">−</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:0.8333em;vertical-align:-0.15em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.1389em;">T</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3283em;"><span style="top:-2.55em;margin-left:-0.1389em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord text mtight"><span class="mord brahmic_fallback mtight">บอร์ด</span></span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span></span></span></span></li>
<li>เทียบกับ <strong>เทอร์โมมิเตอร์ในห้อง</strong> — ค่าชดเชยมักราว <strong>−9 ถึง −10</strong></li>
<li><strong>ความชื้นก็ถูกแปลงเป็นของห้อง:</strong> อากาศรอบเซนเซอร์อุ่นกว่าห้อง %RH จึงอ่านได้ต่ำกว่า (ย้อนดูสไลด์ &quot;ความชื้นสัมพัทธ์&quot;) · ถ้าสูงเกินจริงเมื่อเทียบไฮโกรมิเตอร์ ตั้ง <code>HUM_FIX = False</code></li>
<li>ค่า <strong>&quot;ดิบ&quot;</strong> บนจอไม่เปลี่ยน แต่เข็ม เลขใหญ่ และสีเปลี่ยน — ใช้ค่าเดียวกันต่อใน <strong>กิจกรรม 2 และภารกิจกลุ่ม</strong></li>
</ul>
<div class="think">
<p><strong>คิด:</strong> ติดตั้งจริงในโรงเรือน ควรวางเซนเซอร์ <strong>ห่างจากกล่องควบคุม</strong> หรือ <strong>ในร่มที่ลมผ่าน</strong> — เพราะอะไร?</p>
</div>
</div>
</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B9%82%E0%B8%A3%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%95%E0%B8%AD%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89-1">กิจกรรม 1 — โรงเรือนของเราตอนนี้</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> อ่านอากาศในโรงเรือนจากเซนเซอร์จริง แล้วโชว์บนจอ + จอไฟ RGB</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>รันไฟล์ → <strong>หน้าปัดเข็ม</strong> อุณหภูมิ · <strong>วงแหวน</strong> ความชื้น · ความกดอากาศ · <strong>กราฟย้อนหลัง</strong> (ฟ้า = ความชื้น, ส้ม = อุณหภูมิ)</li>
<li><strong>ขั้นแรก: ชดเชยค่า</strong> — เทียบเลข <strong>&quot;ดิบ&quot;</strong> กับ <strong>เทอร์โมมิเตอร์ในห้อง</strong> (หรือค่าที่ผู้สอนประกาศ) แล้วตั้ง <code>TEMP_OFFSET</code> (สไลด์ก่อนหน้า) · จดไว้ใช้ต่อ</li>
<li>จอไฟ RGB: เลขอุณหภูมิตัวใหญ่ <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e9.svg" data-marp-twemoji=""/> ปกติ · <img class="emoji" draggable="false" alt="🟨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e8.svg" data-marp-twemoji=""/> เกิน 30 · <img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f7e5.svg" data-marp-twemoji=""/> เกิน 35</li>
<li><strong>แข่ง!</strong> เป่าลมหายใจ → ความชื้นสูงสุด · จับบอร์ด → อุณหภูมิสูงสุด · กด <strong>SW5</strong> ล้างสถิติแล้วแข่งใหม่</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/sf1_01_greenhouse_hello__room.png" alt="" style="width:640px;" /></p>
<p><img src="img/emu/sf1_01_greenhouse_hello__room_kit.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator (ค่าจำลอง: 27.5 °C, 62 %RH, 1010.9 hPa, TEMP_OFFSET = 0) · แถวล่าง = แผง TESAIoT DEV KIT ของ Emulator</div>
</div>
</div>

<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%88%E0%B8%AD%E0%B9%84%E0%B8%9F-rgb-%E0%B8%9C%E0%B8%AA%E0%B8%A1%E0%B8%AA%E0%B8%B5%E0%B9%81%E0%B8%9A%E0%B8%9A-%E0%B8%9A%E0%B8%A7%E0%B8%81%E0%B9%81%E0%B8%AA%E0%B8%87">เบื้องหลัง: จอไฟ RGB ผสมสีแบบ &quot;บวกแสง&quot;</h2>
<div class="cols">
<div class="c40">
<svg viewBox="0 0 360 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="360" height="330" rx="16" fill="#000" />
  <g style="mix-blend-mode:screen">
    <circle cx="180" cy="125" r="90" fill="#ff0000" style="mix-blend-mode:screen" />
    <circle cx="125" cy="215" r="90" fill="#00ff00" style="mix-blend-mode:screen" />
    <circle cx="235" cy="215" r="90" fill="#0000ff" style="mix-blend-mode:screen" />
  </g>
  <text x="180" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">R</text>
  <text x="62" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">G</text>
  <text x="298" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">B</text>
</svg>
<div class="src">วาดประกอบ: แสงแดง + เขียว = เหลือง · เขียว + น้ำเงิน = ฟ้า · แดง + น้ำเงิน = ม่วง · ครบสาม = ขาว</div>
</div>
<div>
<p>แต่ละจุดบนจอไฟมี LED จิ๋ว <strong>3 สี</strong> — เปิด/ปิดได้ทีละสี → เลข 3 บิต</p>
<svg viewBox="0 0 620 200" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <g font-size="17" text-anchor="middle">
    <circle cx="40" cy="40" r="26" fill="#1b222c" stroke="#555" /><text x="40" y="92" fill="#37474f">0</text><text x="40" y="114" fill="#37474f">000</text><text x="40" y="138" font-size="14" fill="#546e7a">OFF</text>
    <circle cx="117" cy="40" r="26" fill="#ff3b30" /><text x="117" y="92" fill="#37474f">1</text><text x="117" y="114" fill="#37474f">001</text><text x="117" y="138" font-size="14" fill="#546e7a">RED</text>
    <circle cx="194" cy="40" r="26" fill="#30d158" /><text x="194" y="92" fill="#37474f">2</text><text x="194" y="114" fill="#37474f">010</text><text x="194" y="138" font-size="14" fill="#546e7a">GREEN</text>
    <circle cx="271" cy="40" r="26" fill="#ffd60a" /><text x="271" y="92" fill="#37474f">3</text><text x="271" y="114" fill="#37474f">011</text><text x="271" y="138" font-size="14" fill="#546e7a">YELLOW</text>
    <circle cx="348" cy="40" r="26" fill="#2f6bff" /><text x="348" y="92" fill="#37474f">4</text><text x="348" y="114" fill="#37474f">100</text><text x="348" y="138" font-size="14" fill="#546e7a">BLUE</text>
    <circle cx="425" cy="40" r="26" fill="#d633ff" /><text x="425" y="92" fill="#37474f">5</text><text x="425" y="114" fill="#37474f">101</text><text x="425" y="138" font-size="14" fill="#546e7a">PURPLE</text>
    <circle cx="502" cy="40" r="26" fill="#40e0ff" /><text x="502" y="92" fill="#37474f">6</text><text x="502" y="114" fill="#37474f">110</text><text x="502" y="138" font-size="14" fill="#546e7a">CYAN</text>
    <circle cx="579" cy="40" r="26" fill="#ffffff" stroke="#999" /><text x="579" y="92" fill="#37474f">7</text><text x="579" y="114" fill="#37474f">111</text><text x="579" y="138" font-size="14" fill="#546e7a">WHITE</text>
  </g>
  <text x="310" y="184" text-anchor="middle" font-size="17" fill="#6a1b9a">บิต: B G R  →  RED=1  GREEN=2  BLUE=4</text>
</svg>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">rgbmatrix.RED | rgbmatrix.GREEN == rgbmatrix.YELLOW   <span class="hljs-comment"># 1 | 2 = 3</span>
rgbmatrix.score(<span class="hljs-number">28</span>, rgbmatrix.GREEN)   <span class="hljs-comment"># เลขตัวใหญ่สีเขียว</span>
rgbmatrix.pixel(<span class="hljs-number">3</span>, <span class="hljs-number">5</span>, rgbmatrix.CYAN)  <span class="hljs-comment"># จุดเดียว x=3 y=5</span>
</code></pre>
</div>
</div>
<div class="cap">ในงานจริง ไฟสถานะเครื่องจักรในโรงงาน/โรงเรือนก็ใช้สีบอกความหมายแบบเดียวกัน: เขียว = ปกติ · เหลือง = ระวัง · แดง = หยุด/อันตราย</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B8%9E%E0%B8%B7%E0%B8%8A%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B2%E0%B8%AA%E0%B8%9A%E0%B8%B2%E0%B8%A2%E0%B8%94%E0%B8%B5%E0%B9%84%E0%B8%AB%E0%B8%A1-1">กิจกรรม 2 — พืชของเราสบายดีไหม</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เขียนกฎตัดสินว่าพืช &quot;สบาย / เริ่มเครียด / แย่แล้ว&quot; แล้วให้บอร์ดแสดงผลครบ 3 ทาง</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>ใส่ <code>TEMP_OFFSET</code> ค่าเดียวกับกิจกรรม 1 ก่อนรัน</li>
<li><strong>ปัดวงล้อด้านซ้ายของจอ</strong> เลือกพืช (เปลี่ยนพืช = คะแนนเริ่มนับใหม่) · อยากเพิ่มพืชของกลุ่ม เพิ่มหนึ่งบรรทัดใน <code>CROPS</code></li>
<li>กราฟ: เส้นส้ม = อุณหภูมิ · เส้นเขียวสองเส้น = ขอบช่วงที่พืชชอบ</li>
<li>ทำให้เกิดครบ 3 สถานะ สังเกต <strong>ไฟแดงบนบอร์ด</strong> (ดับ/กะพริบ/ติดค้าง) <strong>หน้าพืชบนจอไฟ RGB</strong> และ <strong>เสียง</strong></li>
<li>(โบนัส) วาดหน้าพืชของกลุ่มเองใน <code>FACES</code> — ตาราง 8×8 ใช้ <code>#</code> แทนจุดที่ติด</li>
</ol>
</div>
</div>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%81%E0%B8%8E%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99">กิจกรรม 2 — หัวใจของโค้ด: กฎตัดสิน</h2>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">judge</span>(<span class="hljs-params">t, h, crop</span>):
    name, t_lo, t_hi, h_lo, h_hi = crop
    problems = []
    <span class="hljs-keyword">if</span> t &gt; t_hi:
        problems.append(<span class="hljs-string">&quot;ร้อนไป&quot;</span>)
    <span class="hljs-keyword">if</span> h &lt; h_lo:
        problems.append(<span class="hljs-string">&quot;แห้งไป&quot;</span>)
    <span class="hljs-comment"># ... (หนาวไป / ชื้นไป เขียนแบบเดียวกัน)</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> problems:
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>, <span class="hljs-string">&quot;อยู่ในช่วงที่ชอบ&quot;</span>
    far = (t &lt; t_lo - <span class="hljs-number">3</span>) <span class="hljs-keyword">or</span> (t &gt; t_hi + <span class="hljs-number">3</span>) <span class="hljs-keyword">or</span> (h &lt; h_lo - <span class="hljs-number">10</span>) <span class="hljs-keyword">or</span> (h &gt; h_hi + <span class="hljs-number">10</span>)
    <span class="hljs-keyword">return</span> (<span class="hljs-number">2</span> <span class="hljs-keyword">if</span> far <span class="hljs-keyword">else</span> <span class="hljs-number">1</span>), <span class="hljs-string">&quot; + &quot;</span>.join(problems)
</code></pre>
</div>
<div>
<p><strong>อ่านโค้ดให้ออก</strong></p>
<ul>
<li><code>problems</code> = รายการ &quot;อะไรหลุดช่วง&quot; — ว่าง = <img class="emoji" draggable="false" alt="😊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f60a.svg" data-marp-twemoji=""/> <strong>สบาย</strong></li>
<li><code>far</code> = หลุด <strong>เกิน 3 °C</strong> หรือ <strong>เกิน 10 %RH</strong> → <img class="emoji" draggable="false" alt="😢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f622.svg" data-marp-twemoji=""/> <strong>แย่แล้ว</strong></li>
<li>ไม่ถึง <code>far</code> → <img class="emoji" draggable="false" alt="😐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f610.svg" data-marp-twemoji=""/> <strong>เริ่มเครียด</strong></li>
<li>เหตุผลที่คืนไป (<code>&quot;ร้อนไป + แห้งไป&quot;</code>) คือข้อความที่ขึ้นบนจอ</li>
</ul>
<div class="think">
<p><strong>ลองแก้:</strong> ถ้าพืชของกลุ่ม &quot;ทนร้อนได้มากกว่าทนแห้ง&quot; จะแก้บรรทัด <code>far</code> อย่างไร?</p>
</div>
</div>
</div>
</section>

<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B5-%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B7%E0%B8%AD">เบื้องหลัง: ทำไมปั๊มต้องมี &quot;ช่องกันกระพือ&quot;</h2>

  <text x="534" y="296" font-size="16" fill="#c62828">ปั๊ม: เปิด-ปิด 15 ครั้ง ทั้งที่ดินแทบไม่ได้น้ำ!</text>

<div class="cols">
<div>
<ul>
<li>ค่าเซนเซอร์จริง <strong>สั่นไปมาเล็กน้อย</strong> เสมอ (สัญญาณรบกวน) — ถ้าเกณฑ์เปิดกับปิดเป็นเลขเดียวกัน ปั๊มจะ <strong>กระพือ</strong> ตามทุกการสั่น</li>
<li>ทางแก้: เปิดที่ <strong>เกณฑ์</strong> แต่ปิดที่ <strong>เกณฑ์ + HYST</strong> — ต้องชื้นขึ้นจริง ๆ ถึงจะปิด</li>
</ul>
</div>
<div>
<p><strong>ปั๊มที่กระพือเสียอะไรบ้าง</strong></p>
<ul>
<li>มอเตอร์กินกระแส <strong>ตอนสตาร์ต</strong> สูงกว่าตอนเดินหลายเท่า → ร้อน สิ้นเปลืองไฟ</li>
<li>หน้าสัมผัสรีเลย์สึกเร็ว · ท่อกระแทก (water hammer)</li>
</ul>
</div>

<h2 id="hysteresis-%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B8%A3%E0%B8%AD%E0%B8%9A%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B9%80%E0%B8%A3%E0%B8%B2-%E0%B9%81%E0%B8%AD%E0%B8%A3%E0%B9%8C-%E0%B8%95%E0%B8%B9%E0%B9%89%E0%B9%80%E0%B8%A2%E0%B9%87%E0%B8%99-%E0%B9%80%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B5%E0%B8%94">Hysteresis อยู่รอบตัวเรา: แอร์ ตู้เย็น เตารีด</h2>
<div class="cols">
<div class="c55">
<div class="vid">
<iframe width="320" height="180" src="https://www.youtube.com/embed/GYd6gmAnNn4" title="Temperature hysteresis — Texas Instruments" loading="lazy" frameborder="0" allowfullscreen></iframe>
</div>
<p><b>Temperature hysteresis</b> — ช่อง Texas Instruments · 6:53 · EN<br /><br />
<a href="https://www.youtube.com/watch?v=GYd6gmAnNn4">https://www.youtube.com/watch?v=GYd6gmAnNn4</a></p>
</div>
<div>
<p><strong>ตัวอย่าง: แอร์แบบเปิด-ปิด (ไม่ใช่อินเวอร์เตอร์) ตั้ง 25 °C</strong></p>
<ul>
<li>คอมเพรสเซอร์ <strong>ติด</strong> เมื่อห้องร้อนถึง ~26 °C</li>
<li><strong>ดับ</strong> เมื่อเย็นลงถึง ~24 °C</li>
<li>ช่วงกลาง 24–26 °C = ช่องกันกระพือ → ไม่ติด-ดับทุกนาที</li>
</ul>
<div class="think">
<p><strong>ในฟาร์ม:</strong> พัดลมโรงเรือน พ่นหมอกโรงเห็ด ฮีตเตอร์กกลูกไก่ — <strong>ทุกตัว</strong> ต้องมีช่องกันกระพือ ลองบอกว่าแต่ละตัวควรกว้างแค่ไหน</p>
</div>
</div>
</div>
<div class="cols">
<div class="c40">
<p><img src="img/greenhouse_vent_controller_ht10_japan_commons.jpg" alt="" style="width:215px;" /></p>
<div class="cap">กล่องควบคุมหน้าต่างหลังคาโรงเรือนอัตโนมัติ (ญี่ปุ่น) — ภาพ: yoppy / Wikimedia Commons — CC BY 2.0</div>
</div>
<div>
<p><strong>ของจริงในโรงเรือน:</strong> ลูกบิดล่าง 温度設定 = <strong>อุณหภูมิที่เริ่มเปิดหน้าต่าง</strong> (5–35 °C) · ลูกบิดบน 感度 = <strong>ความไว 0.5–2 °C</strong> — ทำหน้าที่แบบเดียวกับ <strong>ช่องกันกระพือ</strong> ที่ชาวสวนตั้งเองได้ด้วยมือ</p>
<p>เทียบกับกิจกรรม 3: <strong>VR2 = เกณฑ์</strong> · <strong>HYST = ความไว</strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B8%A3%E0%B8%94%E0%B8%99%E0%B9%89%E0%B8%B3%E0%B8%AD%E0%B8%B1%E0%B8%95%E0%B9%82%E0%B8%99%E0%B8%A1%E0%B8%B1%E0%B8%95%E0%B8%B4-1">กิจกรรม 3 — รดน้ำอัตโนมัติ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> สร้างระบบรดน้ำที่ตัดสินเองจากความชื้นดิน และ <strong>ปลอดภัย</strong> เมื่อน้ำในถังหมด</p>
</div>
<table>
<thead>
<tr>
<th>ของบนบอร์ด</th>
<th>แทนอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>VR1</strong></td>
<td>เซนเซอร์ความชื้นดิน (จำลอง)</td>
</tr>
<tr>
<td><strong>VR2</strong></td>
<td>เกณฑ์เปิดปั๊ม</td>
</tr>
<tr>
<td><strong>VR3</strong></td>
<td>น้ำในถัง</td>
</tr>
<tr>
<td><strong>ไฟสีฟ้าบนบอร์ด</strong> (RGB_BLUE)</td>
<td>ปั๊มน้ำ</td>
</tr>
<tr>
<td><strong>สวิตช์บนจอ</strong></td>
<td>อัตโนมัติ / มือ</td>
</tr>
<tr>
<td><strong>SW5</strong> กดค้าง</td>
<td>รดน้ำเอง</td>
</tr>
<tr>
<td><strong>SW6</strong></td>
<td>ล้างตัวนับ</td>
</tr>
</tbody>
</table>
<div class="src">จอไฟ RGB: ซ้าย = ความชื้นดิน (เส้นแดง = เกณฑ์) · กลางสีเขียว = น้ำกำลังไหล · ขวา = น้ำในถัง · กราฟบนจอ: ฟ้า = ความชื้นดิน, แดง = เกณฑ์เปิด, เขียว = เกณฑ์ปิด</div>
</div>
<div class="shot">
<p><img src="img/emu/sf1_03_auto_irrigation__dry_pump_on.png" alt="" style="width:640px;" /></p>
<p><img src="img/emu/sf1_03_auto_irrigation__dry_pump_on_kit.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — หมุน VR1 ลง (ดินแห้ง) ปั๊มเปิด · แถวล่าง: ลูกบิด VR1–VR3 และจอไฟ RGB แสดงดิน/น้ำไหล/ถัง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B8%97%E0%B8%94%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B7%E0%B8%AD">กิจกรรม 3 — ทดลองให้เห็นการกระพือ</h2>
<div class="cols">
<div>
<p><strong>ลองทำ</strong></p>
<ol>
<li>หมุน <strong>VR3</strong> ให้ถังเต็มก่อน</li>
<li>หมุน <strong>VR1</strong> ลงช้า ๆ → จดค่าที่ปั๊ม <strong>เปิด</strong> · หมุนขึ้น → จดค่าที่ปั๊ม <strong>ปิด</strong></li>
<li><strong>การทดลอง:</strong> หมุน VR1 ค้างตรงขอบเกณฑ์ ขยับเบา ๆ 30 วินาที <strong>นับครั้งที่ปั๊มเปิด</strong></li>
<li>แก้โค้ดเป็น <code>HYST = 0</code> แล้วทำข้อ 3 ซ้ำ (กราฟ: เส้นแดงกับเขียวทับกันเป็นเส้นเดียว)</li>
<li>แตะ <strong>สวิตช์บนจอ</strong> เป็น &quot;มือ&quot; → หมุน VR1 จนดินแห้ง ปั๊มเปิดเองไหม? กด SW5 ค้างล่ะ?</li>
<li>หมุน <strong>VR3</strong> จนถังเหลือ &lt; 10 % ขณะปั๊มเปิด → เกิดอะไรขึ้น? กด <strong>SW5</strong> แล้วปั๊มยอมเดินไหม?</li>
</ol>
</div>
<div class="shot">
<p><img src="img/emu/sf1_03_auto_irrigation__wet_idle.png" alt="" style="width:360px;" /></p>
<div class="cap">ดินชื้นพอ — ปั๊มหยุด</div>
<p><img src="img/emu/sf1_03_auto_irrigation__tank_empty.png" alt="" style="width:360px;" /></p>
<div class="cap">น้ำในถังหมด — ปั๊มถูกล็อก (กันปั๊มเดินตัวเปล่า)</div>
</div>
</div>
<div class="think">
<p><strong>คิด:</strong> ถ้าปั๊มจริงเปิด-ปิดถี่แบบ HYST = 0 จะเกิดอะไรขึ้นกับปั๊มและค่าไฟ? · ฟาร์มจริงต้องมี <strong>โหมดมือ</strong> ไว้ทำไม? · ทำไมต้องห้ามปั๊มเดินตอนถังหมด <strong>แม้ผู้ใช้กด SW5 เอง</strong>?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="53">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%81%E0%B8%8E%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%A1%E0%B8%B5%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B7%E0%B8%AD">กิจกรรม 3 — หัวใจของโค้ด: กฎปั๊มแบบมีช่องกันกระพือ</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">pump_decision</span>(<span class="hljs-params">pump_on, soil, th</span>):
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> pump_on <span class="hljs-keyword">and</span> soil &lt; th:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
    <span class="hljs-keyword">if</span> pump_on <span class="hljs-keyword">and</span> soil &gt; th + HYST:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    <span class="hljs-keyword">return</span> pump_on


<span class="hljs-keyword">def</span> <span class="hljs-title function_">should_run</span>(<span class="hljs-params">auto_wants, manual, tank_ok</span>):
    <span class="hljs-keyword">return</span> (auto_wants <span class="hljs-keyword">or</span> manual) <span class="hljs-keyword">and</span> tank_ok
</code></pre>
<ul>
<li>ปั๊ม <strong>ปิดอยู่</strong> + ดินแห้งกว่าเกณฑ์ → <strong>เปิด</strong></li>
<li>ปั๊ม <strong>เปิดอยู่</strong> + ดินชื้นเกิน เกณฑ์ + <code>HYST</code> → <strong>ปิด</strong></li>
<li>อยู่ระหว่างกลาง → <strong>คงสถานะเดิม</strong> ← นี่แหละช่องกันกระพือ</li>
<li><code>should_run</code>: ถังน้ำไม่พอ = <strong>ห้ามเดิน</strong> ไม่ว่าใครสั่ง</li>
</ul>
</div>
<div class="shot">
<p><img src="img/emu/sf1_03_auto_irrigation__dry_pump_on.png" alt="" style="width:470px;" /></p>
<div class="cap">กราฟล่างซ้าย: เส้นฟ้า = ความชื้นดิน · เส้นแดง = เกณฑ์เปิด · เส้นเขียว = เกณฑ์ปิด — ช่องระหว่างแดงกับเขียวคือ HYST</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-class="sec" data-theme="default" lang="C" class="sec" data-marpit-pagination="38" style="--paginate:true;--class:sec;--theme:default;" data-marpit-pagination-total="53"><div class="when">2:10 – 2:30 · คนขับ = คนที่ 2</div>

<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B9%88%E0%B8%87-mems-%E0%B8%97%E0%B8%B3%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3">เบื้องหลัง: เครื่องวัดความเร่ง MEMS ทำงานอย่างไร</h2>
<div class="cols">
<div>
<p><img src="img/accel_capacitive_principle_commons.png" alt="" style="width:330px;" /></p>
<div class="cap">หลักการ accelerometer แบบตัวเก็บประจุ — ภาพ: Tosaka / Wikimedia Commons — CC BY 3.0</div>
</div>
<div>
<ul>
<li>ข้างในชิปมี <strong>มวลจิ๋วแขวนบนสปริงซิลิคอน</strong> อยู่ระหว่างแผ่นขั้วไฟฟ้า</li>
<li>บอร์ดเร่ง/เอียง → มวลขยับ → <strong>ระยะห่างแผ่นเปลี่ยน → ค่าความจุเปลี่ยน</strong> (วัดด้วยค่าความจุเหมือน SHT40 แต่ที่นี่ &quot;ระยะห่าง&quot; เปลี่ยน ไม่ใช่ชั้นพอลิเมอร์)</li>
<li>ทำ 3 ชุดตั้งฉากกัน = วัด 3 แกน X Y Z</li>
<li><strong>อยู่นิ่ง ๆ ก็วัดได้ 1 g</strong> (9.81 m/s²) — นั่นคือแรงโน้มถ่วง</li>
</ul>

<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%A1%E0%B8%B8%E0%B8%A1%E0%B9%80%E0%B8%AD%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%84%E0%B8%B3%E0%B8%99%E0%B8%A7%E0%B8%93%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B9%81%E0%B8%A3%E0%B8%87%E0%B9%82%E0%B8%99%E0%B9%89%E0%B8%A1%E0%B8%96%E0%B9%88%E0%B8%A7%E0%B8%87">เบื้องหลัง: มุมเอียงคำนวณจากแรงโน้มถ่วง</h2>
<div class="cols">
<div class="c55">
<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs><marker id="ag" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="20" markerHeight="20" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e53935" /></marker>

<div>

gin-right:0.044em;">z</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.7278em;vertical-align:-0.0833em;"></span><span class="mord">+</span><span class="mord">7.7</span></span></span></span> m/s² → atan2(−6.2, 7.7) ≈ −39° คือ <strong>เอียงราว 39°</strong><br />

<div class="goal">

<p><strong>ลองทำ</strong></p>
<ol>
<li><strong>วางบอร์ดนิ่ง ๆ ตอนเริ่ม 1 วินาที</strong> → บอร์ดถือท่านั้นเป็น &quot;ศูนย์&quot; เอง (ขยับตอนเริ่ม → กด <strong>SW5</strong> ตั้งศูนย์ใหม่)</li>
<li>ค่อย ๆ เอียงจนไฟแดงบนบอร์ดติด + ได้ยินเสียง (เข็มเลยเลข 20) → <strong>จดมุมที่เตือน</strong></li>

<li>ยกบอร์ดเล็กน้อยแล้ววางกระแทกโต๊ะ <strong>เบา ๆ</strong> → นับแรงกระแทก (ตัวนับไม่ขึ้น? โค้ดอ่านทุก 0.2 วินาที แรงกระแทกสั้น ๆ อาจหลุด — ลองลด <code>BUMP_G</code>)</li>
<li><strong>เกมประคองแท็งก์</strong> — บรรทัด &quot;อยู่ในเป้า&quot; นับวินาทีให้ · กด <strong>SW6</strong> ล้างแล้วแข่งกับกลุ่มข้าง ๆ</li>
</ol>
</div>

<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">health</span>(<span class="hljs-params">t, h, soil</span>):
    <span class="hljs-string">&quot;&quot;&quot;คะแนนสุขภาพฟาร์ม 0-100 (TODO: ปรับน้ำหนักตามความสำคัญของงานกลุ่ม)&quot;&quot;&quot;</span>
    <span class="hljs-keyword">if</span> t <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">or</span> h <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>
    score = <span class="hljs-number">100</span>
    <span class="hljs-keyword">if</span> t &lt; T_LO <span class="hljs-keyword">or</span> t &gt; T_HI:
        score -= <span class="hljs-number">35</span>
    <span class="hljs-keyword">if</span> h &lt; H_LO <span class="hljs-keyword">or</span> h &gt; H_HI:
        score -= <span class="hljs-number">25</span>
    <span class="hljs-keyword">if</span> soil &lt; SOIL_MIN:
        score -= <span class="hljs-number">40</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">max</span>(<span class="hljs-number">0</span>, score)
</code></pre>
</div>

<style>
.bento-nav{position:fixed;z-index:99999;font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,Segoe UI,sans-serif;
  font-weight:700;font-size:14px;line-height:1;text-decoration:none;padding:9px 15px;border-radius:999px;
  background:rgba(13,17,23,.82);color:#71C7EC;border:1px solid rgba(120,200,255,.42);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.35);
  transition:background .15s,color .15s,transform .15s;user-select:none}
.bento-nav:hover{background:#71C7EC;color:#0d1117;transform:translateY(-1px)}
.bento-nav.toc{top:14px;left:14px}
.bento-nav.next{bottom:16px;right:16px}
.bento-nav.prev{bottom:16px;left:16px;color:#93a0bd;border-color:rgba(147,160,189,.4)}
.bento-nav.prev:hover{background:#93a0bd;color:#0d1117}
@media print{.bento-nav{display:none !important}}
/* lightbox: คลิกภาพในเด็คเพื่อดูใหญ่ (คำสั่งอาจารย์ 2026-08-20) */
svg[data-marpit-svg] section img{cursor:zoom-in}
#bento-lightbox{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:zoom-out}
#bento-lightbox.open{display:flex}
#bento-lightbox img{max-width:94vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.6);
  background:#0d1117;cursor:default}
#bento-lightbox-close{position:fixed;top:14px;right:16px;z-index:100001;font:700 20px/1 sans-serif;
  color:#e6edf3;background:rgba(13,17,23,.82);border:1px solid rgba(120,200,255,.42);border-radius:999px;
  width:44px;height:44px;cursor:pointer}
#bento-lightbox-close:hover{background:#71C7EC;color:#0d1117}
@media print{#bento-lightbox{display:none !important}}
</style>


<div id="bento-lightbox" role="dialog" aria-modal="true" aria-label="ดูภาพขยาย">
  <button id="bento-lightbox-close" aria-label="ปิด" title="ปิด (Esc)">&#10005;</button>
  <img id="bento-lightbox-img" alt="">
</div>
<script>
(function(){
  var box = document.getElementById('bento-lightbox');
  var big = document.getElementById('bento-lightbox-img');
  function close(){ box.classList.remove('open'); big.src = ''; }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t === big) { e.stopPropagation(); return; }        /* คลิกบนภาพใหญ่ = เฉย ๆ */
    if (t.closest && t.closest('#bento-lightbox')) {       /* ฉากหลังหรือปุ่ม = ปิด */
      e.stopPropagation(); close(); return;
    }
    var img = t.closest ? t.closest('svg[data-marpit-svg] section img') : null;
    if (!img || !img.src) return;
    big.src = img.currentSrc || img.src;
    big.alt = img.alt || '';
    box.classList.add('open');
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && box.classList.contains('open')) { close(); e.stopPropagation(); }
  }, true);
})();
</script>
