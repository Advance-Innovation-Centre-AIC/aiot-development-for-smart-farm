  <text x="500" y="26" text-anchor="middle" font-size="21" font-weight="700" fill="#37474f">สองฝั่งไม่ต้องรู้จักกัน รู้แค่ "ชื่อหัวข้อ" เดียวกัน</text>

<h2 id="mqtt-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B9%80%E0%B8%82%E0%B9%89%E0%B8%B2%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B8%82%E0%B9%89%E0%B8%AD-publish--%E0%B8%82%E0%B8%AD%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B8%82%E0%B9%89%E0%B8%AD-subscribe">MQTT: ส่งเข้าหัวข้อ (publish) · ขอฟังหัวข้อ (subscribe)</h2>
<div class="cols">
<div class="c60">
<p><strong>หัวข้อของกลุ่มเรา</strong> (<code>&lt;TEAM&gt;</code> = เลขกลุ่ม เช่น <code>team05</code> ตัวเล็กทั้งหมด)</p>
<table>
<thead>
<tr>
<th>หัวข้อ</th>
<th>ทิศทาง</th>
<th>มีอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/telemetry</code></td>
<td>บอร์ด → แอป</td>
<td>ค่าฟาร์มทุก 5 วินาที</td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/event</code></td>
<td>บอร์ด → แอป</td>
<td>เหตุการณ์: กด SW6 เรียก · แจ้งเตือนพืช</td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/cmd</code></td>
<td>แอป → บอร์ด</td>
<td>คำสั่ง เช่น รดน้ำ 10 วินาที</td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/field/&lt;เซนเซอร์&gt;</code></td>
<td>โหนดเซนเซอร์ → Gateway</td>
<td><code>field/soil</code> · <code>field/tank</code></td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/plc/cmd</code></td>
<td>Gateway → PLC</td>
<td>สั่งปั๊ม</td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/plc/state</code></td>
<td>PLC → Gateway</td>
<td>ปั๊มทำอะไรอยู่ <strong>จริง</strong></td>
</tr>
<tr>
<td><code>bento-aiot/&lt;TEAM&gt;/ai</code></td>
<td>บอร์ด → แอป</td>
<td>ผล AI บนบอร์ด (<code>sf3_06</code> คาบ 3): ชื่อโมเดล · ป้าย · ความมั่นใจ %</td>
</tr>
</tbody>
</table>
<p>ฟังทุกหัวข้อของกลุ่มในทีเดียว: <code>bento-aiot/&lt;TEAM&gt;/#</code> · ทุกโหนดในแปลง: <code>bento-aiot/&lt;TEAM&gt;/field/+</code></p>
<p>ทุกข้อความเป็น <strong>JSON</strong> ข้อความเดียว — หัวข้อ คีย์ และคำสั่งทั้งหมดอยู่ใน <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/MQTT_CONTRACT_th.md"><code>MQTT_CONTRACT_th.md</code></a> หน้าเดียว</p>

<h2 id="%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1--%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94-hotspot-%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%96%E0%B8%B7%E0%B8%AD%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">ก่อนเริ่ม — ทุกกลุ่มเปิด Hotspot มือถือให้บอร์ด</h2>

<table>
<thead>
<tr>
<th>ขั้น</th>
<th>iPhone</th>
<th>Android</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 · ตั้งชื่อ <strong>เอง</strong></td>
<td>ชื่อ Hotspot คือชื่อเครื่อง: การตั้งค่า &gt; ทั่วไป &gt; เกี่ยวกับ &gt; ชื่อ</td>
<td>การตั้งค่า Hotspot &gt; ชื่อเครือข่าย</td>
</tr>
<tr>
<td>2 · ตั้งรหัส</td>
<td>ฮอตสปอตส่วนบุคคล &gt; รหัสผ่าน Wi-Fi <strong>อย่างน้อย 8 ตัว</strong></td>
<td>รหัสผ่าน <strong>อย่างน้อย 8 ตัว</strong> · ความปลอดภัย WPA2</td>
</tr>
<tr>
<td>3 · ย่านความถี่</td>
<td>เปิด <strong>&quot;เพิ่มความเข้ากันได้สูงสุด (Maximize Compatibility)&quot;</strong></td>
<td>เลือก <strong>2.4 GHz</strong> ถ้ามีให้เลือก</td>
</tr>
<tr>
<td>4 · เปิดค้าง</td>
<td>เปิดหน้าฮอตสปอตค้างไว้ตอนบอร์ดต่อครั้งแรก</td>
<td>เปิด Hotspot ค้างไว้</td>
</tr>
</tbody>
</table>
<div class="cols">
<div class="c55">
<p><strong>ชื่อ:</strong> อักษรอังกฤษหรือตัวเลขสั้น ๆ ที่กลุ่มคิดเอง <strong>ไม่มีเว้นวรรค ไม่มีภาษาไทย</strong> (ชื่อเครื่องแบบ <code>สมชาย’s iPhone</code> จอบอร์ดวาดไม่ได้) · <strong>รหัส:</strong> 8 ตัวขึ้นไป — บอร์ดต่อวงที่ไม่มีรหัสไม่ได้</p>
<p>แล้วแก้ข้อความใน <code>&lt; &gt;</code> บนหัว<strong>ทุกไฟล์บอร์ด</strong>ของคาบนี้:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">WIFI_SSID = <span class="hljs-string">&quot;&lt;ชื่อ Hotspot ของกลุ่ม&gt;&quot;</span>   <span class="hljs-comment"># ตั้งเอง: อังกฤษ/ตัวเลขสั้น ๆ ไม่มีเว้นวรรค</span>
WIFI_PASS = <span class="hljs-string">&quot;&lt;รหัส Hotspot ของกลุ่ม&gt;&quot;</span>   <span class="hljs-comment"># อย่างน้อย 8 ตัว · อย่าส่งไฟล์ที่ใส่รหัสจริงให้ใคร</span>
</code></pre>
</div>
<div>
<div class="warn">
<p><img class="emoji" draggable="false" alt="🔒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f512.svg" data-marp-twemoji=""/> <strong>อย่าส่งต่อหรืออัปโหลดไฟล์ที่ใส่รหัสจริง</strong> (แชตกลุ่ม GitHub ฯลฯ) — ก่อนส่งงานแก้กลับเป็น <code>&lt;...&gt;</code> เหมือนเดิม</p>
</div>
<ul>
<li>ใบงาน: จดแค่ <strong>ชื่อ</strong> Hotspot ไม่ต้องจดรหัส</li>
<li>บอร์ดใช้เน็ตน้อยมาก ใบละราว 150 ไบต์ ทุก 5 วินาที</li>
<li>โน้ตบุ๊กจะต่อ Wi-Fi ของสถานที่ก็ได้ ถ้าแอปต่อ broker ไม่ได้ ให้ย้ายมาต่อ Hotspot เดียวกับบอร์ด</li>
</ul>
</div>
</div>
</section>

<h2 id="%E0%B8%97%E0%B8%B3%E0%B9%84%E0%B8%A1%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%83%E0%B8%8A%E0%B9%89-wi-fi-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89--captive-portal">ทำไมบอร์ดใช้ Wi-Fi ของสถานที่ไม่ได้ — captive portal</h2>
<svg viewBox="0 0 1000 250" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs><marker id="cp" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="18" markerHeight="18" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#546e7a" /></marker></defs>
  <rect x="20" y="40" width="190" height="100" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="115" y="80" text-anchor="middle" font-size="21" font-weight="700" fill="#1b5e20">บอร์ด</text>
  <text x="115" y="110" text-anchor="middle" font-size="16" fill="#37474f">ไม่มีเบราว์เซอร์</text>
  <rect x="280" y="40" width="190" height="100" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" />
  <text x="375" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#0d47a1">Wi-Fi สถานที่</text>
  <text x="375" y="110" text-anchor="middle" font-size="16" fill="#37474f">แจกเลข IP ให้ ✓</text>
  <rect id="sf2anim3" x="540" y="40" width="190" height="100" rx="12" fill="#ffebee" stroke="#c62828" stroke-width="3" /><animate href="#sf2anim3" attributeName="stroke-width" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
  <text x="635" y="76" text-anchor="middle" font-size="20" font-weight="700" fill="#b71c1c">🚧 หน้า login</text>
  <text x="635" y="104" text-anchor="middle" font-size="16" fill="#b71c1c">"กดยอมรับ / ใส่รหัส"</text>
  <text x="635" y="126" text-anchor="middle" font-size="16" fill="#b71c1c">บนหน้าเว็บก่อน</text>
  <rect x="800" y="40" width="180" height="100" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="3" />
  <text x="890" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">อินเทอร์เน็ต</text>
  <text x="890" y="110" text-anchor="middle" font-size="16" fill="#37474f">broker.hivemq.com</text>
  <line x1="212" y1="90" x2="274" y2="90" stroke="#546e7a" stroke-width="4" marker-end="url(#cp)" />
  <line x1="472" y1="90" x2="534" y2="90" stroke="#546e7a" stroke-width="4" marker-end="url(#cp)" />
  <line x1="732" y1="90" x2="794" y2="90" stroke="#c62828" stroke-width="4" stroke-dasharray="8 6" />
  <text x="763" y="80" text-anchor="middle" font-size="26" fill="#c62828">✕</text>
  <text x="500" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#37474f">บอร์ดได้เลข IP ตามปกติ — แต่ทุกอย่างถูกกันไว้ที่หน้า login ที่บอร์ดกดไม่ได้</text>
  <text x="500" y="218" text-anchor="middle" font-size="18" fill="#546e7a">wifi.connect() คืน True · IP ไม่ใช่ 0.0.0.0 · แต่ mqtt.connect() ไปไม่ถึง broker = "ติดขั้นแรก ไม่ผ่านขั้นสอง"</text>
</svg>
<ul>
<li>Wi-Fi ที่ต้อง <strong>login หรือกดยอมรับเงื่อนไขบนหน้าเว็บก่อนใช้งาน</strong> (captive portal) รอให้คนเปิดเบราว์เซอร์ — บอร์ดไม่มีเบราว์เซอร์ จึงไม่มีทางผ่าน</li>
<li>วงที่ <strong>ไม่มีรหัสผ่าน</strong> บอร์ดก็ต่อไม่ได้ (บอร์ดรับเฉพาะวงที่เข้ารหัส WPA2/WPA3) · <strong>ทางออกของวันนี้:</strong> Hotspot มือถือของกลุ่ม</li>
<li>เน็ตที่กันพอร์ต 1883 ขาออกก็ไปไม่ถึงเช่นกัน — ไฟล์บอร์ดจะขึ้นบนจอว่า <strong>&quot;broker ไม่ตอบ …&quot;</strong> (ข้อความท้ายต่างกันเล็กน้อยในแต่ละไฟล์)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="8" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B9%82%E0%B8%A1%E0%B8%94%E0%B8%B9%E0%B8%A5-wifi--%E0%B8%AB%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B8%A7%E0%B8%B1%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B9%83%E0%B8%8A%E0%B9%89">โมดูล <code>wifi</code> — ห้าตัวที่ไฟล์วันนี้ใช้</h2>
<svg viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="20" y="16" width="310" height="126" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="175" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#2e7d32">wifi.connect(ssid, pw)</text>
  <text x="175" y="78" text-anchor="middle" font-size="18" fill="#1b5e20">คืน True หรือ False</text>
  <text x="175" y="104" text-anchor="middle" font-size="18" fill="#c62828">บล็อก โปรแกรมหยุดรอ (ถึงราว 85 วิ)</text>
  <text x="175" y="130" text-anchor="middle" font-size="17" fill="#4a7c4e">ตอบว่า "ตอนนั้นต่อสำเร็จไหม"</text>
  <rect x="345" y="16" width="310" height="126" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" />
  <text x="500" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#1565c0">wifi.ip()</text>
  <text x="500" y="78" text-anchor="middle" font-size="18" fill="#0d47a1">คืนสตริงเสมอ ไม่เคยคืน None</text>
  <text x="500" y="104" text-anchor="middle" font-size="18" fill="#c62828">ยังไม่มีที่อยู่ = "0.0.0.0"</text>
  <text x="500" y="130" text-anchor="middle" font-size="17" fill="#5472a3">ตอบว่า "เลขที่อยู่ของเราคืออะไร"</text>
  <rect x="670" y="16" width="310" height="126" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" />
  <text x="825" y="48" text-anchor="middle" font-size="22" font-weight="700" fill="#ef6c00">wifi.is_connected()</text>
  <text x="825" y="78" text-anchor="middle" font-size="18" fill="#e65100">คืน True หรือ False</text>
  <text x="825" y="104" text-anchor="middle" font-size="18" fill="#a1683a">ไม่บล็อก ถามได้ทุกรอบ</text>
  <text x="825" y="130" text-anchor="middle" font-size="17" fill="#a1683a">ตอบว่า "ตอนนี้ยังต่ออยู่ไหม"</text>
  <rect x="20" y="156" width="475" height="62" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3" />
  <text x="257" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#6a1b9a">wifi.scan()</text>
  <text x="257" y="207" text-anchor="middle" font-size="17" fill="#4a148c">ทุกวงที่ได้ยิน (ชื่อ, ความแรง, ความปลอดภัย, ช่อง)</text>
  <rect x="505" y="156" width="475" height="62" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="3" />
  <text x="742" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#455a64">wifi.status()["rssi"]</text>
  <text x="742" y="207" text-anchor="middle" font-size="17" fill="#c62828">บนบอร์ดตอนนี้ยังตอบ 0 เสมอ — ไม่ใช่ค่าที่วัดมา</text>
</svg>
<ul>
<li>สามตัวบนใช้ตอนต่อ สองตัวล่างใช้ตอน <strong>หาสาเหตุ</strong> · ความต่างของสามตัวบนอยู่ที่ <strong>เวลาของคำถาม</strong> ไม่ใช่ข้อมูลที่คืนมา</li>
<li>โมดูลนี้มีอีกสามตัวที่วันนี้ไม่ใช้ (<code>disconnect</code> · <code>ping</code> · <code>softap</code>) — ตรวจเองได้เสมอด้วย <code>print(dir(wifi))</code> บนบอร์ด</li>
<li><code>ui</code> <code>rgbmatrix</code> <code>pots</code> <code>buttons</code> <code>sensors</code> <code>gpio</code> คือชุดเดิมจากคาบที่แล้ว · ของใหม่วันนี้คือ <code>wifi</code> <code>mqtt</code> <code>json</code> (และ <code>tesaiot</code> ใน <code>sf2_05</code>)</li>
<li>ปุ่มและลูกบิด <strong>เชื่อตัวอักษรบนแผงบอร์ด:</strong> SW5 = ปุ่มล่าง = <code>buttons.pressed(0)</code> · SW6 = ปุ่มบน = <code>buttons.pressed(1)</code> · VR1–VR4 = <code>pots.read(0)</code>–<code>pots.read(3)</code> · อย่าเชื่อ <code>buttons.name()</code> ไฟล์คาบนี้จึงเขียนชื่อเองใน <code>BTN_NAMES</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="9" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99-%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%A1%E0%B8%B5-6-%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99--%E0%B8%AA%E0%B9%88%E0%B8%A7%E0%B8%99%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88%E0%B8%84%E0%B8%B7%E0%B8%AD-%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%82%E0%B9%88%E0%B8%B2%E0%B8%A2">อ่านโค้ดให้เป็น: ไฟล์คาบนี้มี 6 ส่วน — ส่วนใหม่คือ &quot;เครือข่าย&quot;</h2>
<svg viewBox="0 0 1000 230" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <g font-size="16" text-anchor="middle">
    <rect x="8" y="16" width="155" height="150" rx="14" fill="#eceff1" stroke="#546e7a" stroke-width="3" />
    <text x="85" y="52" font-size="28">⚙️</text><text x="85" y="86" font-weight="700" fill="#37474f">1) ตั้งค่า</text>
    <text x="85" y="112" fill="#546e7a">WIFI_SSID · TEAM</text><text x="85" y="134" fill="#546e7a">เกณฑ์ · เวลา</text>
    <rect x="173" y="16" width="155" height="150" rx="14" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" />
    <text x="250" y="52" font-size="28">🔌</text><text x="250" y="86" font-weight="700" fill="#1565c0">2) ฮาร์ดแวร์</text>
    <text x="250" y="112" fill="#546e7a">เซนเซอร์ ลูกบิด</text><text x="250" y="134" fill="#546e7a">ปุ่ม ไฟ</text>
    <rect x="338" y="16" width="155" height="150" rx="14" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" />
    <text x="415" y="52" font-size="28">🧠</text><text x="415" y="86" font-weight="700" fill="#6a1b9a">3) สมอง</text>
    <text x="415" y="110" font-size="14" fill="#546e7a">build_payload()</text><text x="415" y="130" font-size="14" fill="#546e7a">handle_command()</text><text x="415" y="150" font-size="14" fill="#546e7a">judge()</text>
    <rect x="503" y="16" width="155" height="150" rx="14" fill="#fffde7" stroke="#f9a825" stroke-width="4" />
    <text x="580" y="52" font-size="28">📡</text><text x="580" y="86" font-weight="700" fill="#f57f17">4) เครือข่าย</text>
    <text x="580" y="112" fill="#546e7a">connect_farm()</text><text x="580" y="134" fill="#546e7a">publish · subscribe</text>
    <rect x="668" y="16" width="155" height="150" rx="14" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" />
    <text x="745" y="52" font-size="28">🖥️</text><text x="745" y="86" font-weight="700" fill="#e65100">5) หน้าจอ</text>
    <text x="745" y="112" fill="#546e7a">build_screen()</text><text x="745" y="134" fill="#546e7a">show...()</text>
    <rect x="833" y="16" width="160" height="150" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
    <text x="913" y="52" font-size="28">🔁</text><text x="913" y="86" font-weight="700" fill="#1b5e20">6) โปรแกรมหลัก</text>
    <text x="913" y="112" fill="#546e7a">main() วนลูป</text><text x="913" y="134" font-size="14" fill="#546e7a">อ่าน→ตัดสิน→ส่ง/ทำ</text>
  </g>
  <text x="415" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#6a1b9a">"สมอง" ไม่แตะฮาร์ดแวร์ ไม่แตะเน็ต</text>
  <text x="415" y="222" text-anchor="middle" font-size="15" fill="#6a1b9a">จึงตรวจกฎได้โดยไม่ต้องต่ออะไรเลย</text>
  <text x="580" y="200" text-anchor="middle" font-size="17" font-weight="700" fill="#f57f17">↑ ของใหม่</text>
</svg>
<ul>
<li>ในไฟล์ให้หาบรรทัด <code># ---- 1) ตั้งค่า (แก้ได้) ----</code> ถึง <code># ---- 6) โปรแกรมหลัก ----</code> — ของที่ <strong>ต้องแก้ก่อนรัน</strong> อยู่ส่วนที่ 1 เสมอ</li>
<li>ส่วน <strong>3) สมอง</strong> คือที่ที่ไฟล์ฝึก Code Quest เว้นช่องให้เติม เพราะมันไม่พึ่งเน็ตและไม่พึ่งบอร์ด</li>
<li><strong>ไฟ MQTT มุมขวาบนของจอ</strong> (ทุกไฟล์ที่ใช้ MQTT): เขียว = เชื่อมต่อแล้ว · หรี่ = ออฟไลน์ — เปลี่ยนตอนต่อติด และตอนสายหลุดหรือโปรแกรมจบ</li>
<li><strong>เสียง:</strong> ส่วนที่ 1 มี <code>SPEAKER = 40</code> (ความดังลำโพงรวม 0–100 % ใช้ได้กับ firmware 2.4.2 ขึ้นไป บอร์ดรุ่นเก่าข้ามบรรทัดนี้เอง) และ <code>VOLUME = 25</code> (ความดังของแต่ละเสียง) · ทุกเสียงผ่าน <code>beep(&quot;tap&quot;)</code> และดัง <strong>เฉพาะตอนเกิดเหตุการณ์</strong> ไม่ใช่ทุกรอบลูป</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="code-quest--%E0%B9%82%E0%B8%88%E0%B8%97%E0%B8%A2%E0%B9%8C-4-%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A%E0%B9%83%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1">Code Quest — โจทย์ 4 ระดับในทุกกิจกรรม</h2>
<p>ทำเรียงจากระดับ 1 ขึ้นไป ทำได้ถึงไหนก็ได้แค่นั้น · แต้มสนุก ไม่นับเกรด · ไม่เพิ่มเวลาคาบ</p>
<table>
<thead>
<tr>
<th>ระดับ</th>
<th>ทำอะไร</th>
<th>ประเภท</th>
<th>แต้ม</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 เดา</strong> (Predict)</td>
<td>อ่านโค้ด เขียนคำตอบที่เดาไว้ก่อน แล้วรันดูว่าตรงไหม เช่น สั่งปั๊ม 9999 วินาทีจะเปิดจริงกี่วินาที</td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
<td>ข้อละ 1</td>
</tr>
<tr>
<td><strong>2 แก้</strong> (Tweak)</td>
<td>แก้ตัวเลขในส่วน <code># ---- 1) ตั้งค่า ----</code> แล้วดูผล เช่น <code>TANK_MIN</code> <code>SEND_MS</code></td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
<td>ข้อละ 2</td>
</tr>
<tr>
<td><strong>3 เติม</strong> (Fill-in)</td>
<td>เติมช่อง <code>____</code> ในส่วน <strong>3) สมอง</strong> ของไฟล์ฝึก ให้ผ่านการตรวจอัตโนมัติ</td>
<td>กิจกรรม 4 = โจทย์หลัก (มีเฉลยในคาบ) · กิจกรรม 5 = โจทย์เพิ่ม (โบนัส เฉลยคาบหน้า)</td>
<td>ลงมือ 3 + ผ่าน 1</td>
</tr>
<tr>
<td><strong>4 สร้าง</strong> (Make)</td>
<td>เพิ่มความสามารถใหม่ 1 อย่าง เช่น คำสั่ง <code>{&quot;cmd&quot;:&quot;set&quot;,&quot;tank_min&quot;:20}</code> หรือกฎข้อที่สองในแอป</td>
<td>โจทย์เพิ่ม (โบนัส เฉลยคาบหน้า)</td>
<td>5</td>
</tr>
</tbody>
</table>
<div class="goal">
<p><strong>โจทย์หลัก (มีเฉลยในคาบ)</strong> = ทุกกลุ่มควรทำได้ ไม่มีใครติดค้าง · <strong>โจทย์เพิ่ม (โบนัส เฉลยคาบหน้า)</strong> = ทำเพื่อสนุกและเก็บแต้ม เฉลยต้นคาบหน้า</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="code-quest--%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B8%9D%E0%B8%B6%E0%B8%81%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99--%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%82%E0%B8%B1%E0%B8%94%E0%B8%97%E0%B8%B3%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%84%E0%B8%A3">Code Quest — ไฟล์ฝึกอยู่ที่ไหน + ติดขัดทำอย่างไร</h2>
<div class="cols">
<div>
<p><strong>ไฟล์ฝึก (ระดับ 3)</strong></p>
<ul>
<li><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/practise/sf2_03_practise.py"><code>s2/practise/sf2_03_practise.py</code></a> — โจทย์หลัก กิจกรรม 4: ตรวจคำสั่งปั๊มใน <code>pump_seconds()</code> กับ <code>handle_command()</code></li>
<li><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/practise/solutions/sf2_03_practise_solution.py"><code>s2/practise/solutions/sf2_03_practise_solution.py</code></a> — เฉลย เปิดได้ในคาบ</li>
<li><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/practise/sf2_04_practise.py"><code>s2/practise/sf2_04_practise.py</code></a> — โจทย์เพิ่ม กิจกรรม 5: กฎตัดสินพืชใน <code>judge()</code> (การบ้าน รันใน Emulator ได้)</li>
</ul>
<p>ช่องที่ต้องเติมเขียนว่า <code>____</code> · รันแล้วไฟล์ <strong>ตรวจกฎของเราเองก่อนเปิดจอ</strong> ไม่ต้องต่อเน็ตก็ตรวจได้</p>
</div>
<div>
<p><strong>ติดขัด? บันไดช่วยเหลือ 5 ขั้น</strong></p>
<ol>
<li><strong>คำใบ้ 3 ขั้น</strong> ท้ายใบงาน — เปิดทีละขั้น ขั้นละ −1 แต้ม</li>
<li><strong>อ่านข้อความ error</strong> — <code>NameError: name '____'</code> = ยังมีช่องที่ไม่ได้เติม</li>
<li><strong>ถามเพื่อน 3 คนก่อนถามผู้สอน</strong> (ในทีมหรือทีมข้าง ๆ)</li>
<li><strong>ทางออกฉุกเฉิน:</strong> รันไฟล์ตัวอย่างเต็มเพื่อไปต่อก่อน แล้วค่อยกลับมาเทียบ</li>
<li><strong>เฉลย:</strong> โจทย์หลักอยู่ใน <code>s2/practise/solutions/</code> · ทุกข้ออธิบายต้นคาบหน้า</li>
</ol>
</div>
</div>
</section>

<h1 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B9%80%E0%B8%99%E0%B9%87%E0%B8%95%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%81%E0%B8%A3%E0%B8%81">กิจกรรม 1 — ฟาร์มขึ้นเน็ตครั้งแรก</h1>
<div class="lead">"ต่อติดแล้ว" ไม่ได้แปลว่า "ออนไลน์ตลอด" — ต้องเฝ้าลิงก์</div>
<div class="flow"><b>wifi.connect()</b><i>→</i><b>ได้เลข IP ที่ไม่ใช่ 0.0.0.0</b><i>→</i><b>เฝ้าลิงก์ 1 นาที</b></div>
<div class="files one"><div><div class="fh">★ ทำในห้อง</div><div class="f"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/sf2_01_farm_goes_online.py">sf2_01_farm_goes_online.py</a> <span>— พาโรงเรือนขึ้นอินเทอร์เน็ตครั้งแรก</span></div></div></div>
<div class="chal">🏆 <b>ท้าทาย:</b> กลุ่มไหน <b>ต่อ Wi-Fi ได้เร็วที่สุด</b> (เลข ms บนจอ = เวลาของ <code>wifi.connect()</code>) — แล้ว <b>รหัสผิดหนึ่งตัว</b> ใช้เวลาต่างไปแค่ไหน?</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99%E0%B9%80%E0%B8%99%E0%B9%87%E0%B8%95%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%81%E0%B8%A3%E0%B8%81-1">กิจกรรม 1 — ฟาร์มขึ้นเน็ตครั้งแรก</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> บอร์ดได้เลข IP ที่ <strong>ไม่ใช่</strong> <code>0.0.0.0</code> แล้วเฝ้าดูว่าฟาร์มออนไลน์กี่ % ของเวลา</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>แก้ <code>WIFI_SSID</code> <code>WIFI_PASS</code> แล้วกด <strong>Program to Device</strong> — <strong>จอหลักจะนิ่ง อย่ากดรีเซ็ต</strong></li>
<li>ระหว่างจอนิ่ง: จับเวลาด้วยมือถือ · <strong>จอไฟ RGB ยังวิ่งคำว่า WIFI อยู่ไหม?</strong></li>
<li>จดเวลา (ms) กับ IP ลงใบงาน แล้วลอง <strong>รหัสผิดหนึ่งตัว</strong> เทียบกัน</li>
<li>ระหว่างเฝ้าดู <strong>ปิด Hotspot 10 วินาที</strong> แล้วเปิดใหม่ → วงแหวน % · ไฟ · กราฟ · จอไฟ <code>OFFLINE</code></li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/sf2_01_farm_goes_online__connected.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — Wi-Fi ใน Emulator เป็นแบบจำลอง: เวลา 2201 ms กับ IP 192.168.1.42 ในภาพ <b>ไม่ใช่</b> ค่าของบอร์ดจริง · บนบอร์ดจริงเฝ้าดูลิงก์ด้วย <code>wifi.is_connected()</code> ทุกวินาทีเป็นเวลา 1 นาที</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-scope-dxHM9Aln="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94--%E0%B8%9B%E0%B9%89%E0%B8%B2%E0%B8%A2%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99-%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99-%E0%B8%9A%E0%B8%A3%E0%B8%A3%E0%B8%97%E0%B8%B1%E0%B8%94%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%9A%E0%B8%A5%E0%B9%87%E0%B8%AD%E0%B8%81-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%88%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B8%84%E0%B8%A3%E0%B9%88%E0%B8%AD%E0%B8%A1%E0%B8%A1%E0%B8%B1%E0%B8%99">หัวใจของโค้ด — ป้ายต้องขึ้น &quot;ก่อน&quot; บรรทัดที่บล็อก แล้วจับเวลาคร่อมมัน</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">connect_wifi</span>(<span class="hljs-params">w</span>):
    <span class="hljs-comment"># ป้ายเตือนต้องขึ้นจอ &quot;ก่อน&quot; บรรทัดที่บล็อก คืน (สำเร็จไหม, ใช้ไปกี่ ms)</span>
    show_note(w, <span class="hljs-string">&quot;ครั้งแรกอาจรอนาน จอนิ่งได้ อย่ากดรีเซ็ต&quot;</span>, COL_WARN)
    ui.poll()                          <span class="hljs-comment"># ป้ายทั้งหมดต้องขึ้นจอก่อนเข้าบรรทัดที่บล็อก</span>
    marquee(<span class="hljs-string">&quot;WIFI&quot;</span>, rgbmatrix.YELLOW)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;กำลังต่อ&quot;</span>, WIFI_SSID, <span class="hljs-string">&quot;- บรรทัดถัดไปจะบล็อก&quot;</span>)
    t0 = time.ticks_ms()
    ok = wifi.connect(WIFI_SSID, WIFI_PASS)
    took = time.ticks_diff(time.ticks_ms(), t0)
    w[<span class="hljs-string">&quot;seg&quot;</span>].text(<span class="hljs-built_in">str</span>(took))           <span class="hljs-comment"># Seg7 รับข้อความ ไม่ใช่ตัวเลข</span>
    w[<span class="hljs-string">&quot;seg&quot;</span>].color(COL_OK <span class="hljs-keyword">if</span> ok <span class="hljs-keyword">else</span> COL_BAD)
    <span class="hljs-keyword">return</span> ok, took
</code></pre>
<svg viewBox="0 0 1000 160" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="20" y="20" width="220" height="52" rx="8" fill="#eceff1" stroke="#78909c" stroke-width="2" />
  <text x="130" y="52" text-anchor="middle" font-size="19" fill="#546e7a">ป้าย + ui.poll()</text>
  <rect x="280" y="20" width="340" height="52" rx="8" fill="#fff8e1" stroke="#f57f17" stroke-width="3" />
  <text x="450" y="43" text-anchor="middle" font-size="19" font-weight="700" fill="#e65100">wifi.connect(WIFI_SSID, WIFI_PASS)</text>
  <text x="450" y="64" text-anchor="middle" font-size="16" fill="#e65100">โปรแกรมหยุดรอตรงนี้</text>
  <rect x="660" y="20" width="150" height="52" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="735" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#2e7d32">True → หา IP</text>
  <rect x="830" y="20" width="150" height="52" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2" />
  <text x="905" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#c62828">False → บอกเหตุ</text>
  <line x1="242" y1="46" x2="276" y2="46" stroke="#455a64" stroke-width="3" />
  <line x1="622" y1="46" x2="656" y2="46" stroke="#2e7d32" stroke-width="3" />
  <rect x="300" y="86" width="300" height="12" rx="6" fill="#ffe0b2" />
  <rect id="sf2anim4" x="300" y="86" width="190" height="12" rx="6" fill="#f57f17" /><animate href="#sf2anim4" attributeName="width" values="20;300;20" dur="3s" repeatCount="indefinite"/>
  <text x="450" y="122" text-anchor="middle" font-size="17" fill="#c62828">ระหว่างแถบนี้เดิน จอหลักไม่ขยับเลย (นานถึงราว 85 วินาที)</text>
  <text x="500" y="152" text-anchor="middle" font-size="17" fill="#546e7a">t0 ก่อน · ticks_diff หลัง → ตัวเลข ms บนจอเป็นของบอร์ดเอง ไม่ใช่ความรู้สึกว่า "นานจัง"</text>
</svg>
<p>ป้ายที่สร้างแล้วแต่ยังไม่ได้ <code>ui.poll()</code> จะไปโผล่ <strong>หลัง</strong> <code>connect()</code> จบ — ตอนที่ไม่มีใครต้องการมันแล้ว · ถ้า <code>ok</code> เป็น <code>False</code> ไฟล์รายงานบนจอแล้วหยุดเอง: <strong>โปรแกรมที่พูดเฉพาะตอนสำเร็จ จะเงียบในจังหวะที่คนอยากรู้ที่สุด</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-scope-YjyUMaTX="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD-0000--%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%A3%E0%B8%AB%E0%B8%B1%E0%B8%AA%E0%B8%9C%E0%B8%B4%E0%B8%94%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2%E0%B9%80%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B9%84%E0%B8%A3">กับดักที่ชื่อ <code>&quot;0.0.0.0&quot;</code> — และรหัสผิดใช้เวลาเท่าไร</h2>
<div class="cols">
<div style="flex:0 0 300px">
<p><img src="img/wifi_association_sequence_commons.svg" alt="" style="width:290px;" /></p>
<div class="cap">ลำดับการเข้าร่วมเครือข่ายไร้สาย: ค้นหา → แนะนำตัว → ขอเข้าร่วม — ภาพ: Superspritz / Wikimedia Commons — CC BY-SA 4.0</div>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">wait_for_ip</span>():
    <span class="hljs-comment"># ip() คืน &quot;0.0.0.0&quot; ตอนยังไม่มีที่อยู่ ซึ่งเป็นสตริงที่ if ถือว่าจริง ต้องเทียบตรง ๆ</span>
    ip = wifi.ip()
    <span class="hljs-keyword">for</span> _ <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(IP_TRIES):
        <span class="hljs-keyword">if</span> ip != <span class="hljs-string">&quot;0.0.0.0&quot;</span>:
            <span class="hljs-keyword">break</span>
        ui.poll()
        time.sleep_ms(IP_WAIT_MS)
        ip = wifi.ip()
    <span class="hljs-keyword">return</span> ip
</code></pre>
<ul>
<li><strong>เข้าร่วมวงได้</strong> กับ <strong>ได้เลขที่อยู่</strong> เป็นคนละขั้น — ช่วงที่ยังไม่มีใครแจกเลข <code>wifi.ip()</code> คืน <code>&quot;0.0.0.0&quot;</code></li>
<li><code>&quot;0.0.0.0&quot;</code> ไม่ใช่สตริงว่าง Python จึงถือว่า <strong>จริง</strong> — เขียน <code>if wifi.ip():</code> แล้วผ่านทั้งที่ยังส่งอะไรออกไม่ได้ <strong>ไม่มี error ให้จับเลย</strong></li>
<li><strong>รหัสผิดใช้เวลาต่างจากรหัสถูกไหม?</strong> เรายังไม่เคยวัดบนบอร์ดรุ่นนี้ — ให้แต่ละกลุ่มวัดเอง แล้วเทียบกันทั้งห้อง</li>
</ul>
<div class="think">
<p><strong>ลองดู:</strong> ใส่รหัสผิดหนึ่งตัว จับเวลาเทียบรอบที่ถูก จดทั้งสองค่าลงใบงาน แล้วเดาว่าทำไมจึงต่างกัน (ถ้าต่าง) — ในขั้น &quot;แนะนำตัว&quot; ของภาพซ้าย บอร์ดรู้ได้ตอนไหนว่ารหัสผิด?</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-scope-bAirEt0c="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%9E%E0%B8%A3%E0%B8%B2%E0%B8%B0%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3--%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94-%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%AB%E0%B9%89%E0%B8%AD%E0%B8%87-%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B8%95%E0%B8%AD%E0%B8%9A">ต่อไม่ติดเพราะอะไร? — ให้บอร์ด &quot;ฟังทั้งห้อง&quot; ก่อนตอบ</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">ssid_heard</span>(<span class="hljs-params">nets, ssid</span>):
    <span class="hljs-comment"># ในผล scan() [(ชื่อวง, rssi, ความปลอดภัย, ช่อง), ...] มีวงชื่อนี้ไหม</span>
    <span class="hljs-keyword">for</span> net <span class="hljs-keyword">in</span> nets:
        <span class="hljs-keyword">if</span> net[<span class="hljs-number">0</span>] == ssid:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
<span class="hljs-comment"># ...</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">heard_on_air</span>():
    <span class="hljs-comment"># &quot;ไม่ได้ยินวงเลย&quot; กับ &quot;ได้ยินแต่รหัสผิด&quot; แก้คนละทาง scan() ช่วยแยกให้</span>
    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">return</span> ssid_heard(wifi.scan(), WIFI_SSID)
    <span class="hljs-keyword">except</span> OSError:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
<span class="hljs-comment"># ...</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">failed</span>(<span class="hljs-params">w, led, took</span>):
    <span class="hljs-comment"># ต่อไม่สำเร็จ: บอกว่าต้องแก้ตรงไหน แล้วค้างจอไฟ RGB เป็นสีแดงให้เห็นว่าไม่ผ่าน</span>
    heard = heard_on_air()
    show_state(w, <span class="hljs-string">&quot;ต่อไม่สำเร็จ&quot;</span>, COL_BAD)
    stop(w, led, <span class="hljs-string">&quot;ได้ยินวงแต่ต่อไม่ผ่าน ตรวจรหัสผ่าน&quot;</span> <span class="hljs-keyword">if</span> heard
         <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;ไม่ได้ยินวง &quot;</span> + WIFI_SSID + <span class="hljs-string">&quot; ตรวจชื่อวง&quot;</span>, COL_BAD)
</code></pre>
</div>
<div>
<svg viewBox="0 0 440 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">

  <text x="220" y="102" text-anchor="middle" font-size="17" fill="#37474f">เป็นคลื่น 5 GHz · อยู่ไกลเกิน</text>
  <text x="220" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#1565c0">→ แก้ที่มือถือ / ชื่อวง</text>

  <text x="220" y="252" text-anchor="middle" font-size="17" fill="#37474f">(scan() ไม่ต้องรู้รหัสของใคร)</text>

</div>
<ul>
<li><code>wifi.scan()</code> คืนทุกวงที่บอร์ดได้ยิน <code>[(ชื่อวง, rssi, ความปลอดภัย, ช่อง), ...]</code> — ไฟล์เรียกมัน <strong>หลัง</strong> ต่อไม่สำเร็จ เพื่อแยกสองปัญหาที่ <strong>แก้คนละทาง</strong></li>
<li><code>scan()</code> เองก็บล็อกจนสแกนเสร็จ (จอนิ่งระหว่างนั้น) · ความแรงจริง (dBm) มาจาก <code>scan()</code> ไม่ใช่ <code>status()</code></li>
</ul>
</section>

<h2 id="%E0%B9%80%E0%B8%9D%E0%B9%89%E0%B8%B2%E0%B8%A5%E0%B8%B4%E0%B8%87%E0%B8%81%E0%B9%8C--%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%81%E0%B8%9B%E0%B8%A5%E0%B8%A7%E0%B9%88%E0%B8%B2-%E0%B8%AD%E0%B8%AD%E0%B8%99%E0%B9%84%E0%B8%A5%E0%B8%99%E0%B9%8C%E0%B8%95%E0%B8%A5%E0%B8%AD%E0%B8%94">เฝ้าลิงก์ — &quot;ต่อติดแล้ว&quot; ไม่ได้แปลว่า &quot;ออนไลน์ตลอด&quot;</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">watch_link</span>(<span class="hljs-params">w, led</span>):
    <span class="hljs-comment"># connect() ตอบว่า &quot;ตอนนั้นต่อสำเร็จ&quot; ส่วน is_connected() ตอบว่า &quot;ตอนนี้ยังต่ออยู่ไหม&quot;</span>
    <span class="hljs-comment"># ...</span>
    <span class="hljs-keyword">while</span> time.ticks_diff(time.ticks_ms(), t0) &lt; RUN_MS:
        online = wifi.is_connected()
        total += <span class="hljs-number">1</span>
        up += <span class="hljs-number">1</span> <span class="hljs-keyword">if</span> online <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>
        <span class="hljs-keyword">if</span> online != was:
            drops += <span class="hljs-number">0</span> <span class="hljs-keyword">if</span> online <span class="hljs-keyword">else</span> <span class="hljs-number">1</span>
            link_changed(online, time.ticks_diff(time.ticks_ms(), t0) // <span class="hljs-number">1000</span>)
        was = online
        set_led(led, online)
        show_link(w, online, up * <span class="hljs-number">100</span> // total, drops)
        <span class="hljs-comment"># ...</span>
        time.sleep_ms(TICK_MS)
    <span class="hljs-keyword">return</span> up, total, drops
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">link_changed</span>(<span class="hljs-params">online, sec</span>):
    <span class="hljs-comment"># จอ LED กับเสียง: ทำเฉพาะตอนสถานะเปลี่ยน ไม่ใช่ทุกวินาที</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> online:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;หลุดตอนวินาทีที่&quot;</span>, sec)
    marquee(<span class="hljs-string">&quot;ONLINE&quot;</span> <span class="hljs-keyword">if</span> online <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;OFFLINE&quot;</span>, rgbmatrix.GREEN <span class="hljs-keyword">if</span> online <span class="hljs-keyword">else</span> rgbmatrix.RED)
    beep(<span class="hljs-string">&quot;good&quot;</span> <span class="hljs-keyword">if</span> online <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;bad&quot;</span>)
</code></pre>
</div>
<div>
<p><strong>สองงาน สองจังหวะ</strong></p>
<ul>
<li><strong>ทุกรอบ (ทุกวินาที):</strong> ถาม <code>is_connected()</code> ใหม่ · วงแหวน % · ไฟ · กราฟ — ไม่เชื่อคำตอบเดิมจากรอบก่อน</li>
<li><strong>เฉพาะตอนเปลี่ยน:</strong> จอไฟ <code>ONLINE</code>/<code>OFFLINE</code> · เสียง · <code>print(&quot;หลุดตอนวินาทีที่&quot;, ...)</code> — ทำทุกรอบเมื่อไร เสียงจะดังทุกวินาทีและหาไม่เจอว่าหลุดตอนไหน</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> ถ้าโรงเรือนจริงอยู่ห่างบ้าน 2 กม. กลุ่มจะเอาเน็ตจากไหนมาให้บอร์ด? และจะรู้ได้อย่างไรว่ามันหลุดตอนตีสาม?</p>
</div>
</div>
</div>
</section>

<div class="c60">
<ul>
<li><strong>หัวข้อต้องไม่ซ้ำใคร</strong> ผู้สอนแจก <code>TEAM</code> ให้แต่ละกลุ่มไม่ซ้ำกัน · ไฟล์บอร์ด <strong>ไม่ยอมรัน</strong> ถ้ายังเป็น <code>teamXX</code></li>
<li><strong>ห้าม subscribe <code>#</code></strong> ข้อความของคนแปลกหน้าทั้งโลกจะไหลเข้ามา · แอปของกลุ่มฟัง <code>bento-aiot/&lt;TEAM&gt;/#</code> · หน้ารวมฟัง <code>bento-aiot/+/telemetry</code> กับ <code>/+/event</code></li>
<li><strong>ห้ามส่งความลับ</strong> ไม่ว่ารหัส Wi-Fi ชื่อจริง หรือเบอร์โทร</li>
<li><strong>client_id ชนกันได้กับทุกคนบนอินเทอร์เน็ต</strong> ชนเมื่อไร broker เตะตัวเก่าออก · บอร์ดใช้ <code>bento-farm-&lt;TEAM&gt;-&lt;สุ่ม&gt;</code> (สุ่มใหม่ทุกครั้งที่รัน) · แอป Python ใช้ <code>farm-app-&lt;TEAM&gt;-&lt;สุ่ม&gt;</code> · หน้าเว็บสุ่มชื่อของตัวเอง (<code>farm-web-…</code> / <code>web-…</code>) จึงไม่เตะกัน</li>
</ul>
</div>
<div>
<div class="vid" style="flex-direction:column">
<iframe width="300" height="169" src="https://www.youtube.com/embed/juq_l70Vg1w" title="MQTT Topic Best Practices — HiveMQ" loading="lazy" frameborder="0" allowfullscreen></iframe>
<div><b>MQTT Topic Best Practices | MQTT Essentials Part 6</b><br />HiveMQ · 5:50 · EN<br /><https://www.youtube.com/watch?v=juq_l70Vg1w></div>
</div>
</div>
</div>
<blockquote>
<p>ใครก็ส่งเข้า <code>bento-aiot/&lt;TEAM&gt;/cmd</code> ได้ ไม่ใช่แค่แอปของเรา — นี่คือเหตุผลที่ไฟล์บอร์ด <strong>ไม่เชื่อคนส่งเลยสักบรรทัด</strong> (กิจกรรม 4)</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-scope-jLpTasW1="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AB%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B8%AA%E0%B8%A5%E0%B8%B1%E0%B8%9A-wi-fi-%E2%86%92-ip-%E2%86%92-broker-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%84%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AA%E0%B9%88%E0%B8%87">บันไดสามขั้นที่ห้ามสลับ: Wi-Fi → IP → broker แล้วค่อยส่ง</h2>
<svg viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="20" y="100" width="300" height="56" rx="9" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
  <text x="170" y="124" text-anchor="middle" font-size="19" font-weight="700" fill="#2e7d32">1 · Wi-Fi ต้องให้ IP ก่อน</text>
  <text x="170" y="146" text-anchor="middle" font-size="16" fill="#1b5e20">wifi.connect() + ip() != "0.0.0.0"</text>
  <rect x="350" y="60" width="300" height="56" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="3" />
  <text x="500" y="84" text-anchor="middle" font-size="19" font-weight="700" fill="#1565c0">2 · แนะนำตัวกับ broker</text>
  <text x="500" y="106" text-anchor="middle" font-size="16" fill="#0d47a1">mqtt.connect(BROKER, port=1883, ...)</text>
  <rect x="680" y="20" width="300" height="56" rx="9" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3" />
  <text x="830" y="44" text-anchor="middle" font-size="19" font-weight="700" fill="#6a1b9a">3 · ส่งของจริงออกไป</text>
  <text x="830" y="66" text-anchor="middle" font-size="16" fill="#4a148c">mqtt.publish(TOPIC, json.dumps(body))</text>
  <line x1="322" y1="116" x2="348" y2="100" stroke="#90a4ae" stroke-width="3" />
  <line x1="652" y1="76" x2="678" y2="60" stroke="#90a4ae" stroke-width="3" />
  <text x="170" y="40" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">ขั้นไหนพัง ขึ้นจอว่าพังที่ไหน</text>
  <text x="170" y="64" text-anchor="middle" font-size="16" fill="#c62828">ไม่ใช่ค้างเงียบ</text>
</svg>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">connect_farm</span>(<span class="hljs-params">w</span>):
    <span class="hljs-comment"># บันไดสามขั้น WiFi -&gt; IP -&gt; broker ขั้นไหนพังคืนข้อความบอกว่าพังตรงไหน</span>
    show_note(w, <span class="hljs-string">&quot;ต่อ WiFi... จอนิ่งได้&quot;</span>, COL_WARN)
    ui.poll()                          <span class="hljs-comment"># ป้ายต้องขึ้นจอก่อนบรรทัดที่บล็อก</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> wifi.connect(WIFI_SSID, WIFI_PASS) <span class="hljs-keyword">or</span> wifi.ip() == <span class="hljs-string">&quot;0.0.0.0&quot;</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;ต่อ WiFi ไม่ได้&quot;</span>
    <span class="hljs-keyword">try</span>:
        linked = mqtt.connect(BROKER, port=<span class="hljs-number">1883</span>, client_id=CLIENT_ID, keepalive=<span class="hljs-number">60</span>)
    <span class="hljs-keyword">except</span> OSError:
        linked = <span class="hljs-literal">False</span>
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;&quot;</span> <span class="hljs-keyword">if</span> linked <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;broker ไม่ตอบ พอร์ต 1883?&quot;</span>
</code></pre>
</div>
<div>
<ul>
<li><code>connect_farm()</code> คืน <code>&quot;&quot;</code> = ผ่านครบ หรือคืน <strong>ข้อความบอกว่าพังขั้นไหน</strong> แล้ว <code>main()</code> เอาขึ้นจอ</li>
<li><code>mqtt.connect()</code> ใช้ชื่อ <code>username=</code> ไม่ใช่ <code>user=</code></li>
<li>ตอนสายหลุด <code>publish()</code> <strong>โยน <code>OSError</code></strong> ไม่ได้คืน <code>False</code> — จึงต้องครอบด้วย <code>try</code> (ข้างล่าง)</li>
</ul>
</div>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">publish_json</span>(<span class="hljs-params">topic, obj</span>):
    <span class="hljs-comment"># คืน &quot;ok&quot; / &quot;refused&quot; (broker ไม่รับใบนี้) / &quot;lost&quot; (สายหลุด: publish โยน OSError ไม่ใช่คืน False)</span>
    <span class="hljs-keyword">try</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;ok&quot;</span> <span class="hljs-keyword">if</span> mqtt.publish(topic, json.dumps(obj)) <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;refused&quot;</span>
    <span class="hljs-keyword">except</span> OSError:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;lost&quot;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-scope-f6ccuMWI="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%84%E0%B8%9B%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87--%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%9A%E0%B8%AD%E0%B8%81%E0%B8%95%E0%B8%A3%E0%B8%87-%E0%B9%86-%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B8%88%E0%B8%B3%E0%B8%A5%E0%B8%AD%E0%B8%87">ค่าที่ส่งออกไปต้องเป็นค่าจริง — และบอกตรง ๆ ว่าอะไรจำลอง</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">build_payload</span>(<span class="hljs-params">n, t, h, p, az, knobs, manual</span>):
    <span class="hljs-comment"># รายงานหนึ่งใบ คีย์ครบตามสัญญา MQTT ข้อ 3.1: มี id กับ n เสมอ ตัวไหนอ่านไม่ได้เป็น None</span>
    <span class="hljs-comment"># (ลำดับคีย์ในใบที่ส่งจริงอาจสลับกัน แอปจึงต้องอ่านด้วยชื่อคีย์ ไม่ใช่ตำแหน่ง)</span>
    <span class="hljs-comment"># sim บอกตรง ๆ ว่าคีย์ไหนมาจากลูกบิดจำลอง · by บอกว่าส่งเพราะครบเวลาหรือเพราะคนกด SW5</span>
    body = {<span class="hljs-string">&quot;id&quot;</span>: TEAM, <span class="hljs-string">&quot;n&quot;</span>: n, <span class="hljs-string">&quot;temp_c&quot;</span>: r1(t), <span class="hljs-string">&quot;rh&quot;</span>: r1(h), <span class="hljs-string">&quot;hpa&quot;</span>: r1(p), <span class="hljs-string">&quot;az&quot;</span>: r1(az, <span class="hljs-number">2</span>)}
    body[<span class="hljs-string">&quot;soil&quot;</span>], body[<span class="hljs-string">&quot;light&quot;</span>], body[<span class="hljs-string">&quot;tank&quot;</span>] = knobs          <span class="hljs-comment"># ลูกบิดจำลอง VR1 VR3 VR4</span>
    body[<span class="hljs-string">&quot;sim&quot;</span>], body[<span class="hljs-string">&quot;by&quot;</span>] = <span class="hljs-string">&quot;soil light tank&quot;</span>, <span class="hljs-string">&quot;sw5&quot;</span> <span class="hljs-keyword">if</span> manual <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;timer&quot;</span>
    <span class="hljs-keyword">return</span> body
</code></pre>
<p>ใบจริงที่บอร์ด TESAIoT Dev Kit ส่งถึง broker.hivemq.com ระหว่างการทดสอบ (คีย์ครบตาม <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/MQTT_CONTRACT_th.md"><code>MQTT_CONTRACT_th.md</code></a> ข้อ 3.1 · ลำดับคีย์สลับจากในโค้ด · <code>temp_c</code> สูงเพราะรอบนั้นยังไม่ตั้ง <code>TEMP_OFFSET</code>):</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;n&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">2</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;sim&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;soil light tank&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;az&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">7.88</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team97&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;hpa&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1012.2</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;soil&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">42</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;rh&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">48.3</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;by&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;timer&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;tank&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">28</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;temp_c&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">40.1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;light&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">99</span><span class="hljs-punctuation">}</span>
</code></pre>
<div class="cols">
<div>
<ul>
<li><code>temp_c</code> <code>rh</code> <code>hpa</code> <code>az</code> = <strong>เซนเซอร์จริง</strong> ต่อหน้าเรา — เป่าลม เอียงบอร์ด แล้วเลขบนมือถือขยับตามมือเรา</li>
<li><code>soil</code> <code>light</code> <code>tank</code> = <strong>ลูกบิดจำลอง</strong> VR1 · VR3 · VR4 → คีย์ <code>sim</code> <strong>บอกคนรับตรง ๆ</strong> ว่าคีย์ไหนไม่ใช่เซนเซอร์จริง</li>
<li><code>n</code> เริ่ม 1 ใหม่ทุกครั้งที่รัน ใช้ดูว่ามีใบหาย · <code>by</code> = <code>&quot;timer&quot;</code> หรือ <code>&quot;sw5&quot;</code></li>
</ul>
</div>
<div>
<div class="think">
<p><strong>ทำไมต้องบอกว่าจำลอง?</strong> ถ้าวันหนึ่งข้อมูลนี้ไปอยู่ในรายงานของฟาร์ม แล้วมีคนเอาค่า <code>soil</code> จากลูกบิดไปตัดสินใจรดน้ำจริง — ใครผิด?</p>
</div>
<p><code>null</code> = เซนเซอร์ตัวนั้นอ่านไม่ได้รอบนั้น <strong>แอปต้องไม่พังเมื่อเจอ <code>null</code></strong></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="23" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B9%82%E0%B8%A3%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%A3%E0%B8%B2%E0%B8%A2%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B8%95%E0%B8%B1%E0%B8%A7">กิจกรรม 2 — โรงเรือนรายงานตัว</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> ค่าฟาร์มของกลุ่มขึ้นบน <strong>มือถือ</strong> ทุก 5 วินาที และจดตารางจาก <strong>หน้าเว็บ</strong> ไม่ใช่จากจอบอร์ด</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>แก้ <code>WIFI_SSID</code> <code>WIFI_PASS</code> และ <code>TEAM</code> แล้วรัน (ส่งนาน 30 นาที)</li>
<li>เปิดหน้าอ่านค่าบนมือถือ (สไลด์ถัดไป) ต่อท้าย <code>?team=</code> ด้วยเลขกลุ่ม</li>
<li>จด 3 ใบจากหน้าเว็บ · <strong>เป่าลมใส่บอร์ด</strong> จับเวลาว่ามือถือช้ากว่ากี่วินาที</li>
<li>กด <strong>SW5</strong> (ปุ่มล่าง) = ส่งทันที <code>by = sw5</code> · กด <strong>SW6</strong> (ปุ่มบน) = เหตุการณ์ <code>&quot;event&quot;: &quot;sw6&quot;</code></li>
<li>ห้องเสียงดังไป? ตั้ง <code>SOUND = False</code></li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/sf2_02_greenhouse_report__sent.png" alt="" style="width:590px;" /></p>
<p><img src="img/emu/sf2_02_greenhouse_report__sent_kit.png" alt="" style="width:590px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator (TEAM = team99 เฉพาะตอนถ่าย · ค่าเซนเซอร์จำลอง) — <b>MQTT ใน Emulator เป็น broker จำลอง "No TCP leaves the browser"</b> "ส่งแล้ว 3 ใบ" จึงไม่ได้ออกไปถึง broker.hivemq.com · จอไฟ RGB นับใบที่ส่ง · แผง Emulator พิมพ์ชื่อปุ่มเป็น SW4 / SW5: ปุ่มซ้าย = <b>SW5</b> (ปุ่มล่าง) ปุ่มขวา = <b>SW6</b> (ปุ่มบน)</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-scope-92PGmgGG="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B9%80%E0%B8%A7%E0%B9%87%E0%B8%9A%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1--%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">เปิดหน้าเว็บอ่านค่าของกลุ่ม — ไม่ต้องติดตั้งอะไร</h2>
<svg viewBox="0 0 1000 130" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">

<div>
<ul>
<li>&quot;ทุก 5 วินาที&quot; คือ <strong>ถามว่าถึงเวลาหรือยัง</strong> ไม่ใช่ <code>time.sleep(5)</code> — ไม่งั้นการกดปุ่มระหว่างหลับจะหาย</li>
<li><strong>วัดถี่ แต่ส่งห่าง ๆ</strong> เพราะการส่งกวน broker ของทั้งห้อง</li>
<li><strong>SW6 = เหตุการณ์</strong> ไม่ใช่รายงาน จึงส่งเข้าอีกหัวข้อ (<code>/event</code>)</li>
</ul>
<div class="think">
<p><strong>เฉลยเกมทาย:</strong> มือถือช้ากว่าจอบอร์ดได้ถึง ~5 วินาที ส่วนใหญ่ไม่ใช่เพราะเน็ตช้า — แต่เพราะอะไร? (ดูบรรทัด <code>SEND_MS</code>)<br />
<strong>ใบ้:</strong> ฟาร์ม 1,000 แห่งส่งทุก 5 วิ = 200 ใบต่อวินาที เข้าระบบเดียว</p>

<h1 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B9%81%E0%B8%AD%E0%B8%9B%E0%B9%80%E0%B8%9D%E0%B9%89%E0%B8%B2%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">กิจกรรม 3 — แอปเฝ้าฟาร์มของกลุ่ม</h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-scope-n8F0MnvT="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="28" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%8D%E0%B8%B2-mqtt-%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7--%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B8%A1%E0%B8%B2">สัญญา MQTT หน้าเดียว — ข้อความที่บอร์ดส่งออกมา</h2>
<div class="cols">
<div class="c55">
<table>
<thead>
<tr>
<th>คีย์</th>
<th>ชนิด</th>
<th>ความหมาย</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>id</code> · <code>n</code></td>
<td>ข้อความ · จำนวนเต็ม</td>
<td>เลขกลุ่ม (มีเสมอ) · ลำดับใบ (มีในรายงาน telemetry · event ไม่มี <code>n</code>)</td>
</tr>
<tr>
<td><code>temp_c</code> · <code>rh</code> · <code>hpa</code></td>
<td>ทศนิยม หรือ <code>null</code></td>
<td>อุณหภูมิ (รวม <code>TEMP_OFFSET</code>) · ความชื้น · ความกด</td>
</tr>
<tr>
<td><code>az</code></td>
<td>ทศนิยม หรือ <code>null</code></td>
<td>แรงโน้มถ่วงแกนตั้ง m/s² — ตกลงมาก = &quot;กระถางล้ม&quot;</td>
</tr>
<tr>
<td><code>soil</code> · <code>light</code> · <code>tank</code></td>
<td>0–100 %</td>
<td><strong>จำลอง</strong> จาก VR1 · VR3 · VR4</td>
</tr>
<tr>
<td><code>pump</code></td>
<td>0 / 1</td>
<td>ปั๊มเปิดอยู่ไหม (เฉพาะ <code>sf2_03</code> · <code>sf2_06</code>)</td>
</tr>
<tr>
<td><code>sim</code></td>
<td>ข้อความ</td>
<td>คีย์ไหนมาจากลูกบิด</td>
</tr>
<tr>
<td><code>by</code></td>
<td>ข้อความ</td>
<td><code>timer</code> · <code>sw5</code> · <code>gateway</code></td>
</tr>
</tbody>
</table>
</div>
<div>
<p><code>sf2_03</code> → <code>telemetry</code> (ไม่มี <code>temp_c</code>)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;n&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">7</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;soil&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">20</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;tank&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">80</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;pump&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;sim&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;soil tank&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><code>sf2_02</code> กด SW6 → <code>event</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;sw6&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;msg&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;call&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>กติกาที่แอปต้องรู้:</strong> ไฟล์บอร์ดแต่ละไฟล์ส่งคีย์ไม่เหมือนกัน → <strong>เช็กว่ามีคีย์ก่อนใช้</strong> · ค่าอาจเป็น <code>null</code> · broker สาธารณะ → <strong>ตรวจทุกค่าก่อนใช้</strong> (อาจมีคนส่งขยะมา)</p>
</div>
</div>
<p><code>sf2_04</code> แจ้งเตือนพืช → <code>event</code> (ตัวอย่าง <code>sf2_02</code> → <code>telemetry</code> อยู่ในสไลด์ &quot;ค่าที่ส่งออกไปต้องเป็นค่าจริง&quot;)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;crop&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;tomato&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;level&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">2</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;alert&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;hot&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;temp_c&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">33.5</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;rh&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">62.0</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;sun_c&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">5</span><span class="hljs-punctuation">}</span>
</code></pre>
<div class="src">ที่มา: <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/MQTT_CONTRACT_th.md"><code>MQTT_CONTRACT_th.md</code></a> ข้อ 3.1–3.4 — "หน้านี้คือสัญญาตัวจริงตัวเดียว แอปทุกตัวในคอร์สอ่านจากหน้านี้"</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-marpit-scope-wOIOgmcX="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="29" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%8D%E0%B8%B2-mqtt--%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%97%E0%B8%B2%E0%B8%87-bento-aiotteamcmd">สัญญา MQTT — คำสั่งที่บอร์ดรับทาง <code>bento-aiot/&lt;TEAM&gt;/cmd</code></h2>

<table>
<thead>
<tr>
<th>ส่งแบบนี้</th>
<th>ไฟล์ที่ฟัง</th>
<th>บอร์ดทำอะไร</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>{&quot;cmd&quot;:&quot;pump&quot;,&quot;on&quot;:1,&quot;sec&quot;:10}</code></td>
<td><code>sf2_03</code></td>
<td>เปิดปั๊ม <code>sec</code> วินาที (ไม่ใส่ = 10 · <strong>สูงสุด 30</strong> · ไม่ใช่จำนวนเต็มบวก = 10) แล้วดับเอง · <strong>ไม่ยอมเปิดถ้า <code>tank</code> ต่ำกว่า 10 %</strong></td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;pump&quot;,&quot;on&quot;:0}</code></td>
<td><code>sf2_03</code></td>
<td>ปิดปั๊มทันที</td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;led&quot;,&quot;n&quot;:0,&quot;on&quot;:1}</code></td>
<td><code>sf2_03</code></td>
<td>เหมือน pump · <code>n</code> อื่นที่ไม่ใช่ 0 ถูกปฏิเสธ</td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;beep&quot;}</code></td>
<td><code>sf2_03</code></td>
<td>ลำโพงดังหนึ่งครั้ง &quot;เจ้าของฟาร์มเรียก&quot;</td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;say&quot;,&quot;text&quot;:&quot;HELLO&quot;}</code></td>
<td><code>sf2_03</code></td>
<td>ตัววิ่งบนจอไฟ RGB · อังกฤษ/ตัวเลข ไม่เกิน 20 ตัว (ไทยถูกตัดทิ้ง) · ไม่วิ่งระหว่างปั๊มเปิด</td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;ack&quot;}</code></td>
<td><code>sf2_04</code></td>
<td>รับทราบแจ้งเตือน บอร์ดหยุดร้อง (กด SW5 ที่บอร์ดก็ได้ผลเดียวกัน)</td>
</tr>
<tr>
<td><code>{&quot;cmd&quot;:&quot;set&quot;,&quot;t_hi&quot;:28}</code></td>
<td><code>sf2_04</code></td>
<td>เปลี่ยนเกณฑ์ &quot;ร้อนไป&quot; (จำนวนเต็ม มากกว่าเกณฑ์หนาว ไม่เกิน 45) แล้วตัดสินใหม่ทันที</td>
</tr>
</tbody>
</table>
<ul>
<li>ข้อความที่ไม่ใช่ JSON object หรือ <code>cmd</code> ที่ไม่รู้จัก → บอร์ด <strong>ไม่ทำอะไร</strong> (<code>sf2_03</code> ขึ้นเตือนบนจอ · <code>sf2_04</code> เงียบ)</li>
<li><strong>อย่าส่งรัว:</strong> กล่องรับของบอร์ดมี <strong>ช่องเดียว</strong> ใบใหม่ทับใบเก่า → ส่งห่างกันอย่างน้อย 1 วินาที · กฎอัตโนมัติเว้นอย่างน้อย <strong>60 วินาที</strong> ก่อนสั่งซ้ำ</li>
<li>ข้อความถึงบอร์ดไม่เกิน 255 ไบต์ · ชื่อหัวข้อไม่เกิน 127 ตัว</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-scope-QvIjsHqa="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="30" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="farm_monitorpy--%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B9%81%E0%B8%81%E0%B9%89-todo-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1"><code>farm_monitor.py</code> — ติดตั้งครั้งเดียว แล้วแก้ TODO ของกลุ่ม</h2>
<div class="cols">

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># ===== TODO 1: ตั้งค่าของกลุ่ม =====</span>
TEAM = <span class="hljs-string">&quot;teamXX&quot;</span>                                  <span class="hljs-comment"># ต้องตรงกับ TEAM บนบอร์ด</span>

COLUMNS = [<span class="hljs-string">&quot;n&quot;</span>, <span class="hljs-string">&quot;temp_c&quot;</span>, <span class="hljs-string">&quot;rh&quot;</span>, <span class="hljs-string">&quot;hpa&quot;</span>, <span class="hljs-string">&quot;az&quot;</span>, <span class="hljs-string">&quot;soil&quot;</span>, <span class="hljs-string">&quot;light&quot;</span>, <span class="hljs-string">&quot;tank&quot;</span>, <span class="hljs-string">&quot;pump&quot;</span>]
<span class="hljs-comment"># ...</span>
<span class="hljs-comment"># ===== TODO 3: กฎของกลุ่ม ดินแห้งกว่าเกณฑ์ = สั่งรดน้ำ =====</span>
SOIL_MIN = <span class="hljs-number">30</span>          <span class="hljs-comment"># ดิน (VR1 บนบอร์ด) ต่ำกว่านี้ถือว่าแห้ง</span>
PUMP_SEC = <span class="hljs-number">10</span>          <span class="hljs-comment"># สั่งรดน้ำครั้งละกี่วินาที (บอร์ดตัดที่ 30 เองอยู่แล้ว)</span>
COOLDOWN_S = <span class="hljs-number">60</span>        <span class="hljs-comment"># สั่งแล้วรออย่างน้อยกี่วินาทีก่อนสั่งซ้ำ ไม่งั้นแอปสั่งรัวทุก 5 วินาที</span>
<span class="hljs-comment"># ...</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">rule</span>(<span class="hljs-params">data</span>):
    <span class="hljs-string">&quot;&quot;&quot;รับค่าหนึ่งใบจากบอร์ด คืนคำสั่งที่จะส่งกลับ (dict) หรือ None ถ้าไม่ต้องทำอะไร&quot;&quot;&quot;</span>
    soil = data.get(<span class="hljs-string">&quot;soil&quot;</span>)
    <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(soil, (<span class="hljs-built_in">int</span>, <span class="hljs-built_in">float</span>)) <span class="hljs-keyword">and</span> soil &lt; SOIL_MIN <span class="hljs-keyword">and</span> data.get(<span class="hljs-string">&quot;pump&quot;</span>) != <span class="hljs-number">1</span>:
        <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;cmd&quot;</span>: <span class="hljs-string">&quot;pump&quot;</span>, <span class="hljs-string">&quot;on&quot;</span>: <span class="hljs-number">1</span>, <span class="hljs-string">&quot;sec&quot;</span>: PUMP_SEC}
    <span class="hljs-comment"># TODO 4: เพิ่มกฎของกลุ่มเอง เช่น ร้อนเกิน 32 C ให้ส่ง {&quot;cmd&quot;: &quot;say&quot;, &quot;text&quot;: &quot;HOT&quot;}</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
</code></pre>
</div>
<div>
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> แอปของกลุ่มเองที่ฟังบอร์ดของกลุ่ม ขึ้น <strong>ตารางสด</strong> จด <strong>CSV</strong> และมี <strong>กฎหนึ่งข้อ</strong></p>

<h2 id="%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%81%E0%B8%AD%E0%B8%9B--%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1-%E2%86%92-%E0%B8%88%E0%B8%94-csv-%E2%86%92-%E0%B8%81%E0%B8%8E-%E2%86%92-%E0%B9%80%E0%B8%A7%E0%B9%89%E0%B8%99-60-%E0%B8%A7%E0%B8%B4%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">หัวใจของแอป — ได้ข้อความ → จด CSV → กฎ → เว้น 60 วินาที</h2>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">on_message</span>(<span class="hljs-params">client, userdata, msg</span>):
    text = msg.payload.decode(<span class="hljs-string">&quot;utf-8&quot;</span>, <span class="hljs-string">&quot;replace&quot;</span>)
    <span class="hljs-keyword">try</span>:
        data = json.loads(text)
    <span class="hljs-keyword">except</span> ValueError:
        data = <span class="hljs-literal">None</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-built_in">isinstance</span>(data, <span class="hljs-built_in">dict</span>):               <span class="hljs-comment"># คนอื่นส่งอะไรมาก็ได้ ไม่ใช่ JSON object ก็แค่จดไว้</span>
        data = {}
    now = time.strftime(<span class="hljs-string">&quot;%Y-%m-%d %H:%M:%S&quot;</span>)
    <span class="hljs-keyword">if</span> msg.topic == T_EVT:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;&gt;&gt;&gt; เหตุการณ์:&quot;</span>, text[:<span class="hljs-number">120</span>])
        state[<span class="hljs-string">&quot;writer&quot;</span>].writerow([now, <span class="hljs-string">&quot;event&quot;</span>] + [<span class="hljs-string">&quot;&quot;</span>] * <span class="hljs-built_in">len</span>(COLUMNS) + [text[:<span class="hljs-number">200</span>]])
    <span class="hljs-keyword">else</span>:
        print_row(data)
        state[<span class="hljs-string">&quot;writer&quot;</span>].writerow([now, <span class="hljs-string">&quot;telemetry&quot;</span>] + [data.get(c, <span class="hljs-string">&quot;&quot;</span>) <span class="hljs-keyword">for</span> c <span class="hljs-keyword">in</span> COLUMNS] + [<span class="hljs-string">&quot;&quot;</span>])
        cmd = rule(data)
        <span class="hljs-keyword">if</span> cmd <span class="hljs-keyword">and</span> time.time() - state[<span class="hljs-string">&quot;last_cmd&quot;</span>] &gt;= COOLDOWN_S:
            state[<span class="hljs-string">&quot;last_cmd&quot;</span>] = time.time()
            client.publish(T_CMD, json.dumps(cmd))
            <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;&lt;&lt;&lt; สั่งกลับ:&quot;</span>, json.dumps(cmd))
            state[<span class="hljs-string">&quot;writer&quot;</span>].writerow([now, <span class="hljs-string">&quot;command&quot;</span>] + [<span class="hljs-string">&quot;&quot;</span>] * <span class="hljs-built_in">len</span>(COLUMNS) + [json.dumps(cmd)])
    state[<span class="hljs-string">&quot;log&quot;</span>].flush()                         <span class="hljs-comment"># เขียนลงดิสก์ทันที ปิดแอปแบบไหนข้อมูลก็ไม่หาย</span>
</code></pre>
</div>
<div>
<ul>
<li>ไม่ใช่ JSON object ก็ <strong>แค่จดไว้</strong> ไม่พัง</li>
<li><code>rule(data)</code> ตัดสิน · <code>COOLDOWN_S</code> กัน <strong>สั่งรัวทุก 5 วินาที</strong></li>
<li>ทุกแถวมี <code>kind</code> = <code>telemetry</code> / <code>event</code> / <code>command</code> → CSV คือ <strong>หลักฐาน</strong> ของภารกิจกลุ่ม</li>
<li><code>utf-8-sig</code> = Excel อ่านภาษาไทยถูก · <code>flush()</code> ทุกใบ ปิดแอปแบบไหนข้อมูลก็ไม่หาย</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> แถวที่ควรได้ =<br />
<span style="display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .3em"><span style="border-bottom:2px solid currentColor;padding:0 .3em">เวลาที่ฟัง (วินาที)</span><span>บอร์ดส่งทุกกี่วินาที</span></span> · ได้จริงเท่าไร?<br />
ตอนบอร์ดรัน <code>sf2_02</code> แอปสั่งปั๊มไปแล้ว <strong>ทำไมบอร์ดไม่ทำอะไร?</strong> · ถ้าไม่มี <code>COOLDOWN_S</code> จะสั่งกี่ครั้งใน 1 นาที?</p>
</div>
</div>
</div>
</section>

<h2 id="farm_webhtml--%E0%B9%81%E0%B8%AD%E0%B8%9B%E0%B9%83%E0%B8%99%E0%B9%80%E0%B8%9A%E0%B8%A3%E0%B8%B2%E0%B8%A7%E0%B9%8C%E0%B9%80%E0%B8%8B%E0%B8%AD%E0%B8%A3%E0%B9%8C-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3"><code>farm_web.html</code> — แอปในเบราว์เซอร์ ไม่ต้องติดตั้งอะไร</h2>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-js"><span class="hljs-keyword">const</span> <span class="hljs-variable constant_">BROKER_URL</span> = <span class="hljs-string">&quot;wss://broker.hivemq.com:8884/mqtt&quot;</span>;   <span class="hljs-comment">// สำรอง: &quot;wss://test.mosquitto.org:8081/mqtt&quot;</span>
<span class="hljs-keyword">const</span> <span class="hljs-variable constant_">ROOT</span> = <span class="hljs-string">&quot;bento-aiot&quot;</span>;

<h2 id="vibe-coding--%E0%B9%83%E0%B8%AB%E0%B9%89-ai-%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%A2%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%81%E0%B8%AD%E0%B8%9B%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%88%E0%B8%B2%E0%B8%81-%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%8D%E0%B8%B2">Vibe coding — ให้ AI ช่วยเขียนแอปของกลุ่มจาก &quot;สัญญา&quot;</h2>

<p><strong>วิธี:</strong> คัดลอก <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/MQTT_CONTRACT_th.md"><code>MQTT_CONTRACT_th.md</code></a> <strong>ทั้งหน้า</strong> ไปวางก่อน แล้วตามด้วยประโยคเริ่มต้นหนึ่งข้อ (ข้อ 7 ของสัญญา) · เปลี่ยน <code>team05</code> เป็นเลขกลุ่มของเราทุกที่</p>
<div class="pr">
<div><b>ก. หน้าเว็บไฟล์เดียว</b><br />เขียนหน้าเว็บ dashboard ไฟล์ HTML ไฟล์เดียว ใช้ mqtt.js จาก CDN ต่อ `wss://broker.hivemq.com:8884/mqtt` subscribe `bento-aiot/team05/#` ตามสัญญาข้างบน แสดงการ์ดอุณหภูมิ ความชื้น ดิน ถังน้ำ กราฟอุณหภูมิย้อนหลัง 5 นาที รายการ event ล่าสุด และปุ่ม "รดน้ำ 10 วินาที" ที่ส่ง `{"cmd":"pump","on":1,"sec":10}` ไป `bento-aiot/team05/cmd` ใช้ client id สุ่ม รองรับค่า null และคีย์ที่ขาดหาย ใช้ textContent ห้ามใช้ innerHTML กับข้อมูลที่รับมา ภาษาไทยทั้งหน้า ใช้บนมือถือได้</div>
<div><b>ข. Python จดข้อมูลและเตือน</b><br />เขียนโปรแกรม Python 3 ใช้ paho-mqtt (รองรับทั้งรุ่น 1.x และ 2.x) ต่อ `broker.hivemq.com` พอร์ต 1883 subscribe telemetry และ event ของ `team05` ตามสัญญาข้างบน จดทุกข้อความลงไฟล์ CSV ที่เปิดใน Excel แล้วภาษาไทยไม่เพี้ยน (utf-8-sig) และเตือนบนจอพร้อมเสียงเมื่อได้ event ที่ `level` เป็น 2 หรือเมื่อ `soil` ต่ำกว่า 30 · ถ้าดินแห้งให้ส่งคำสั่งรดน้ำ แต่เว้นอย่างน้อย 60 วินาทีก่อนสั่งซ้ำ และไม่สั่งเมื่อ `pump` เป็น 1 อยู่แล้ว</div>
<div><b>ค. Streamlit</b><br />เขียนแอป Streamlit หนึ่งไฟล์ ใช้ paho-mqtt ใน thread แยกรับ `bento-aiot/team05/telemetry` ตามสัญญาข้างบน เก็บค่าล่าสุด 300 ใบ แสดงตัวเลขล่าสุดด้วย st.metric กราฟ temp_c และ soil ด้วย st.line_chart รีเฟรชทุก 2 วินาที และปุ่มส่งคำสั่งเปิด/ปิดปั๊มไป `bento-aiot/team05/cmd`</div>
<div><b>ง. Node-RED</b><br />อธิบายทีละขั้นให้สร้าง flow ใน Node-RED ที่ใช้ mqtt in ต่อ `broker.hivemq.com:1883` topic `bento-aiot/team05/telemetry` แปลง JSON แล้วแสดง gauge ความชื้นดินและกราฟอุณหภูมิบน Dashboard พร้อมปุ่มที่ส่ง `{"cmd":"pump","on":1,"sec":10}` ผ่าน mqtt out ไป `bento-aiot/team05/cmd` ตามสัญญาข้างบน และให้ไฟล์ flow JSON ที่ import ได้</div>
</div>
<div class="warn">
<p><strong>ก่อนเชื่อโค้ดที่ AI เขียน ตรวจ 4 ข้อ:</strong> ① ทดสอบกับ <code>fake_board.py</code> ก่อนต่อบอร์ดจริง ② client id <strong>สุ่ม</strong> ไม่ซ้ำบอร์ด ③ ข้อมูลที่รับมาใช้ <code>textContent</code> ไม่ใช่ <code>innerHTML</code> ④ กฎอัตโนมัติมี cooldown ≥ 60 วินาที — <strong>จะเขียนเองหรือ vibe coding ก็ได้ แต่กลุ่มต้องอธิบายโค้ดของตัวเองได้</strong></p>
</div>
</section>

<h2 id="%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%84%E0%B8%99%E0%B8%AA%E0%B9%88%E0%B8%87--%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%81%E0%B8%95%E0%B8%B0%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87">ไม่เชื่อคนส่ง — ตรวจทุกคำสั่งก่อนแตะของจริง</h2>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">pump_seconds</span>(<span class="hljs-params">sec</span>):
    <span class="hljs-comment"># ตรวจเวลาที่สั่ง: ไม่ใช่จำนวนเต็มบวก = ค่าตั้งต้น  เกินเพดาน = เพดาน</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-built_in">isinstance</span>(sec, <span class="hljs-built_in">int</span>) <span class="hljs-keyword">or</span> sec &lt;= <span class="hljs-number">0</span>:
        sec = PUMP_DEFAULT_S
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">min</span>(sec, PUMP_MAX_S)
<span class="hljs-comment"># ...</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">handle_command</span>(<span class="hljs-params">raw, tank</span>):
    <span class="hljs-comment"># ตัดสินคำสั่งหนึ่งใบ -&gt; (ทำอะไร, วินาทีหรือข้อความ, ข้อความขึ้นจอ, สี)  ไม่แตะของจริงในนี้</span>
    <span class="hljs-keyword">try</span>:
        cmd = json.loads(raw.decode())
    <span class="hljs-keyword">except</span> ValueError:
        cmd = <span class="hljs-literal">None</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-built_in">isinstance</span>(cmd, <span class="hljs-built_in">dict</span>):      <span class="hljs-comment"># 5, null, [] ก็เป็น JSON ได้ แต่ไม่ใช่คำสั่ง</span>
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;deny&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;อ่านคำสั่งไม่ได้&quot;</span>, COL_BAD
    act, on = cmd.get(<span class="hljs-string">&quot;cmd&quot;</span>, <span class="hljs-string">&quot;&quot;</span>), cmd.get(<span class="hljs-string">&quot;on&quot;</span>, <span class="hljs-number">1</span>)
    <span class="hljs-keyword">if</span> act == <span class="hljs-string">&quot;led&quot;</span> <span class="hljs-keyword">and</span> cmd.get(<span class="hljs-string">&quot;n&quot;</span>, <span class="hljs-number">0</span>) != <span class="hljs-number">0</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;deny&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;ไม่มีปั๊มดวงที่ &quot;</span> + <span class="hljs-built_in">str</span>(cmd.get(<span class="hljs-string">&quot;n&quot;</span>)), COL_WARN
    <span class="hljs-keyword">if</span> act <span class="hljs-keyword">in</span> (<span class="hljs-string">&quot;led&quot;</span>, <span class="hljs-string">&quot;pump&quot;</span>) <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> on:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;off&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;สั่งปิดปั๊ม&quot;</span>, COL_OK
    <span class="hljs-keyword">if</span> act <span class="hljs-keyword">in</span> (<span class="hljs-string">&quot;led&quot;</span>, <span class="hljs-string">&quot;pump&quot;</span>) <span class="hljs-keyword">and</span> tank &lt; TANK_MIN:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;deny&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;น้ำเหลือ %d%% ไม่ยอมเปิด&quot;</span> % tank, COL_BAD
    <span class="hljs-keyword">if</span> act <span class="hljs-keyword">in</span> (<span class="hljs-string">&quot;led&quot;</span>, <span class="hljs-string">&quot;pump&quot;</span>):
        sec = pump_seconds(cmd.get(<span class="hljs-string">&quot;sec&quot;</span>, PUMP_DEFAULT_S))
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;on&quot;</span>, sec, <span class="hljs-string">&quot;เปิดปั๊ม %d วิ&quot;</span> % sec, COL_OK
    <span class="hljs-comment"># ...</span>
    <span class="hljs-keyword">if</span> act != <span class="hljs-string">&quot;&quot;</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;deny&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;ไม่รู้จัก &quot;</span> + <span class="hljs-built_in">str</span>(act)[:<span class="hljs-number">12</span>], COL_WARN
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;&quot;</span>, COL_INFO
</code></pre>
</div>
<div>
<ul>
<li><code>json.loads</code> พัง → ไม่พัง แค่ <strong>&quot;อ่านคำสั่งไม่ได้&quot;</strong> · <code>5</code> <code>null</code> <code>[]</code> เป็น JSON ได้แต่ <strong>ไม่ใช่คำสั่ง</strong></li>
<li>ใครสั่ง 9999 วินาที ก็ได้แค่ <strong><code>PUMP_MAX_S</code> = 30</strong> · ไม่ใช่จำนวนเต็มบวก = 10</li>
<li><strong>ถังต่ำกว่า <code>TANK_MIN</code></strong> → ไม่ยอมเปิด (ปั๊มเดินตัวเปล่า = พัง)</li>
<li><code>handle_command()</code> <strong>แค่ตัดสิน</strong> ไม่แตะฮาร์ดแวร์ → คนละฟังก์ชันกับ <code>act_on()</code> ที่ลงมือ → ตรวจกฎได้โดยไม่ต้องมีปั๊ม (ไฟล์ฝึก Code Quest ระดับ 3 เติมตรงนี้)</li>
</ul>
</div>
</div>
</section>
