<h2 id="%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD-%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%A7%E0%B8%B4%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5--%E0%B8%84%E0%B8%99%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%88%E0%B8%B0%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%8A%E0%B8%B4%E0%B8%99%E0%B8%88%E0%B8%99%E0%B9%80%E0%B8%A1%E0%B8%B4%E0%B8%99">ส่งเมื่อ &quot;เปลี่ยน&quot; ไม่ใช่ทุกวินาที — คนรับจะได้ไม่ชินจนเมิน</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">read_and_judge</span>(<span class="hljs-params">w, s</span>):
    <span class="hljs-comment"># อ่าน -&gt; ตัดสิน -&gt; โชว์ -&gt; แจ้งถ้าเปลี่ยน  คืน True ถ้าเพิ่งแจ้ง (เริ่มนับรอบร้องซ้ำใหม่)</span>
    sun = pots.read(<span class="hljs-number">2</span>) * <span class="hljs-number">10</span> // <span class="hljs-number">4095</span>    <span class="hljs-comment"># VR3 = แดดจำลอง 0-10 C ที่บวกเข้าอุณหภูมิ</span>
    t, h = read_climate()
    <span class="hljs-keyword">if</span> t <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">or</span> h <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span>:
        s.t = <span class="hljs-literal">None</span>                     <span class="hljs-comment"># อ่านไม่ได้ = ลองใหม่รอบหน้าเลย ไม่ต้องรอครบวินาที</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    s.t = t = t + sun
    level, why_th, why_en = judge(t, h, s.lim)
    show_reading(w, s, t, h, sun, level, why_th)
    <span class="hljs-keyword">if</span> level == s.level:               <span class="hljs-comment"># ส่ง เล่นเสียง และเขียนจอไฟ RGB เฉพาะตอนเปลี่ยน</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    on_level(w, s, level, why_th, why_en, t, h, sun)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">on_level</span>(<span class="hljs-params">w, s, level, why_th, why_en, t, h, sun</span>):
    <span class="hljs-comment"># ระดับเปลี่ยน: แจ้งออกเน็ต (สัญญาข้อ 3.4) แล้วค่อยเสียง จอไฟ RGB และกล่องเตือน</span>
    s.level, s.acked = level, level &lt; <span class="hljs-number">2</span>
    s.alerts += <span class="hljs-number">1</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> send({<span class="hljs-string">&quot;id&quot;</span>: TEAM, <span class="hljs-string">&quot;crop&quot;</span>: s.crop[<span class="hljs-number">1</span>], <span class="hljs-string">&quot;level&quot;</span>: level, <span class="hljs-string">&quot;alert&quot;</span>: why_en,
                 <span class="hljs-string">&quot;temp_c&quot;</span>: <span class="hljs-built_in">round</span>(t, <span class="hljs-number">1</span>), <span class="hljs-string">&quot;rh&quot;</span>: <span class="hljs-built_in">round</span>(h, <span class="hljs-number">1</span>), <span class="hljs-string">&quot;sun_c&quot;</span>: sun}):
        stop(w, <span class="hljs-string">&quot;สายหลุดตอนส่ง&quot;</span>)
</code></pre>
</div>
<div class="shot">
<p><img src="img/emu/sf2_04_crop_alert__comfy.png" alt="" style="width:470px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator (TEAM = team99 เฉพาะตอนถ่าย) — มะเขือเทศ 25 °C 70 %RH แดด +0 → "สบายดี" · รอบแรกแจ้งเสมอ จึงขึ้น "แจ้งไปแล้ว 1 ครั้ง" · MQTT ใน Emulator เป็น broker จำลอง ใบแจ้งนั้นไม่ได้ออกนอกเบราว์เซอร์</div>
<ul>
<li><strong>VR3 = แดดจำลอง</strong> บวกอุณหภูมิ 0–10 °C · แจ้งเตือนส่ง <code>sun_c</code> บอกว่าบวกไปเท่าไร</li>
<li><code>level</code> 0 สบาย · 1 เริ่มเครียด · 2 แย่แล้ว (ร้องซ้ำทุก 5 วินาทีจนมีคนรับทราบ)</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="42" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-5--%E0%B8%9E%E0%B8%B7%E0%B8%8A%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%AA%E0%B8%9A%E0%B8%B2%E0%B8%A2-%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%96%E0%B8%B7%E0%B8%AD%E0%B8%A3%E0%B8%B9%E0%B9%89%E0%B8%97%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B5-1">กิจกรรม 5 — พืชไม่สบาย มือถือรู้ทันที</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> แจ้งเตือนขึ้นบนมือถือเมื่อพืชเปลี่ยนสถานะ · มีคนรับทราบ · เปลี่ยนเกณฑ์ได้จากที่ไกล</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>แก้ <code>CROP</code> เป็นพืชของกลุ่ม (ต้องมีใน <code>CROPS</code>) และ <code>TEMP_OFFSET</code> ค่าเดียวกับคาบที่แล้ว</li>
<li>หมุน <strong>VR3</strong> (แดด) จนขึ้น <strong>&quot;แย่แล้ว!&quot;</strong> — ดูมือถือ จอ กล่องเตือน จอไฟ <code>ALERT</code></li>
<li>รับทราบด้วย <code>{&quot;cmd&quot;:&quot;ack&quot;}</code> จากช่อง JSON ในหน้ารวม · อีกรอบรับทราบด้วย <strong>SW5</strong></li>
<li>ส่ง <code>{&quot;cmd&quot;:&quot;set&quot;,&quot;t_hi&quot;:28}</code> → เส้นแดงในกราฟขยับ</li>
<li>หมุน VR3 ขึ้นลงเร็ว ๆ ข้ามเส้น นับแจ้งเตือนใน 30 วินาที</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/sf2_04_crop_alert__alert.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — ตั้งอุณหภูมิจำลอง 30 °C + หมุน VR3 สุด (แดด +10) = 40 °C → "แย่แล้ว!: ร้อนไป" กล่องเตือนลอยกลางจอจนกว่าจะมีคนรับทราบ · <b>MQTT ใน Emulator เป็น broker จำลอง</b> แจ้งเตือนในภาพจึงไม่ได้ออกไปถึงมือถือจริง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-marpit-scope-IVNpWcp0="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="43" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%97%E0%B8%A3%E0%B8%B2%E0%B8%9A--%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%80%E0%B8%81%E0%B8%93%E0%B8%91%E0%B9%8C%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%81%E0%B8%A5--%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%88%E0%B8%B8%E0%B8%94%E0%B8%A7%E0%B8%B2%E0%B8%87%E0%B8%A0%E0%B8%B2%E0%B8%A3%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">รับทราบ + ตั้งเกณฑ์จากที่ไกล — และจุดวางภารกิจกลุ่ม</h2>
<div class="cols">
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">on_command</span>(<span class="hljs-params">w, s, raw</span>):
    <span class="hljs-comment"># คำสั่งจากแอป (สัญญาข้อ 4) คืน True ถ้าเป็นการรับทราบ  คำสั่งที่ไม่รู้จัก = เงียบ ไม่ทำอะไร</span>
    <span class="hljs-keyword">try</span>:                               <span class="hljs-comment"># ใครส่งอะไรมาก็ได้ ไม่ใช่ JSON object ก็ไม่ใช้</span>
        cmd = json.loads(raw.decode())
        act = cmd.get(<span class="hljs-string">&quot;cmd&quot;</span>)
    <span class="hljs-keyword">except</span> Exception:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    <span class="hljs-keyword">if</span> act == <span class="hljs-string">&quot;ack&quot;</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
    <span class="hljs-keyword">elif</span> act == <span class="hljs-string">&quot;set&quot;</span>:                 <span class="hljs-comment"># เกณฑ์ใหม่จากที่ไกล ต้องเป็นเลขจำนวนเต็มในช่วงที่สมเหตุผล</span>
        v = cmd.get(<span class="hljs-string">&quot;t_hi&quot;</span>)
        <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(v, <span class="hljs-built_in">int</span>) <span class="hljs-keyword">and</span> s.lim[<span class="hljs-number">0</span>] &lt; v &lt;= T_HI_MAX:
            s.lim[<span class="hljs-number">1</span>], s.level, s.t = v, -<span class="hljs-number">1</span>, <span class="hljs-literal">None</span>     <span class="hljs-comment"># level -1 + t None = ตัดสินใหม่และแจ้งทันที</span>
            show_crop(w, s)
            beep(<span class="hljs-string">&quot;tap&quot;</span>)
    <span class="hljs-comment"># &gt;&gt;&gt; ภารกิจกลุ่ม: วาง elif สำหรับ &quot;led&quot;/&quot;pump&quot; จาก sf2_03 ตรงนี้ &lt;&lt;&lt;</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
</code></pre>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        msg = mqtt.get_message()       <span class="hljs-comment"># ฟังทุก 20 ms แม้จะอ่านเซนเซอร์แค่ทุกวินาที</span>
        ack = on_command(w, s, msg[<span class="hljs-number">1</span>]) <span class="hljs-keyword">if</span> msg <span class="hljs-keyword">else</span> <span class="hljs-literal">False</span>
        down = buttons.pressed(<span class="hljs-number">0</span>)      <span class="hljs-comment"># SW5 (ปุ่มล่าง) = คนหน้าฟาร์มกดรับทราบเอง ไม่ต้องพึ่งเน็ต</span>
        <span class="hljs-keyword">if</span> down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> was_down:      <span class="hljs-comment"># นับตอนเพิ่งกดลง กดค้างไม่นับซ้ำ</span>
            ack = <span class="hljs-literal">True</span>
        was_down = down
        <span class="hljs-keyword">if</span> ack <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> s.acked:        <span class="hljs-comment"># มีคนรับทราบ: หยุดร้อง ปิดกล่องเตือน จอไฟ RGB ขึ้น ACK</span>
            s.acked = <span class="hljs-literal">True</span>
            close_box(w)
            show_ack(w, s, <span class="hljs-string">&quot;รับทราบแล้ว&quot;</span>, COL_OK)
            rgbmatrix.scroll(<span class="hljs-string">&quot;ACK&quot;</span>, rgbmatrix.CYAN, <span class="hljs-number">80</span>)
            beep(<span class="hljs-string">&quot;tap&quot;</span>)
</code></pre>
<div class="think">
<p><strong>คิด:</strong> หมุนแดดข้ามเส้นเร็ว ๆ ได้ ______ แจ้งเตือนใน 30 วินาที — ถ้าเป็นมือถือเจ้าของฟาร์มจริงจะเกิดอะไร? · แก้อย่างไรให้ต้อง &quot;แย่ติดกัน 5 วินาที&quot; ก่อนแจ้ง?</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="sec" data-theme="default" lang="C" class="sec" data-marpit-pagination="44" style="--paginate:true;--class:sec;--theme:default;" data-marpit-pagination-total="61"><div class="when">2:30 – 2:50 · 20 นาที</div>
<h1 id="%E0%B8%A0%E0%B8%B2%E0%B8%A3%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1--%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%A7%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1">ภารกิจกลุ่ม — ปิดวงจรฟาร์ม</h1>

<h2 id="%E0%B8%A0%E0%B8%B2%E0%B8%A3%E0%B8%81%E0%B8%B4%E0%B8%88-%E0%B8%94%E0%B8%B4%E0%B8%99%E0%B9%81%E0%B8%AB%E0%B9%89%E0%B8%87-%E2%86%92-%E0%B9%81%E0%B8%AD%E0%B8%9B%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99-%E2%86%92-%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94-%E2%86%92-csv-%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%81%E0%B8%90%E0%B8%B2%E0%B8%99">ภารกิจ: ดินแห้ง → แอปตัดสิน → ปั๊มเปิด → CSV เป็นหลักฐาน</h2>
<svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs><marker id="lp" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="16" markerHeight="16" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#546e7a" /></marker></defs>

  <text x="120" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#1b5e20">① หมุน VR1 ลง</text>
  <text x="120" y="90" text-anchor="middle" font-size="16" fill="#37474f">บอร์ดส่ง soil ทุก 5 วิ</text>

  <text x="375" y="90" text-anchor="middle" font-size="16" fill="#37474f">rule() + cooldown 60 วิ</text>
  <rect x="520" y="30" width="220" height="80" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="3" />
  <text x="630" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#6a1b9a">③ ส่ง cmd pump</text>
  <text x="630" y="90" text-anchor="middle" font-size="16" fill="#37474f">บอร์ดตรวจ แล้วเปิดปั๊ม</text>
  <rect x="775" y="30" width="215" height="80" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" />
  <text x="882" y="62" text-anchor="middle" font-size="19" font-weight="700" fill="#e65100">④ pump = 1</text>

<h2 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%A3%E0%B8%B1%E0%B8%99%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94">วิธีรันบนบอร์ด</h2>
<div class="cols">
<div class="c55">
<ol>
<li><strong>บนจอบอร์ด</strong> แตะการ์ด <strong>BENTO Playground</strong> เปิดค้างไว้ก่อนส่งโค้ด</li>
<li><strong>บนคอม</strong> เปิด BENTO IDE (<a href="https://ide.tesaiot.com/">https://ide.tesaiot.com/</a>) กด <strong>Connect</strong> บอร์ด</li>
<li>เปิดไฟล์ของคาบนี้ แก้หัวไฟล์: <code>WIFI_SSID</code> · <code>WIFI_PASS</code> · <code>TEAM</code> จาก <code>teamXX</code> เป็นเลขที่ผู้สอนแจก (ลืม = ไฟล์หยุดตั้งแต่แรกพร้อมบอกบนจอ) · <code>sf2_01</code> ไม่มี <code>TEAM</code> · <code>sf2_04</code> แก้ <code>CROP</code> กับ <code>TEMP_OFFSET</code> ด้วย · <code>sf2_05</code> ใช้ <code>DEVICE_ID</code> ที่ผู้สอนแจก · <code>BROKER</code> ตั้งไว้แล้ว ไม่ต้องแก้</li>
<li>กด <strong>Program to Device</strong> แล้ว <strong>หันไปมองจอบอร์ด</strong> · อย่ากดรีเซ็ตระหว่างที่จอนิ่ง</li>
<li>ข้อความจาก <code>print()</code> เช่น <code>ส่ง: {...}</code> ดูได้ใน <strong>Console</strong></li>
<li><strong>ไฟล์ละครั้ง รันครั้ง</strong> — อย่าแก้หลายไฟล์แล้วค่อยรันทีเดียว จะไม่รู้ว่าพังที่ไหน</li>
</ol>
</div>
<div>
<div class="warn">
<p><strong>บอกตรง ๆ:</strong> ไฟล์บอร์ดของคาบนี้ รันกับ Wi-Fi และ MQTT จริงบนบอร์ด TESAIoT Dev Kit แล้ว (broker.hivemq.com): ค่าจากบอร์ดถึง <code>farm_monitor.py</code> และลง CSV · คำสั่งปั๊มถึงบอร์ด · Gateway สั่ง PLC รดน้ำเองเมื่อดินแห้ง · ยกเว้น <code>sf2_05</code> ที่ต้องใช้รหัสอุปกรณ์จากผู้สอน · broker สาธารณะบางครั้งตอบช้า ถ้าขึ้น <strong>&quot;broker ไม่ตอบ …&quot;</strong> ให้กด <strong>Program to Device</strong> อีกครั้ง · เจออาการแปลกอื่น จดข้อความบนจอลงใบงานแล้วบอกผู้สอน</p>
</div>
<div class="think">
<p><strong>ถ้าเน็ตของสถานที่กันพอร์ตทั้งห้อง</strong> (ผู้สอนประกาศ): ข้อ MQTT ผ่านเมื่อกลุ่มอธิบายจากจอได้ว่าหยุดที่ขั้นไหนของ <strong>Wi-Fi → IP → broker</strong> และเพราะอะไร</p>
</div>
</div>
</div>
</section>

<h2 id="mvp-checkpoint--%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD">MVP checkpoint — ผ่านคาบนี้เมื่อ</h2>

<p><strong>กลุ่มส่งค่าฟาร์มออกไปให้แอปของตัวเองเห็น และสั่งปั๊มกลับมาได้</strong></p>
<ul>
<li>[ ] <code>sf2_01</code> ขึ้นเลข IP ที่ <strong>ไม่ใช่</strong> <code>0.0.0.0</code> บนจอบอร์ด</li>
<li>[ ] <code>sf2_02</code> ค่าของกลุ่มขึ้นบนหน้าเว็บมือถือ (<code>id</code> ตรงกับ TEAM) และกรอกตาราง 4.2 ครบ 3 ใบ</li>
<li>[ ] แอปของกลุ่ม (<code>farm_monitor.py</code> หรือ <code>farm_web.html</code>) แสดงค่าจากบอร์ดของกลุ่มเอง และแก้ TODO อย่างน้อย 2 ข้อ</li>
<li>[ ] มีไฟล์ CSV ที่เปิดใน Excel พร้อมกราฟ (กลุ่มที่ใช้เว็บ: ตารางจดมือ 5 แถว)</li>
<li>[ ] <code>sf2_03</code> ปั๊มเปิดจากคำสั่งที่ไกลอย่างน้อย 1 ครั้ง และกรอกตาราง 4.4 อย่างน้อย 4 แถว</li>
<li>[ ] ภารกิจกลุ่มสำเร็จอย่างน้อย 1 รอบ (มีแถว <code>command</code> และ <code>pump</code> = 1 ใน CSV)</li>
</ul>
<blockquote>
<p><strong>ถ้าเน็ตของห้องกันพอร์ตทั้งห้อง</strong> (ผู้สอนประกาศ) ข้อ MQTT ผ่านเมื่อกลุ่มอธิบายจากจอได้ว่าหยุดที่ขั้นไหนของ Wi-Fi → IP → broker และเพราะอะไร</p>
</blockquote>
</section>

<h2 id="%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%94%E0%B8%B1%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B9%88%E0%B8%AD%E0%B8%A2">กับดักที่เจอบ่อย</h2>

<table>
<thead>
<tr>
<th>อาการ</th>
<th>สาเหตุที่แท้จริง</th>
<th>วิธีแก้</th>
</tr>
</thead>
<tbody>
<tr>
<td>จอนิ่งค้างนาน คิดว่าบอร์ดแฮงก์</td>
<td><code>wifi.connect()</code> บล็อกได้ถึงราว 85 วินาที</td>
<td>รอ <strong>อย่ากดรีเซ็ต</strong> · ป้าย + <code>ui.poll()</code> ต้องมาก่อนบรรทัดนั้น</td>
</tr>
<tr>
<td>ได้ IP แต่ขึ้น &quot;broker ไม่ตอบ …&quot;</td>
<td>broker สาธารณะตอบช้าชั่วคราว · หรือ Wi-Fi ที่ต้อง login หน้าเว็บ / เน็ตกันพอร์ต 1883</td>
<td>กด <strong>Program to Device</strong> อีกครั้ง · ถ้ายังไม่ได้ ใช้ Hotspot มือถือของกลุ่ม</td>
</tr>
<tr>
<td>&quot;ได้ยินวงแต่ต่อไม่ผ่าน&quot;</td>
<td>รหัสผ่านผิด</td>
<td>แก้ <code>WIFI_PASS</code> (อย่างน้อย 8 ตัว)</td>
</tr>
<tr>
<td>&quot;ไม่ได้ยินวง ...&quot;</td>
<td>ชื่อผิด · Hotspot ปิด · เป็นคลื่น 5 GHz</td>
<td>iPhone เปิด Maximize Compatibility · Android เลือก 2.4 GHz</td>
</tr>
<tr>
<td>โค้ดบอกว่าได้ IP แต่ส่งอะไรไม่ออก</td>
<td>เขียน <code>if wifi.ip():</code> — <code>&quot;0.0.0.0&quot;</code> ถือว่าจริง</td>
<td>เทียบตรง ๆ <code>wifi.ip() != &quot;0.0.0.0&quot;</code></td>
</tr>
<tr>
<td>&quot;แก้ TEAM เป็นเลขกลุ่มก่อน&quot;</td>
<td>ยังเป็น <code>teamXX</code></td>
<td>แก้ <code>TEAM</code> ให้ตรงกับที่ผู้สอนแจก</td>
</tr>
<tr>
<td>บอร์ดส่งแต่หน้าเว็บว่าง</td>
<td><code>?team=</code> ไม่ตรง หรือเปิดหน้าเว็บหลังบอร์ดส่ง (ไม่มี retain)</td>
<td>ตรวจ TEAM สองที่ แล้วรอใบถัดไป 5 วินาที</td>
</tr>
<tr>
<td>สองเครื่องผลัดกันหลุด</td>
<td><code>client_id</code> ซ้ำ — broker เตะตัวเก่า</td>
<td>บอร์ดต่อท้ายตัวสุ่มเองทุกครั้งที่รัน · แอปต่อท้ายตัวสุ่มเสมอ</td>
</tr>
<tr>
<td>ต่อ broker ไม่ได้ทันทีหลังหยุดโปรแกรม</td>
<td>การเชื่อมต่อของรอบก่อนยังค้างอยู่ที่ broker</td>
<td>รอราว 1 นาที หรือกด <strong>RESET</strong> แล้วรันใหม่</td>
</tr>
<tr>
<td>ยิงคำสั่งสามใบ บอร์ดได้ใบเดียว</td>
<td>กล่องรับมีช่องเดียว ใบใหม่ทับใบเก่า</td>
<td>ส่งห่างอย่างน้อย 1 วินาที · กฎอัตโนมัติเว้น 60 วินาที</td>
</tr>
<tr>
<td><code>say</code> ภาษาไทยแล้วจอไฟไม่ขึ้น</td>
<td>จอไฟ RGB รับเฉพาะอักษรอังกฤษ ตัวเลข เครื่องหมาย</td>
<td>ใช้อังกฤษ ไม่เกิน 20 ตัว</td>
</tr>
<tr>
<td><code>farm_monitor.py</code> ต่อไม่ได้</td>
<td>ยังไม่ <code>pip install paho-mqtt</code> หรือเน็ตกันพอร์ต 1883</td>
<td>ติดตั้ง · ใช้ Hotspot · หรือใช้ <code>farm_web.html</code></td>
</tr>
<tr>
<td>หน้าเว็บขึ้นผิดพลาด</td>
<td>เน็ตกันพอร์ต 8884</td>
<td>ตัวสำรองที่ผู้สอนประกาศ <code>wss://test.mosquitto.org:8081/mqtt</code> หรือต่อ Hotspot</td>
</tr>
<tr>
<td>แอปไม่เห็นอะไรจากบอร์ดใน Emulator</td>
<td>MQTT ของ Emulator เป็น broker จำลองในเบราว์เซอร์</td>
<td>ทดสอบแอปด้วย <code>fake_board.py</code></td>
</tr>

</table>
<blockquote>
<p>ครึ่งหนึ่งของตารางนี้ <strong>ไม่มี error ให้จับสักตัว</strong> โปรแกรมเดินผ่านไปเงียบ ๆ แล้วรายงานสิ่งที่ไม่จริง — บั๊กที่แพงที่สุดในงานเครือข่าย</p>
</blockquote>

<h2 id="%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B9%81%E0%B8%9B%E0%B8%A5%E0%B8%87--%E0%B9%82%E0%B8%AB%E0%B8%99%E0%B8%94--plc--gateway">ข้อความในแปลง — โหนด · PLC · Gateway</h2>
<div class="cols">
<div>
<p><strong>โหนดเซนเซอร์ → <code>field/&lt;เซนเซอร์&gt;</code></strong> (ทุก 5 วิ ต่อโหนด)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;node&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;soil-1&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;value&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">42</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;unit&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;%&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;n&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">17</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>PLC → <code>plc/state</code></strong> (ทุกครั้งที่เปลี่ยน · ได้คำสั่ง · ทุก 5 วิ)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;pump&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;left_s&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">8</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;why&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;on&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;n&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">23</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><code>why</code>: <code>start</code> · <code>on</code> · <code>off</code> · <code>timeout</code> · <code>blocked_tank</code> · <code>bad_cmd</code> · <code>stop</code> · <code>tick</code> — <strong>ไม่ได้ยิน <code>plc/state</code> เกิน 15 วินาที = ถือว่า PLC หลุด</strong></p>
</div>
<div>
<p><strong>Gateway → <code>telemetry</code></strong> (สรุปทุก 5 วิ)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;n&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">31</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;soil&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">42</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;tank&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">77</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;pump&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">0</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;auto&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;by&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;gateway&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>Gateway → <code>event</code></strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;pump&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;pump&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">1</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;why&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;on&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;plc_lost&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;team05&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;event&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;auto_water&quot;</span><span class="hljs-punctuation">,</span> <span class="hljs-attr">&quot;soil&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">28</span><span class="hljs-punctuation">}</span>
</code></pre>
<p><strong>แอป → Gateway ทาง <code>cmd</code>:</strong> <code>{&quot;cmd&quot;:&quot;pump&quot;,&quot;on&quot;:1,&quot;sec&quot;:10}</code> · <code>{&quot;cmd&quot;:&quot;pump&quot;,&quot;on&quot;:0}</code> · <code>{&quot;cmd&quot;:&quot;auto&quot;,&quot;on&quot;:0}</code> — Gateway ตรวจก่อนแล้วส่งต่อให้ PLC ทาง <code>plc/cmd</code> เช่น <code>{&quot;pump&quot;:1,&quot;sec&quot;:10}</code></p>
</div>
</div>

<h2 id="gateway-%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99%E0%B9%83%E0%B8%88--%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AA%E0%B8%B4%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B9%88-plc-%E0%B8%A3%E0%B8%B2%E0%B8%A2%E0%B8%87%E0%B8%B2%E0%B8%99">Gateway ตัดสินใจ — แต่ความจริงคือสิ่งที่ PLC รายงาน</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">should_water</span>(<span class="hljs-params">farm, soil, tank, since_cmd_ms</span>):
    <span class="hljs-comment"># กฎออโต้: เปิดโหมด + ดินแห้ง + น้ำพอ + PLC บอกว่าปั๊มหยุด + พ้นช่วงรอ</span>
    <span class="hljs-keyword">return</span> (farm.auto <span class="hljs-keyword">and</span> soil <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> soil &lt; SOIL_MIN <span class="hljs-keyword">and</span> tank <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>
            <span class="hljs-keyword">and</span> tank &gt;= TANK_MIN <span class="hljs-keyword">and</span> farm.pump == <span class="hljs-number">0</span> <span class="hljs-keyword">and</span> since_cmd_ms &gt;= COOLDOWN_MS)
<span class="hljs-comment"># ...</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">app_request</span>(<span class="hljs-params">cmd, tank</span>):
    <span class="hljs-comment"># คำสั่งจากแอป (สัญญาข้อ 4.1) -&gt; (คำสั่งถึง PLC หรือ None, โหมดออโต้ใหม่หรือ None, ข้อความ)</span>
    act = cmd.get(<span class="hljs-string">&quot;cmd&quot;</span>) <span class="hljs-keyword">if</span> cmd <span class="hljs-keyword">else</span> <span class="hljs-literal">None</span>
    <span class="hljs-keyword">if</span> act == <span class="hljs-string">&quot;pump&quot;</span> <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> cmd.get(<span class="hljs-string">&quot;on&quot;</span>, <span class="hljs-number">1</span>):
        <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;pump&quot;</span>: <span class="hljs-number">0</span>}, <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;หยุดปั๊ม&quot;</span>
    <span class="hljs-keyword">if</span> act == <span class="hljs-string">&quot;pump&quot;</span>:
        <span class="hljs-keyword">if</span> tank <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">or</span> tank &lt; TANK_MIN:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>, <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;ถังน้ำไม่พอ&quot;</span>
        sec = cmd.get(<span class="hljs-string">&quot;sec&quot;</span>, PUMP_SEC)
        sec = <span class="hljs-built_in">min</span>(sec, PUMP_MAX_S) <span class="hljs-keyword">if</span> <span class="hljs-built_in">isinstance</span>(sec, <span class="hljs-built_in">int</span>) <span class="hljs-keyword">and</span> sec &gt; <span class="hljs-number">0</span> <span class="hljs-keyword">else</span> PUMP_SEC
        <span class="hljs-keyword">return</span> {<span class="hljs-string">&quot;pump&quot;</span>: <span class="hljs-number">1</span>, <span class="hljs-string">&quot;sec&quot;</span>: sec}, <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;รดน้ำ %d วิ&quot;</span> % sec
    <span class="hljs-keyword">if</span> act == <span class="hljs-string">&quot;auto&quot;</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>, <span class="hljs-number">1</span> <span class="hljs-keyword">if</span> cmd.get(<span class="hljs-string">&quot;on&quot;</span>, <span class="hljs-number">1</span>) <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>, <span class="hljs-string">&quot;ตั้งออโต้&quot;</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>, <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;ไม่รู้จักคำสั่ง&quot;</span>
</code></pre>
</div>
<div class="shot">
<p><img src="img/emu/sf2_06_smart_gateway__watering.png" alt="" style="width:470px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — ใน Emulator ไม่มีแปลงและ PLC จริง และ <b>MQTT เป็น broker จำลอง ("No TCP leaves the browser")</b> ภาพนี้ป้อนข้อความแทน <code>field_sim.py</code> เข้า broker จำลองตอนถ่าย: <code>field/soil</code> = 25 · <code>field/tank</code> = 70 · และคำตอบ <code>plc/state</code> ของ PLC → Gateway เห็นดิน 25 % &lt; 30 % สั่งรดน้ำ · ไฟ PLC ติด "เดิน อีก 10 วิ"</div>
</div>
</div>
<ul>
<li><strong>กฎออโต้ห้าข้อต้องจริงพร้อมกัน</strong> ถ้าข้อใดไม่แน่ใจ (<code>None</code>) = ไม่สั่ง · ปุ่ม <strong>SW5</strong> ผ่าน <code>app_request()</code> <strong>กฎเดียวกับคำสั่งจากแอป</strong> · <strong>SW6</strong> หรือแตะสวิตช์บนจอ = สลับโหมดออโต้</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-marpit-scope-P1lg1Ruo="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="54" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="plc-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%83%E0%B8%84%E0%B8%A3--%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%A0%E0%B8%B1%E0%B8%A2%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%8A%E0%B8%B1%E0%B9%89%E0%B8%99">PLC ไม่เชื่อใคร — ความปลอดภัยสองชั้น</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">plc_decide</span>(<span class="hljs-params">raw, tank</span>):
    <span class="hljs-comment"># คำสั่งจาก plc/cmd (สัญญาข้อ 4.2) -&gt; (วินาทีที่จะเปิด / 0 = ปิด / None = ไม่ทำ, เหตุผล)</span>
    <span class="hljs-keyword">try</span>:
        cmd = json.loads(raw.decode())
    <span class="hljs-keyword">except</span> ValueError:
        cmd = <span class="hljs-literal">None</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-built_in">isinstance</span>(cmd, <span class="hljs-built_in">dict</span>) <span class="hljs-keyword">or</span> <span class="hljs-string">&quot;pump&quot;</span> <span class="hljs-keyword">not</span> <span class="hljs-keyword">in</span> cmd:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;bad_cmd&quot;</span>
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> cmd[<span class="hljs-string">&quot;pump&quot;</span>]:
        <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>, <span class="hljs-string">&quot;off&quot;</span>
    <span class="hljs-keyword">if</span> tank &lt; PLC_TANK_MIN:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;blocked_tank&quot;</span>
    sec = cmd.get(<span class="hljs-string">&quot;sec&quot;</span>, PLC_DEFAULT_S)
    <span class="hljs-keyword">if</span> <span class="hljs-keyword">not</span> <span class="hljs-built_in">isinstance</span>(sec, <span class="hljs-built_in">int</span>) <span class="hljs-keyword">or</span> sec &lt;= <span class="hljs-number">0</span>:
        sec = PLC_DEFAULT_S
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">min</span>(sec, PLC_MAX_S), <span class="hljs-string">&quot;on&quot;</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">check_plc_alive</span>(<span class="hljs-params">w, farm, now</span>):
    <span class="hljs-comment"># PLC เงียบเกิน STALE_MS: ไม่รู้แล้วว่าปั๊มเดินไหม ต้องบอกคนทันที (เสียง + ข้อความแดง + event)</span>
    <span class="hljs-keyword">if</span> farm.plc_ms <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> farm.lost <span class="hljs-keyword">and</span> time.ticks_diff(now, farm.plc_ms) &gt;= STALE_MS:
        farm.lost, farm.pump = <span class="hljs-literal">True</span>, <span class="hljs-literal">None</span>
        beep(<span class="hljs-string">&quot;bad&quot;</span>)
        show_note(w, <span class="hljs-string">&quot;PLC หลุด!&quot;</span>, COL_BAD)
        send(<span class="hljs-string">&quot;event&quot;</span>, {<span class="hljs-string">&quot;id&quot;</span>: TEAM, <span class="hljs-string">&quot;event&quot;</span>: <span class="hljs-string">&quot;plc_lost&quot;</span>})
</code></pre>
</div>
<div class="shot">
<p><img src="img/emu/sf2_07_field_station__station.png" alt="" style="width:450px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — <code>sf2_07</code> เล่นเป็นแปลง: VR1 = ดิน 40 % · VR4 = ถัง 80 % · ไฟสีฟ้า = รีเลย์ (TEAM = team99 เฉพาะตอนถ่าย · MQTT ใน Emulator เป็นแบบจำลอง จึง "รับคำสั่งแล้ว 0")</div>
<ul>
<li><strong>ชั้นที่ 1</strong> Gateway ตรวจก่อนส่ง · <strong>ชั้นที่ 2</strong> PLC ตรวจซ้ำด้วยกฎของตัวเอง — ชั้นไหนพลาด อีกชั้นยังกันไว้</li>
<li>Gateway สั่งเปิด 999 วินาที → <strong>ใคร</strong> ตัดเหลือ 30?</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-marpit-scope-yIO9JAq6="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="55" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%99%E0%B8%AD%E0%B8%81%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2-sf2_05--%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B8%88%E0%B8%B3%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88%E0%B8%84%E0%B8%A5%E0%B8%B2%E0%B8%A7%E0%B8%94%E0%B9%8C%E0%B9%80%E0%B8%AD%E0%B8%87">อ่านนอกเวลา: <code>sf2_05</code> — ฟาร์มจำที่อยู่คลาวด์เอง</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">wait_platform</span>(<span class="hljs-params">w</span>):
    <span class="hljs-comment"># สั่งต่อ แล้ววนถาม is_connected() ทุก POLL_MS จนติด (True) หรือรอครบ WAIT_MS (False)</span>
    <span class="hljs-comment"># connect() คืนทันที = &quot;รับคำสั่งแล้ว&quot; ไม่ใช่ &quot;ต่อติดแล้ว&quot; ส่งบรรทัดถัดไปเลยจะหาย</span>
    tesaiot.connect()
    t0 = time.ticks_ms()
    <span class="hljs-keyword">while</span> <span class="hljs-keyword">not</span> tesaiot.is_connected():
        waited = time.ticks_diff(time.ticks_ms(), t0)
        show_wait(w, waited)
        <span class="hljs-keyword">if</span> waited &gt;= WAIT_MS:
            <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
        time.sleep_ms(POLL_MS)
    <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
</code></pre>
<ul>
<li><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/sf2_05_farm_cloud_one_call.py"><code>sf2_05_farm_cloud_one_call.py</code></a> อ่าน <strong>คลังค่าตั้งบนแฟลช</strong> (<code>tesaiot.config()</code>) ได้โดยไม่ต้องมีเน็ต · ถอดไฟแล้วค่ายังอยู่</li>
<li><code>tesaiot.connect()</code> ต่อแบบ <strong>เข้ารหัส TLS เสมอ</strong> จึงต่อ <code>broker.hivemq.com:1883</code> ไม่ได้ · มัน <strong>คืนค่าทันที</strong> ไม่ได้แปลว่าต่อติด → ต้องวนถาม <code>is_connected()</code> เองพร้อมเวลาเลิกรอ</li>
<li>ต้องรอผู้สอนแจกชื่อ broker ของแพลตฟอร์ม · ยังไม่แจก = ไฟล์อ่านคลังค่าตั้งอย่างเดียวแล้วจบอย่างสุภาพ</li>
</ul>
</div>
<div class="shot">
<p><img src="img/emu/sf2_05_farm_cloud_one_call__config.png" alt="" style="width:460px;" /></p>
<div class="cap">ภาพจริงจาก BENTO Emulator — ค่าในตารางเป็นคลังค่าตั้ง <b>จำลอง</b> ของ Emulator ไม่ใช่ค่าบนบอร์ดของกลุ่ม · <code>PLATFORM_BROKER</code> ว่าง จึงขึ้นสีส้ม "ไม่ได้เขียนอะไรลงแฟลช"</div>
</div>
</div>
</section>

<h1 id="exit-ticket--%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C">Exit ticket + ต่อยอดโปรเจกต์</h1>
<div class="lead">ทวนว่าบอร์ด "ส่ง" อะไร "ฟัง" อะไร และ "ไม่เชื่อ" อะไร แล้ววางแผนโปรเจกต์</div>
<div class="flow"><b>Exit ticket</b><i>→</i><b>แผน "ทางออก" + "ทางกลับ" ของโปรเจกต์</b><i>→</i><b>คาบหน้า: เซนเซอร์และ AI</b></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-marpit-scope-saVzLx1s="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="57" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="exit-ticket-%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%99%E0%B8%95%E0%B8%AD%E0%B8%9A-1-%E0%B8%82%E0%B9%89%E0%B8%AD--%E0%B9%81%E0%B8%9C%E0%B8%99%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">Exit ticket (ทุกคนตอบ 1 ข้อ) + แผนโปรเจกต์ของกลุ่ม</h2>
<div class="cols">
<div>
<p>เลือกตอบ <strong>1 ข้อ</strong> จากข้อ 1–3 · ทุกคนตอบข้อ 4</p>
<div class="goal">
<ol>
<li>หัวข้อสามอันของกลุ่มคืออะไร อันไหนบอร์ด <strong>ส่ง</strong> อันไหนบอร์ด <strong>ฟัง</strong>?</li>
</ol>
</div>
<div class="goal" style="border-color:#1e88e5;background:#e3f2fd">
<ol start="2">
<li>ยกตัวอย่างหนึ่งอย่างที่บอร์ด <strong>&quot;ไม่เชื่อคนส่ง&quot;</strong> — ถ้าไม่ทำ ฟาร์มจริงจะเกิดอะไร?</li>
</ol>
</div>
<div class="goal" style="border-color:#8e24aa;background:#f3e5f5">
<ol start="3">
<li>CSV ของกลุ่มช่วยตัดสินใจเรื่องอะไรในงานโลจิสติกส์ของฟาร์ม (วางแผนน้ำ · รอบรดน้ำ)?</li>
</ol>
</div>
<ol start="4">
<li>ความมั่นใจวันนี้ ☐1 ☐2 ☐3 ☐4 ☐5 · เรื่องที่ยังงง …</li>
</ol>
</div>
<div>
<p><strong>ต่อยอดโปรเจกต์</strong> — เริ่มจากแผงควบคุมฟาร์มของคาบที่แล้ว (<a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_05_my_farm_dashboard.py"><code>sf1_05_my_farm_dashboard.py</code></a>) คาบนี้เติม <strong>&quot;ทางออก&quot;</strong> กับ <strong>&quot;ทางกลับ&quot;</strong> ให้มัน</p>
<table>
<thead>
<tr>
<th>คำถาม</th>
<th>แผนของกลุ่ม</th>
</tr>
</thead>
<tbody>
<tr>
<td>ค่าที่แผงจะส่งออก (คีย์ JSON) ทุกกี่วินาที</td>
<td></td>
</tr>
<tr>
<td>เหตุการณ์ที่ควรส่งเข้า <code>/event</code></td>
<td></td>
</tr>
<tr>
<td>คำสั่งที่รับ + ข้อห้ามที่บอร์ดต้องกันเอง</td>
<td></td>
</tr>
<tr>
<td>กฎในแอป + cooldown กี่วินาที</td>
<td></td>
</tr>
<tr>
<td>จอไฟ RGB · SW5 · SW6 · เสียง ทำอะไร</td>
<td></td>
</tr>
</tbody>
</table>
<p>☐ รวมโค้ดส่งค่าจาก <code>sf2_02</code> เข้า <code>sf1_05</code> · ☐ แอปของกลุ่มบันทึก CSV ของโปรเจกต์ได้</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="58" style="--paginate:true;--theme:default;" data-marpit-pagination-total="61">
<h2 id="%E0%B8%84%E0%B8%B2%E0%B8%9A%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2-%E0%B9%80%E0%B8%8B%E0%B8%99%E0%B9%80%E0%B8%8B%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B9%81%E0%B8%A5%E0%B8%B0-ai-%E0%B9%83%E0%B8%99%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1--%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">คาบหน้า: เซนเซอร์และ AI ในฟาร์ม + เริ่มโปรเจกต์ของกลุ่ม</h2>
<div class="cols">
<div class="c55">
<ul>
<li>ให้บอร์ด <strong>&quot;รู้สึก&quot;</strong> มากขึ้น: <strong>เรดาร์</strong> เฝ้าคอก · <strong>ไมค์</strong> ฟังเล้าไก่ · <strong>แรงสั่น</strong> ของปั๊มน้ำ</li>
<li><strong>กฎที่เราเขียนเอง vs AI ที่รันบนชิปในบอร์ด (Edge AI)</strong> — แล้ววัดเองว่าแบบไหนเหมาะกับปัญหาไหน</li>
<li>ชั่วโมงสุดท้ายของคาบ <strong>เริ่มโปรเจกต์ของกลุ่ม</strong> (Project Canvas แล้ว MVP บนบอร์ด) จากแม่แบบ <strong>Smart IoT Gateway ครบห้าเสา</strong> — เก็บแอปและ CSV ของวันนี้ไว้ ใช้ต่อได้ทันที</li>
<li><strong>เตรียมมา:</strong> Hotspot มือถือ (ชื่อ/รหัสเดิม) · โน้ตบุ๊กที่ติดตั้ง <code>paho-mqtt</code> แล้ว · แผนโปรเจกต์ในตารางสไลด์ก่อน</li>
</ul>
</div>
<div>

<h2 id="%E0%B8%AD%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AD%E0%B8%B4%E0%B8%87%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%94%E0%B8%B4%E0%B8%95-12--%E0%B8%A0%E0%B8%B2%E0%B8%9E%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%84%E0%B8%94%E0%B8%AD%E0%B8%B0%E0%B9%81%E0%B8%81%E0%B8%A3%E0%B8%A1">อ้างอิงและเครดิต (1/2) — ภาพและไดอะแกรม</h2>

<p><strong>ภาพจากแหล่งภายนอก</strong></p>
<table>
<thead>
<tr>
<th>ภาพ</th>
<th>ผู้สร้าง</th>
<th>สัญญาอนุญาต</th>
<th>ที่มา</th>
</tr>
</thead>
<tbody>
<tr>
<td>ลำดับการเข้าร่วมเครือข่ายไร้สาย (802.11 Connection Setup)</td>
<td>Superspritz</td>
<td>CC BY-SA 4.0</td>
<td><a href="https://commons.wikimedia.org/wiki/File:802.11_Connection_Setup.svg">Wikimedia Commons</a></td>
</tr>
</tbody>
</table>
<p><strong>ภาพหน้าจอจาก BENTO Emulator</strong> (ค่าเซนเซอร์ Wi-Fi และ MQTT เป็นค่าจำลอง · MQTT ใน Emulator เป็น broker จำลองในเบราว์เซอร์ &quot;No TCP leaves the browser&quot; · ไฟล์ของคอร์สไม่ถูกแก้ ตอนถ่ายภาพแทน <code>TEAM = &quot;teamXX&quot;</code> เป็น <code>team99</code> และป้อนข้อความเข้า broker จำลองในภาพ <code>sf2_03</code> กับ <code>sf2_06</code> ตามที่เขียนใต้ภาพ)<br />
<code>sf2_01</code> ต่อ Wi-Fi แล้ว · <code>sf2_02</code> ส่งแล้ว 3 ใบ (+ แผงลูกบิด/จอไฟ RGB) · <code>sf2_03</code> ปั๊มเปิด (+ แผง) และถังแห้งดับเอง · <code>sf2_04</code> สบายดี และแย่แล้ว (กล่องเตือน) · <code>sf2_05</code> คลังค่าตั้ง · <code>sf2_06</code> Gateway สั่งรดน้ำ · <code>sf2_07</code> แปลงผัก: โหนด + PLC</p>
<p><strong>ไดอะแกรมที่วาดขึ้นเองสำหรับคอร์สนี้ (SVG/HTML):</strong> ปก · สองลูกศรวิ่งสวนทาง · captive portal · โมดูล wifi · ไฟล์ 6 ส่วน · ป้ายก่อนบรรทัดที่บล็อก · ได้ยินวงไหม · 1883 กับ wss 8884 · broker สาธารณะ · บันไดสามขั้น · หน้าอ่านค่า 4 ขั้น · เส้นเวลา fake_board · กล่องรับช่องเดียว · ภารกิจปิดวงจร · ข้อมูลไหลไปทางไหน · Smart IoT Gateway</p>
<p><strong>อีโมจิ:</strong> Twemoji — Twitter, Inc. และผู้ร่วมพัฒนา (jdecked/twemoji) — CC BY 4.0</p>
<p><strong>ข้อมูลในสไลด์:</strong> โค้ดทุกชิ้นคัดจากไฟล์ใน <code>s2/</code> ของคอร์สตรงตัว (ละได้เฉพาะบรรทัด <code># ...</code>) · หัวข้อ คีย์ และคำสั่งจาก <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/MQTT_CONTRACT_th.md"><code>MQTT_CONTRACT_th.md</code></a> · ลำดับกิจกรรมจาก <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/sf-s2-th.worksheet.md"><code>sf-s2-th.worksheet.md</code></a> · ฮาร์ดแวร์: TESAIoT Dev Kit SDK — <a href="https://tesaiot.github.io/tesaiot-pse84-devkit-sdk/">https://tesaiot.github.io/tesaiot-pse84-devkit-sdk/</a></p>
<p><strong>สถานะการทดสอบ:</strong> <code>farm_monitor.py</code> และ <code>farm_web.html</code> ทดสอบกับ broker.hivemq.com จริงแล้ว โดยใช้บอร์ดจำลองบนโน้ตบุ๊ก · ไฟล์บอร์ด รันกับ Wi-Fi และ MQTT จริงบนบอร์ด TESAIoT Dev Kit แล้ว (broker.hivemq.com): ค่าจากบอร์ดถึง <code>farm_monitor.py</code> และลง CSV · คำสั่งปั๊มถึงบอร์ด · Gateway สั่ง PLC รดน้ำเองเมื่อดินแห้ง · ยกเว้น <code>sf2_05</code> ที่ต้องใช้รหัสอุปกรณ์จากผู้สอน</p>
</section>

<p><strong>วิดีโอ (YouTube — ลิขสิทธิ์เป็นของเจ้าของช่อง ใช้ด้วยการฝัง/ลิงก์)</strong></p>
<ul>
<li><a href="https://www.youtube.com/watch?v=-K3zSs1a1yo">EP5 เข้าใจ MQTT และ HTTP พื้นฐานสำคัญของการสื่อสารในระบบ IoT</a> — N Academy · 8:15</li>
<li><a href="https://www.youtube.com/watch?v=HCzQJMdHcy0">Pub Sub Model · MQTT Essentials Part 3</a> — HiveMQ · 5:48</li>
<li><a href="https://www.youtube.com/watch?v=t2b1CwQmDRY">MQTT Publish / Subscribe / Unsubscribe · MQTT Essentials Part 5</a> — HiveMQ · 5:23</li>
<li><a href="https://www.youtube.com/watch?v=juq_l70Vg1w">MQTT Topic Best Practices · MQTT Essentials Part 6</a> — HiveMQ · 5:50</li>
<li><a href="https://www.youtube.com/watch?v=fCfK7ugax1s">อธิบาย IoT Gateway · What is IoT Gateway</a> — Factonation · 3:53</li>
<li><a href="https://www.youtube.com/watch?v=-OFNvMDLv5g">Control PLC by MQTT Client</a> — ThaiPLC · 6:21</li>
<li><a href="https://www.youtube.com/watch?v=MHUWmhuaC1A">ตอนที่ 3 - ระบบ IoT sensor สำหรับความชื้นในดิน</a> — mju.mooc · 5:13</li>
</ul>
<p><strong>มาตรฐานและเอกสารเปิดที่อ้างถึง:</strong> IEEE 802.11 (ลำดับการเข้าร่วมเครือข่าย) · MQTT 3.1.1 — OASIS Standard (topic, publish/subscribe, QoS 0) · RFC 8259 (JSON) · HiveMQ public broker <code>broker.hivemq.com</code> (1883 TCP · 8884 wss) · หน้าเว็บของคอร์สใช้ MQTT.js 5.16.0 จาก cdn.jsdelivr.net · Python ใช้ paho-mqtt</p>
</section>

<style>
.bento-nav{position:fixed;z-index:99999;font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,Segoe UI,sans-serif;
  font-weight:700;font-size:14px;line-height:1;text-decoration:none;padding:9px 15px;border-radius:999px;
  background:rgba(13,17,23,.82);color:#71C7EC;border:1px solid rgba(120,200,255,.42);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.35);
  transition:background .15s,color .15s,transform .15s;user-select:none}
.bento-nav:hover{background:#71C7EC;color:#0d1117;transform:translateY(-1px)}
.bento-nav.toc{top:14px;left:14px}
.bento-nav.next{bottom:16px;right:16px}
.bento-nav.prev{bottom:16px;left:16px;color:#93a0bd;border-color:rgba(147,160,189,.4)}
.bento-nav.prev:hover{background:#93a0bd;color:#0d1117}
@media print{.bento-nav{display:none !important}}
/* lightbox: คลิกภาพในเด็คเพื่อดูใหญ่ (คำสั่งอาจารย์ 2026-08-20) */
svg[data-marpit-svg] section img{cursor:zoom-in}
#bento-lightbox{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:zoom-out}
#bento-lightbox.open{display:flex}
#bento-lightbox img{max-width:94vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.6);
  background:#0d1117;cursor:default}
#bento-lightbox-close{position:fixed;top:14px;right:16px;z-index:100001;font:700 20px/1 sans-serif;
  color:#e6edf3;background:rgba(13,17,23,.82);border:1px solid rgba(120,200,255,.42);border-radius:999px;
  width:44px;height:44px;cursor:pointer}
#bento-lightbox-close:hover{background:#71C7EC;color:#0d1117}
@media print{#bento-lightbox{display:none !important}}
</style>


<div id="bento-lightbox" role="dialog" aria-modal="true" aria-label="ดูภาพขยาย">
  <button id="bento-lightbox-close" aria-label="ปิด" title="ปิด (Esc)">&#10005;</button>
  <img id="bento-lightbox-img" alt="">
</div>
<script>
(function(){
  var box = document.getElementById('bento-lightbox');
  var big = document.getElementById('bento-lightbox-img');
  function close(){ box.classList.remove('open'); big.src = ''; }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t === big) { e.stopPropagation(); return; }        /* คลิกบนภาพใหญ่ = เฉย ๆ */
    if (t.closest && t.closest('#bento-lightbox')) {       /* ฉากหลังหรือปุ่ม = ปิด */
      e.stopPropagation(); close(); return;
    }
    var img = t.closest ? t.closest('svg[data-marpit-svg] section img') : null;
    if (!img || !img.src) return;
    big.src = img.currentSrc || img.src;
    big.alt = img.alt || '';
    box.classList.add('open');
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && box.classList.contains('open')) { close(); e.stopPropagation(); }
  }, true);
})();
</script>
