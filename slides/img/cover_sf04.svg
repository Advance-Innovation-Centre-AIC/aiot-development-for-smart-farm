<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.6" stop-color="#132a44"/>
      <stop offset="1" stop-color="#1d4d2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#cfd8dc"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- fields -->
  <path d="M0 640 Q 320 590 640 630 T 1280 610 L1280 720 L0 720 Z" fill="#1f5f33"/>
  <path d="M0 680 Q 360 650 720 682 T 1280 672 L1280 720 L0 720 Z" fill="#27773f"/>
  <!-- the loop, right side -->
  <g transform="translate(1000 330)">
    <circle r="210" fill="url(#glow)"/>
    <circle r="165" fill="none" stroke="#cfd8dc" stroke-width="4" stroke-dasharray="10 10" opacity="0.55"/>
    <!-- heart in the middle -->
    <path d="M0 40 C -70 -10 -60 -70 -20 -70 C -6 -70 0 -58 0 -50 C 0 -58 6 -70 20 -70 C 60 -70 70 -10 0 40 Z" fill="#e5484d" stroke="#ffb3b3" stroke-width="3"/>
    <text y="-18" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">AIoT</text>
    <!-- four nodes -->
    <g font-size="26" font-weight="700" text-anchor="middle" fill="#fff">
      <circle cx="0" cy="-165" r="58" fill="#1e88e5" stroke="#bbdefb" stroke-width="4"/>
      <text x="0" y="-157">วัด</text>
      <circle cx="165" cy="0" r="58" fill="#8e24aa" stroke="#e1bee7" stroke-width="4"/>
      <text x="165" y="8">ตัดสิน</text>
      <circle cx="0" cy="165" r="58" fill="#2e7d32" stroke="#c8e6c9" stroke-width="4"/>
      <text x="0" y="173">ทำ</text>
      <circle cx="-165" cy="0" r="58" fill="#ef6c00" stroke="#ffe0b2" stroke-width="4"/>
      <text x="-165" y="8">โชว์</text>
    </g>
    <g font-size="15" text-anchor="middle" fill="#e3f2fd">
      <text x="0" y="-132">Sense</text><text x="165" y="33">Decide</text>
      <text x="0" y="198">Act</text><text x="-165" y="33">Show</text>
    </g>
    <g fill="none" stroke="#cfd8dc" stroke-width="4" marker-end="url(#ah)">
      <path d="M 58 -150 Q 140 -140 152 -62"/>
      <path d="M 152 62 Q 140 140 60 150"/>
      <path d="M -60 150 Q -140 140 -152 62"/>
      <path d="M -152 -62 Q -140 -140 -60 -150"/>
    </g>
  </g>
  <!-- four principle cards, bottom left -->
  <g transform="translate(64 560)" font-size="18" fill="#fff">
    <rect x="0" y="0" width="92" height="56" rx="10" fill="#1e88e5" opacity="0.9"/>
    <rect x="104" y="0" width="92" height="56" rx="10" fill="#8e24aa" opacity="0.9"/>
    <rect x="208" y="0" width="92" height="56" rx="10" fill="#2e7d32" opacity="0.9"/>
    <rect x="312" y="0" width="92" height="56" rx="10" fill="#ef6c00" opacity="0.9"/>
    <g text-anchor="middle" font-weight="700"><text x="46" y="35">cp1</text><text x="150" y="35">cp2</text><text x="254" y="35">cp3</text><text x="358" y="35">cp4</text></g>
  </g>
</svg>
