<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" font-family="sans-serif">
  <defs>
    <marker id="p3pa" markerUnits="userSpaceOnUse" viewBox="0 0 12 12" markerWidth="16" markerHeight="16" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#546e7a"/></marker>
    <linearGradient id="p3tube" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c5e1a5"/><stop offset="0.5" stop-color="#7cb342"/><stop offset="1" stop-color="#558b2f"/></linearGradient>
  </defs>
  <rect width="1000" height="320" rx="18" fill="#fbfdf9"/>
  <!-- LEFT: MQTT 1883 open envelope -->
  <text x="245" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#c62828">MQTT · พอร์ต 1883 · ซองเปิด</text>
  <rect x="20" y="70" width="92" height="56" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="66" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">บอร์ด</text>
  <rect x="378" y="70" width="92" height="56" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2.5"/>
  <text x="424" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#455a64">broker</text>
  <line x1="114" y1="98" x2="372" y2="98" stroke="#b0bec5" stroke-width="10"/>
  <line x1="114" y1="98" x2="372" y2="98" stroke="#546e7a" stroke-width="2.5" marker-end="url(#p3pa)"/>
  <!-- open envelope -->
  <rect x="160" y="112" width="170" height="78" rx="6" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
  <path d="M160 112 L245 84 L330 112" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="245" y="146" text-anchor="middle" font-size="15" font-family="monospace" fill="#b71c1c">{"soil": 42,</text>
  <text x="245" y="168" text-anchor="middle" font-size="15" font-family="monospace" fill="#b71c1c"> "pump": 1}</text>
  <text x="112" y="222" font-size="26">👀</text>
  <text x="148" y="218" font-size="15" fill="#37474f">ใครอยู่กลางทางก็ <tspan font-weight="700" fill="#c62828">อ่านได้</tspan> และ <tspan font-weight="700" fill="#c62828">แก้ได้</tspan></text>
  <text x="148" y="240" font-size="14" fill="#546e7a">Wi-Fi เดียวกัน · เราเตอร์ · ผู้ให้บริการ</text>
  <line x1="500" y1="16" x2="500" y2="258" stroke="#cfd8dc" stroke-width="2"/>
  <!-- RIGHT: MQTTS sealed tube -->
  <text x="752" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#2e7d32">MQTTS · 8883 / 8884 · ท่อปิดผนึก</text>
  <rect x="520" y="70" width="92" height="56" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="566" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1">บอร์ด</text>
  <rect x="890" y="70" width="92" height="56" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2.5"/>
  <text x="936" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="#455a64">broker</text>
  <rect x="614" y="80" width="274" height="36" rx="18" fill="url(#p3tube)" stroke="#33691e" stroke-width="2"/>
  <text x="751" y="104" text-anchor="middle" font-size="14" font-family="monospace" fill="#fff">8f 2c a1 d7 04 …</text>
  <text x="742" y="72" font-size="22">🔒</text>
  <text x="530" y="152" font-size="15" fill="#37474f"><tspan font-weight="700" fill="#2e7d32">① เข้ารหัส</tspan> — คนกลางทางเห็นแต่ไบต์มั่ว ๆ</text>
  <text x="530" y="178" font-size="15" fill="#37474f"><tspan font-weight="700" fill="#2e7d32">② broker ยื่นใบรับรอง</tspan> — บอร์ดรู้ว่าคุยกับตัวจริง</text>
  <text x="530" y="204" font-size="15" fill="#37474f"><tspan font-weight="700" fill="#6a1b9a">③ mTLS</tspan> — บอร์ดยื่น <tspan font-weight="700">บัตรประจำตัว</tspan> ของตัวเองด้วย</text>
  <text x="552" y="226" font-size="13.5" fill="#6a1b9a">🔑 โหมดกุญแจฮาร์ดแวร์: กุญแจลับเก็บในส่วนปลอดภัยของบอร์ด</text>
  <!-- bottom: what this board has -->
  <rect x="14" y="258" width="972" height="54" rx="10" fill="#fff8e1" stroke="#f5a623" stroke-width="2.5"/>
  <text x="30" y="281" font-size="15" fill="#37474f"><tspan font-weight="700" fill="#e65100">บอร์ดนี้:</tspan> <tspan font-family="monospace">mqtt</tspan> ไม่เข้ารหัสอย่างเดียว (ไม่มี TLS · ไม่มี retain · ไม่มี Last Will · รับข้อความละ ≤ 255 ไบต์)</text>
  <text x="30" y="303" font-size="15" fill="#37474f">TLS มีทางเดียว: โมดูล <tspan font-family="monospace">tesaiot</tspan> → broker ของแพลตฟอร์ม TESAIoT (server TLS 8884 · mTLS 8883 · ไม่มี subscribe)</text>
</svg>
