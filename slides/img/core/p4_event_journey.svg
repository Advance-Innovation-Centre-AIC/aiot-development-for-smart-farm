<rect x="176" y="72" width="76" height="34" rx="8" fill="#4a9eff"/>
<text x="214" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ปุ่ม</text>
<text x="214" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">LVGL</text>
<text x="214" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">รู้ว่าโดนวิดเจ็ตไหน</text>
<text x="214" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">เกิดเหตุการณ์ 1 ชิ้น</text>
