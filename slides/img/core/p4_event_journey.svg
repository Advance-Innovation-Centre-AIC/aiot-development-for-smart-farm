<rect x="450" y="76" width="100" height="28" rx="6" fill="#0d1117"/>
<text x="500" y="95" text-anchor="middle" font-size="14" font-family="monospace" fill="#e6edf3">ui.poll()</text>
<text x="500" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">ถามทุกรอบ</text>
<text x="500" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">ทุก 20–50 ms · ≤ 8 ชิ้น</text>
<text x="500" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">มีเหลือ → ถามจนว่าง</text>
<!-- 5 router -->
<g font-family="monospace" font-size="10.5">
<rect x="585" y="64" width="116" height="52" rx="6" fill="#fff" stroke="#1e88e5" stroke-width="1.5"/>
<text x="591" y="79" fill="#1565c0">(3,clicked)→ถาม</text>
<text x="591" y="94" fill="#1565c0">(3,long_pressed)</text>
<text x="591" y="109" fill="#1565c0">  →เปิดปั๊ม</text>
</g>
<text x="643" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">ตารางแยกทาง</text>
<text x="643" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">กุญแจ = (id, type)</text>
<text x="643" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">→ ฟังก์ชันที่ต้องเรียก</text>
<!-- 6 handler -->
<text x="786" y="102" text-anchor="middle" font-size="34">🧠</text>
<text x="786" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">ฟังก์ชันจัดการ</text>
<text x="786" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">แก้สถานะของเรา</text>
<text x="786" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">ตรวจเงื่อนไขก่อนทำ</text>
<!-- 7 pump -->
<text x="929" y="102" text-anchor="middle" font-size="36">💧</text>
<text x="929" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">ปั๊ม / ไฟ</text>
<text x="929" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">สั่งงานจริง</text>
<text x="929" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">แล้วอัปเดตจอ</text>

<!-- event names: always on vs opt-in -->
<text x="12" y="238" font-size="15" font-weight="700" fill="#2e7d32">เปิดเสมอ</text>
<g font-family="monospace" font-size="14" fill="#fff">
