<g fill="#fff" stroke="#ef6c00" stroke-width="1.5">
<rect x="310" y="80" width="11" height="18" rx="2"/><rect x="323" y="80" width="11" height="18" rx="2"/><rect x="336" y="80" width="11" height="18" rx="2"/><rect x="349" y="80" width="11" height="18" rx="2"/><rect x="362" y="80" width="11" height="18" rx="2"/>
