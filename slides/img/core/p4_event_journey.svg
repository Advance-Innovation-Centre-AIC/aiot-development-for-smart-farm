<text x="357" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">คิวเต็ม = ของใหม่</text>
<text x="357" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">ถูกทิ้งเงียบ ๆ</text>
