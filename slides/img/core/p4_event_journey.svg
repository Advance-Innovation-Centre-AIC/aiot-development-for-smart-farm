<!-- 1 finger -->
<text x="71" y="102" text-anchor="middle" font-size="36">👆</text>
<text x="71" y="134" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">นิ้วแตะจอ</text>
<text x="71" y="156" text-anchor="middle" font-size="12.5" fill="#37474f">ชิปจอสัมผัส</text>
<text x="71" y="173" text-anchor="middle" font-size="12.5" fill="#37474f">ถูกอ่านทุก 20 ms</text>
