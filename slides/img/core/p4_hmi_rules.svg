<g font-size="18" font-weight="700" fill="#fff" text-anchor="middle">
<path d="M12 28 a16 16 0 0 1 16 -16 h206 a16 16 0 0 1 16 16 v34 h-238 z" fill="#2e7d32"/><text x="131" y="45">① สถานะต้องเห็นเสมอ</text>
<path d="M258 28 a16 16 0 0 1 16 -16 h206 a16 16 0 0 1 16 16 v34 h-238 z" fill="#e53935"/><text x="377" y="45">② คำสั่งอันตรายต้องยืนยัน</text>
<path d="M504 28 a16 16 0 0 1 16 -16 h206 a16 16 0 0 1 16 16 v34 h-238 z" fill="#1e88e5"/><text x="623" y="45">③ ตัวเลขเปลี่ยนช้าพอให้อ่าน</text>
<path d="M750 28 a16 16 0 0 1 16 -16 h206 a16 16 0 0 1 16 16 v34 h-238 z" fill="#8e24aa"/><text x="869" y="44" font-size="16">④ ไฟหนึ่งดวง ทางเปลี่ยนทางเดียว</text>
</g>

<!-- 1: status strip outside the tabs -->
<rect x="32" y="76" width="198" height="130" rx="8" fill="#171b22"/>
<rect x="40" y="84" width="182" height="24" rx="5" fill="#1f2733" stroke="#30a46c" stroke-width="2"/>
<circle cx="52" cy="96" r="6" fill="#30a46c"/>
<text x="64" y="101" font-size="13" fill="#e8eaed">ปั๊มปิด · 31 °C · เน็ตปกติ</text>
<rect x="40" y="116" width="58" height="20" rx="4" fill="#4a9eff"/><text x="69" y="131" text-anchor="middle" font-size="12" fill="#fff">ภาพรวม</text>
<rect x="102" y="116" width="58" height="20" rx="4" fill="#30363d"/><text x="131" y="131" text-anchor="middle" font-size="12" fill="#9aa3af">สั่งงาน</text>
<rect x="164" y="116" width="58" height="20" rx="4" fill="#30363d"/><text x="193" y="131" text-anchor="middle" font-size="12" fill="#9aa3af">บันทึก</text>
<rect x="40" y="140" width="182" height="58" rx="5" fill="#1a1f27" stroke="#30363d"/>
<text x="131" y="174" text-anchor="middle" font-size="13" fill="#78909c">เนื้อหาของแท็บ</text>
<g font-size="14" fill="#263238" text-anchor="middle">
<text x="131" y="234">แถบสถานะอยู่ <tspan font-weight="700">นอกแท็บ</tspan></text>
<text x="131" y="256">สลับแท็บกี่ครั้งก็ยังเห็น</text>
<text x="131" y="278">ปั๊มเปิดอยู่ไหม · ต่อเน็ตไหม</text>
<text x="131" y="300" fill="#546e7a" font-size="13">ต้องตอบได้ในหนึ่งแวบ</text>
</g>

<!-- 2: confirm -->
<rect x="282" y="80" width="92" height="36" rx="8" fill="#4a9eff"/>
<text x="328" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">เปิดปั๊ม</text>
<text x="424" y="96" text-anchor="middle" font-size="13" fill="#e53935" font-weight="700">กดค้าง</text>
<text x="424" y="113" text-anchor="middle" font-size="13" fill="#e53935">ไม่ใช่แตะ</text>
<rect x="286" y="128" width="182" height="78" rx="8" fill="#fff" stroke="#546e7a" stroke-width="2"/>
<text x="377" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">ยืนยันเปิดปั๊ม?</text>
<text x="377" y="170" text-anchor="middle" font-size="12" fill="#546e7a">น้ำจะไหล 5 นาที</text>
<rect x="298" y="178" width="72" height="22" rx="5" fill="#e53935"/><text x="334" y="194" text-anchor="middle" font-size="12" fill="#fff">ยืนยัน</text>
<rect x="384" y="178" width="72" height="22" rx="5" fill="#90a4ae"/><text x="420" y="194" text-anchor="middle" font-size="12" fill="#fff">ยกเลิก</text>
<g font-size="14" fill="#263238" text-anchor="middle">
<text x="377" y="234">แตะพลาดครั้งเดียว</text>
<text x="377" y="256"><tspan font-weight="700">ต้องไม่</tspan> เปิดปั๊ม</text>
<text x="377" y="278">กดค้าง หรือ กล่องยืนยัน</text>
<text x="377" y="300" fill="#546e7a" font-size="13">ปุ่มหยุดฉุกเฉิน = แตะเดียวพอ</text>
</g>

<!-- 3: slow numbers -->
<text x="623" y="130" text-anchor="middle" font-size="46" font-weight="700" fill="#263238">31.2</text>
<line x1="530" y1="160" x2="716" y2="160" stroke="#b0bec5" stroke-width="2"/>
<g fill="#1e88e5">
<circle cx="540" cy="160" r="6"/><circle cx="586" cy="160" r="6"/><circle cx="632" cy="160" r="6"/><circle cx="678" cy="160" r="6"/>
</g>
<g font-size="12" fill="#546e7a" text-anchor="middle"><text x="540" y="182">0</text><text x="586" y="182">0.5</text><text x="632" y="182">1.0</text><text x="678" y="182">1.5 วิ</text></g>
<text x="623" y="202" text-anchor="middle" font-size="13" fill="#1565c0" font-family="monospace">TICK_MS ≥ 500</text>
<g font-size="14" fill="#263238" text-anchor="middle">
<text x="623" y="234">อัปเดตไม่เกิน 1–2 ครั้ง/วินาที</text>
<text x="623" y="256">และเฉพาะตัวที่ค่าเปลี่ยน</text>
<text x="623" y="278">ถี่กว่านี้คนก็อ่านไม่ทัน</text>
<text x="623" y="300" fill="#546e7a" font-size="13">แถมแย่งช่องส่งคำสั่งไปจอ</text>
</g>

<!-- 4: one path per lamp -->
<g font-size="12" text-anchor="middle">
<rect x="764" y="80" width="62" height="24" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="795" y="96" fill="#1565c0">ปุ่มบนจอ</text>
<rect x="764" y="112" width="62" height="24" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="795" y="128" fill="#1565c0">SW5</text>
<rect x="764" y="144" width="62" height="24" rx="6" fill="#e3f2fd" stroke="#1e88e5"/><text x="795" y="160" fill="#1565c0">MQTT</text>
<rect x="846" y="104" width="72" height="40" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
<text x="882" y="121" fill="#6a1b9a" font-weight="700">สถานะ</text><text x="882" y="137" fill="#6a1b9a" font-weight="700">ปั๊มจริง</text>
</g>
<g stroke="#546e7a" stroke-width="2.5">
<line x1="827" y1="92" x2="844" y2="112" marker-end="url(#p4hr_a)"/>
<line x1="827" y1="124" x2="844" y2="124" marker-end="url(#p4hr_a)"/>
<line x1="827" y1="156" x2="844" y2="136" marker-end="url(#p4hr_a)"/>
<line x1="920" y1="124" x2="940" y2="124" marker-end="url(#p4hr_a)"/>
</g>
<circle cx="958" cy="124" r="14" fill="#43a047"/><circle cx="958" cy="124" r="20" fill="#43a047" opacity="0.25"/>
<text x="882" y="190" text-anchor="middle" font-size="12" fill="#546e7a">ไฟบนจอ วาดจากสถานะจริงเท่านั้น</text>
<g font-size="14" fill="#263238" text-anchor="middle">
<text x="869" y="234">ทุกทางสั่ง <tspan font-weight="700">ผ่านจุดเดียว</tspan></text>
<text x="869" y="256">แล้วไฟอ่านจากสถานะจริง</text>
<text x="869" y="278">บอร์ดเปลี่ยนเอง → อัปเดตจอ</text>
<text x="869" y="300" fill="#546e7a" font-size="13">แต่อย่าส่งกลับเป็นคำสั่งใหม่</text>
