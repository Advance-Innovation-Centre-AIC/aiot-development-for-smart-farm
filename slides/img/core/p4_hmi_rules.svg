<rect x="258" y="12" width="238" height="306" rx="16" stroke="#e53935"/>
<rect x="504" y="12" width="238" height="306" rx="16" stroke="#1e88e5"/>
<rect x="750" y="12" width="238" height="306" rx="16" stroke="#8e24aa"/>
