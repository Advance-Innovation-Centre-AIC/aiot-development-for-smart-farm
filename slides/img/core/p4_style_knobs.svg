<text x="346" y="168">ขีดของสเกล · จำนวนหลักของ Spinbox</text>
<text x="346" y="232">ขนาดตัวอักษร (ไทยได้ Noto Thai เอง)</text>
<text x="346" y="296" font-size="13.5">color=พื้น · min=สีขอบ · max=มุมโค้ง · value=ขอบหนา</text>
</g>

