<text x="28" y="232">ป้ายเตือนโผล่เฉพาะตอนมีปัญหา</text>
<text x="28" y="296" font-size="13">ปิดปุ่ม: เทา + ไม่ส่งเหตุการณ์ (Emulator ยังไม่มี)</text>
