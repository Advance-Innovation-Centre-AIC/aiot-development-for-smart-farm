<!-- brain 1: CM33 Python -->
<rect x="12" y="12" width="298" height="244" rx="18" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3"/>
<text x="161" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#1565c0">สมอง 1 · CM33</text>
<text x="161" y="68" text-anchor="middle" font-size="16" fill="#37474f">โปรแกรม Python ของเรา</text>
<rect x="26" y="80" width="270" height="164" rx="8" fill="#0d1117"/>
<g font-family="monospace" font-size="15">
<text x="38" y="104" fill="#e6edf3">w = ui.Label(...)</text>
<text x="38" y="123" fill="#8b949e"># ① สร้างครั้งเดียว</text>
<text x="38" y="147" fill="#ff7b72">while <tspan fill="#e6edf3">...:</tspan></text>
<text x="58" y="168" fill="#e6edf3">w.text("31.2 °C")</text>
<text x="58" y="187" fill="#8b949e"># ② เมื่อค่าเปลี่ยน</text>
<text x="58" y="211" fill="#e6edf3">evs = ui.poll()</text>
<text x="58" y="230" fill="#8b949e"># ③ ฟังทุกรอบ</text>
</g>

