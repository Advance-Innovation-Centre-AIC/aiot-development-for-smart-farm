<h2 id="%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B8%A7%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%88%E0%B9%87%E0%B8%95%E0%B8%88%E0%B8%B2%E0%B8%81-%E0%B8%84%E0%B8%B3%E0%B8%96%E0%B8%B2%E0%B8%A1%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%84%E0%B8%99%E0%B8%94%E0%B8%B9-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%AA%E0%B8%A7%E0%B8%A2">เลือกวิดเจ็ตจาก &quot;คำถามของคนดู&quot; ไม่ใช่จากความสวย</h2>
<p><img src="img/core/p4_widget_chooser.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>เท่าไร?</strong> → Label/Seg7 · <strong>เต็มแค่ไหน?</strong> → Bar/Arc · <strong>อยู่ช่วงไหน?</strong> → หน้าปัด · <strong>ขึ้นหรือลง?</strong> → Chart · <strong>ดีไหม?</strong> → Led · กรอบฟ้า = แสดงผล · กรอบส้ม = รับจากคน</li>
<li>มีวิดเจ็ต 33 แบบ แต่ <strong>ไม่มี Gauge/Meter/Canvas</strong> → หน้าปัดใช้ Scale แล้วสั่งเข็มเอง: <code>prop(ui.PROP_SCALE_NEEDLE, (ความยาว &lt;&lt; 16) | ค่า)</code></li>
<li>Chart: กว้าง <strong>≤ 400 px</strong> · จำนวนจุด <strong>10–400</strong> (<code>PROP_CHART_POINTS</code>)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="68" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A0-%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-7-%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B2-%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B8%A7%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%88%E0%B9%87%E0%B8%95%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%8A%E0%B8%99%E0%B8%B4%E0%B8%94%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%B9%E0%B8%A5">เล่น ① ค่าเดียว 7 หน้าตา: เลือกวิดเจ็ตตามชนิดข้อมูล</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เห็นว่าตัวเลขตัวเดียวแสดงได้หลายแบบ แต่ละแบบตอบคำถามคนละข้อ และเห็นว่า <strong>ค่าไม่เปลี่ยน = ไม่ต้องส่งไปจอ</strong></p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp4_01_one_value_many_faces.py"><code>cp4_01_one_value_many_faces.py</code></a></p>
<ol>
<li>รันไฟล์ → การ์ด <strong>Label + Seg7 · Bar + Arc · Scale + เข็ม · Led</strong> และ <strong>Chart</strong> แถวล่าง · VR1 = ความชื้นดิน 0–100 %</li>
<li>หมุน VR1 ช้า ๆ → 7 หน้าตาขยับพร้อมกัน · ยืนห่างจอ 2 เมตร อันไหนอ่านรู้เรื่องเร็วที่สุด?</li>
<li>ปล่อย VR1 นิ่ง → ตัวนับ <strong>&quot;ส่งไปจอ&quot;</strong> หยุด แต่ <strong>&quot;อ่าน&quot;</strong> ยังนับ และกราฟยังเดิน (กราฟคือเวลา)</li>
<li>หมุนลงต่ำกว่า 40 % → <strong>&quot;เริ่มแห้ง&quot;</strong> · ต่ำกว่า 25 % → ไฟสถานะสว่างสุด <strong>&quot;แห้ง!&quot;</strong> + เสียงเตือนครั้งเดียว</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp4_01_one_value_many_faces__dry_alarm.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp4_01_one_value_many_faces__wet_steady.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · VR1 หมุนจากแผงจำลอง · จอใน Emulator วาดด้วยเบราว์เซอร์ หน้าตาใกล้เคียงแต่ไม่เหมือนจอบอร์ดทุกพิกเซล</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="69" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="69" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%87%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B2%E0%B8%95%E0%B8%AD%E0%B8%99%E0%B8%A3%E0%B8%B1%E0%B8%99-%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%9B%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A1%E0%B8%B5%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87%E0%B9%80%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%B1%E0%B9%89%E0%B8%99">แต่งหน้าตาตอนรัน: ใช้ปุ่มปรับที่มีจริงเท่านั้น</h2>
<p><img src="img/core/p4_style_knobs.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>ส่งคำสั่งแต่งจอ <strong>เฉพาะตอนโซนเปลี่ยน</strong> ไม่ใช่ทุกรอบ · Label เลือกขนาดตัวอักษรตอนสร้างด้วย <code>value=</code> 14/16/20/24/28</li>
<li>Panel ตั้งขอบตอนสร้าง: <code>color</code> = พื้น · <code>min</code> = สีขอบ · <code>max</code> = มุมโค้ง · <code>value</code> = ความหนาขอบ</li>
<li><code>disable()</code> = ปุ่มเทา <strong>และไม่ส่งเหตุการณ์</strong> — แต่เป็นแค่การบอกคน กฎความปลอดภัยจริงต้องเช็กซ้ำในโปรแกรม</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="70" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A1-%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B9%80%E0%B8%94%E0%B8%B4%E0%B8%A1-%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%87%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B8%AD%E0%B8%99%E0%B8%A3%E0%B8%B1%E0%B8%99-%E0%B8%AA%E0%B8%B5%E0%B8%9A%E0%B8%AD%E0%B8%81%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A3%E0%B9%88%E0%B8%87%E0%B8%94%E0%B9%88%E0%B8%A7%E0%B8%99">เล่น ② การ์ดเดิม แต่งใหม่ตอนรัน: สีบอกความเร่งด่วน</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> ใช้ <code>color()</code> <code>prop()</code> <code>show()/hide()</code> <code>disable()</code> <code>size()</code> ให้หน้าตาบอกว่า <strong>ต้องรีบไหม</strong> และ <strong>ปุ่มไหนใช้ไม่ได้</strong></p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp4_02_style_at_runtime.py"><code>cp4_02_style_at_runtime.py</code></a></p>
<ol>
<li>หมุน <strong>VR1</strong> (ความชื้นดิน) ลงช้า ๆ → ตัวเลข แถบ เข็ม เปลี่ยนสี <strong>เขียว → ส้ม (&lt; 40 %) → แดง (&lt; 25 %)</strong></li>
<li>ตอนแดง: แถบเตือน <strong>&quot;ดินแห้ง! รดน้ำ&quot;</strong> โผล่ · พื้นการ์ดเป็นแดงเข้ม · ไฟเตือนเต้นด้วย <code>size()</code></li>
<li>หมุน <strong>VR2</strong> (น้ำในถัง) ต่ำกว่า 20 % → ปุ่ม <strong>&quot;เปิดปั๊ม&quot;</strong> เทาและกดไม่ติด · ข้อความ <strong>&quot;ถังต่ำ: ห้ามกด&quot;</strong></li>
<li>แตะ &quot;เปิดปั๊ม&quot; ตอนถังพอ → ตัวนับ <strong>&quot;สั่ง … ครั้ง&quot;</strong> เพิ่ม · เปิดโค้ดหา <code>pump_allowed()</code> = กฎจริงอยู่ตรงนี้</li>
</ol>
</div>
<div class="no">
<p><strong>Emulator ยังทำไม่ได้:</strong> <code>enable()/disable()</code> — ปุ่มใน Emulator จึงไม่เป็นสีเทา ไฟล์ดัก <code>AttributeError</code> ไว้ และเช็กถังซ้ำใน <code>pump_allowed()</code> ก่อนสั่ง ปั๊มจึงไม่เดินตอนถังต่ำทั้งบนบอร์ดและใน Emulator</p>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp4_02_style_at_runtime__dry_restyle.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp4_02_style_at_runtime__tank_low_locked.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · VR1 และ VR2 หมุนจากแผงจำลอง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="71" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%AA%E0%B9%89%E0%B8%99%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%99%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B9%81%E0%B8%95%E0%B8%B0-%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%99%E0%B8%B4%E0%B9%89%E0%B8%A7-%E0%B8%96%E0%B8%B6%E0%B8%87%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1">เส้นทางของหนึ่งแตะ: จากนิ้ว ถึงปั๊ม</h2>
<p><img src="img/core/p4_event_journey.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>เหตุการณ์หนึ่งใบ = <code>{'handle': id, 'type': ชื่อเหตุการณ์, 'value': ตัวเลข}</code> · ปุ่ม → <code>clicked</code> · Slider/Roller → <code>value_changed</code> · Switch → <code>toggled</code></li>
<li>ชนิดอื่นต้องขอด้วย <code>.listen(...)</code> ซึ่งต่อท้ายได้ · สะกดผิด = <code>ValueError</code> · เรียก <code>listen()</code> ซ้ำ = <strong>แทน</strong> ชุดเดิม ไม่ใช่เพิ่ม</li>
<li>ปุ่มเดียวส่งได้หลายชนิด → ตารางส่งต่อต้องใช้ <strong>คู่ (id, type)</strong> เป็นกุญแจ ไม่ใช่ id อย่างเดียว</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="72" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A2-%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%AD%E0%B8%B1%E0%B8%99%E0%B8%95%E0%B8%A3%E0%B8%B2%E0%B8%A2%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%94%E0%B8%84%E0%B9%89%E0%B8%B2%E0%B8%87-%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87-id-type-%E2%86%92-%E0%B8%95%E0%B8%B1%E0%B8%A7%E0%B8%88%E0%B8%B1%E0%B8%94%E0%B8%81%E0%B8%B2%E0%B8%A3">เล่น ③ ปุ่มอันตรายต้องกดค้าง: ตาราง (id, type) → ตัวจัดการ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> ฟังเหตุการณ์ทุกรอบจนคิวว่าง แล้วส่งต่อด้วยตาราง · <strong>อ่านค่าตั้ง</strong> (Slider · Roller · Switch) และ <strong>สั่งงาน</strong> (ปุ่ม) ในไฟล์เดียว</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp4_03_event_router.py"><code>cp4_03_event_router.py</code></a></p>
<ol>
<li><strong>เดาก่อนรัน</strong> (Code Quest ระดับ 1): แตะ &quot;เปิดปั๊ม&quot; 1 ครั้ง ได้เหตุการณ์ชนิดไหน? กดค้าง 1 วิแล้วปล่อยล่ะ? จดไว้</li>
<li>แตะสั้น → จอบอก <strong>&quot;กดค้างเพื่อยืนยัน&quot;</strong> · กดค้าง → <strong>&quot;เปิดปั๊มแล้ว&quot;</strong> ไฟปั๊มบนจอ + จอไฟ RGB ติด · แตะ <strong>&quot;หยุด&quot;</strong> = ปิดทันที</li>
<li>ดู <strong>บรรทัดตัวส้ม</strong> กลางจอ = เหตุการณ์ล่าสุด <code>ชนิด = ค่า</code> → ตรงกับที่เดาไหม?</li>
<li>ลาก <strong>Slider</strong> = เกณฑ์ · หมุน <strong>Roller</strong> = วิธีรดน้ำ (สีจอไฟ RGB) · เปิด <strong>Switch อัตโนมัติ</strong> แล้วหมุน VR1 ต่ำกว่าเกณฑ์</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp4_03_event_router__tap_asks_hold.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp4_03_event_router__stop_wins.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · แตะจอด้วยเมาส์ กดเมาส์ค้าง = กดค้าง · VR1 หมุนจากแผงจำลอง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="73" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A2-%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%94%E0%B8%B6%E0%B8%87%E0%B8%88%E0%B8%99%E0%B8%84%E0%B8%B4%E0%B8%A7%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%87-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87">เล่น ③ หัวใจของโค้ด: ดึงจนคิวว่าง แล้วเปิดตาราง</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">        evs = ui.poll()                                <span class="hljs-comment"># 1) ฟัง: ดึงจนคิวว่าง (ครั้งละ &lt;= 8)</span>
        last = <span class="hljs-literal">None</span>
        <span class="hljs-keyword">while</span> evs:
            <span class="hljs-keyword">for</span> ev <span class="hljs-keyword">in</span> evs:
                p = s[<span class="hljs-string">&quot;pump&quot;</span>]
                note = dispatch(router, s, ev)         <span class="hljs-comment"># 2) ตาราง -&gt; ตัวจัดการ</span>
                last = ev
                <span class="hljs-keyword">if</span> note:
                    w[<span class="hljs-string">&quot;note&quot;</span>].text(note)
                    <span class="hljs-keyword">if</span> s[<span class="hljs-string">&quot;pump&quot;</span>] == p:
                        beep(<span class="hljs-string">&quot;tap&quot;</span>)                       <span class="hljs-comment"># ปั๊มไม่เปลี่ยน = เสียงกด (ปั๊มเปลี่ยน show_pump ส่งเสียงเอง)</span>
            evs = ui.poll()
        <span class="hljs-keyword">if</span> last:                                       <span class="hljs-comment"># ลาก Slider ได้หลายใบต่อรอบ: เขียนจอครั้งเดียว</span>
            w[<span class="hljs-string">&quot;last&quot;</span>].text(<span class="hljs-string">&quot;%s = %d&quot;</span> % (last[<span class="hljs-string">&quot;type&quot;</span>], last[<span class="hljs-string">&quot;value&quot;</span>]))
</code></pre>
<ul>
<li><code>dispatch()</code> หาตัวจัดการด้วย <code>router.get((ev[&quot;handle&quot;], ev[&quot;type&quot;]))</code> · ไม่อยู่ในตาราง = ไม่สนใจ · ตัวจัดการอยู่ในส่วน 3) สมอง ทดสอบด้วยเหตุการณ์ปลอมได้</li>
<li>สองทาง: บอร์ดเปลี่ยนสถานะเองก็ต้องเลื่อน Switch ตาม · <code>.value()</code> ที่โปรแกรมสั่ง <strong>ไม่ส่ง <code>toggled</code> กลับมา</strong> จึงไม่เกิดคำสั่งซ้ำ</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> ถ้าเปลี่ยน <code>while evs:</code> เป็นเรียก <code>ui.poll()</code> ครั้งเดียวต่อรอบ แล้วลาก Slider เร็ว ๆ คิว 16 ช่องจะเป็นอย่างไร — แล้วการแตะ <strong>&quot;หยุด&quot;</strong> ที่ตามมาเสี่ยงอะไร?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="74" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%88%E0%B8%AD-792-%C3%97-398-%E0%B8%A7%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%95%E0%B8%B2%E0%B8%A3%E0%B8%B2%E0%B8%87-%E0%B9%80%E0%B8%A7%E0%B9%89%E0%B8%99%E0%B8%82%E0%B8%AD%E0%B8%9A-12">จอ 792 × 398: วางเป็นตาราง เว้นขอบ 12</h2>

</div>
<div>
<p><strong>พื้นที่ <code>ui.screen()</code> = 792 × 398 px</strong> · ตำแหน่ง <code>x, y, w, h</code> นับจากมุมซ้ายบน</p>
<ul>
<li>ขอบ 12 · ช่องไฟ 12 · การ์ด 3 ใบกว้าง 248 → 12 + 3 × (248 + 12) = 792 พอดี</li>

</ul>
<p><strong>ขีดจำกัด:</strong> วิดเจ็ต <strong>≤ 64 ตัว</strong> · ข้อความใน Label <strong>≈ 126 ไบต์</strong> (ไทยตัวละ 3 ไบต์ นับสระและวรรณยุกต์ด้วย) · Chart กว้าง ≤ 400 · ไม่ใช้ Spinner</p>

<h2 id="%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2-hmi-%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%94%E0%B8%B5-4-%E0%B8%81%E0%B8%8E%E0%B8%88%E0%B8%B2%E0%B8%81%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B9%E0%B9%89%E0%B8%84%E0%B8%A7%E0%B8%9A%E0%B8%84%E0%B8%B8%E0%B8%A1">หน้า HMI ที่ดี: 4 กฎจากหน้าตู้ควบคุม</h2>
<p><img src="img/core/p4_hmi_rules.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>① แถบสถานะอยู่ <strong>นอก</strong> Tabview · ② คำสั่งที่ทำให้น้ำไหลต้อง <strong>กดค้าง</strong> (cp4_03) หรือ <strong>กล่องยืนยัน</strong> (cp4_05) · ปุ่มหยุด = แตะเดียว</li>
<li>③ ตัวเลขที่คนอ่าน อัปเดต <strong>≤ 2 ครั้ง/วิ</strong> (<code>TICK_MS ≥ 500</code>) · ④ ทุกทางสั่ง (จอ · SW5 · MQTT) เข้า <strong>จุดเดียว</strong> แล้วไฟวาดจากสถานะจริง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-marpit-scope-VfsRUrfP="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="76" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A3-%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2-hmi-%E0%B9%81%E0%B8%96%E0%B8%9A%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0--%E0%B9%81%E0%B8%97%E0%B9%87%E0%B8%9A--%E0%B8%81%E0%B8%A5%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%A2%E0%B8%B7%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%99--%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B6%E0%B8%81">เล่น ④ หน้า HMI: แถบสถานะ · แท็บ · กล่องยืนยัน · บันทึก</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> จัดจอแบบตู้ควบคุมจริง: <strong>สถานะเห็นทุกหน้า</strong> · แยกหน้าด้วยแท็บ · <strong>ยืนยันก่อนเปิดปั๊ม</strong> แต่ <strong>หยุดทันที</strong> · ทุกเหตุการณ์ลงบันทึก</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp4_05_hmi_page_pattern.py"><code>cp4_05_hmi_page_pattern.py</code></a></p>
<ol>
<li>รันไฟล์ → แถบสถานะบนสุด (ไฟปั๊ม · ถัง % · ไฟเตือน) + 3 แท็บ <strong>ภาพรวม · สั่งงาน · บันทึก</strong></li>
<li>แท็บ <strong>สั่งงาน</strong> → แตะ <strong>&quot;เปิดปั๊ม&quot;</strong> → กล่อง <strong>&quot;ยืนยันเปิดปั๊ม?&quot;</strong> บอกว่าจะเกิดอะไร · ลอง <strong>ยกเลิก</strong> · ลอง <strong>รอเกิน 8 วิ</strong> · แล้วค่อย <strong>ยืนยัน</strong></li>
<li>ปั๊มเดินอยู่ → หมุน <strong>VR2</strong> (น้ำในถัง) ต่ำกว่า 20 % → ไฟเตือนติด ปั๊มหยุดเอง สั่งเปิดไม่ได้ · อยู่แท็บไหนแถบสถานะก็ยังบอก</li>
<li>แท็บ <strong>บันทึก</strong> → ทุกเหตุการณ์มีเวลา (ครบ 6 แถววนทับแถวเก่าสุด) · เปิดโค้ดหา 3 ก้อน <code>build()</code> · <code>update()</code> · <code>handle()</code></li>
</ol>
</div>
<div class="no">
<p><strong>ยังทำไม่ได้:</strong> ปุ่มที่เติมใน MsgBox ด้วย <code>add_button()</code> ไม่ส่งเหตุการณ์กลับมาให้ Python (ทั้งบนบอร์ดและ Emulator) → ไฟล์วาง <code>ui.Button</code> จริงสองปุ่มทับกล่องไว้เป็นคำตอบ · กล่องไม่ล็อกทั้งจอ แท็บและ &quot;หยุด&quot; ยังแตะได้</p>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp4_05_hmi_page_pattern__confirm_msgbox.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp4_05_hmi_page_pattern__log_tab.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · VR2 หมุนจากแผงจำลอง · แตะแท็บและปุ่มด้วยเมาส์</div>
</div>
</div>
</section>

<h2 id="%F0%9F%93%8C-%E0%B8%81%E0%B8%8E%E0%B8%82%E0%B8%AD%E0%B8%87-part-4"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cc.svg" data-marp-twemoji=""/> กฎของ Part 4</h2>
<div class="rule">
<p>สร้างครั้งเดียว อัปเดตเฉพาะที่เปลี่ยน ฟังเหตุการณ์ทุกรอบ และคำสั่งอันตรายต้องยืนยัน</p>
</div>
<ul>
<li><strong>สร้างครั้งเดียว อัปเดตเฉพาะที่เปลี่ยน:</strong> จอจำวิดเจ็ตไว้เองได้ไม่เกิน 64 ตัว · ทุกคำสั่งต้องข้ามไปอีกสมอง ส่งเท่าที่จำเป็น จอจึงลื่นและคนอ่านทัน</li>
<li><strong>ฟังทุกรอบ:</strong> ไม่มี callback และคิว 16 ช่องเต็มแล้วของใหม่หาย → <code>poll()</code> ทุก 20–50 ms จนคิวว่าง ไม่งั้นการแตะ &quot;หยุด&quot; อาจหายเงียบ</li>
<li><strong>ยืนยันก่อนทำ:</strong> แตะพลาดครั้งเดียวต้องไม่ทำให้น้ำไหล · ปุ่มเทาบอกคน แต่กฎจริงต้องอยู่ในสมองของโปรแกรม</li>
</ul>
<div class="think">
<p><strong>การ์ดออกแบบของกลุ่ม ช่อง &quot;โชว์&quot;:</strong> วิดเจ็ตสำคัญ 3 ตัว · สถานะอะไรต้องเห็นเสมอ · คำสั่งไหนต้องยืนยัน?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="79" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%94%E0%B8%B9%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1-lvgl-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">ดูเพิ่ม: LVGL คืออะไร</h2>

<iframe width="400" height="225" src="https://www.youtube.com/embed/y5O7zKFdgPk" title="LVGL Lessons On ESP32 01: Introduction — Michael ee" loading="lazy" frameborder="0" allowfullscreen></iframe>
<div>
<p><b>LVGL Lessons On ESP32 01: Introduction</b><br /><br />
ช่อง Michael ee<br /><br />
<a href="https://www.youtube.com/watch?v=y5O7zKFdgPk">https://www.youtube.com/watch?v=y5O7zKFdgPk</a></p>
<p>คลิปใช้บอร์ด ESP32 และภาษา C — ดูเพื่อเข้าใจว่า LVGL คืออะไร <strong>ไม่ต้องทำตามโค้ด</strong> บนบอร์ดของเราสั่ง LVGL ผ่านโมดูล <code>ui</code> ของ Python</p>
<p><strong>ดูแล้วตอบ:</strong> วิดเจ็ตที่เห็นในคลิป ตรงกับช่องไหนในตารางเลือกวิดเจ็ตของเรา และบนบอร์ดเรา สมองตัวไหนเป็นคนวาดมัน?</p>

<h1 id="%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%84%E0%B8%B2%E0%B8%9A--%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">ปิดคาบ — การ์ดออกแบบของกลุ่ม</h1>
<div class="lead">กฎหนึ่งบรรทัด 4 ใบ ประกอบกลับเป็นหัวใจของโปรเจกต์ของกลุ่มเอง</div>

<h2 id="%E0%B8%AA%E0%B8%B5%E0%B9%88%E0%B8%81%E0%B8%8E%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%81%E0%B9%87%E0%B8%9A%E0%B8%81%E0%B8%A5%E0%B8%B1%E0%B8%9A%E0%B8%9A%E0%B9%89%E0%B8%B2%E0%B8%99">สี่กฎที่เก็บกลับบ้าน</h2>
<div class="cards">
<div class="card" style="background:#1e88e5">
<p><b>1 · วัด</b><br />
อ่านให้ถูกจังหวะ แปลงให้มีหน่วย และสอบเทียบก่อนเชื่อ</p>
</div>
<div class="card" style="background:#8e24aa">
<p><b>2 · ตัดสิน</b><br />
กรองตามรูปของสัญญาณรบกวน ตัดสินด้วยขั้นบันไดที่ต่ำที่สุดที่ได้ผล และให้ AI มีสิทธิ์ตอบว่าไม่แน่ใจ</p>
</div>
<div class="card" style="background:#2e7d32">
<p><b>3 · ทำ</b><br />
สถานะหนึ่ง ภาษาเดียว · ส่งเมื่อเปลี่ยน + ส่งว่ายังอยู่ · ทุกคำสั่งต้องมีคำยืนยันและทางถอยที่ปลอดภัย</p>
</div>
<div class="card" style="background:#ef6c00">
<p><b>4 · โชว์</b><br />
สร้างครั้งเดียว อัปเดตเฉพาะที่เปลี่ยน ฟังเหตุการณ์ทุกรอบ และคำสั่งอันตรายต้องยืนยัน</p>
</div>
</div>
<div class="think">
<p><strong>คิดก่อนกรอกการ์ด:</strong> โปรเจกต์ของกลุ่มทำผิดกฎข้อไหนอยู่ตอนนี้บ้าง? ข้อไหนแก้ได้ภายใน 10 บรรทัด?</p>
</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%AD%E0%B8%AD%E0%B8%81%E0%B9%81%E0%B8%9A%E0%B8%9A-%E0%B8%A7%E0%B8%B1%E0%B8%94--%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99--%E0%B8%97%E0%B8%B3--%E0%B9%82%E0%B8%8A%E0%B8%A7%E0%B9%8C-%E0%B8%AB%E0%B8%99%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%81%E0%B8%A5%E0%B8%B8%E0%B9%88%E0%B8%A1">การ์ดออกแบบ วัด · ตัดสิน · ทำ · โชว์ (หนึ่งหน้าต่อกลุ่ม)</h2>
<svg viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="4" y="4" width="992" height="40" rx="10" fill="#263238" />
  <text x="20" y="31" font-size="19" fill="#fff" font-weight="700">ปัญหาในฟาร์มที่กลุ่มเลือก: ______________________________________</text>
  <g font-size="17">
    <rect x="4" y="54" width="240" height="210" rx="12" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" />
    <text x="16" y="82" font-weight="700" fill="#1565c0">วัด</text>
    <text x="16" y="110" fill="#37474f">• อ่านอะไร · รูปร่างไหน</text><text x="16" y="136" fill="#37474f">• อ่านถี่แค่ไหน</text><text x="16" y="162" fill="#37474f">• สอบเทียบอย่างไร</text>
    <rect x="254" y="54" width="240" height="210" rx="12" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" />
    <text x="266" y="82" font-weight="700" fill="#6a1b9a">ตัดสิน</text>
    <text x="266" y="110" fill="#37474f">• บันไดขั้นไหน</text><text x="266" y="136" fill="#37474f">• ทำไมขั้นล่างไม่พอ</text><text x="266" y="162" fill="#37474f">• กรองแบบไหน</text>
    <rect x="504" y="54" width="240" height="210" rx="12" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" />
    <text x="516" y="82" font-weight="700" fill="#1b5e20">ทำ</text>
    <text x="516" y="110" fill="#37474f">• ภาษาสถานะ</text><text x="516" y="136" fill="#37474f">• ส่งเมื่อไร (dead-band)</text><text x="516" y="162" fill="#37474f">• กันพลาด (interlock)</text>
    <rect x="754" y="54" width="242" height="210" rx="12" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" />
    <text x="766" y="82" font-weight="700" fill="#e65100">โชว์</text>
    <text x="766" y="110" fill="#37474f">• widget สำคัญ 3 ตัว</text><text x="766" y="136" fill="#37474f">• คำสั่งที่ต้องยืนยัน</text><text x="766" y="162" fill="#37474f">• อะไรต้องเห็นตลอด</text>
  </g>
  <rect x="4" y="276" width="992" height="48" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="3" />
  <text x="20" y="307" font-size="18" fill="#b71c1c" font-weight="700">ความปลอดภัย: เน็ตหลุด / เซนเซอร์เสีย / ไฟดับ → ระบบอยู่ในสภาพไหน? ____________________</text>
</svg>
<ul>
<li>กรอกลงใบงาน ข้อ 8 · การ์ดนี้ตรงกับ <strong>5 เสาหลัก</strong> ของโปรเจกต์ และใช้ต่อในวันนำเสนอได้เลย</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-marpit-scope-SlubgZOu="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="83" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%A3%E0%B8%B8%E0%B9%88%E0%B8%99%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%97%E0%B8%B3%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%84%E0%B8%94%E0%B9%89--%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B8%97%E0%B8%B3%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89-%E0%B8%9E%E0%B8%B9%E0%B8%94%E0%B8%95%E0%B8%A3%E0%B8%87-%E0%B9%86">บอร์ดรุ่นนี้ทำอะไรได้ · ยังทำอะไรไม่ได้ (พูดตรง ๆ)</h2>

<table>
<thead>
<tr>
<th>เรื่อง</th>
<th>บอร์ดรุ่นนี้ (เฟิร์มแวร์ปัจจุบัน)</th>
<th>ในคาบเราทำอย่างไร</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Modbus</strong> TCP / RTU</td>
<td>ไม่มีโมดูล Modbus</td>
<td>บอร์ดสร้างเฟรมจริงด้วย <code>struct</code> · เกตเวย์บนโน้ตบุ๊กพูด Modbus TCP แทน</td>
</tr>
<tr>
<td><strong>socket</strong> ของ Python</td>
<td>ไม่มี <code>socket</code> <code>network</code> <code>ssl</code> จึงเปิด TCP เองไม่ได้</td>
<td>คุยผ่าน MQTT</td>
</tr>
<tr>
<td><strong>RS-485</strong> บนฐานบอร์ด</td>
<td>มีวงจรบนฐานบอร์ด แต่เฟิร์มแวร์ยังไม่ได้ขับ · ขาควบคุมใช้ร่วมกับปุ่ม SW5/SW6</td>
<td>เป็นแนวคิดในสไลด์เท่านั้น</td>
</tr>
<tr>
<td><strong><code>mqtt</code></strong></td>
<td>ไม่เข้ารหัส · ไม่มี retain · ไม่มี Last Will · ข้อความขาเข้ายาวได้ไม่เกิน 255 ไบต์</td>
<td>ส่งว่ายังอยู่ (heartbeat) · JSON สั้น ๆ</td>
</tr>
<tr>
<td><strong>MQTTS</strong></td>
<td>มีผ่านโมดูล <code>tesaiot</code> ไปแพลตฟอร์ม TESAIoT เท่านั้น (ไม่มี subscribe)</td>
<td>คำสั่งในคาบใช้ <code>mqtt</code> ธรรมดา</td>
</tr>
<tr>
<td><strong><code>machine</code></strong></td>
<td>ไม่มี ADC · PWM · UART · SPI · Timer · WDT</td>
<td><code>pots</code> · <code>header.pwm</code> · <code>header.uart_*</code></td>
</tr>
<tr>
<td><strong><code>ui</code></strong></td>
<td>ไม่มี callback (poll ได้ครั้งละ ≤ 8 เหตุการณ์) · ไม่มี Canvas / Gauge / เลือกฟอนต์ / ความโปร่งใส</td>
<td>ตาราง router · Scale / Arc · Line / DotMatrix</td>
</tr>
<tr>
<td><strong><code>dsp</code></strong></td>
<td>ไม่มี mean · std · z-score</td>
<td>เขียนเองราว 10 บรรทัด</td>
</tr>
<tr>
<td><strong>เสียง</strong></td>
<td><code>ui.sfx</code> ปรับความดังไม่ได้</td>
<td><code>ui.tone</code> + <code>VOLUME = 25</code> (เฟิร์มแวร์ 2.4.2 เพิ่ม <code>ui.volume()</code> ความดังรวม)</td>
</tr>
<tr>
<td><strong><code>edge_ai.select()</code></strong></td>
<td>รับเลขลำดับ ไม่รับชื่อโมเดล</td>
<td>หาเลขจากชื่อใน <code>edge_ai.models()</code></td>
</tr>
</tbody>
</table>
<div class="cap">ตรวจจากซอร์สของเฟิร์มแวร์ที่ใช้ในคอร์สนี้ · "ยังทำไม่ได้" วันนี้ ไม่ได้แปลว่าทำไม่ได้ตลอดไป</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="84" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="exit-ticket-%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%99%E0%B8%95%E0%B8%AD%E0%B8%9A-1-%E0%B8%82%E0%B9%89%E0%B8%AD--%E0%B9%80%E0%B8%81%E0%B8%93%E0%B8%91%E0%B9%8C%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%84%E0%B8%B2%E0%B8%9A">Exit ticket (ทุกคนตอบ 1 ข้อ) + เกณฑ์ผ่านคาบ</h2>
<div class="cols">
<div>
<div class="goal">
<p><strong>ข้อ 1:</strong> กฎหนึ่งบรรทัดข้อไหนที่โปรเจกต์ของกลุ่ม <strong>ยังขาด</strong> และจะเติมตรงไหน …</p>
</div>
<div class="goal" style="border-color:#1e88e5;background:#e3f2fd">
<p><strong>ข้อ 2:</strong> ในโปรเจกต์ของกลุ่ม จุดไหนควรให้ระบบตอบว่า <strong>&quot;ไม่แน่ใจ&quot;</strong> แทนการเดา …</p>
</div>
</div>
<div>
<p><strong>เกณฑ์ผ่านคาบ</strong></p>
<ul>
<li>☐ เล่นไฟล์ ★ ครบทั้ง 4 ส่วน และกรอกตารางบันทึก</li>
<li>☐ ผ่านการตรวจอัตโนมัติของไฟล์ฝึกโจทย์หลักอย่างน้อย 1 ไฟล์</li>
<li>☐ การ์ดออกแบบของกลุ่มครบ 5 กล่อง</li>
</ul>
<p><strong>การบ้าน (BENTO Emulator)</strong></p>
<ul>
<li>ไฟล์ ☆ ทุกไฟล์ใน <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/tree/main/core"><code>core/</code></a></li>
<li>ภาคผนวก <strong>สรุปคำสั่งหนึ่งหน้าต่อส่วน</strong> ในใบงาน</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-marpit-scope-1sb85ERP="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="85" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AD%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AD%E0%B8%B4%E0%B8%87%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%94%E0%B8%B4%E0%B8%95">อ้างอิงและเครดิต</h2>

<p><strong>วิดีโอ (YouTube — ลิขสิทธิ์เป็นของเจ้าของช่อง ใช้ด้วยการฝัง/ลิงก์)</strong> · ตรวจชื่อคลิปและช่องด้วย YouTube oEmbed ก่อนเผยแพร่</p>
<ul>
<li><a href="https://www.youtube.com/watch?v=IvU8m_30iK0">What is Switch Bounce and How to Debounce – ATM | Digi-Key Electronics</a> — DigiKey</li>
<li><a href="https://www.youtube.com/watch?v=plq_Nmud5CM">ADC Quantization and Resolution</a> — Microchip Developer Help</li>
<li><a href="https://www.youtube.com/watch?v=SzZ6GpcfoQY">Calculating the Mean, Variance and Standard Deviation, Clearly Explained!!!</a> — StatQuest with Josh Starmer</li>
<li><a href="https://www.youtube.com/watch?v=spUNpyF58BY">But what is the Fourier Transform?  A visual introduction.</a> — 3Blue1Brown</li>
<li><a href="https://www.youtube.com/watch?v=OX5uhoHeFKw">Modbus Explained in 2 Minutes (How It Works + RTU vs TCP Explained)</a> — ICP DAS USA, Inc.</li>
<li><a href="https://www.youtube.com/watch?v=fgicf8svA_E">เพียง 15 นาที เริ่มต้นกับ MODBUS อย่างไรให้เข้าใจง่ายๆ</a> — ทําอะไรก็มีสุข (saroj1961)</li>
<li><a href="https://www.youtube.com/watch?v=y5O7zKFdgPk">LVGL Lessons On ESP32 01: Introduction</a> — Michael ee</li>
</ul>
<p><strong>ภาพที่ทำขึ้นเองสำหรับคอร์สนี้:</strong> ปก · อินโฟกราฟิกทุกภาพที่วาดด้วย SVG/HTML (ห่วงโซ่การวัด ห้ารูปร่างของข้อมูล ไทม์ไลน์ปุ่ม ADC aliasing การสอบเทียบ บันไดข้อมูล สัญญาณรบกวน EMA z-score บันไดการตัดสินใจ state machine สเปกตรัม ประตูความมั่นใจ บันไดการสั่งงาน ภาษาสถานะ รูปแบบเสียง รายงานเมื่อเปลี่ยน คำสั่ง-ยืนยัน สองท่อ Modbus สองสมอง ตัวเลือก widget ปุ่มปรับหน้าตา เส้นทางเหตุการณ์ กริดจอ กฎ HMI การ์ดออกแบบ) · <strong>ภาพหน้าจอทุกภาพจาก BENTO Emulator</strong> (ค่าเซนเซอร์ MQTT ไมโครโฟน และผล AI เป็นของจำลอง)</p>
<p><strong>อีโมจิ:</strong> Twemoji — Twitter, Inc. และผู้ร่วมพัฒนา (jdecked/twemoji) — CC BY 4.0</p>
<p><strong>ข้อมูลฮาร์ดแวร์และ API:</strong> ตรวจจากซอร์สของเฟิร์มแวร์ที่ใช้ในคอร์สนี้ · TESAIoT Dev Kit SDK — <a href="https://tesaiot.github.io/tesaiot-pse84-devkit-sdk/">https://tesaiot.github.io/tesaiot-pse84-devkit-sdk/</a> · ข้อกำหนด Modbus: Modbus Organization — <a href="https://modbus.org/specs.php">https://modbus.org/specs.php</a></p>
</section>

<style>
.bento-nav{position:fixed;z-index:99999;font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,Segoe UI,sans-serif;
  font-weight:700;font-size:14px;line-height:1;text-decoration:none;padding:9px 15px;border-radius:999px;
  background:rgba(13,17,23,.82);color:#71C7EC;border:1px solid rgba(120,200,255,.42);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.35);
  transition:background .15s,color .15s,transform .15s;user-select:none}
.bento-nav:hover{background:#71C7EC;color:#0d1117;transform:translateY(-1px)}
.bento-nav.toc{top:14px;left:14px}
.bento-nav.next{bottom:16px;right:16px}
.bento-nav.prev{bottom:16px;left:16px;color:#93a0bd;border-color:rgba(147,160,189,.4)}

/* lightbox: คลิกภาพในเด็คเพื่อดูใหญ่ (คำสั่งอาจารย์ 2026-08-20) */
svg[data-marpit-svg] section img{cursor:zoom-in}
#bento-lightbox{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:zoom-out}
#bento-lightbox.open{display:flex}
#bento-lightbox img{max-width:94vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.6);
  background:#0d1117;cursor:default}
#bento-lightbox-close{position:fixed;top:14px;right:16px;z-index:100001;font:700 20px/1 sans-serif;
  color:#e6edf3;background:rgba(13,17,23,.82);border:1px solid rgba(120,200,255,.42);border-radius:999px;
  width:44px;height:44px;cursor:pointer}
#bento-lightbox-close:hover{background:#71C7EC;color:#0d1117}
@media print{#bento-lightbox{display:none !important}}
</style>


<div id="bento-lightbox" role="dialog" aria-modal="true" aria-label="ดูภาพขยาย">
  <button id="bento-lightbox-close" aria-label="ปิด" title="ปิด (Esc)">&#10005;</button>
  <img id="bento-lightbox-img" alt="">
</div>
<script>
(function(){
  var box = document.getElementById('bento-lightbox');
  var big = document.getElementById('bento-lightbox-img');
  function close(){ box.classList.remove('open'); big.src = ''; }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t === big) { e.stopPropagation(); return; }        /* คลิกบนภาพใหญ่ = เฉย ๆ */
    if (t.closest && t.closest('#bento-lightbox')) {       /* ฉากหลังหรือปุ่ม = ปิด */
      e.stopPropagation(); close(); return;
    }
    var img = t.closest ? t.closest('svg[data-marpit-svg] section img') : null;
    if (!img || !img.src) return;
    big.src = img.currentSrc || img.src;
    big.alt = img.alt || '';
    box.classList.add('open');
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && box.classList.contains('open')) { close(); e.stopPropagation(); }
  }, true);
})();
</script>
