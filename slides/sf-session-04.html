<li>ตัวเลขบนจอผ่านมา <strong>6 ทอด</strong> และ <strong>ทุกทอดเพี้ยนได้</strong> — รู้ที่มา จึงรู้ว่าเชื่อได้แค่ไหน</li>
<li>ในคลาสใช้ <strong>ลูกบิด VR1 แทนหัววัดดิน</strong>: ตัวแปลงต่างกัน แต่ห่วงโซ่เหมือนกันทุกทอด</li>
<li>ค่าที่ไม่มี <strong>หน่วย</strong> และ <strong>เวลา</strong> กำกับ = ตัวเลขลอย ๆ ที่เอาไปตัดสินใจไม่ได้</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%82%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%B9%E0%B8%A5%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%99%E0%B8%B5%E0%B9%89%E0%B8%A1%E0%B8%B5-5-%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%A3%E0%B9%88%E0%B8%B2%E0%B8%87--%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%A3%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B8%9A%E0%B8%AD%E0%B8%81%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99">ข้อมูลบนบอร์ดนี้มี 5 รูปร่าง — รูปร่างบอกวิธีอ่าน</h2>
<p><img src="img/core/p1_five_shapes.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>เหตุการณ์</strong> ห้ามพลาด · <strong>ระดับ</strong> อ่านช้าได้ · <strong>ค่าเดี่ยว</strong> อ่านนาน ๆ ครั้ง · <strong>เวกเตอร์</strong> อ่านทุกแกนในคำสั่งเดียว · <strong>สตรีม</strong> อ่านเป็นก้อน</li>
<li>สตรีมเสียงหนักกว่าค่าเดี่ยว <strong>หลักพันเท่า</strong> → ส่งดิบขึ้นเน็ตไม่ไหว ต้องย่อที่บอร์ดก่อน (Part 2)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%AB%E0%B8%99%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1-%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B9%84%E0%B8%94%E0%B9%89-3-%E0%B9%81%E0%B8%9A%E0%B8%9A-%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A-%E2%86%92-%E0%B8%82%E0%B8%AD%E0%B8%9A-%E2%86%92-%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%81%E0%B8%9A%E0%B8%9A">ปุ่มหนึ่งปุ่ม อ่านได้ 3 แบบ: ระดับ → ขอบ → รูปแบบ</h2>
<p><img src="img/core/p1_button_timeline.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>ระดับ</strong> = ตอนนี้กดอยู่ไหม · <strong>ขอบ</strong> = เพิ่งเปลี่ยนจากปล่อยเป็นกด · <strong>รูปแบบ</strong> = ต้องดูเวลาประกอบ</li>
<li>ปุ่มต่อแบบ <strong>active-low + pull-up</strong>: ปล่อย = HIGH · กด = LOW — <code>buttons.pressed()</code> กลับด้านให้แล้ว (True = กด)</li>
<li>เฟิร์มแวร์กรองสั่น 50 ms <strong>ทุกครั้งที่ Python เรียก <code>pressed()</code></strong> ไม่ใช่ตัวจับเวลาเบื้องหลัง → จึงต้องอ่านถี่ทุก 10–20 ms</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="12" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%A7%E0%B8%99-polling-%E0%B8%AB%E0%B8%A3%E0%B8%B7%E0%B8%AD-%E0%B8%82%E0%B8%B1%E0%B8%94%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-interrupt">อ่านวน (polling) หรือ ขัดจังหวะ (interrupt)?</h2>
<p><img src="img/core/p1_poll_vs_irq.svg" alt="" style="width:1000px;" /></p>
<div class="cols">
<div>
<p><strong>คอร์สนี้ใช้การอ่านวน (polling) เพราะ</strong></p>
<ul>
<li>โมดูล <code>buttons</code> มีแค่ <code>read()</code> <code>pressed()</code> <code>name()</code> <code>count()</code> — <strong>ไม่มีคำสั่งแจ้งขอบ</strong></li>
<li>การกรองสั่นอยู่ในเฟิร์มแวร์แล้ว และทำงาน <strong>ตอนเราอ่าน</strong> — ยิ่งอ่านสม่ำเสมอ ยิ่งกรองได้ตรง</li>
<li>อ่านทุก 10 ms ถี่กว่าหน้าต่างกรอง 50 ms หลายเท่า → การกดที่ตัวกรองยอมรับไม่หลุดสายตา</li>
</ul>
</div>
<div>
<div class="no">
<p><strong>ยังไม่ได้ลอง:</strong> <code>machine.Pin.irq</code> มีอยู่ในเฟิร์มแวร์ แต่ขาของ SW5/SW6 ถูกโมดูล <code>buttons</code> ใช้อยู่ — การผูก interrupt กับขาเดียวกัน <strong>ต้องลองบนบอร์ด</strong> ก่อนจึงจะสอนได้</p>
</div>
<p><strong>interrupt เหมาะกับ</strong> สัญญาณที่สั้นมากจนอ่านวนไม่ทัน เช่น พัลส์จากมาตรวัดน้ำ (แนวคิด) · งานใน interrupt ต้องสั้น: <strong>จดไว้</strong> แล้วให้ลูปหลักทำต่อ</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="13" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A0-%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-3-%E0%B9%81%E0%B8%9A%E0%B8%9A-%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A--%E0%B8%82%E0%B8%AD%E0%B8%9A--%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%81%E0%B8%9A%E0%B8%9A">เล่น ① ปุ่มเดียว 3 แบบ: ระดับ · ขอบ · รูปแบบ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> แยกให้ออกว่า &quot;กดอยู่&quot; &quot;เพิ่งกด&quot; และ &quot;กดแบบไหน&quot; ต่างกันอย่างไร และเห็นว่า <strong>เวลา</strong> คือตัวตัดสินรูปแบบ</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp1_01_button_patterns.py"><code>cp1_01_button_patterns.py</code></a></p>
<ol>
<li>รันไฟล์ → การ์ด <strong>SW5 (ปุ่มล่าง)</strong> และ <strong>SW6 (ปุ่มบน)</strong></li>
<li>กดค้างไว้ → <strong>ไฟบนจอ</strong> ติดตลอด (ระดับ) แต่ <strong>ตัวเลขใหญ่</strong> ขึ้นแค่ 1 (ขอบ)</li>
<li>กดสั้น ๆ → รอราว 0.4 วิ จึงขึ้น <strong>&quot;คลิก!&quot;</strong> · ค้างเกิน 0.8 วิ → <strong>&quot;ค้าง!&quot;</strong> · กด 2 ครั้งเร็ว ๆ → <strong>&quot;ดับเบิล!&quot;</strong></li>
<li><strong>แข่ง:</strong> ดับเบิลคลิก 10 ครั้ง ให้แถวล่างนับ &quot;ดับเบิล&quot; ครบ 10 โดย &quot;คลิก&quot; ไม่เพิ่ม</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp1_01_button_patterns__hold.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp1_01_button_patterns__press.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · การกดปุ่มจำลองจากแผงของ Emulator</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="14" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A0-%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%81%E0%B8%9A%E0%B8%9A--%E0%B8%82%E0%B8%AD%E0%B8%9A--%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2">เล่น ① หัวใจของโค้ด: รูปแบบ = ขอบ + เวลา</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">    <span class="hljs-keyword">def</span> <span class="hljs-title function_">feed</span>(<span class="hljs-params">self, down, now</span>):
        ev = <span class="hljs-literal">None</span>
        <span class="hljs-keyword">if</span> down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> <span class="hljs-variable language_">self</span>.down:                       <span class="hljs-comment"># ขอบ: เพิ่งกดลง</span>
            <span class="hljs-variable language_">self</span>.edges += <span class="hljs-number">1</span>
            <span class="hljs-variable language_">self</span>.t_down, <span class="hljs-variable language_">self</span>.held = now, <span class="hljs-literal">False</span>
        <span class="hljs-keyword">elif</span> down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> <span class="hljs-variable language_">self</span>.held <span class="hljs-keyword">and</span> time.ticks_diff(now, <span class="hljs-variable language_">self</span>.t_down) &gt;= LONG_MS:
            <span class="hljs-variable language_">self</span>.held, <span class="hljs-variable language_">self</span>.t_up, ev = <span class="hljs-literal">True</span>, <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;long&quot;</span>
        <span class="hljs-keyword">elif</span> <span class="hljs-variable language_">self</span>.down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> down <span class="hljs-keyword">and</span> <span class="hljs-keyword">not</span> <span class="hljs-variable language_">self</span>.held:   <span class="hljs-comment"># ขอบ: เพิ่งปล่อยหลังกดสั้น</span>
            <span class="hljs-keyword">if</span> <span class="hljs-variable language_">self</span>.t_up <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> time.ticks_diff(now, <span class="hljs-variable language_">self</span>.t_up) &lt;= DOUBLE_MS:
                <span class="hljs-variable language_">self</span>.t_up, ev = <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;double&quot;</span>
            <span class="hljs-keyword">else</span>:
                <span class="hljs-variable language_">self</span>.t_up = now                          <span class="hljs-comment"># รอดูก่อนว่าจะมีครั้งที่สองไหม</span>
        <span class="hljs-keyword">elif</span> <span class="hljs-keyword">not</span> down <span class="hljs-keyword">and</span> <span class="hljs-variable language_">self</span>.t_up <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">and</span> time.ticks_diff(now, <span class="hljs-variable language_">self</span>.t_up) &gt; DOUBLE_MS:
            <span class="hljs-variable language_">self</span>.t_up, ev = <span class="hljs-literal">None</span>, <span class="hljs-string">&quot;click&quot;</span>                <span class="hljs-comment"># หมดเวลารอ = คลิกเดี่ยว</span>
</code></pre>
<ul>
<li><code>feed()</code> รับแค่ <strong>&quot;กดอยู่ไหม&quot;</strong> กับ <strong>&quot;ตอนนี้กี่ ms&quot;</strong> → อยู่ในส่วน 3) สมอง ไม่แตะฮาร์ดแวร์ ทดสอบได้โดยไม่มีบอร์ด</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> ทำไม &quot;คลิก!&quot; ขึ้นช้ากว่าตอนปล่อยปุ่มราว 0.4 วิ? ถ้าตู้ควบคุมของเราไม่ใช้ดับเบิลเลย ควรแก้ตรงไหนให้คลิกตอบทันที?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="15" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%A5%E0%B8%B9%E0%B8%81%E0%B8%9A%E0%B8%B4%E0%B8%94--adc-12-%E0%B8%9A%E0%B8%B4%E0%B8%95-%E0%B9%80%E0%B8%A5%E0%B8%82%E0%B8%94%E0%B8%B4%E0%B8%9A%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94-%E0%B9%81%E0%B8%9B%E0%B8%A5%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%AB%E0%B8%99%E0%B9%88%E0%B8%A7%E0%B8%A2%E0%B9%84%E0%B8%AB%E0%B8%99%E0%B8%81%E0%B9%87%E0%B9%84%E0%B8%94%E0%B9%89">ลูกบิด = ADC 12 บิต: เลขดิบเป็นขั้นบันได แปลงเป็นหน่วยไหนก็ได้</h2>
<p><img src="img/core/p1_adc_mapping.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>แปลงช่วง:</strong> ค่า = ต่ำสุด + (ดิบ ÷ 4095) × (สูงสุด − ต่ำสุด) · แล้ว <strong>clamp</strong> ให้อยู่ในช่วงเสมอ</li>
<li><strong>ช่องกันกะพริบ (dead-band):</strong> เปลี่ยนตัวเลขบนจอเฉพาะตอนดิบขยับเกิน <code>DEADBAND</code> = 20 count (ราว 0.5 % ของช่วง)</li>
<li>ทางลัด: <code>pots.norm(0)</code> ให้ 0.0–1.0 ได้เลย · บนบอร์ด <strong>ไม่มี</strong> <code>pots.percent()</code></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="16" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A1-%E0%B8%A5%E0%B8%B9%E0%B8%81%E0%B8%9A%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B8%AA%E0%B8%B5%E0%B9%88%E0%B8%AB%E0%B8%99%E0%B9%88%E0%B8%A7%E0%B8%A2-%E0%B9%80%E0%B8%A5%E0%B8%82%E0%B8%94%E0%B8%B4%E0%B8%9A-%E2%86%92-%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A1%E0%B8%B5%E0%B8%AB%E0%B8%99%E0%B9%88%E0%B8%A7%E0%B8%A2">เล่น ② ลูกบิดเดียว สี่หน่วย: เลขดิบ → ค่าที่มีหน่วย</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> แปลงเลขดิบ 0–4095 เป็น % องศา ลิตร นาที แล้วเห็นว่าช่องกันกะพริบทำให้ตัวเลขนิ่ง</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp1_02_knob_scaling.py"><code>cp1_02_knob_scaling.py</code></a></p>
<ol>
<li>รันไฟล์ → 4 การ์ด: <strong>VR1</strong> ความชื้นดิน 0–100 % · <strong>VR2</strong> อุณหภูมิเป้า 15–40 · <strong>VR3</strong> น้ำในถัง 0–500 ลิตร · <strong>VR4</strong> ตั้งเวลารดน้ำ 0–60 นาที</li>
<li>หมุนช้า ๆ → เทียบ <strong>raw</strong> (ขยับทุกครั้ง) กับ <strong>ตัวเลขใหญ่</strong> (ขยับเป็นช่วง) · <strong>&quot;ข้าม&quot;</strong> = ครั้งที่ช่องกันกะพริบกันไว้</li>
<li>อ่านบรรทัด <strong>&quot;1 ขั้น = …&quot;</strong> ของแต่ละการ์ด เทียบกับภาพสไลด์ก่อน</li>
<li>กด <strong>SW5</strong> (ปุ่มล่าง) ปิด/เปิดช่องกันกะพริบ แล้วเทียบกัน</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp1_02_knob_scaling__knobs.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp1_02_knob_scaling__noband.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · ลูกบิดใน Emulator นิ่งสนิท · บนบอร์ดจริง raw อาจแกว่งเองแม้ไม่ได้แตะ (แกว่งแค่ไหน ดูจากบอร์ดของคุณเอง)</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="17" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%A5%E0%B8%B9%E0%B8%9B%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B8%AB%E0%B8%A5%E0%B8%B2%E0%B8%A2%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-%E0%B8%96%E0%B8%B2%E0%B8%A1%E0%B8%99%E0%B8%B2%E0%B8%AC%E0%B8%B4%E0%B8%81%E0%B8%B2-%E0%B8%AD%E0%B8%A2%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%AD%E0%B8%99%E0%B8%A3%E0%B8%AD">ลูปเดียว หลายจังหวะ: ถามนาฬิกา อย่านอนรอ</h2>
<p><img src="img/core/p1_multirate.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>แต่ละงานมี <strong>นัด</strong> ของตัวเอง: ถึงนัดแล้วจึงทำ แล้วเลื่อนนัด <code>self.due = time.ticks_add(self.due, self.period)</code></li>
<li>นัดถัดไป = <strong>นัดเดิม</strong> + คาบ ไม่ใช่ &quot;ตอนนี้&quot; + คาบ → คาบเฉลี่ยไม่ค่อย ๆ เลื่อน</li>
<li><code>ticks_diff()</code> ลบเวลาได้ถูกแม้นาฬิกาวนกลับไปนับใหม่ · <strong>jitter</strong> = เริ่มช้ากว่านัดไม่เท่ากันทุกรอบ เพราะงานอื่นกำลังทำอยู่</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="18" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AD%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%8A%E0%B9%89%E0%B8%B2%E0%B9%80%E0%B8%81%E0%B8%B4%E0%B8%99--%E0%B9%80%E0%B8%AB%E0%B9%87%E0%B8%99%E0%B8%9C%E0%B8%B5-aliasing">อ่านช้าเกิน = เห็นผี (aliasing)</h2>
<p><img src="img/core/p1_aliasing.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>ปั๊มสั่น 30 Hz แต่เราอ่าน 25 ครั้ง/วิ → กราฟโชว์คลื่นช้า 5 Hz ที่ <strong>ไม่มีอยู่จริง</strong> และดูน่าเชื่อมาก</li>
<li>กฎ Nyquist: อยากเห็นความถี่ f ต้องอ่าน <strong>เร็วกว่า 2f</strong> · ไมค์อ่าน 16 000 ครั้ง/วิ → เห็นได้ไม่เกิน 8 000 Hz</li>
<li>ลูป Python อ่าน BMI270 ได้เร็วสุดกี่ครั้ง/วิ <strong>ต้องลองบนบอร์ด</strong> — ยังไม่มีตัวเลขยืนยัน</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> cp1_03 อ่าน IMU 20 ครั้ง/วิ — เห็นการสั่นได้ไม่เกินกี่ Hz? พอสำหรับปั๊ม 30 Hz ไหม?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="19" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A2-%E0%B8%A5%E0%B8%B9%E0%B8%9B%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-%E0%B8%99%E0%B8%B1%E0%B8%94-%E0%B8%9B%E0%B8%B0%E0%B8%97%E0%B8%B0-%E0%B8%99%E0%B8%AD%E0%B8%99%E0%B8%A3%E0%B8%AD">เล่น ③ ลูปเดียว สามจังหวะ: &quot;นัด&quot; ปะทะ &quot;นอนรอ&quot;</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> วัดให้เห็นว่าลูปแบบ <strong>นัด</strong> (<code>ticks_add</code>) รักษาจังหวะได้ ส่วนลูป <strong>นอนรอ</strong> (<code>sleep_ms</code>) ช้าสะสม</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp1_03_loop_clock.py"><code>cp1_03_loop_clock.py</code></a></p>
<ol>
<li>รันไฟล์ → ตาราง 3 งาน: <strong>IMU 20Hz · อากาศ 1Hz · จอ 2Hz</strong></li>
<li>อ่านคอลัมน์ <strong>เฉลี่ย</strong> เทียบ <strong>เป้า ms</strong> · <strong>ต่ำ-สูง</strong> = jitter · <strong>ช้า</strong> = เริ่มช้ากว่าเป้าเกิน 10 ms</li>
<li>กด <strong>SW5</strong> (ปุ่มล่าง) → &quot;โหมดง่าย: sleep_ms(50) ต่อกัน&quot; → ตัวเลขเปลี่ยนอย่างไร</li>
<li>จดตัวเลขทั้งสองโหมด <strong>จากบอร์ดจริง</strong> ลงใบงาน</li>
</ol>
</div>
<div class="warn">
<p>ตัวเลขเวลาใน Emulator <strong>ไม่ใช่</strong> เวลาของบอร์ด (เบราว์เซอร์มีจังหวะของตัวเอง) — จะสรุปว่าช้าเร็วเท่าไร ต้องดูจากบอร์ดจริง</p>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp1_03_loop_clock__ticks.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp1_03_loop_clock__naive.png" alt="" style="width:430px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="20" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AA%E0%B8%AD%E0%B8%9A%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD-%E0%B8%8A%E0%B8%94%E0%B9%80%E0%B8%8A%E0%B8%A2--%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%A8%E0%B8%B9%E0%B8%99%E0%B8%A2%E0%B9%8C--%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%B8%E0%B8%94">สอบเทียบก่อนเชื่อ: ชดเชย · ตั้งศูนย์ · สองจุด</h2>
<div class="cols">
<div class="c55">
<p><img src="img/core/p1_offset_gain.svg" alt="" style="width:600px;" /></p>
</div>
<div>
<p><strong>① ชดเชย (offset)</strong> <img class="emoji" draggable="false" alt="🌡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f321.svg" data-marp-twemoji=""/> SHT40 อยู่บนบอร์ด จึงวัดความอุ่นของบอร์ดติดมาด้วย → เทียบเทอร์โมมิเตอร์ในห้อง แล้วใส่ <code>TEMP_OFFSET</code></p>
<p><strong>ตั้งศูนย์ (tare)</strong> <img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4d0.svg" data-marp-twemoji=""/> บอร์ดวางนิ่งก็เอียงอยู่แล้ว (เอียงราว 39° บนโต๊ะเรา) → จดท่านี้ไว้เป็น 0° แล้วลบออกทุกครั้ง</p>
<p><strong>② สองจุด (two-point)</strong> <img class="emoji" draggable="false" alt="🌱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f331.svg" data-marp-twemoji=""/> หัววัดดินแต่ละตัวให้ค่าดิบไม่เท่ากัน → จับค่าดินแห้ง = 0 % และดินอิ่มน้ำ = 100 % แก้ทั้งชดเชยและความชันในครั้งเดียว</p>
</div>
</div>
<div class="warn">
<p><strong>เชื่อก่อนต้องตรวจ:</strong> อ่านพลาดลองใหม่ 3 ครั้ง ยังพลาดก็คืน <code>None</code> ไม่ให้โปรแกรมล้ม · ผลสองจุดถูกบีบให้อยู่ 0–100 % · จุดแห้งกับจุดเปียกใกล้กันเกิน <code>MIN_SPAN</code> = ไม่หาร</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A3-%E0%B8%AA%E0%B8%AD%E0%B8%9A%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B8%81%E0%B9%88%E0%B8%AD%E0%B8%99%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD-%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%94-%E0%B8%AA%E0%B8%B2%E0%B8%A1%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5">เล่น ④ สอบเทียบก่อนเชื่อ: สามการ์ด สามวิธี</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> แก้ความเพี้ยน 3 แบบด้วยเลขง่าย ๆ: <strong>บวกค่าคงที่ · หักศูนย์ · สองจุด</strong></p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp1_04_calibrate.py"><code>cp1_04_calibrate.py</code></a></p>
<ol>
<li>การ์ด 1: เทียบค่าดิบ SHT40 กับเทอร์โมมิเตอร์ในห้อง → ใส่ผลต่างใน <code>TEMP_OFFSET</code> แล้วรันใหม่</li>
<li>การ์ด 2: วางบอร์ดตามปกติ ดูค่า <strong>ดิบ</strong> ก่อน → กด <strong>SW5</strong> (ปุ่มล่าง) = ท่านี้คือศูนย์ → ลองเอียง</li>
<li>การ์ด 3: หมุน VR1 ไปตำแหน่งหนึ่ง กด <strong>SW6</strong> (ปุ่มบน) = จุดแห้ง · หมุนไปอีกตำแหน่ง กด <strong>SW6</strong> = จุดเปียก → หมุนดู %</li>
<li>กด SW6 อีกครั้ง = เริ่มใหม่ · ลองให้จุดแห้งมีค่าดิบ <strong>มากกว่า</strong> จุดเปียก สูตรยังใช้ได้ไหม?</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp1_04_calibrate__half.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · อุณหภูมิและมุมเอียงเป็นค่าจำลองจากแผงของ Emulator ไม่ใช่ค่าจากบอร์ดจริง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="22" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">

<h2 id="%F0%9F%93%8C-%E0%B8%81%E0%B8%8E%E0%B8%82%E0%B8%AD%E0%B8%87-part-1"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cc.svg" data-marp-twemoji=""/> กฎของ Part 1</h2>
<div class="rule">
<p>อ่านให้ถูกจังหวะ แปลงให้มีหน่วย และสอบเทียบก่อนเชื่อ</p>
</div>
<ul>
<li><strong>ถูกจังหวะ:</strong> อ่านช้าไปพลาดการกดและเห็นผี · อ่านถี่ไปเปลืองเวลาและจอกะพริบ · ให้แต่ละงานมีนัดของตัวเอง</li>
<li><strong>มีหน่วย:</strong> 2048 ยังไม่มีความหมาย จนกว่าจะบอกว่าเป็น 50 % หรือ 250 ลิตร — และติดเวลาไว้ด้วยว่าวัดเมื่อไร</li>
<li><strong>สอบเทียบก่อนเชื่อ:</strong> เซนเซอร์บอกความจริงของตัวมันเอง (บอร์ดอุ่น บอร์ดเอียง) เราต้องแปลเป็นความจริงของฟาร์ม</li>
</ul>
<div class="think">
<p><strong>การ์ดออกแบบของกลุ่ม ช่อง &quot;วัด&quot;:</strong> อินพุตอะไร · ข้อมูลรูปร่างแบบไหน · อ่านกี่ครั้ง/วิ · สอบเทียบอย่างไร?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="24" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%94%E0%B8%B9%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1-%E0%B8%9B%E0%B8%B8%E0%B9%88%E0%B8%A1%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94%E0%B8%82%E0%B8%AD%E0%B8%87-adc">ดูเพิ่ม: ปุ่มสั่น และขั้นบันไดของ ADC</h2>
<div class="vid">
<iframe width="400" height="225" src="https://www.youtube.com/embed/IvU8m_30iK0" title="What is Switch Bounce and How to Debounce – ATM | Digi-Key Electronics — DigiKey" loading="lazy" frameborder="0" allowfullscreen></iframe>
<div>
<p><b>What is Switch Bounce and How to Debounce – ATM | Digi-Key Electronics</b><br /><br />
ช่อง DigiKey<br /><br />
<a href="https://www.youtube.com/watch?v=IvU8m_30iK0">https://www.youtube.com/watch?v=IvU8m_30iK0</a></p>

<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A0-%E0%B9%81%E0%B8%82%E0%B9%88%E0%B8%87%E0%B8%81%E0%B8%A3%E0%B8%AD%E0%B8%87-%E0%B8%94%E0%B8%B4%E0%B8%9A--ema--median--kalman-%E0%B8%9A%E0%B8%99%E0%B8%81%E0%B8%A3%E0%B8%B2%E0%B8%9F%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7">เล่น ① แข่งกรอง: ดิบ · EMA · Median · Kalman บนกราฟเดียว</h2>

<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> นับให้เห็นว่าตัวกรองแต่ละตัว <strong>ปล่อยหนามผ่าน</strong> กี่ครั้ง แล้วเลือกตัวที่ตรงรูปของสัญญาณรบกวน</p>

<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp2_01_filter_race.py"><code>cp2_01_filter_race.py</code></a></p>
<ol>

<h2 id="%E0%B8%AA%E0%B8%96%E0%B8%B4%E0%B8%95%E0%B8%B4%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%9F%E0%B8%B5%E0%B9%80%E0%B8%88%E0%B8%AD%E0%B8%A3%E0%B9%8C-z-%E0%B8%9A%E0%B8%AD%E0%B8%81%E0%B8%A7%E0%B9%88%E0%B8%B2-%E0%B9%81%E0%B8%9B%E0%B8%A5%E0%B8%81%E0%B9%81%E0%B8%84%E0%B9%88%E0%B9%84%E0%B8%AB%E0%B8%99">สถิติคือฟีเจอร์: z บอกว่า &quot;แปลกแค่ไหน&quot;</h2>
<p><img src="img/core/p2_bell_zscore.svg" alt="" style="width:1000px;" /></p>
<div class="cols">
<div>
<ul>
<li><strong>z = <sup>x − mean</sup>⁄<sub>std</sub></strong> = ค่าใหม่ห่างจากค่าเฉลี่ยกี่เท่าของ std</li>
<li><code>dsp</code> ไม่มี mean / std / z ให้ — เราเขียนเองราว <strong>10 บรรทัด</strong></li>
</ul>
</div>
<div>
<ul>
<li>เกณฑ์ตายตัว (เช่น 32 °C) ไม่รู้ว่า &quot;ปกติ&quot; ของเช้ากับบ่ายต่างกัน · z เทียบกับ <strong>ช่วงล่าสุดของตัวเอง</strong></li>
<li>ค่านิ่งสนิท std เกือบ 0 → z พุ่งเกินจริง จึงต้องมี std ขั้นต่ำ</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="32" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E2%98%86-%E0%B8%96%E0%B9%89%E0%B8%B2%E0%B8%A1%E0%B8%B5%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2-%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B9%88%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%99-30-%E0%B8%84%E0%B9%88%E0%B8%B2-%E2%86%92-mean-std-z">☆ ถ้ามีเวลา: หน้าต่างเลื่อน 30 ค่า → mean, std, z</h2>
<div class="cols">
<div class="c55">
<p><strong>สูตร Welford: เดินผ่านหน้าต่างรอบเดียว ได้ทั้ง mean และ std</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">mean_sd</span>(<span class="hljs-params">win</span>):
    <span class="hljs-comment"># Welford: เดินผ่านหน้าต่างรอบเดียว ได้ค่าเฉลี่ยและ SD (แบบตัวอย่าง หารด้วย n - 1)</span>
    <span class="hljs-comment"># ไม่ต้องบวกกำลังสองก้อนใหญ่แล้วลบกัน ซึ่งทำให้ทศนิยมหายบน float 32 บิตของบอร์ด</span>
    n, mean, m2 = <span class="hljs-number">0</span>, <span class="hljs-number">0.0</span>, <span class="hljs-number">0.0</span>
    <span class="hljs-keyword">for</span> x <span class="hljs-keyword">in</span> win:
        n += <span class="hljs-number">1</span>
        d = x - mean
        mean += d / n
        m2 += d * (x - mean)
    <span class="hljs-keyword">return</span> mean, (math.sqrt(m2 / (n - <span class="hljs-number">1</span>)) <span class="hljs-keyword">if</span> n &gt; <span class="hljs-number">1</span> <span class="hljs-keyword">else</span> <span class="hljs-number">0.0</span>)

<span class="hljs-keyword">def</span> <span class="hljs-title function_">zscore</span>(<span class="hljs-params">x, mean, sd, sd_min</span>):
    <span class="hljs-comment"># z = ห่างจากค่าเฉลี่ยกี่ SD (บวก = สูงกว่าปกติ ลบ = ต่ำกว่าปกติ)</span>
    <span class="hljs-keyword">return</span> (x - mean) / <span class="hljs-built_in">max</span>(sd, sd_min)
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp2_02_rolling_stats.py">core/cp2_02_rolling_stats.py</a> · mean_sd() และ zscore() (ตัดตอน)</div>
<div class="think">
<p><strong>คิด:</strong> ทำไมไฟล์นี้เทียบค่าล่าสุดกับ 30 ค่า <strong>ก่อนหน้า</strong> โดยไม่รวมตัวมันเอง?</p>
</div>
<div class="try">
<ol>
<li>รอเก็บครบ 30 ค่า (15 วินาที)</li>
<li>หมุน <strong>VR1</strong> เร็ว ๆ → z พุ่ง ไฟแดงติด (|z| เกิน 2.5)</li>
<li>หมุนค้างไว้ที่ใหม่ → หน้าต่าง &quot;ลืม&quot; ของเก่า z กลับเข้าใกล้ 0</li>
<li>กด <strong>SW5</strong> สลับเป็น SHT40 แล้วเป่าลมหายใจใส่เซนเซอร์</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp2_02_rolling_stats__vr1_jump_z.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp2_02_rolling_stats__breath_z.png" alt="" style="width:430px;" /></p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="33" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99%E0%B9%83%E0%B8%88-6-%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99--%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%95%E0%B9%88%E0%B8%B3%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B8%B8%E0%B8%94%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%9C%E0%B8%A5">บันไดการตัดสินใจ 6 ขั้น — ใช้ขั้นที่ต่ำที่สุดที่ได้ผล</h2>
<p><img src="img/core/p2_staircase.svg" alt="" style="width:1000px;" /></p>
<blockquote>
<p><strong>&quot;สัญญาณเตือนที่คนเรียนรู้ที่จะเมิน แย่กว่าไม่มีสัญญาณเตือน&quot;</strong> — เตือนผิดบ่อย คนจะเลิกฟัง แล้ววันที่ร้อนจริงก็ไม่มีใครมา</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="34" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99-4-%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B8%B1%E0%B8%8D%E0%B8%8D%E0%B8%B2%E0%B8%93%E0%B9%80%E0%B8%95%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B9%82%E0%B8%A3%E0%B8%87%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%99">ขั้น 4: เครื่องสถานะของสัญญาณเตือนโรงเรือน</h2>
<p><img src="img/core/p2_state_machine.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>ค้างไว้ (latch):</strong> ALARM ไม่ดับเองแม้ค่ากลับปกติ ต้องมีคนกด <strong>SW5 รับทราบ</strong> · <strong>COOLDOWN:</strong> พักเตือน 10 วินาที ไม่ให้เตือนรัว</li>
<li>ในโค้ด: ฟังก์ชันเดียว <code>next_state(state, over, ack, t_s)</code> รับสถานะเดิม + สิ่งที่เห็น แล้วคืนสถานะถัดไป ทดสอบได้โดยไม่มีบอร์ด</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="35" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A1-%E0%B8%9A%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99-%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-4-%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5-%E0%B8%99%E0%B8%B1%E0%B8%9A%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B9%83%E0%B8%84%E0%B8%A3%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%9E%E0%B8%B7%E0%B8%AD">เล่น ② บันไดตัดสิน: ค่าเดียว 4 วิธี นับว่าใครกระพือ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เห็นเป็น <strong>ตัวเลข</strong> ว่าแต่ละขั้นของบันได &quot;สลับติด/ดับ&quot; กี่ครั้ง บนค่าเดียวกัน</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp2_03_decision_ladder.py"><code>cp2_03_decision_ladder.py</code></a></p>
<ol>
<li>รันไฟล์ → 4 การ์ด: <strong>1 เกณฑ์ · 2 กันกระพือ · 3 รอให้นาน · 4 สถานะ</strong> แต่ละการ์ดมีไฟ + ตัวนับ &quot;สลับ (ครั้ง)&quot;</li>
<li>หมุน <strong>VR1</strong> ค้างไว้แถวเส้น 50 → ขั้น 1 วิ่งเร็ว ขั้น 2–4 แทบไม่ขยับ</li>
<li>หมุนขึ้นไป 70 ค้าง 3 วิ แล้วหมุนกลับลง → ขั้น 4 ยังค้าง <strong>ALARM</strong></li>
<li>กด <strong>SW5</strong> = รับทราบ → COOLDOWN 10 วิ → OK</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp2_03_decision_ladder__near_line_chatter.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp2_03_decision_ladder__ack_cooldown.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · ลูกบิดใน Emulator นิ่งสนิท สั่นบวกลบ 2 % มาจาก NOISE ที่โปรแกรมจำลองใส่ (บนบอร์ดก็ใส่เหมือนกัน)</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="36" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7%E0%B8%81%E0%B8%B1%E0%B8%99-%E0%B8%94%E0%B8%B9%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2-%E0%B8%AB%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%94%E0%B8%B9%E0%B8%95%E0%B8%B2%E0%B8%A1%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%96%E0%B8%B5%E0%B9%88">เสียงเดียวกัน ดูตามเวลา หรือดูตามความถี่</h2>
<p><img src="img/core/p2_time_freq.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>ไมค์ให้ 16,000 ตัวอย่างต่อวินาที · หยิบทีละ 256 ตัว (16 ms) → <code>dsp.fft_mag(mic.raw(), 256)</code> → <strong>128 ช่อง</strong> คำนวณในภาษา C</li>
<li>N ต้องเป็นกำลังของ 2 ระหว่าง 8–512 · N เล็กลง = ช่องกว้างขึ้น แยกความถี่ที่ใกล้กันไม่ออก</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A2-%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B9%87%E0%B8%99%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%96%E0%B8%B5%E0%B9%88-%E0%B8%AA%E0%B9%80%E0%B8%9B%E0%B8%81%E0%B8%95%E0%B8%A3%E0%B8%B1%E0%B8%A1%E0%B8%9A%E0%B8%99%E0%B8%88%E0%B8%AD%E0%B9%84%E0%B8%9F-rgb-16-%E0%B9%81%E0%B8%97%E0%B9%88%E0%B8%87">เล่น ③ ฟังเสียงเป็นความถี่: สเปกตรัมบนจอไฟ RGB 16 แท่ง</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> หาว่ายอดของเสียงอยู่ <strong>ช่องไหน</strong> แล้วแปลงเป็น Hz ด้วย ช่อง × 62.5</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp2_04_sound_spectrum.py"><code>cp2_04_sound_spectrum.py</code></a></p>
<ol>
<li><strong>ผิวปาก</strong> → ยอดเดียวสูง · <strong>ฮัมเสียงต่ำ</strong> → ยอดทางซ้าย · <strong>ตบมือ</strong> → กระจายหลายช่อง</li>
<li>กด <strong>SW5</strong> = บอร์ดเล่นโน้ต A 440 Hz ให้ไมค์ฟังเอง · <strong>SW6</strong> = 880 Hz (เสียงเบา ถ้ายอดไม่ขึ้นชัดให้ผิวปากแทน)</li>
<li>จอไฟ RGB: 16 แท่ง แท่งละ 500 Hz · สูงขึ้นหนึ่งแถว = ดังขึ้น 6 dB</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp2_04_sound_spectrum__ref_a440.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · ไมค์ของ Emulator เป็นเสียงสังเคราะห์ 440 Hz (ยอดอยู่ช่อง 7 ≈ 437 Hz) ตบมือใส่คอมพิวเตอร์ไม่มีผล · เสียงจริงต้องลองบนบอร์ด</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99-6-ai-%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B5%E0%B8%AA%E0%B8%B4%E0%B8%97%E0%B8%98%E0%B8%B4%E0%B9%8C%E0%B8%95%E0%B8%AD%E0%B8%9A%E0%B8%A7%E0%B9%88%E0%B8%B2-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%81%E0%B8%99%E0%B9%88%E0%B9%83%E0%B8%88">ขั้น 6: AI ต้องมีสิทธิ์ตอบว่า &quot;ไม่แน่ใจ&quot;</h2>
<p><img src="img/core/p2_ai_funnel.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>โมเดลให้ <strong>คะแนนทุกคลาส</strong> (0–1) · คลาสที่สูงสุด = คำตอบ · คะแนนของมัน = ความมั่นใจ (<code>conf</code>)</li>
<li><code>edge_ai.result()</code> คืนคำตอบล่าสุด <strong>ซ้ำทุกครั้งที่ถาม</strong> → นับเฉพาะคำตอบใหม่ (เลข <code>seq</code> เปลี่ยน)</li>
<li>เลือกโมเดลด้วย <strong>ชื่อ</strong>: หาแถวใน <code>edge_ai.models()</code> แล้วใช้ <code>m[&quot;index&quot;]</code> เพราะ <code>start()</code> / <code>select()</code> รับเลข ไม่รับชื่อ</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A3-%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B8%95%E0%B8%B9%E0%B8%84%E0%B8%A7%E0%B8%B2%E0%B8%A1%E0%B8%A1%E0%B8%B1%E0%B9%88%E0%B8%99%E0%B9%83%E0%B8%88-%E0%B8%AB%E0%B8%A1%E0%B8%B8%E0%B8%99%E0%B9%80%E0%B8%81%E0%B8%93%E0%B8%91%E0%B9%8C-%E0%B9%81%E0%B8%A5%E0%B9%89%E0%B8%A7%E0%B8%94%E0%B8%B9%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B9%81%E0%B8%A5%E0%B8%81%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">เล่น ④ ประตูความมั่นใจ: หมุนเกณฑ์ แล้วดูว่าแลกอะไร</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> รู้สึกด้วยมือว่าเกณฑ์สูง = <strong>ไม่แน่ใจบ่อย แต่ลงมือผิดน้อย</strong> · เกณฑ์ต่ำ = ตอบไว แต่เชื่อคำตอบกำกวมด้วย</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp2_06_ai_confidence_gate.py"><code>cp2_06_ai_confidence_gate.py</code></a></p>
<ol>
<li>รันไฟล์ → บรรทัดบนบอกชื่อโมเดลที่หาเจอจาก <code>MODEL_KEY</code> (หาไม่เจอ = ขึ้น &quot;ไม่พบโมเดล&quot; แล้วจบอย่างสงบ)</li>
<li>ทำตามคำแนะนำในไฟล์: วางบอร์ดนิ่ง → ถือบอร์ดวาดวงกลม → เขย่า · เทียบ <strong>&quot;AI ตอบดิบ&quot;</strong> กับ <strong>&quot;ประตูตัดสิน&quot;</strong></li>
<li>หมุน <strong>VR1</strong> = เกณฑ์ 0.50–0.99 แล้วดูตัวนับ <strong>ลงมือ</strong> กับ <strong>ไม่แน่ใจ</strong></li>
</ol>
</div>
<div class="think">
<p><strong>☆ โจทย์เพิ่ม:</strong> โมเดลจริงอาจสลับคำตอบไปมา (วัดจริง: AnomalousVibration ขณะเขย่า) — ลองเปลี่ยน <code>cp2_06</code> เป็น &quot;อย่างน้อย 3 ใน 5 ครั้งล่าสุด&quot; แล้วเทียบกัน</p>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp2_06_ai_confidence_gate__shaking.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp2_06_ai_confidence_gate__strict.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · คำตอบของ AI ใน Emulator เป็นผลจำลอง (ปุ่ม Shake = เขย่า) ไม่ได้รันโมเดลจริง · ชื่อโมเดลและคลาสบนบอร์ดจริง ต้องลองบนบอร์ด</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="40" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="code-quest--part-2">Code Quest — Part 2</h2>
<table>
<thead>
<tr>
<th>ระดับ</th>
<th>โจทย์</th>
<th>ประเภท</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 เดา</strong></td>
<td><strong>cp2_01:</strong> EMA α = 0.2 ค่านิ่งที่ 40 แล้วมีหนามไป 85 หนึ่งตัว → เส้น EMA ขึ้นไปที่ <strong>___</strong> · Median window 5 หนามตัวเดียวกัน → <strong>___</strong></td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
</tr>
<tr>
<td><strong>2 แก้</strong></td>
<td><strong>cp2_03:</strong> ตั้ง <code>HOLD_S = 0</code> แล้วเทียบตัวนับขั้น 3 กับขั้น 1 · <strong>cp2_06:</strong> ตั้ง <code>CONF_MIN = 0.95</code> แล้วจดสัดส่วน ลงมือ : ไม่แน่ใจ</td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
</tr>
<tr>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">next_state</span>(<span class="hljs-params">state, over, ack, t_s</span>):

            <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;OK&quot;</span>
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;ALARM&quot;</span> <span class="hljs-keyword">if</span> t_s &gt;= ____ <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;WATCH&quot;</span>     <span class="hljs-comment"># ช่อง A: เกินต่อเนื่องนานเท่าไรจึงเตือน?</span>
    <span class="hljs-keyword">if</span> state == <span class="hljs-string">&quot;ALARM&quot;</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;COOLDOWN&quot;</span> <span class="hljs-keyword">if</span> ____ <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;ALARM&quot;</span>         <span class="hljs-comment"># ช่อง B: อะไรเท่านั้นที่ปลด ALARM ได้?</span>
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;OK&quot;</span> <span class="hljs-keyword">if</span> t_s &gt;= ____ <span class="hljs-keyword">else</span> <span class="hljs-string">&quot;COOLDOWN&quot;</span>         <span class="hljs-comment"># ช่อง C: พักนานเท่าไรจึงกลับ OK?</span>
</code></pre>

<h2 id="%F0%9F%93%8C-%E0%B8%81%E0%B8%8E%E0%B8%82%E0%B8%AD%E0%B8%87-part-2"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cc.svg" data-marp-twemoji=""/> กฎของ Part 2</h2>
<div class="rule">
<p>กรองตามรูปของสัญญาณรบกวน ตัดสินด้วยขั้นบันไดที่ต่ำที่สุดที่ได้ผล และให้ AI มีสิทธิ์ตอบว่าไม่แน่ใจ</p>
</div>
<ul>
<li><strong>กรองตามรูป:</strong> สั่นยิบ → EMA · หนาม → Median · ลอย → baseline · เลือกผิดรูปทั้งช้าและยังพลาด</li>
<li><strong>ขั้นต่ำสุดที่ได้ผล:</strong> ขั้นสูงแพงกว่า ทดสอบยากกว่า อธิบายให้เกษตรกรฟังยากกว่า และเตือนผิดบ่อย = คนเลิกฟัง</li>
<li><strong>&quot;ไม่แน่ใจ&quot; เป็นคำตอบที่ถูกต้อง:</strong> AI ที่ถูกบังคับให้ตอบทุกครั้ง จะตอบผิดอย่างมั่นใจ</li>
</ul>
<div class="think">
<p><strong>การ์ดออกแบบของกลุ่ม ช่อง &quot;ตัดสิน&quot;:</strong> โปรเจกต์ของเราใช้ขั้นไหนของบันได และทำไมขั้นที่ต่ำกว่าถึงไม่พอ?</p>
</div>
</section>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="48" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%A0%E0%B8%B2%E0%B8%A9%E0%B8%B2%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0-%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%AA%E0%B8%B5-%E0%B8%88%E0%B8%B1%E0%B8%87%E0%B8%AB%E0%B8%A7%E0%B8%B0-%E0%B8%84%E0%B8%B3-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B2%E0%B8%87">ภาษาสถานะ: สถานะเดียว ได้สี จังหวะ คำ และเสียงเดียวกันทุกช่องทาง</h2>
<p><img src="img/core/p3_status_language.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>ยิ่งรุนแรงยิ่งเร่ง: <strong>ติดนิ่ง → กะพริบช้า → กะพริบเร็ว</strong> · ไม่พึ่งสีอย่างเดียว คนตาบอดสีอ่านจังหวะกับคำบนจอไฟได้</li>
<li>เสียงดัง <strong>เฉพาะตอนแย่ลง และตอนกลับมาปกติ</strong> · ดีขึ้นแต่ยังไม่ปกติ = เงียบ</li>
<li>&quot;อันตราย&quot; ดังซ้ำได้ <strong>ไม่ถี่กว่าทุก 10 วิ</strong> และต้องกดรับทราบให้เงียบได้ — เตือนถี่เกิน คนจะเลิกฟัง (alarm fatigue) · รับทราบแล้ว <strong>ไฟยังอยู่</strong> จนกว่าต้นเหตุจะหาย</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="49" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%AA%E0%B8%B5%E0%B8%A2%E0%B8%87%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%84%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%AA-7-%E0%B8%97%E0%B8%B3%E0%B8%99%E0%B8%AD%E0%B8%87-%E0%B8%9C%E0%B9%88%E0%B8%B2%E0%B8%99%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B9%80%E0%B8%9A%E0%B8%B2%E0%B9%80%E0%B8%97%E0%B9%88%E0%B8%B2%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C">เสียงทั้งคอร์ส: 7 ทำนอง ผ่านทางเดียว เบาเท่ากันทุกไฟล์</h2>
<p><img src="img/core/p3_sound_patterns.svg" alt="" style="width:640px;" /></p>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># เสียงเตือนใช้ ui.tone เพราะปรับความดังได้ (ui.sfx ในเฟิร์มแวร์นี้ปรับความดังไม่ได้)</span>
TUNES = {<span class="hljs-string">&quot;tap&quot;</span>: (<span class="hljs-number">76</span>,), <span class="hljs-string">&quot;start&quot;</span>: (<span class="hljs-number">72</span>, <span class="hljs-number">79</span>), <span class="hljs-string">&quot;stop&quot;</span>: (<span class="hljs-number">79</span>, <span class="hljs-number">72</span>), <span class="hljs-string">&quot;good&quot;</span>: (<span class="hljs-number">72</span>, <span class="hljs-number">79</span>, <span class="hljs-number">84</span>),
         <span class="hljs-string">&quot;bad&quot;</span>: (<span class="hljs-number">84</span>, <span class="hljs-number">76</span>), <span class="hljs-string">&quot;empty&quot;</span>: (<span class="hljs-number">84</span>, <span class="hljs-number">76</span>, <span class="hljs-number">69</span>), <span class="hljs-string">&quot;hit&quot;</span>: (<span class="hljs-number">88</span>,)}


<span class="hljs-keyword">def</span> <span class="hljs-title function_">beep</span>(<span class="hljs-params">name</span>):
    <span class="hljs-keyword">for</span> n <span class="hljs-keyword">in</span> TUNES[name]:
        ui.tone(n, ui.WAVE_SINE, VOLUME, <span class="hljs-number">90</span>)
        time.sleep_ms(<span class="hljs-number">100</span>)
</code></pre>
</div>
<div>
<ul>
<li>ทุกไฟล์มีเสียงผ่าน <strong><code>beep(ชื่อ)</code></strong> ทางเดียว และตั้ง <strong><code>VOLUME = 25</code></strong> (0–127 ราว 20 %) → ชื่อเดียว ทำนองเดียว ดังเท่ากัน</li>
<li><code>ui.tone(โน้ต, คลื่น, ความดัง, ms)</code> มีช่อง <strong>ความดัง</strong> · <code>ui.sfx</code> บนเฟิร์มแวร์นี้รับแค่ <strong>หมายเลขเสียง</strong> จึงหรี่ไม่ได้ — คอร์สนี้ไม่ใช้</li>
<li>เฟิร์มแวร์ 2.4.2 เพิ่ม <code>ui.volume()</code> = <strong>ความดังลำโพงรวม</strong> ทั้งเครื่อง · ส่วน <code>VOLUME</code> ยังเป็นความดังของแต่ละโน้ต (velocity) เหมือนเดิม</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="50" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A0-%E0%B8%A0%E0%B8%B2%E0%B8%A9%E0%B8%B2%E0%B8%AA%E0%B8%96%E0%B8%B2%E0%B8%99%E0%B8%B0-%E0%B8%AB%E0%B8%A1%E0%B8%B8%E0%B8%99%E0%B8%A5%E0%B8%B9%E0%B8%81%E0%B8%9A%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7-%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%8A%E0%B9%88%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99%E0%B8%9E%E0%B8%A3%E0%B9%89%E0%B8%AD%E0%B8%A1%E0%B8%81%E0%B8%B1%E0%B8%99">เล่น ① ภาษาสถานะ: หมุนลูกบิดเดียว ทุกช่องทางเปลี่ยนพร้อมกัน</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เห็นว่าสถานะเดียวออกทุกช่องทางพร้อมกัน และเสียงเตือนถูกคุมไม่ให้รำคาญ</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp3_01_status_language.py"><code>cp3_01_status_language.py</code></a></p>
<ol>
<li>รันไฟล์ → หมุน <strong>VR1</strong> จากซ้ายสุดไปขวาสุด: <strong>ปกติ → เฝ้าดู → เตือน → อันตราย</strong> (VR1 แทนผลตัดสินจาก Part 2)</li>
<li>ดูไฟ RGB · จอไฟ 16×8 · วงไฟบนจอ · ฟังเสียง — เปลี่ยน <strong>พร้อมกัน</strong> ไหม?</li>
<li>ค้างที่ <strong>&quot;อันตราย&quot;</strong> → นับว่าเสียงดังซ้ำทุกกี่วินาที (จอนับถอยหลังให้)</li>
<li>กด <strong>SW5</strong> (ปุ่มล่าง) = รับทราบ → เสียงเงียบ แต่ไฟยังกะพริบ · หมุนกลับมา <strong>&quot;ปกติ&quot;</strong> ฟังเสียง <code>good</code></li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp3_01_status_language__warn_blink.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp3_01_status_language__alarm_acked.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · ลูกบิดหมุนจากแผงจำลอง · ไฟล์นี้ไม่ใช้เน็ต · คำวิ่งบนจอไฟใน Emulator ขึ้นแค่เฟรมแรก บนบอร์ดวิ่งจริง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="51" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99--%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B8%A2%E0%B8%B1%E0%B8%87%E0%B8%AD%E0%B8%A2%E0%B8%B9%E0%B9%88-%E0%B8%A7%E0%B8%B1%E0%B8%94%E0%B8%96%E0%B8%B5%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87">ส่งเมื่อเปลี่ยน + ส่งว่ายังอยู่: วัดถี่ได้ ไม่ต้องส่งทุกครั้ง</h2>
<p><img src="img/core/p3_report_timeline.svg" alt="" style="width:860px;" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">why_send</span>(<span class="hljs-params">value, last, quiet_ms</span>):
    <span class="hljs-comment"># ส่งใบนี้ไหม: &quot;change&quot; / &quot;heartbeat&quot; / None</span>
    <span class="hljs-comment"># last = ค่าในใบที่ส่งไปล่าสุด (None = ยังไม่เคยส่ง) - quiet_ms = เงียบมานานเท่าไรแล้ว</span>
    <span class="hljs-keyword">if</span> last <span class="hljs-keyword">is</span> <span class="hljs-literal">None</span> <span class="hljs-keyword">or</span> <span class="hljs-built_in">abs</span>(value - last) &gt; DEADBAND:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;change&quot;</span>
    <span class="hljs-keyword">if</span> quiet_ms &gt;= HEARTBEAT_S * <span class="hljs-number">1000</span>:
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;heartbeat&quot;</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
</code></pre>
<ul>
<li>เทียบกับ <strong>ใบที่ส่งไปล่าสุด</strong> ไม่ใช่ค่ารอบก่อน · ใบ &quot;ยังอยู่&quot; ทำให้ปลายทางแยก <strong>ค่านิ่ง</strong> กับ <strong>บอร์ดตาย</strong> ได้ · ภาพใช้ heartbeat 60 วิ ส่วน cp3_03 ตั้ง <code>HEARTBEAT_S = 30</code> — ลองคิดตัวเลขทั้งวันใหม่เอง</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="52" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A1-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B9%80%E0%B8%A1%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B9%80%E0%B8%9B%E0%B8%A5%E0%B8%B5%E0%B9%88%E0%B8%A2%E0%B8%99-%E0%B8%99%E0%B8%B1%E0%B8%9A%E0%B9%83%E0%B8%9A%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-%E0%B9%80%E0%B8%97%E0%B8%B5%E0%B8%A2%E0%B8%9A%E0%B8%81%E0%B8%B1%E0%B8%9A%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%A7%E0%B8%B1%E0%B8%94">เล่น ② ส่งเมื่อเปลี่ยน: นับใบที่ส่งจริง เทียบกับที่วัด</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เห็นกับตาว่าส่งน้อยลงเท่าไร โดยปลายทางยังรู้ว่าบอร์ดยังอยู่</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp3_03_report_by_exception.py"><code>cp3_03_report_by_exception.py</code></a></p>
<ol>
<li>แก้ <code>WIFI_SSID</code> <code>WIFI_PASS</code> <code>TEAM</code> แล้วรัน → ไฟ <strong>MQTT</strong> บนจอติด ขึ้น <strong>เชื่อมต่อแล้ว</strong> = ออนไลน์</li>
<li>ปล่อย <strong>VR1</strong> นิ่ง ๆ → มีแต่ใบ <strong>heartbeat</strong> ทุก 30 วิ</li>
<li>หมุน VR1 ช้า ๆ แล้วเร็ว ๆ → เส้น <strong>เขียว</strong> (ใบที่ส่ง) เดินเป็น <strong>ขั้นบันได</strong> ตามเส้น <strong>ฟ้า</strong> (ค่าที่วัด)</li>
<li>อ่าน <strong>&quot;ส่ง … ใบ / วัด … ครั้ง&quot;</strong> และ <strong>% ประหยัด</strong> · ดูใบจริงใน MQTT Explorer: subscribe <code>bento-aiot/&lt;TEAM&gt;/core/#</code> แล้วดูช่อง <code>n</code> <code>up_s</code> <code>why</code></li>
</ol>
</div>
<div class="warn">
<p>ต่อ broker ไม่ได้ทันทีหลังหยุดโปรแกรม → รอ ~1 นาที หรือกด <strong>RESET</strong> แล้วรันใหม่</p>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp3_03_report_by_exception__turn_more.png" alt="" style="width:600px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · Emulator ต่อ broker.hivemq.com จริงผ่าน WebSocket (client id ต่อท้าย -emu) · ลูกบิดหมุนจากแผงจำลอง</div>
<div class="warn">
<p>พอร์ต 1883 <strong>ไม่เข้ารหัส</strong> ใครก็อ่านหัวข้อเราได้ — ห้ามส่งรหัสหรือของลับ · <code>n</code> = เลขใบ (เห็นใบหาย) · <code>up_s</code> = บอร์ดเปิดมากี่วิ (เห็นรีสตาร์ต)</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="53" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B5%E0%B8%84%E0%B8%B3%E0%B8%A2%E0%B8%B7%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%99-%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%97%E0%B8%B2%E0%B8%87%E0%B8%96%E0%B8%AD%E0%B8%A2%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%9B%E0%B8%A5%E0%B8%AD%E0%B8%94%E0%B8%A0%E0%B8%B1%E0%B8%A2">ทุกคำสั่งต้องมีคำยืนยัน และทางถอยที่ปลอดภัย</h2>
<p><img src="img/core/p3_command_confirm.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>สั่ง → รอคำยืนยันที่จับคู่กับคำสั่งนี้ได้ → หมดเวลา = &quot;ไม่รู้&quot;</strong> · เงียบ <strong>ไม่ใช่</strong> สำเร็จ · สถานะปั๊มบนจอมาจาก <strong>คำยืนยันของ PLC</strong> ไม่ใช่จากปุ่มที่เรากด</li>
<li><strong>ไม่รู้ = ปิดไว้ก่อน</strong> (fail-safe): cp3_06 ถ้ายังไม่รู้สถานะปั๊ม กด SW6 จะขอ <strong>&quot;ปิด&quot;</strong> ก่อนเสมอ</li>
<li><strong>ด่านสุดท้ายอยู่ที่ PLC (interlock):</strong> เปิดได้ไม่เกิน 30 วิ · ถังต่ำกว่า 10 % ไม่ยอมเปิด — ต่อให้บอร์ดดับไปเลย ปั๊มก็ไม่ค้าง</li>
</ul>
<p>☆ <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp3_04_command_confirm.py"><code>cp3_04_command_confirm.py</code></a> เล่นวงปิดนี้กับ <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/field_sim.py"><code>field_sim.py</code></a> บนโน้ตบุ๊ก: SW5 ขอเปิด 10 วิ · SW6 ขอปิด · รอ 3 วิ ส่งซ้ำ 1 ครั้ง · ยังเงียบ = สั่งปิดและถือว่า &quot;ไม่รู้&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="54" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%97%E0%B9%88%E0%B8%AD%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B9%81%E0%B8%9A%E0%B8%9A-mqtt-%E0%B8%8B%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94--mqtts-%E0%B8%97%E0%B9%88%E0%B8%AD%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9C%E0%B8%99%E0%B8%B6%E0%B8%81">ท่อสองแบบ: MQTT ซองเปิด · MQTTS ท่อปิดผนึก</h2>
<p><img src="img/core/p3_two_pipes.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>TLS ให้ 2 อย่าง: <strong>เข้ารหัส</strong> (คนกลางทางอ่าน/แก้ไม่ได้) + <strong>ยืนยันตัวตน broker</strong> · mTLS เพิ่มอีกข้อ: <strong>broker รู้ว่าบอร์ดเป็นใคร</strong></li>
<li>ในคลาสใช้ <code>mqtt</code> พอร์ต 1883 กับ broker สาธารณะ เพราะเริ่มง่าย — งานจริง <strong>คำสั่งปั๊มต้องไม่วิ่งบนซองเปิด</strong></li>
<li><code>mqtt</code> ของบอร์ดนี้ไม่มี retain และไม่มี Last Will → ปลายทางต้อง <strong>จับเวลา heartbeat เอง</strong> (เงียบเกินรอบ = บอร์ดมีปัญหา)</li>
</ul>
<p>☆ <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp3_05_two_pipes.py"><code>cp3_05_two_pipes.py</code></a> ค่าเดียวกัน สองท่อ: ท่อ 1 โชว์ใบที่วิ่งใน <code>mqtt</code> 1883 ทีละตัวอักษร · ท่อ 2 อ่านค่าตั้งของ <code>tesaiot</code> (tls_mode, broker, พอร์ต) แบบไม่ต่อเน็ต</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="55" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="modbus-%E0%B8%A0%E0%B8%B2%E0%B8%A9%E0%B8%B2%E0%B8%82%E0%B8%AD%E0%B8%87-plc-%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B8%A1%E0%B8%B2%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B9%81%E0%B8%95%E0%B9%88%E0%B8%9B%E0%B8%B5-1979">Modbus: ภาษาของ PLC ใช้กันมาตั้งแต่ปี 1979</h2>
<p><img src="img/core/p3_modbus_model.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>ถาม 1 ตอบ 1:</strong> client ขอ → server ตอบ · server ไม่พูดก่อน (ต่างจาก MQTT ที่ใครอยาก publish ก็ส่งเลย)</li>
<li>ข้อมูลอยู่ใน <strong>4 ตาราง</strong> · วันนี้ใช้ตารางเดียว: <strong>holding register</strong> ช่องละ 16 บิต · อ่าน = <strong>FC03</strong> · เขียนช่องเดียว = <strong>FC06</strong></li>
<li>ในฟาร์มเจอ Modbus ที่อินเวอร์เตอร์ปั๊ม (VFD) มิเตอร์ไฟ หัววัดดิน/EC/pH แบบ RS-485 และ PLC ในตู้ควบคุม</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="56" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%81%E0%B8%A3%E0%B8%AD%E0%B8%9A-modbus-tcp-12-%E0%B9%84%E0%B8%9A%E0%B8%95%E0%B9%8C-%E0%B9%80%E0%B8%9B%E0%B8%B4%E0%B8%94%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1-%E0%B8%AB%E0%B8%99%E0%B9%89%E0%B8%B2%E0%B8%95%E0%B8%B2%E0%B9%81%E0%B8%9A%E0%B8%9A%E0%B8%99%E0%B8%B5%E0%B9%89">กรอบ Modbus TCP 12 ไบต์: &quot;เปิดปั๊ม&quot; หน้าตาแบบนี้</h2>
<p><img src="img/core/p3_modbus_frame.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>MBAP 7 ไบต์</strong> (หัวของ TCP) + <strong>PDU 5 ไบต์</strong> (ตัวคำสั่ง) · ช่อง 2 ไบต์เรียงแบบ <strong>big-endian</strong> (ไบต์สูงมาก่อน)</li>
<li>PLC ทำสำเร็จ = <strong>ทวนคำขอกลับครบ 12 ไบต์</strong> · ไม่ยอมทำ = function code <strong>ติดบิตสูง</strong> (06 → 86) ตามด้วยรหัสข้อยกเว้น</li>
<li>ข้อยกเว้นของ PLC จำลอง: <strong>01</strong> ไม่รู้จักคำสั่ง · <strong>02</strong> ไม่มี register ให้ทำแบบนั้น · <strong>03</strong> ค่าไม่ถูกต้อง · <strong>04</strong> ไม่ยอมทำ (ระบบป้องกัน)</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="57" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%A5%E0%B9%88%E0%B8%99-%E2%91%A2-%E0%B8%81%E0%B8%A3%E0%B8%AD%E0%B8%9A-modbus-%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%88%E0%B8%A3%E0%B8%B4%E0%B8%87-%E0%B8%AA%E0%B8%A3%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%9A%E0%B8%99%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%97%E0%B8%B5%E0%B8%A5%E0%B8%B0%E0%B9%84%E0%B8%9A%E0%B8%95%E0%B9%8C">เล่น ③ กรอบ Modbus ของจริง สร้างบนบอร์ดทีละไบต์</h2>
<div class="cols">
<div class="c45">
<div class="no">
<p><strong>บอร์ดรุ่นนี้ยังส่ง Modbus TCP เองไม่ได้</strong> (เฟิร์มแวร์ไม่มีโมดูล Modbus และไม่มี socket) — เราจึงให้บอร์ดส่ง <strong>&quot;ความตั้งใจ&quot;</strong> ผ่าน MQTT แล้วให้เกตเวย์บนโน้ตบุ๊กพูด Modbus TCP แทน</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/cp3_06_modbus_frame.py"><code>cp3_06_modbus_frame.py</code></a></p>
<ol>
<li>รันโดย <strong>ยังไม่ตั้ง WiFi</strong> = โหมดดูกรอบ (สร้างกรอบโชว์บนจอ ไม่ส่งไปไหน)</li>
<li>กด <strong>SW6</strong> (ปุ่มบน) เป็นปุ่มแรก → FC06 เขียน HR0 = 1 → เทียบกับกรอบในสไลด์ก่อน <strong>ตรงทุกไบต์ไหม?</strong></li>
<li><strong>ทายก่อนกด:</strong> กด <strong>SW5</strong> (ปุ่มล่าง) → FC03 อ่าน HR0–HR2 · ไบต์ 0–1 (tid) และไบต์ 11 (qty) จะเป็นเลขอะไร?</li>
<li>กด SW6 ซ้ำ ๆ → ไบต์ไหนเปลี่ยน ไบต์ไหนคงที่ (โหมดนี้สลับ 1 กับ 0 ให้เอง ไม่ใช่สถานะจริงของปั๊ม)</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/emu/cp3_06_modbus_frame__fc03_read_confirmed.png" alt="" style="width:430px;" /></p>
<p><img src="img/emu/cp3_06_modbus_frame__fc06_pump_on_confirmed.png" alt="" style="width:430px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator · ตอนถ่ายไม่มีเกตเวย์บนโน้ตบุ๊กตอบ (Emulator ต่อ broker.hivemq.com จริง ถ้ารันเกตเวย์ด้วย TEAM เดียวกันจะได้คำตอบ) · ไบต์ของกรอบคำนวณด้วย struct จริง</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="58" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B9%80%E0%B8%94%E0%B9%82%E0%B8%A1%E0%B8%9C%E0%B8%B9%E0%B9%89%E0%B8%AA%E0%B8%AD%E0%B8%99-%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94-%E2%86%92-mqtt-%E2%86%92-%E0%B9%80%E0%B8%81%E0%B8%95%E0%B9%80%E0%B8%A7%E0%B8%A2%E0%B9%8C-%E2%86%92-modbus-tcp-%E2%86%92-plc-%E0%B8%88%E0%B8%B3%E0%B8%A5%E0%B8%AD%E0%B8%87">เดโมผู้สอน: บอร์ด → MQTT → เกตเวย์ → Modbus TCP → PLC จำลอง</h2>
<p><img src="img/core/p3_modbus_gateway.svg" alt="" style="width:860px;" /></p>
<div class="cols">
<div>
<p><strong>บนโน้ตบุ๊ก 2 หน้าต่าง</strong> (Python 3)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">python modbus_plc_sim.py      <span class="hljs-comment"># 1: PLC จำลอง พอร์ต 5020</span>
pip install paho-mqtt         <span class="hljs-comment"># ครั้งแรกครั้งเดียว</span>
python modbus_bridge.py       <span class="hljs-comment"># 2: แก้ TEAM ให้ตรงบอร์ดก่อน</span>
</code></pre>
<p><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/app/modbus_plc_sim.py"><code>modbus_plc_sim.py</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/app/modbus_bridge.py"><code>modbus_bridge.py</code></a></p>
</div>
<div>
<p><strong>ดูอะไร</strong> (บอร์ดตั้ง WiFi + TEAM เดียวกัน)</p>
<ul>
<li>กด SW5 อ่าน แล้ว SW6 สั่งเปิด → บรรทัด <code>-&gt; PLC</code> ในหน้าต่างเกตเวย์คือ <strong>12 ไบต์ชุดเดียวกับบนจอบอร์ด</strong> ออกไปพอร์ต 5020 · คำตอบกลับถึงบอร์ด = <strong>&quot;ยืนยันแล้ว&quot;</strong></li>
<li>ปิด PLC จำลองแล้วกดอีกครั้ง → บอร์ดขึ้น <code>plc_offline</code> สถานะปั๊มเป็น <strong>--</strong> (ไม่รู้) · เปิดใหม่ด้วย <code>--tank 5</code> แล้วสั่งเปิด → <strong>&quot;PLC ปฏิเสธ 4&quot;</strong></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="59" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="%E0%B8%AD%E0%B8%A2%E0%B8%B2%E0%B8%81%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94%E0%B8%9E%E0%B8%B9%E0%B8%94-modbus-%E0%B9%80%E0%B8%AD%E0%B8%87-%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B5%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1">อยากให้บอร์ดพูด Modbus เอง ต้องมีอะไรเพิ่ม</h2>
<p><img src="img/core/p3_modbus_future.svg" alt="" style="width:1000px;" /></p>
<ul>
<li><strong>RTU กับ TCP ใช้ PDU ชุดเดียวกัน</strong> · TCP ไม่มี CRC (TCP ตรวจให้แล้ว) และ <strong>address ของ RTU</strong> ย้ายไปเป็น <strong>unit id</strong> ใน MBAP</li>
<li><strong>(a)</strong> โมดูล <code>modbus</code> ภาษา C บน network stack เดิมของบอร์ด → Modbus TCP ทาง Wi-Fi · <strong>(b)</strong> ผูก UART + ขาคุมทิศส่ง/รับของชิป RS-485 บนบอร์ดฐาน → Modbus RTU แต่ขาใช้ร่วมกับปุ่ม <strong>SW5/SW6</strong> (DIP switch เลือก)</li>
<li>ทั้งสองข้อเป็น <strong>งานเฟิร์มแวร์ในอนาคต ยังไม่มีกำหนดวัน</strong> · วันนี้ใช้เกตเวย์แปล MQTT เป็น Modbus ซึ่งเป็น <strong>รูปแบบที่ใช้กันทั่วไป</strong> ในการพา PLC รุ่นเก่าเข้าระบบ IoT</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="60" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">
<h2 id="code-quest--part-3">Code Quest — Part 3</h2>
<table>
<thead>
<tr>
<th>ระดับ</th>
<th>โจทย์</th>
<th>ประเภท</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 เดา</strong></td>
<td><strong>cp3_03:</strong> ค่าที่วัดได้ 40, 40.5, 41, 43, 43.2, 46 ตามลำดับ · <code>DEADBAND = 2</code> · เทียบกับ <strong>ใบที่ส่งไปล่าสุด</strong> · ค่าแรกส่งเสมอ · ส่งเมื่อต่าง <strong>มากกว่า</strong> 2 → ส่งกี่ใบ (ไม่นับ heartbeat)? <strong>___</strong></td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
</tr>
<tr>
<td><strong>2 แก้</strong></td>
<td><strong>cp3_03:</strong> ตั้ง <code>HEARTBEAT_S = 10</code> ปล่อย VR1 นิ่ง ๆ แล้วดู % ประหยัด คุ้มไหมกับการรู้เร็วขึ้นว่าบอร์ดตาย · <strong>cp3_01:</strong> ตั้ง <code>REPEAT_S = 3</code> ค้างที่ &quot;อันตราย&quot; ครึ่งนาที รำคาญหรือยัง?</td>
<td>โจทย์หลัก (มีเฉลยในคาบ)</td>
</tr>
<tr>
<td><strong>3 เติม</strong></td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/practise/cp3_06_practise.py"><code>cp3_06_practise.py</code></a> เติม 2 ช่องใน <code>fc06_write()</code>: <strong>A</strong> รูปแบบ <code>struct</code> ของ PDU · <strong>B</strong> ค่า len ใน MBAP → ต้องได้ <code>00 01 00 00 00 06 01 06 00 00 00 01</code></td>
<td><strong>โจทย์หลัก (มีเฉลยในคาบ)</strong> · 7 นาที</td>
</tr>
<tr>
<td><strong>4 สร้าง</strong></td>
<td>สร้างกรอบ <strong>FC16</strong> (เขียนหลายช่องในกรอบเดียว) โชว์บนจอบอร์ด — เกตเวย์และ PLC จำลองของเรารับแค่ FC03/FC06 อยากส่งจริงต้องแก้สองฝั่ง · หรือใน cp3_01 <strong>ยกระดับเตือน</strong> เมื่อ &quot;อันตราย&quot; ไม่มีใครกดรับทราบเกิน 60 วิ</td>
<td>โจทย์เพิ่ม (โบนัส เฉลยคาบหน้า)</td>
</tr>

<h2 id="code-quest-%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A-3--%E0%B9%80%E0%B8%95%E0%B8%B4%E0%B8%A1-fc06_write-%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%84%E0%B8%94%E0%B9%89-12-%E0%B9%84%E0%B8%9A%E0%B8%95%E0%B9%8C%E0%B9%80%E0%B8%9B%E0%B9%8A%E0%B8%B0-%E0%B9%82%E0%B8%88%E0%B8%97%E0%B8%A2%E0%B9%8C%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%81-7-%E0%B8%99%E0%B8%B2%E0%B8%97%E0%B8%B5">Code Quest ระดับ 3 — เติม <code>fc06_write()</code> ให้ได้ 12 ไบต์เป๊ะ (โจทย์หลัก 7 นาที)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">fc03_read</span>(<span class="hljs-params">tid, unit, addr, qty</span>):
    <span class="hljs-comment"># FC03 อ่าน holding register qty ช่อง เริ่มที่ช่อง addr (ทำเสร็จแล้ว ใช้ดูเป็นตัวอย่าง)</span>
    <span class="hljs-comment"># &quot;&gt;HHHBBHH&quot; = big-endian: tid(H) protocol(H) len(H) unit(B) | fc(B) addr(H) qty(H) รวม 12 ไบต์</span>
    <span class="hljs-keyword">return</span> struct.pack(<span class="hljs-string">&quot;&gt;HHHBBHH&quot;</span>, tid &amp; <span class="hljs-number">0xFFFF</span>, <span class="hljs-number">0</span>, <span class="hljs-number">6</span>, unit, <span class="hljs-number">3</span>, addr, qty)


<span class="hljs-keyword">def</span> <span class="hljs-title function_">fc06_write</span>(<span class="hljs-params">tid, unit, addr, value</span>):
    <span class="hljs-comment"># FC06 เขียนค่า value ลง holding register ช่องเดียว (ช่อง addr) สร้างเป็นสองท่อนแล้วต่อกัน</span>
    pdu = struct.pack(____, <span class="hljs-number">6</span>, addr, value)                    <span class="hljs-comment"># ช่อง A: รูปแบบของ fc(1) addr(2) value(2)</span>
    mbap = struct.pack(<span class="hljs-string">&quot;&gt;HHHB&quot;</span>, tid &amp; <span class="hljs-number">0xFFFF</span>, <span class="hljs-number">0</span>, ____, unit)   <span class="hljs-comment"># ช่อง B: len = นับไบต์ที่ตามหลังช่องนี้</span>
    <span class="hljs-keyword">return</span> mbap + pdu
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/core/practise/cp3_06_practise.py">core/practise/cp3_06_practise.py</a> · fc03_read() + fc06_write() (ตัดตอน)</div>
<div class="cols">
<div class="c55">
<div class="try">

<li>ดู <code>fc03_read()</code> เป็น <strong>ตัวอย่าง</strong> คู่กับภาพกรอบ 12 ไบต์: ช่อง 2 ไบต์ = <code>H</code> · ช่อง 1 ไบต์ = <code>B</code> · <code>&gt;</code> = big-endian</li>
<li>ผู้สอนเติม <strong>ช่อง A</strong> (รูปแบบของ PDU 5 ไบต์) ให้ดูสด → ทุกทีมเติม <strong>ช่อง B</strong> (len = นับไบต์ที่ตามหลังช่องนี้)</li>
<li>รัน → ไฟล์ตรวจ <strong>3 กรอบ</strong> ก่อนเปิดจอ · ผ่านครบ = Console ขึ้น <strong>&quot;ผ่าน!&quot;</strong> แล้วกด SW5 / SW6 ดูกรอบบนจอ</li>

<h2 id="%F0%9F%93%8C-%E0%B8%81%E0%B8%8E%E0%B8%82%E0%B8%AD%E0%B8%87-part-3"><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f4cc.svg" data-marp-twemoji=""/> กฎของ Part 3</h2>
<div class="rule">
<p>สถานะหนึ่ง ภาษาเดียว · ส่งเมื่อเปลี่ยน + ส่งว่ายังอยู่ · ทุกคำสั่งต้องมีคำยืนยันและทางถอยที่ปลอดภัย</p>
</div>
<ul>
<li><strong>ภาษาเดียว:</strong> ไฟ จอ เสียง และแอป บอกสถานะเดียวกันด้วยสี จังหวะ และเสียงชุดเดียว · เตือนเท่าที่จำเป็น ไม่งั้นคนเลิกฟัง</li>
<li><strong>ส่งเมื่อเปลี่ยน + ส่งว่ายังอยู่:</strong> ประหยัดเน็ตและแบต แต่ปลายทางยังแยก &quot;ค่านิ่ง&quot; กับ &quot;บอร์ดตาย&quot; ได้</li>
<li><strong>คำยืนยัน + ทางถอย:</strong> เงียบไม่ใช่สำเร็จ · ไม่รู้ = ปิดไว้ก่อน · และให้ PLC มีด่านป้องกันของตัวเองอีกชั้นเสมอ</li>
</ul>
<div class="think">
<p><strong>การ์ดออกแบบของกลุ่ม ช่อง &quot;ทำ&quot;:</strong> สถานะมีกี่ระดับ ใช้สี/จังหวะ/เสียงอะไร · ส่งอะไร เมื่อไร heartbeat กี่วิ · คำสั่งไหนต้องรอคำยืนยัน ถ้าไม่มาจะถอยไปทางไหน?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="63" style="--paginate:true;--theme:default;" data-marpit-pagination-total="85">

<h2 id="%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%AA%E0%B8%A1%E0%B8%AD%E0%B8%87-python-%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87--lvgl-%E0%B8%A7%E0%B8%B2%E0%B8%94%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B8%88%E0%B8%B3">สองสมอง: Python สั่ง · LVGL วาดและจำ</h2>
<p><img src="img/core/p4_two_brains.svg" alt="" style="width:1000px;" /></p>
<ul>
<li>Python บน <strong>CM33</strong> แค่ <strong>สั่ง</strong> · LVGL บน <strong>CM55</strong> <strong>วาดและจำวิดเจ็ตไว้เอง</strong> → สร้างครั้งเดียว แล้วส่งไปเฉพาะค่าที่เปลี่ยน</li>
<li>แตะจอ = เหตุการณ์เข้า <strong>คิว 16 ช่อง</strong> · คิวเต็มแล้ว <strong>ของใหม่หาย</strong> · <code>ui.poll()</code> ได้ครั้งละ <strong>≤ 8</strong> → เรียกทุก 20–50 ms และดึงจนคิวว่าง (500 ms ใช้กับการอัปเดตตัวเลขบนจอเท่านั้น)</li>
<li><strong>ไม่มี callback</strong> · คำสั่ง <code>ui</code> ครั้งแรก <strong>พักงานส่งค่าเซนเซอร์เบื้องหลัง</strong> ของเฟิร์มแวร์ → อ่านเซนเซอร์เองในลูป</li>
</ul>
</section>
