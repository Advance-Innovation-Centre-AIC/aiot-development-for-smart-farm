<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">calibrate_radar</span>():
    <span class="hljs-comment"># radar_config(0) = จำ &quot;ฉากนิ่ง&quot; ใหม่ (ต้องไม่มีใครขยับหน้าบอร์ด)</span>
    <span class="hljs-comment"># แล้วตั้งเกณฑ์ THRESH_DB: ของที่แรงกว่าฉากนิ่งเท่านี้ถึงนับเป็นเป้า</span>
    <span class="hljs-keyword">try</span>:
        sensors.radar_config(<span class="hljs-number">0</span>)
        time.sleep_ms(<span class="hljs-number">500</span>)
        sensors.radar_config(THRESH_DB)
        <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
    <span class="hljs-keyword">except</span> OSError:

</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_01_pen_guard.py">sf3_01_pen_guard.py</a> · calibrate_radar()</div>

<h2 id="%E0%B9%80%E0%B8%9A%E0%B8%B7%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B9%80%E0%B8%A3%E0%B8%94%E0%B8%B2%E0%B8%A3%E0%B9%8C-%E0%B8%A7%E0%B8%B9%E0%B8%9A-%E0%B8%AA%E0%B8%AD%E0%B8%87%E0%B8%8A%E0%B8%B1%E0%B9%89%E0%B8%99--%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%81%E0%B8%A5%E0%B8%B2%E0%B8%87-5-%E0%B8%84%E0%B9%88%E0%B8%B2--%E0%B8%A2%E0%B8%B7%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%99-3-%E0%B8%A3%E0%B8%AD%E0%B8%9A">เบื้องหลัง: กันเรดาร์ &quot;วูบ&quot; สองชั้น — ค่ากลาง 5 ค่า + ยืนยัน 3 รอบ</h2>
<svg viewBox="0 0 1000 290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <line x1="60" y1="250" x2="950" y2="250" stroke="#b0bec5" />

  <g font-size="16" font-weight="700" fill="#fff" text-anchor="middle">

<ul>
<li><strong>ชั้นที่ 1 <code>smooth()</code>:</strong> เรียง 5 ค่าล่าสุดแล้วหยิบ <strong>ตัวกลาง</strong> — ค่าวูบเดียวไม่มีทางเป็นตัวกลาง</li>
<li><strong>ชั้นที่ 2 <code>confirm()</code>:</strong> เข้าเขตแล้วต้องอยู่ <strong><code>CONFIRM_N = 3</code> รอบติดกัน</strong> (ราว 0.75 วิ) ถึงนับว่าบุกรุก — ถ้าไม่มีสองชั้นนี้ จุดสีส้มจะทำให้ไซเรนดังผิด</li>
</ul>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B8%A2%E0%B8%B2%E0%B8%A1%E0%B9%80%E0%B8%9D%E0%B9%89%E0%B8%B2%E0%B8%84%E0%B8%AD%E0%B8%81">กิจกรรม 1 — ยามเฝ้าคอก</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> เรดาร์นับผู้บุกรุกเข้าคอก เชื่อเมื่อเห็นซ้ำ และปิดระบบได้ตอนเจ้าของเข้าเอง</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>รันไฟล์ ตอนจอนับถอยหลัง 3-2-1 <strong>ทุกคนถอยห่างหน้าบอร์ด</strong> (บอร์ดกำลังจำ &quot;ฉากนิ่ง&quot;)</li>
<li>เดินเข้าหาบอร์ดช้า ๆ จนจอขึ้น <strong>&quot;มีผู้บุกรุก!&quot;</strong> ไซเรนดัง จอไฟ RGB วิ่ง <strong>INTRUDER</strong> สีแดง</li>
<li>หมุน <strong>VR3</strong> ตั้งเขตเตือน 50–250 cm · กด <strong>SW5 (ปุ่มล่าง)</strong> หรือแตะสวิตช์บนจอ = <strong>ปิดระบบเฝ้า</strong> แล้วเดินเข้าไปอีกครั้ง</li>
<li>วัดระยะจริงด้วยตลับเมตร 0.5 / 1.0 / 1.5 / 2.0 ม. เทียบเลขบนจอ → จดลงใบงาน</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/s3_pen_guard_safe.png" alt="" style="width:640px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator (ค่าจำลอง: ลูกบิด VR1 ของแผง Emulator แทนระยะเป้า = 171 cm · เขตเตือน VR3 = 130 cm) · ไฟส้ม "การเคลื่อนไหว" = presence จาก radar() · กราฟล่าง: ฟ้า = ระยะเป้า แดง = เขตเตือน</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="10" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%81%E0%B8%A5%E0%B8%B2%E0%B8%87--%E0%B8%A2%E0%B8%B7%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%99-n-%E0%B8%84%E0%B8%A3%E0%B8%B1%E0%B9%89%E0%B8%87">กิจกรรม 1 — หัวใจของโค้ด: ค่ากลาง + ยืนยัน N ครั้ง</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">smooth</span>(<span class="hljs-params">hist, cm</span>):
    <span class="hljs-comment"># median 5 ค่า กันเรดาร์กระโดดข้ามเฟรมจากคลื่นสะท้อนหลายทาง</span>
    hist.append(cm)
    <span class="hljs-keyword">if</span> <span class="hljs-built_in">len</span>(hist) &gt; <span class="hljs-number">5</span>:
        hist.pop(<span class="hljs-number">0</span>)
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">sorted</span>(hist)[<span class="hljs-built_in">len</span>(hist) // <span class="hljs-number">2</span>]
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">confirm</span>(<span class="hljs-params">inside, streak, near</span>):
    <span class="hljs-comment"># สถานะใหม่ต้องยืนครบ CONFIRM_N รอบติดกันถึงจะเชื่อ</span>
    <span class="hljs-comment"># คืน (สถานะที่เชื่อแล้ว, จำนวนรอบที่เห็นสถานะใหม่ติดกัน)</span>
    <span class="hljs-keyword">if</span> near == inside:
        <span class="hljs-keyword">return</span> inside, <span class="hljs-number">0</span>
    <span class="hljs-keyword">if</span> streak + <span class="hljs-number">1</span> &gt;= CONFIRM_N:
        <span class="hljs-keyword">return</span> near, <span class="hljs-number">0</span>
    <span class="hljs-keyword">return</span> inside, streak + <span class="hljs-number">1</span>
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_01_pen_guard.py">sf3_01_pen_guard.py</a> · smooth() และ confirm() ในส่วน "3) สมอง"</div>
<ul>
<li>เห็น <strong>เหมือนเดิม</strong> → ล้างตัวนับเป็น 0 · เห็น <strong>ต่าง</strong> → นับเพิ่ม · ครบ <code>CONFIRM_N</code> → <strong>เปลี่ยนสถานะ</strong></li>
<li>ใช้ทั้ง &quot;เข้า&quot; และ &quot;ออก&quot; — ออกจากเขตก็ต้องยืนยัน 3 รอบเหมือนกัน</li>
</ul>
</div>
<div class="shot">
<p><img src="img/s3_pen_guard_intruder.png" alt="" style="width:470px;" /></p>
<div class="cap">ค่าจำลอง (Emulator): หมุน VR1 ให้เป้าเข้ามาที่ ~40 cm → ยืนยันครบ → "มีผู้บุกรุก!" ตัวนับ = 1 · บันทึกผู้บุกรุกรายแรกที่ระยะ 40 cm</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="11" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-1--%E0%B8%97%E0%B8%94%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%80%E0%B8%95%E0%B8%B7%E0%B8%AD%E0%B8%99%E0%B8%9C%E0%B8%B4%E0%B8%94-confirm_n--1-%E0%B8%81%E0%B8%B1%E0%B8%9A-3">กิจกรรม 1 — ทดลองเตือนผิด: <code>CONFIRM_N</code> = 1 กับ 3</h2>
<div class="cols">
<div>
<p><strong>เดินผ่านหน้าบอร์ดเร็ว ๆ 5 รอบ (ไม่หยุด)</strong> แล้วแก้ <code>CONFIRM_N</code> ในส่วน <code># ---- 1) ตั้งค่า (แก้ได้) ----</code> รันใหม่</p>
<table>
<thead>
<tr>
<th><code>CONFIRM_N</code></th>
<th>เดินผ่าน 5 รอบ นับได้</th>
<th>ยืนนิ่ง 10 วิ ยังนับว่าอยู่ไหม</th>
<th>เตือนช้าลงราว</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td></td>
<td>☐ ใช่ ☐ ไม่</td>
<td>N × 0.25 วิ = ___</td>
</tr>
<tr>
<td>3</td>
<td></td>
<td>☐ ใช่ ☐ ไม่</td>
<td>N × 0.25 วิ = ___</td>
</tr>
</tbody>
</table>
<div class="think">
<p><strong>คิด:</strong> เรดาร์ละเอียดราว <strong>0.33 ม./ช่อง</strong> ถ้าเจ้าของฟาร์มขอ &quot;เตือนเมื่อเข้าใกล้กว่า <strong>1.10 ม.</strong>&quot; เราจะตอบเขาว่าอะไร? · ทำไมปุ่มเปิด/ปิดระบบเฝ้า (<strong>SW5</strong>) ต้องอยู่ <strong>บนบอร์ด</strong> ไม่ใช่อยู่บนแอปอย่างเดียว?</p>
</div>
</div>
<div class="c40">
<p><strong>ตาคุณ (ท้ายไฟล์)</strong></p>
<ul>
<li>นับผู้บุกรุกเฉพาะตอนเรดาร์บอกว่า <strong>&quot;มีการเคลื่อนไหว&quot;</strong> ด้วย (ส่ง <code>moving</code> เข้า <code>in_zone()</code>) แล้วลองยืนนิ่ง — แบบไหนเหมาะกับ <strong>คอกวัวตอนกลางคืน</strong>?</li>
<li>ให้ <strong>SW6 (ปุ่มบน)</strong> = <code>Button(1)</code> ล้างตัวนับ — อย่าลืมใส่ปุ่มใหม่ใน <code>wait_ms</code> ด้วย</li>
</ul>
<div class="warn">
<p>ความละเอียด &quot;เป็นช่อง&quot; ไม่ใช่ข้อบกพร่องของโค้ด — เป็นธรรมชาติของเรดาร์ ออกแบบเขตเตือนให้กว้างกว่าหนึ่งช่องเสมอ</p>
</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-class="sec" data-theme="default" lang="C" class="sec" data-marpit-pagination="12" style="--paginate:true;--class:sec;--theme:default;" data-marpit-pagination-total="48"><div class="when">0:25 – 0:40 · 15 นาที</div>
<h1 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B8%AB%E0%B8%B9%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B9%80%E0%B8%A5%E0%B9%89%E0%B8%B2%E0%B9%84%E0%B8%81%E0%B9%88-%E0%B9%84%E0%B8%A1%E0%B8%84%E0%B9%8C">กิจกรรม 2 — หูฟังเล้าไก่ (ไมค์)</h1>
<div class="lead">นับเหตุการณ์ในช่วงเวลา แทนการเตือนทุกเสียงดัง</div>
<div class="flow"><b>ไมค์ฟังยอดเสียง</b><i>→</i><b>เกินเกณฑ์ VR3</b><i>→</i><b>นับใน 30 วินาที</b><i>→</i><b>PANIC บนจอไฟ RGB</b></div>
<div class="files one"><div><div class="fh">★ ทำในห้อง</div><div class="f"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_02_coop_ears.py">sf3_02_coop_ears.py</a> <span>— นับเสียงดังฉับพลันในเล้า</span></div><div class="f"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/practise/sf3_02_practise.py">sf3_02_practise.py</a> <span>— Code Quest ระดับ 3 · เติม is_event()</span></div></div></div>
<div class="chal">🏆 <b>ท้าทาย:</b> หาเกณฑ์ VR3 ที่ <b>ไม่นับเสียงคุย</b> แต่ <b>นับเสียงตบมือทุกครั้ง</b> — กลุ่มไหนหาได้ก่อน?</div>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B8%AB%E0%B8%B9%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B9%80%E0%B8%A5%E0%B9%89%E0%B8%B2%E0%B9%84%E0%B8%81%E0%B9%88">กิจกรรม 2 — หูฟังเล้าไก่</h2>
<div class="cols">
<div class="c45">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> นับ &quot;เสียงดังฉับพลัน&quot; ในเล้า แล้วเตือนเมื่อถี่ผิดปกติ</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong> (ต้องใช้ <strong>บอร์ดจริง</strong>)</p>
<ol>
<li>รันไฟล์ ดู <strong>ความดัง 0–100</strong> · <strong>ยอดเสียงดิบ</strong> เทียบเกณฑ์ · แถวล่างของจอไฟ RGB = ความดัง</li>
<li>จดค่า: ห้องเงียบ · คุยปกติ · ตบมือ 1 ครั้งห่าง 1 ม. · เคาะโต๊ะ</li>
<li>หมุน <strong>VR3</strong> ให้เส้นแดงในกราฟอยู่ <strong>เหนือยอดเสียงคุย</strong> แต่ <strong>ต่ำกว่ายอดเสียงตบมือ</strong> — จดเลขเกณฑ์</li>
<li>ตบมือ 5–6 ครั้ง ห่างกันราวครึ่งวินาที → <strong>PANIC</strong> สีแดงวิ่ง · เงียบแล้วกลับปกติภายในกี่วินาที? (ดู <code>WINDOW_MS</code>)</li>
<li><strong>ลำโพงหลอกไมค์:</strong> ตั้ง <code>MUTE_MS = 0</code> แล้วทำให้เตือน — เสียงเตือนของบอร์ดถูกนับไหม?</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/s3_coop_ears_quiet.png" alt="" style="width:600px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator — ใช้ดู <b>หน้าจอ</b> เท่านั้น: เสียงใน Emulator เป็นสัญญาณสังเคราะห์ (ยอด 112 ต่ำกว่าเกณฑ์ ~11,000 จึงไม่นับ) ตบมือใส่คอมพิวเตอร์ไม่มีผล</div>
</div>
</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-2--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%99%E0%B8%B1%E0%B8%9A%E0%B9%80%E0%B8%AB%E0%B8%95%E0%B8%B8%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%93%E0%B9%8C%E0%B9%83%E0%B8%99%E0%B8%8A%E0%B9%88%E0%B8%A7%E0%B8%87%E0%B9%80%E0%B8%A7%E0%B8%A5%E0%B8%B2">กิจกรรม 2 — หัวใจของโค้ด: นับเหตุการณ์ในช่วงเวลา</h2>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">is_event</span>(<span class="hljs-params">peak, th, now, last, mute_until</span>):
    <span class="hljs-comment"># นับเป็น &quot;เสียงดังฉับพลัน&quot; เมื่อ: พ้นช่วงปิดหู, ยอดถึงเกณฑ์, และห่างครั้งก่อนพอ</span>
    <span class="hljs-keyword">return</span> (time.ticks_diff(now, mute_until) &gt;= <span class="hljs-number">0</span> <span class="hljs-keyword">and</span> peak &gt;= th
            <span class="hljs-keyword">and</span> time.ticks_diff(now, last) &gt;= EVENT_GAP_MS)


<span class="hljs-keyword">def</span> <span class="hljs-title function_">forget_old</span>(<span class="hljs-params">events, now</span>):
    <span class="hljs-comment"># ลืมเหตุการณ์ที่เก่ากว่า 30 วินาที เหลือเฉพาะที่อยู่ในหน้าต่างเวลา</span>
    <span class="hljs-keyword">while</span> events <span class="hljs-keyword">and</span> time.ticks_diff(now, events[<span class="hljs-number">0</span>]) &gt; WINDOW_MS:
        events.pop(<span class="hljs-number">0</span>)
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_02_coop_ears.py">sf3_02_coop_ears.py</a> · is_event() และ forget_old() ในส่วน "3) สมอง"</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">            forget_old(ears.events, now)             <span class="hljs-comment"># 2) ตัดสิน</span>
            was, panic = panic, <span class="hljs-built_in">len</span>(ears.events) &gt;= ALARM_EVENTS
            <span class="hljs-keyword">if</span> panic != was:                         <span class="hljs-comment"># 3) ทำ: เสียงเฉพาะตอนสถานะเปลี่ยน</span>
                beep(<span class="hljs-number">84</span>, <span class="hljs-number">76</span>) <span class="hljs-keyword">if</span> panic <span class="hljs-keyword">else</span> beep(<span class="hljs-number">79</span>, <span class="hljs-number">84</span>)
                ears.mute()                          <span class="hljs-comment"># ทุกครั้งที่ลำโพงดัง = ปิดหู MUTE_MS</span>
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_02_coop_ears.py">sf3_02_coop_ears.py</a> · main()</div>
</div>
<div>
<ul>
<li><code>events</code> = <strong>รายการเวลา</strong> ของเสียงดังแต่ละครั้ง · <code>len(events)</code> = จำนวนในหน้าต่าง</li>
<li><code>time.ticks_diff()</code> ใช้เทียบเวลาเสมอ (ตัวนับ ms ของบอร์ดวนกลับได้ ห้ามลบกันตรง ๆ)</li>
<li><strong>เสียงเฉพาะตอนสถานะเปลี่ยน</strong> + <strong>ปิดหูทุกครั้งที่ลำโพงดัง</strong> — สองกฎนี้คู่กัน</li>
</ul>
<div class="think">
<p><strong>คิด:</strong> เล้าจริงมีเสียงที่ไม่อันตราย (ฝนตกบนหลังคา รถไถผ่าน) จะเพิ่มกฎอะไร ให้ระบบ <strong>ไม่ปลุกเจ้าของฟาร์มตอนตีสาม</strong> โดยไม่จำเป็น?</p>
</div>
</div>
</div>

  <line x1="60" y1="190" x2="950" y2="190" stroke="#f5a623" stroke-width="2.5" stroke-dasharray="9 6" />

  <text x="954" y="186" text-anchor="end" font-size="14" fill="#e65100">× K_WARN 3 = เฝ้าระวัง</text>
  <text x="954" y="126" text-anchor="end" font-size="14" fill="#c62828">× K_BAD 6 = ผิดปกติ</text>
  <path d="M60.0 233.7 L71.0 229.4 L82.0 231.8 L93.0 228.5 L104.0 228.2 L115.0 236.1 L126.0 236.8 L137.0 225.3 L148.0 233.4 L159.0 233.7 L170.0 223.1 L181.0 230.4 L192.0 225.3 L203.0 230.3 L214.0 228.1 L225.0 234.9 L236.0 228.1 L247.0 224.8 L258.0 229.7 L269.0 226.6 L280.0 227.6 L291.0 236.1 L302.0 226.4 L313.0 228.7 L324.0 232.8 L335.0 236.6 L346.0 224.9 L357.0 230.4 L368.0 226.9 L379.0 224.7 L390.0 227.0 L401.0 224.1 L412.0 160.0 L423.0 160.0 L434.0 230.8 L445.0 223.9 L456.0 224.7 L467.0 235.6 L478.0 235.1 L489.0 234.0 L500.0 223.5 L511.0 230.9 L522.0 228.2 L533.0 232.8 L544.0 229.9 L555.0 231.6 L566.0 232.1 L577.0 228.8 L588.0 228.8 L599.0 224.3 L610.0 227.5 L621.0 224.0 L632.0 66.4 L643.0 102.8 L654.0 67.6 L665.0 85.0 L676.0 100.7 L687.0 84.8 L698.0 107.2 L709.0 66.4 L720.0 74.8 L731.0 103.4 L742.0 76.2 L753.0 108.1 L764.0 108.0 L775.0 95.4 L786.0 66.9 L797.0 66.1 L808.0 106.6 L819.0 228.6 L830.0 236.6 L841.0 234.2 L852.0 231.3 L863.0 228.5 L874.0 234.8 L885.0 236.4 L896.0 224.9 L907.0 232.6 L918.0 223.6 L929.0 224.4 L940.0 231.7" fill="none" stroke="#1e88e5" stroke-width="3" />

  <text x="60" y="272" font-size="14" fill="#546e7a">เส้นฟ้า = ค่าสั่น · ภาพประกอบแนวคิด ไม่ใช่ค่าจริง</text>

<ul>
<li>นี่คือ <strong>anomaly detection ด้วยกฎที่เขียนเอง</strong>: จำ &quot;ปกติ&quot; ของเครื่องเราเอง แล้วจับสิ่งที่ <strong>ต่างไปหลายเท่า</strong></li>
<li>ระดับใหม่ต้องค้าง <strong><code>CONFIRM_N = 10</code> ตัวอย่าง</strong> (10 × 50 ms = 0.5 วิ) ถึงเชื่อ · <code>MIN_BASE = 0.05</code> กันบอร์ดนิ่งสนิทได้ค่าปกติเป็นศูนย์</li>
<li><strong>ข้อมูลตอนสอนสำคัญที่สุด:</strong> สอนตอนเพื่อนเคาะโต๊ะ → &quot;ปกติ&quot; สูงเกินจริง → ของเสียจริงก็ไม่เตือน</li>
</ul>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B8%AB%E0%B8%A1%E0%B8%AD%E0%B8%9F%E0%B8%B1%E0%B8%87%E0%B8%9B%E0%B8%B1%E0%B9%8A%E0%B8%A1%E0%B8%99%E0%B9%89%E0%B8%B3">กิจกรรม 3 — หมอฟังปั๊มน้ำ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> ให้บอร์ดเรียนรู้การสั่นปกติ แล้วให้คะแนนการสั่น 0–100</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>5 วินาทีแรก <strong>วางบอร์ดนิ่ง</strong> (แถบส้ม = กำลังเรียน → เขียว = ได้ค่าปกติ) · จดค่าปกติ</li>
<li><strong>เคาะโต๊ะเบา ๆ</strong> → ควรยัง &quot;ปกติ&quot; · <strong>เขย่าแรง ๆ</strong> → &quot;ผิดปกติ!&quot; เสียงเตือน ตัวนับบนจอไฟ RGB +1</li>
<li>กด <strong>SW5 (ปุ่มล่าง)</strong> = เรียนรู้ใหม่ — ระหว่างนั้นให้เพื่อน <strong>เคาะโต๊ะตลอด</strong> · เขย่าแรงเท่าเดิมยังเตือนไหม?</li>
</ol>
</div>
</div>
<div class="shot">
<p><img src="img/s3_pump_vibration_learned.png" alt="" style="width:330px;" /> <img src="img/s3_pump_vibration_shake.png" alt="" style="width:330px;" /></p>
<p><img src="img/s3_pump_vibration_shake_matrix.png" alt="" style="width:200px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator (ค่าจำลอง): ซ้าย วางนิ่ง ค่าสั่น 0.014 — ค่าปกติถูกยกขึ้นเป็น MIN_BASE 0.050 · ขวา กดปุ่ม Shake ของ Emulator → 3.331 = ผิดปกติ · ล่าง จอไฟ RGB: เลข 1 = ผิดปกติ 1 ครั้ง แถวล่าง = แถบคะแนน</div>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="21" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-3--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%82%E0%B8%99%E0%B8%B2%E0%B8%94-%E2%86%92-%E0%B8%A3%E0%B8%B0%E0%B8%94%E0%B8%B1%E0%B8%9A-%E2%86%92-%E0%B8%A2%E0%B8%B7%E0%B8%99%E0%B8%A2%E0%B8%B1%E0%B8%99">กิจกรรม 3 — หัวใจของโค้ด: ขนาด → ระดับ → ยืนยัน</h2>
<div class="cols">
<div class="c60">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">magnitude</span>():
    <span class="hljs-comment"># ขนาดความเร่งรวมสามแกน (m/s^2) วางนิ่งได้ราว 9.8 คือแรงโน้มถ่วง</span>
    <span class="hljs-comment"># ขนาดไม่เปลี่ยนตามมุมเอียง บอร์ดวางเอียงก็วัดการสั่นได้เหมือนวางราบ</span>
    <span class="hljs-comment"># อ่านไม่ได้ (บัสไม่ว่าง) คืน None แล้วข้ามตัวอย่างนั้นไป ไม่เดาค่าแทน</span>
    <span class="hljs-keyword">try</span>:
        ax, ay, az, _, _, _ = sensors.bmi270.motion()
    <span class="hljs-keyword">except</span> OSError:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">None</span>
    <span class="hljs-keyword">return</span> math.sqrt(ax * ax + ay * ay + az * az)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">classify</span>(<span class="hljs-params">vib, base</span>):
    <span class="hljs-comment"># 0 = ปกติ, 1 = เฝ้าระวัง (เกิน K_WARN เท่าของปกติ), 2 = ผิดปกติ (เกิน K_BAD เท่า)</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">2</span> <span class="hljs-keyword">if</span> vib &gt; base * K_BAD <span class="hljs-keyword">else</span> (<span class="hljs-number">1</span> <span class="hljs-keyword">if</span> vib &gt; base * K_WARN <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>)
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_03_pump_vibration.py">sf3_03_pump_vibration.py</a> · magnitude() ในส่วน "2) ฮาร์ดแวร์" · classify() ในส่วน "3) สมอง"</div>
</div>
<div class="c40">
<p><strong><code>Watch.judge()</code></strong> — &quot;ระดับใหม่ต้องค้าง <code>CONFIRM_N</code> ตัวอย่างติดกันถึงจะเชื่อ (เคาะทีเดียวไม่ถือว่าเครื่องเสีย)&quot; · เปลี่ยนเป็น &quot;ผิดปกติ&quot; เมื่อไร <code>bad_count</code> +1</p>
<ul>
<li>ตัวเลข <strong>เกณฑ์เป็น &quot;เท่าของปกติ&quot;</strong> ไม่ใช่ค่าตายตัว → ใช้ได้กับปั๊มเล็กหรือใหญ่</li>
<li>ยืนยัน N ครั้ง <strong>ตัวเดียวกับกิจกรรม 1</strong> แค่เขียนในรูป class</li>
</ul>
</div>
</div>
</section>

<h2 id="%E0%B9%80%E0%B8%A1%E0%B8%99%E0%B8%B9-edge-ai-%E0%B8%9A%E0%B8%99%E0%B8%88%E0%B8%AD%E0%B8%9A%E0%B8%AD%E0%B8%A3%E0%B9%8C%E0%B8%94--%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%A1%E0%B9%80%E0%B8%94%E0%B8%A5%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%82%E0%B8%94%E0%B8%A2%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%80%E0%B8%82%E0%B8%B5%E0%B8%A2%E0%B8%99%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94">เมนู Edge AI บนจอบอร์ด — ลองโมเดลได้โดยไม่เขียนโค้ด</h2>
<div class="flow"><b>หน้าแรก → การ์ด Edge AI</b><i>→</i><b>เลือกโมเดลในรายการ</b><i>→</i><b>กด Load</b><i>→</i><b>ดูผลสด</b><i>→</i><b>กด Stop</b></div>
<div class="cols">
<div>
<div class="try">
<p><strong>ลองทำ (3 นาที)</strong></p>
<ol>
<li>หน้าแรกของบอร์ด แตะการ์ด <strong>Edge AI</strong> (ไอคอนชิปสีม่วง)</li>
<li>แตะรายการโมเดล — แต่ละแถวเป็น <strong>ชื่อ (IMU / Microphone / Radar)</strong> · เรียงตามเซนเซอร์ IMU ก่อน · โมเดลจาก Store อยู่ <strong>ต่อจากโมเดลในตัว</strong> ของเซนเซอร์เดียวกัน (ยังไม่เห็น → ออกจากเมนูแล้วเปิดใหม่)</li>
<li>เลือก <strong>AnomalousVibration</strong> (ยังไม่ได้ส่ง → เลือก <strong>Motion Detection</strong>) แล้วกดปุ่มเขียว <strong>Load</strong> · ป้ายสถานะ STOPPED → LOADING → <strong>RUNNING</strong></li>
<li>วางนิ่ง → เคาะโต๊ะ → เขย่า · จดคลาสที่ชนะ และ <strong>inference: … ms</strong> (เวลาคิดต่อครั้ง)</li>
<li>กดปุ่มเดิมซึ่งตอนนี้เป็น <strong>Stop</strong> สีแดง</li>
</ol>
</div>
</div>
<div>
<p><strong>อ่านหน้าจอ</strong></p>
<ul>
<li>ป้ายใหญ่: <strong>warming up...</strong> → ชื่อคลาสที่ชนะ (ถ้าได้ ≥ 50 %) หรือ <strong>-- not sure --</strong></li>
<li>ทุกคลาสมีแถบ + <strong>NN%</strong> · ถ้า unlabeled ชนะ ป้ายใหญ่เขียนว่า <strong>no event</strong></li>
<li>ขึ้น <strong>FAILED</strong> → กด Load อีกครั้ง ถ้ายังไม่ได้ แจ้งผู้สอน</li>
</ul>
<div class="warn">
<p><strong>ออกจากหน้านี้ โมเดลยังรันต่อ</strong> — อยากหยุดต้องกด Stop · ถ้ารันไฟล์ <code>.py</code> ที่เรียก <code>edge_ai.select()</code> หน้านี้จะเปลี่ยนไปแสดงโมเดลที่โปรแกรมเลือก</p>
</div>
</div>
</div>
<div class="src">ป้ายบนจอเป็นภาษาอังกฤษตามเฟิร์มแวร์ของบอร์ด · ปุ่ม <b>Unload</b> ขึ้นเฉพาะโมเดลจาก Store ตอนไม่ได้รัน: เอาออกจากหน่วยความจำ แต่ไม่ลบไฟล์ที่บันทึกไว้บนบอร์ด</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="26" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="edge-ai--%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B3">Edge AI — ลองทำ</h2>
<div class="cols">
<div class="c40">
<div class="goal">
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>เป้าหมาย:</strong> ให้ AI บนบอร์ดตัดสินแทนกฎ แล้วดูว่ามัน &quot;มั่นใจ&quot; แค่ไหน</p>
</div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>กด <strong>Stop</strong> ในเมนู Edge AI ก่อน (ถ้ายังรันอยู่) แล้วรันไฟล์ จอขึ้น <strong>ชื่อโมเดล</strong> และ <strong>ชื่อคลาส</strong>: <strong>AnomalousVibration</strong> (unlabeled · anomaly) หรือ <strong>Motion Detection</strong> ในตัว (idle · circle · shaking) · ถ้าจอบอก <strong>&quot;ไม่พบโมเดล&quot;</strong> → ทำเฉพาะคอลัมน์ &quot;กฎ&quot; ในตารางแข่งห้าท่า แล้วแจ้งผู้สอน</li>
<li><strong>วางนิ่ง → ถือวาดวงกลมช้า ๆ → เขย่าแรง ๆ</strong> ดูวงแหวนความมั่นใจ แถบคะแนนทุกคลาส แท่งบนจอไฟ RGB</li>
<li>จด <strong>&quot;ใช้เวลาคิด&quot;</strong> (latency) ต่อหนึ่งคำตอบ</li>
<li>จอบอก <strong>&quot;ผลไม่ขยับ ลองรีเซ็ตบอร์ด&quot;</strong> → กด RESET แล้วรันใหม่</li>
</ol>
</div>
<div class="src">ของที่ใช้: แกน AI บนชิป (<code>edge_ai</code>) + IMU · ไฟ LED สีแดงบนโมดูล SoM หาจากชื่อ <code>RGB_RED</code> = ไฟเตือน · ลำโพงดังเฉพาะตอนเริ่ม/หายเตือน</div>
</div>
<div class="shot">
<p><img src="img/s3_ai_doctor_idle.png" alt="" style="width:330px;" /> <img src="img/s3_ai_doctor_shaking.png" alt="" style="width:330px;" /></p>
<p><img src="img/s3_ai_doctor_shaking_matrix.png" alt="" style="width:200px;" /></p>
<div class="cap">ภาพจาก BENTO Emulator — <b>ผล AI ใน Emulator เป็นผลจำลอง ไม่ใช่โมเดลจริง</b> และเวลาคิดไม่ใช่ของบอร์ดจริง · ซ้าย วางนิ่ง → idle มั่นใจ 96 % · ขวา กด Shake → shaking ชนะแต่มั่นใจแค่ 50 % ต่ำกว่า CONF_MIN 60 จึง <b>ยังไม่นับ</b> (อันตรายติดกัน 0/3) · ล่าง จอไฟ RGB แท่งละคลาส แท่งที่ชนะเป็นสีเขียว</div>

<h2 id="edge-ai--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%AB%E0%B8%B2%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD--%E0%B8%A1%E0%B8%B1%E0%B9%88%E0%B8%99%E0%B9%83%E0%B8%88%E0%B8%9E%E0%B8%AD%E0%B9%84%E0%B8%AB%E0%B8%A1--%E0%B8%8A%E0%B8%99%E0%B8%B0%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%81%E0%B8%B1%E0%B8%99%E0%B9%84%E0%B8%AB%E0%B8%A1">Edge AI — หัวใจของโค้ด: หาด้วยชื่อ · มั่นใจพอไหม · ชนะติดกันไหม</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">find_models</span>(<span class="hljs-params">keys</span>):
    <span class="hljs-comment"># หาโมเดลจาก &quot;ชื่อ&quot; ตามลำดับใน keys เพราะลำดับบนแต่ละบอร์ดไม่เหมือนกัน (เปลี่ยนได้หลังรีบูต)</span>
    <span class="hljs-comment"># คืนรายการ (ลำดับ, ชื่อ, ชื่อคลาส) ทุกตัวที่ชื่อตรง ตัวแรกเลือกไม่สำเร็จ main() จะลองตัวถัดไป</span>
    <span class="hljs-keyword">try</span>:
        ms = edge_ai.models()
    <span class="hljs-keyword">except</span> Exception:
        <span class="hljs-keyword">return</span> []               <span class="hljs-comment"># แกน AI ไม่ตอบ = ถือว่าไม่พบ</span>
    <span class="hljs-keyword">return</span> [(m[<span class="hljs-string">&quot;index&quot;</span>], m[<span class="hljs-string">&quot;name&quot;</span>], m[<span class="hljs-string">&quot;labels&quot;</span>]) <span class="hljs-keyword">for</span> key <span class="hljs-keyword">in</span> keys <span class="hljs-keyword">for</span> m <span class="hljs-keyword">in</span> ms <span class="hljs-keyword">if</span> key.lower() <span class="hljs-keyword">in</span> m[<span class="hljs-string">&quot;name&quot;</span>].lower()]
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_04_ai_pump_doctor.py">sf3_04_ai_pump_doctor.py</a> · find_models() ในส่วน "2) ฮาร์ดแวร์" · main() ลอง <code>edge_ai.select()</code> ทีละตัวจนสำเร็จ</div>
<div class="cols">
<div class="c55">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">is_danger</span>(<span class="hljs-params">label, conf</span>):
    <span class="hljs-keyword">return</span> label <span class="hljs-keyword">in</span> DANGER <span class="hljs-keyword">and</span> conf &gt;= CONF_MIN


<span class="hljs-keyword">def</span> <span class="hljs-title function_">alert_rule</span>(<span class="hljs-params">streak, alerting, danger</span>):
    <span class="hljs-comment"># เตือนเมื่ออันตรายชนะติดกัน CONFIRM_N ครั้ง (กันเตือนมั่วจากคำตอบเดียว)</span>
    <span class="hljs-comment"># หายเตือนเมื่อคำตอบกลับมาปลอดภัย</span>
    streak = streak + <span class="hljs-number">1</span> <span class="hljs-keyword">if</span> danger <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>
    <span class="hljs-keyword">if</span> streak &gt;= CONFIRM_N:
        <span class="hljs-keyword">return</span> streak, <span class="hljs-literal">True</span>
    <span class="hljs-keyword">return</span> streak, alerting <span class="hljs-keyword">and</span> streak &gt; <span class="hljs-number">0</span>
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_04_ai_pump_doctor.py">sf3_04_ai_pump_doctor.py</a> · is_danger() และ alert_rule() ในส่วน "3) สมอง"</div>
</div>
<div>
<p><strong>ค่าตั้งบนหัวไฟล์:</strong> <code>MODEL_KEYS = (&quot;AnomalousVibration&quot;, &quot;Motion&quot;)</code> · <code>CONF_MIN = 60</code> (%) · <code>CONFIRM_N = 3</code></p>
<ul>
<li>AI ไม่ได้ตัดสิน &quot;คนเดียว&quot; — คำตอบของมันผ่าน <strong>กฎของเราอีกชั้น</strong>: <strong>ความมั่นใจขั้นต่ำ</strong> (ตัวกันเตือนผิดอีกแบบ) + ชนะติดกัน</li>
<li>เรียกโมเดลด้วย <strong>ชื่อ</strong> เสมอ · <strong>ห้ามพิมพ์ทั้งแถวของ <code>edge_ai.models()</code></strong> เก็บแค่ชื่อ ลำดับ และคลาส</li>
<li>โมเดลที่ฟังไมค์: ไม่เชื่อผล <code>MUTE_MS</code> หลังบอร์ดส่งเสียงเอง (ลำโพงบอร์ดเข้าไมค์)</li>
</ul>
<div class="think">
<p><strong>ตาคุณ:</strong> ① ลด <code>CONFIRM_N</code> เหลือ 1 แล้วเขย่าเบา ๆ นับว่าเตือนมั่วกี่ครั้ง เทียบกับ 3 · ② เปลี่ยน <code>MODEL_KEYS</code> เป็น <code>(&quot;Cough&quot;,)</code> แล้วลองไอใส่บอร์ด — โมเดลนี้ฝึกจากเสียงไอ <strong>คน</strong> งานจริงในฟาร์มต้องฝึกจากเสียงในฟาร์ม</p>
</div>
</div>
</div>
</section>

<h2 id="%E0%B8%95%E0%B9%88%E0%B8%AD%E0%B8%A2%E0%B8%AD%E0%B8%94-%E0%B8%AA%E0%B9%88%E0%B8%87%E0%B8%9C%E0%B8%A5-ai-%E0%B8%82%E0%B8%B6%E0%B9%89%E0%B8%99-mqtt-%E0%B9%83%E0%B8%AB%E0%B9%89%E0%B9%81%E0%B8%AD%E0%B8%9B%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B5%E0%B8%A1--sf3_06">ต่อยอด: ส่งผล AI ขึ้น MQTT ให้แอปของทีม — <code>sf3_06</code></h2>
<div class="flow"><b>AI บนบอร์ดสรุปป้าย</b><i>→</i><b>ป้ายเปลี่ยน · ครบ 2 วิ</b><i>→</i><b>bento-aiot/&lt;TEAM&gt;/ai</b><i>→</i><b>แดชบอร์ด / mosquitto_sub</b></div>
<div class="cols">
<div>
<div class="try">
<p><strong>ลองทำ</strong></p>
<ol>
<li>แก้ <code>WIFI_SSID</code> <code>WIFI_PASS</code> และ <code>TEAM</code> (team01–team99 ตามที่ผู้สอนแจก · ยังเป็น teamXX = ไม่ต่อเน็ต พิมพ์ผลลง Console แทน)</li>
<li>รัน แล้วเปิด <a href="https://advance-innovation-centre-aic.github.io/aiot-development-for-smart-farm/apps/web-dashboard/">แดชบอร์ดของคอร์ส</a> หรือพิมพ์บนโน้ตบุ๊ก<br /><code>mosquitto_sub -h broker.hivemq.com -t 'bento-aiot/team05/ai' -v</code></li>
<li>วางนิ่ง 10 วิ <strong>นับข้อความ</strong> แล้วเขย่า ดูว่าป้ายใหม่มาเร็วแค่ไหน</li>
</ol>
</div>
<div class="src">ในข้อความหนึ่งใบ: <code>id</code> ทีม · <code>n</code> ลำดับ · <code>model</code> ชื่อโมเดล · <code>label</code> ป้าย · <code>conf</code> มั่นใจ % — ส่งแค่ <b>ผลสรุป</b> ไม่ส่งข้อมูลดิบ · ป้ายไม่เปลี่ยนก็ส่งซ้ำทุก 2 วิ (heartbeat) ให้แอปรู้ว่าบอร์ดยังอยู่</div>
</div>
<div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">should_send</span>(<span class="hljs-params">changed, since_ms</span>):
    <span class="hljs-comment"># ส่งเมื่อ: ห่างครั้งก่อนพอ และ (ป้ายต่างจากที่ส่งไปล่าสุด หรือ ถึงเวลา heartbeat)</span>
    <span class="hljs-comment"># ป้ายที่เปลี่ยนระหว่างรอช่วงห่าง 200 ms จะค้างไว้ แล้วส่งทันทีที่ครบช่วง ไม่หล่นหาย</span>
    <span class="hljs-keyword">if</span> since_ms &lt; GAP_MS:
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    <span class="hljs-keyword">return</span> changed <span class="hljs-keyword">or</span> since_ms &gt;= HEARTBEAT_MS
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_06_ai_to_mqtt.py">sf3_06_ai_to_mqtt.py</a> · should_send() ในส่วน "3) สมอง"</div>
<div class="think">
<p><strong>ตาคุณ:</strong> ① วางนิ่ง 10 วิ ควรได้กี่ข้อความ? ตั้ง <code>HEARTBEAT_MS = 10000</code> แล้วนับใหม่ · ② ตั้ง <code>HEARTBEAT_MS</code> กลับเป็น 2000 แล้วในแอปของทีม เพิ่มกฎ &quot;ไม่มีข้อความจาก .../ai เกิน 5 วิ = <strong>AI เงียบ</strong>&quot; · ③ เพิ่มคีย์ <code>&quot;danger&quot;: 1/0</code> ให้แอปใช้ง่ายขึ้น</p>
</div>
</div>
</div>
<div class="src">ใน BENTO Emulator MQTT เป็นแบบจำลอง · broker สาธารณะใช้ร่วมกันทั้งห้อง ไฟล์จึงไม่ส่งถี่กว่า 200 ms</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-4--%E0%B8%AB%E0%B9%89%E0%B8%B2%E0%B9%80%E0%B8%AA%E0%B8%B2%E0%B9%83%E0%B8%99%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7">กิจกรรม 4 — ห้าเสาในไฟล์เดียว</h2>
<div class="cols">
<div class="c60">
<table>
<thead>
<tr>
<th>เสา</th>
<th>ใน <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05_farm_all_in_one.py</code></a></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 · Smart HMI</strong></td>
<td>3 การ์ด <strong>โรงเรือน · แปลงผัก · คอกสัตว์</strong> + ปุ่มบนจอ <strong>&quot;ส่งรายงานเลย&quot;</strong> · จอไฟ RGB <strong>เขียว</strong> ปกติ · <strong>เหลือง</strong> มีเครื่องทำงาน · <strong>แดงวิ่ง INTRUDER</strong></td>
</tr>
<tr>
<td><strong>2 · เซนเซอร์</strong></td>
<td>อุณหภูมิ ความชื้น ความกดอากาศ · เรดาร์ที่คอก · <strong>ดิน = จำลองด้วย VR2</strong> (ต้องประกาศ) · hysteresis + ยืนยัน 3 รอบ</td>
</tr>
<tr>
<td><strong>3 · ปุ่มตั้งค่า</strong></td>
<td><strong>VR3</strong> = เกณฑ์พัดลม · <strong>VR4</strong> = เขตคอก 50–250 cm · <strong>SW5 (ล่าง) กดค้าง</strong> = รดน้ำเอง · <strong>SW6 (บน)</strong> = รับทราบผู้บุกรุก ปิดไซเรน</td>
</tr>
<tr>
<td><strong>4 · เสียง</strong></td>
<td>ดังเฉพาะตอนคอกเปลี่ยน กดรับทราบ หรือมีคำสั่งจากแอป</td>
</tr>
<tr>
<td><strong>5 · MQTT + แอป</strong></td>
<td><code>telemetry</code> ทุก 5 วิ · <code>event</code> intruder / clear · ฟัง <code>cmd</code> จากแอปของทีม</td>
</tr>
</tbody>
</table>
</div>
<div>
<p><strong>คำสั่งจากแอป</strong> → หัวข้อ <code>bento-aiot/&lt;TEAM&gt;/cmd</code></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-json"><span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;cmd&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;pump&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;on&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">1</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;sec&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">10</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;cmd&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;pump&quot;</span><span class="hljs-punctuation">,</span><span class="hljs-attr">&quot;on&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-number">0</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;cmd&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;beep&quot;</span><span class="hljs-punctuation">}</span>
<span class="hljs-punctuation">{</span><span class="hljs-attr">&quot;cmd&quot;</span><span class="hljs-punctuation">:</span><span class="hljs-string">&quot;ack&quot;</span><span class="hljs-punctuation">}</span>
</code></pre>
<p>รดน้ำไม่เกิน 30 วิต่อคำสั่ง · <code>&quot;on&quot;:0</code> = ปิดทันทีแม้ดินแห้ง และงดรดอัตโนมัติ 30 วิ (กด SW5 ค้างยังรดได้) · <code>beep</code> = เรียกเจ้าของ · <code>ack</code> = รับทราบผู้บุกรุก</p>
<div class="warn">
<p><strong>ยังไม่แก้ <code>TEAM</code> (หรือไม่ใช่ team01–team99) = ไม่ต่อเน็ตเลย</strong> ทำงานออฟไลน์ และจอบอก &quot;แก้ TEAM ก่อน&quot; — ถ้าหลายกลุ่มลืมแก้ client id จะชนกัน แล้ว broker เตะกันหลุด · broker สาธารณะไม่เข้ารหัส <strong>ห้ามส่งของลับ</strong></p>
</div>
</div>
</div>
</section>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-4--%E0%B8%A5%E0%B8%AD%E0%B8%87%E0%B8%97%E0%B8%B3">กิจกรรม 4 — ลองทำ</h2>
<div class="cols">

<ol>
<li>แก้ <code>WIFI_SSID</code> <code>WIFI_PASS</code> <code>TEAM</code> ให้เหมือน Session 2 แล้วรัน → แถบสถานะขึ้น <strong>&quot;ออนไลน์ teamNN&quot;</strong> หรือ <strong>&quot;ออฟไลน์ (ทำงานต่อ)&quot;</strong></li>
<li>หมุน <strong>VR2 ลง</strong> (ดินแห้ง → ไฟปั๊ม) · หมุน <strong>VR3 ลง</strong> ต่ำกว่าอุณหภูมิห้อง (→ ไฟพัดลม) · <strong>เดินเข้าหาบอร์ด</strong> (→ INTRUDER) แล้วกด <strong>SW6</strong> · กด <strong>SW5 ค้าง</strong> (รดเอง) · แตะ <strong>&quot;ส่งรายงานเลย&quot;</strong></li>
<li>เปิดแอปของทีม <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/farm_monitor.py"><code>farm_monitor.py</code></a> หรือ <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/farm_web.html"><code>farm_web.html</code></a> ใส่ TEAM เดียวกัน → เห็นรายงาน · สั่ง <code>pump</code> <code>beep</code> แล้วบอร์ดตอบสนอง</li>
<li><strong>ปิด Hotspot กลางทาง</strong> — ฟาร์มยังตัดสินและเตือนได้ไหม?</li>
</ol>
</div>
</div>

<h2 id="%E0%B8%81%E0%B8%B4%E0%B8%88%E0%B8%81%E0%B8%A3%E0%B8%A3%E0%B8%A1-4--%E0%B8%AB%E0%B8%B1%E0%B8%A7%E0%B9%83%E0%B8%88%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%84%E0%B9%89%E0%B8%94-%E0%B8%81%E0%B8%8E%E0%B8%97%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B9%83%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7">กิจกรรม 4 — หัวใจของโค้ด: กฎทั้งฟาร์มในที่เดียว</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">decide</span>(<span class="hljs-params">f, near</span>):
    <span class="hljs-comment"># กฎทั้งฟาร์มในที่เดียว คืน True ตอนคอกเปลี่ยน (ผู้บุกรุกเข้า/ออก)</span>
    <span class="hljs-keyword">if</span> f.t <span class="hljs-keyword">is</span> <span class="hljs-keyword">not</span> <span class="hljs-literal">None</span>:                 <span class="hljs-comment"># อ่านอุณหภูมิไม่ได้ = พัดลมคงเดิม</span>
        f.fan = f.t &gt; f.fan_at <span class="hljs-keyword">or</span> (f.fan <span class="hljs-keyword">and</span> f.t &gt; f.fan_at - <span class="hljs-number">1</span>)   <span class="hljs-comment"># เย็นกว่าเกณฑ์ 1 C ถึงปิด</span>
    f.auto = f.soil &lt; PUMP_ON <span class="hljs-keyword">or</span> (f.auto <span class="hljs-keyword">and</span> f.soil &lt; PUMP_OFF)    <span class="hljs-comment"># ช่องตรงกลางกันปั๊มเปิดปิดรัว</span>
    f.streak = f.streak + <span class="hljs-number">1</span> <span class="hljs-keyword">if</span> near != f.inside <span class="hljs-keyword">else</span> <span class="hljs-number">0</span>            <span class="hljs-comment"># เรดาร์ต้องเห็นเหมือนเดิม 3 รอบติด</span>
    <span class="hljs-keyword">if</span> f.streak &lt; <span class="hljs-number">3</span>:                                              <span class="hljs-comment"># ถึงเชื่อ (กันใบไม้ไหว)</span>
        <span class="hljs-keyword">return</span> <span class="hljs-literal">False</span>
    f.inside, f.streak, f.silenced = near, <span class="hljs-number">0</span>, <span class="hljs-literal">False</span>
    f.count += near                     <span class="hljs-comment"># True นับเป็น 1 = นับเฉพาะตอนเข้า</span>
    <span class="hljs-keyword">return</span> <span class="hljs-literal">True</span>
</code></pre>
<div class="src"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py">sf3_05_farm_all_in_one.py</a> · decide() ในส่วน "3) สมอง (ตัดสินใจ) ไม่แตะฮาร์ดแวร์ ไม่แตะเน็ต"</div>
<div class="cols">
<div>
<ul>
<li><strong>ช่องกันกระพือ 2 ชุด</strong> (พัดลม 1 °C · ปั๊ม 35/45 %) + <strong>ยืนยัน 3 รอบ</strong> (เรดาร์) — เทคนิคของทั้งสาม Session อยู่ในฟังก์ชันเดียว</li>
<li><code>decide()</code> <strong>ไม่แตะฮาร์ดแวร์ ไม่แตะเน็ต</strong> → ทดสอบง่าย ยกไปใส่โปรเจกต์ได้ทั้งก้อน</li>
<li>ไฟล์แบ่ง 6 ส่วน: ตั้งค่า · ฮาร์ดแวร์ · สมอง · <strong>เครือข่าย</strong> · หน้าจอ · โปรแกรมหลัก</li>
</ul>
</div>
<div class="c40">
<div class="think">
<p><strong>ตาคุณ:</strong> เพิ่มกฎข้ามระบบใน <code>decide()</code> — <strong>&quot;มีผู้บุกรุก ห้ามเปิดปั๊ม&quot;</strong> แล้วส่ง event บอกแอปว่าปั๊มถูกล็อกเพราะอะไร</p>
</div>
</div>
</div>
</section>

<h1 id="%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C%E0%B8%97%E0%B8%B5%E0%B8%A1--smart-hmi-%E0%B8%AA%E0%B8%B3%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%9F%E0%B8%B2%E0%B8%A3%E0%B9%8C%E0%B8%A1%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%82%E0%B8%A5%E0%B8%88%E0%B8%B4%E0%B8%AA%E0%B8%95%E0%B8%B4%E0%B8%81%E0%B8%AA%E0%B9%8C%E0%B9%80%E0%B8%81%E0%B8%A9%E0%B8%95%E0%B8%A3">โปรเจกต์ทีม — Smart HMI สำหรับฟาร์มและโลจิสติกส์เกษตร</h1>
<div class="lead">เริ่มจาก "ปัญหา" ไม่ใช่ "เซนเซอร์" — แล้วนำเสนอบนบอร์ดจริงใน Project Showcase</div>
<div class="flow"><b>Sprint 0 · Canvas</b><i>→</i><b>Sprint 1 · MVP บนบอร์ด</b><i>→</i><b>Sprint 2 · แอป + ทดสอบ</b><i>→</i><b>ซ้อมพูด</b></div>
<div class="budget"><span>📝 Sprint 0 <b>15</b> นาที</span><span>🛠️ Sprint 1 <b>35</b> นาที</span><span>📡 Sprint 2 <b>25</b> นาที</span><span>🎤 ซ้อมพูด <b>10</b> นาที</span></div>
<div class="files one"><div><div class="fh">★ ทำในห้อง</div><div class="f"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/PROJECT_BRIEF_th.md">PROJECT_BRIEF_th.md</a> <span>— โจทย์ เกณฑ์ให้คะแนน และการนำเสนอ</span></div><div class="f"><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py">sf3_05_farm_all_in_one.py</a> <span>— แม่แบบ: คัดลอกแล้วแก้เป็นเรื่องของทีม</span></div></div></div>
<div class="chal">🏆 <b>ภายในวันนี้:</b> Project Canvas ผ่านการตรวจ + <b>MVP บนบอร์ดรันได้อย่างน้อยเสา 1–4</b></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="37" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B9%82%E0%B8%88%E0%B8%97%E0%B8%A2%E0%B9%8C%E0%B9%83%E0%B8%99%E0%B8%9B%E0%B8%A3%E0%B8%B0%E0%B9%82%E0%B8%A2%E0%B8%84%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%A7--%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1%E0%B8%88%E0%B8%B2%E0%B8%81-%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%83%E0%B8%8A%E0%B9%88-%E0%B9%80%E0%B8%8B%E0%B8%99%E0%B9%80%E0%B8%8B%E0%B8%AD%E0%B8%A3%E0%B9%8C">โจทย์ในประโยคเดียว — เริ่มจาก &quot;ปัญหา&quot; ไม่ใช่ &quot;เซนเซอร์&quot;</h2>
<div class="cols">
<div>
<blockquote>
<p>เลือก <strong>ปัญหาจริงหนึ่งข้อ</strong> ในฟาร์มหรือในการขนส่งผลผลิต แล้วสร้าง <strong>อุปกรณ์ Smart HMI</strong> บนบอร์ดที่วัดได้ ตัดสินใจเองได้ ส่งเสียงและไฟบอกคนหน้างาน ส่งข้อมูลขึ้น MQTT และมี <strong>แอปของทีมเอง</strong> (เว็บหรือมือถือ) ที่รับข้อมูล เก็บ เตือน และสั่งกลับได้</p>
</blockquote>
<div class="warn">
<p><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/274c.svg" data-marp-twemoji=""/> &quot;บอร์ดเรามีเรดาร์ เลยทำอะไรกับเรดาร์ดี&quot; — คำถามที่ผิด</p>
</div>
<div class="goal">
<p><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.2/assets/svg/2705.svg" data-marp-twemoji=""/> &quot;หัวหน้าคลังไม่รู้ว่าผลไม้เสียตอนไหนของเที่ยวขนส่ง&quot; — คำถามที่ถูก</p>
</div>
</div>
<div>
<p><strong>ข้อบังคับเรื่องความซื่อตรง</strong></p>
<ul>
<li>บอกให้ชัดว่าเซนเซอร์ไหน <strong>จริง</strong> และไหน <strong>จำลองด้วยลูกบิด</strong> (เช่น ความชื้นดิน ระดับน้ำ) — จำลองได้ แต่ต้องประกาศ</li>
<li>ถ้าใช้ Edge AI บอกว่าโมเดลในตัวบอร์ด <strong>ฝึกจากท่ามือคน/เสียงทั่วไป ไม่ใช่ข้อมูลฟาร์มจริง</strong> · เรียกโมเดลด้วย <strong>ชื่อ</strong> เท่านั้น</li>
<li>broker <code>broker.hivemq.com:1883</code> ไม่เข้ารหัส ใครก็อ่านหัวข้อเราได้ <strong>ห้ามส่งรหัสผ่านหรือข้อมูลส่วนตัว</strong></li>
<li>ตัวเลขเกณฑ์เป็นค่าสำหรับการเรียน ไม่ใช่คำแนะนำทางเกษตรกรรม ถ้าอ้างอิงค่าจริงให้บอกแหล่งที่มา</li>
<li>งานนี้เป็นต้นแบบเพื่อการเรียน <strong>ไม่ใช่อุปกรณ์ความปลอดภัยจริง</strong></li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-marpit-scope-6K2D0CD8="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="38" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B8%AB%E0%B9%89%E0%B8%B2%E0%B9%80%E0%B8%AA%E0%B8%B2%E0%B8%82%E0%B8%AD%E0%B8%87%E0%B9%82%E0%B8%9B%E0%B8%A3%E0%B9%80%E0%B8%88%E0%B8%81%E0%B8%95%E0%B9%8C--%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B9%88%E0%B8%B3%E0%B8%97%E0%B8%B5%E0%B9%88%E0%B8%97%E0%B8%B8%E0%B8%81%E0%B8%97%E0%B8%B5%E0%B8%A1%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87%E0%B8%A1%E0%B8%B5">ห้าเสาของโปรเจกต์ — ขั้นต่ำที่ทุกทีมต้องมี</h2>
<svg viewBox="0 0 1000 70" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <g font-size="17" text-anchor="middle" font-weight="700">
    <rect x="4" y="6" width="188" height="56" rx="10" fill="#e3f2fd" stroke="#1e88e5" stroke-width="3" /><text x="98" y="41" fill="#1565c0">🖥️ 1 · Smart HMI</text>
    <rect x="206" y="6" width="188" height="56" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3" /><text x="300" y="41" fill="#1b5e20">🌡️ 2 · เซนเซอร์</text>
    <rect x="408" y="6" width="188" height="56" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="3" /><text x="502" y="41" fill="#e65100">🎛️ 3 · ปุ่มตั้งค่า</text>
    <rect x="610" y="6" width="188" height="56" rx="10" fill="#f3e5f5" stroke="#8e24aa" stroke-width="3" /><text x="704" y="41" fill="#6a1b9a">🔊 4 · เสียง</text>
    <rect x="812" y="6" width="184" height="56" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="3" /><text x="904" y="41" fill="#37474f">📡 5 · MQTT + แอป</text>
  </g>
</svg>
<table>
<thead>
<tr>
<th>เสา</th>
<th>ขั้นต่ำที่ต้องมี</th>
<th>ไฟล์ตัวอย่างที่ใช้ได้</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1 · Smart HMI</strong> จอสัมผัส + จอไฟ RGB</td>
<td>หน้าจอเป็นเรื่องของทีม อ่านออกจากระยะหนึ่งเมตร มีป้ายสถานะ และมีการแตะอย่างน้อย 1 อย่าง (ปุ่ม/สวิตช์/แท็บบนจอ) ที่ทำงานจริง · จอไฟ RGB บอกสถานะที่เห็นได้จากไกล วาด <strong>เฉพาะตอนสถานะเปลี่ยน</strong></td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_05_my_farm_dashboard.py"><code>sf1_05</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_01_pen_guard.py"><code>sf3_01</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05</code></a></td>
</tr>
<tr>
<td><strong>2 · เซนเซอร์</strong></td>
<td>เซนเซอร์จริงบนบอร์ดอย่างน้อย 1 ตัว (SHT40 · DPS368 · BMI270 · เรดาร์ · ไมค์) · กฎหรือ AI ที่มีตัวกันเตือนผิด (hysteresis / ยืนยัน N ครั้ง / นับในช่วงเวลา / ความมั่นใจขั้นต่ำ) · ถ้าใช้ SHT40 ต้องตั้ง <code>TEMP_OFFSET</code> เทียบกับเทอร์โมมิเตอร์</td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_01_greenhouse_hello.py"><code>sf1_01</code></a>–<a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_04_tank_tilt.py"><code>sf1_04</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_01_pen_guard.py"><code>sf3_01</code></a>–<a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_04_ai_pump_doctor.py"><code>sf3_04</code></a></td>
</tr>
<tr>
<td><strong>3 · ปุ่มตั้งค่า</strong></td>
<td>ลูกบิด VR อย่างน้อย 1 ตัวเป็น &quot;ค่าตั้ง&quot; ที่มีเหตุผล (เช่น เกณฑ์) · ปุ่ม SW5 (ล่าง) / SW6 (บน) อย่างน้อย 1 ปุ่มที่มีหน้าที่ชัด (เช่น รับทราบ · รดน้ำเอง · เริ่มเที่ยว)</td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_03_auto_irrigation.py"><code>sf1_03</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05</code></a></td>
</tr>
<tr>
<td><strong>4 · เสียง</strong></td>
<td>เสียงอย่างน้อย 2 แบบ ต่างกันตามเหตุการณ์ ดัง <strong>เฉพาะตอนเกิดเหตุการณ์</strong></td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s1/sf1_02_crop_comfort.py"><code>sf1_02</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_02_coop_ears.py"><code>sf3_02</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05</code></a></td>
</tr>
<tr>
<td><strong>5 · MQTT + แอปของตัวเอง</strong></td>
<td>บอร์ดส่ง telemetry ขึ้น <code>bento-aiot/&lt;TEAM&gt;/telemetry</code> ไม่ถี่กว่าทุก 5 วินาที · ส่ง event อย่างน้อย 1 ชนิดขึ้น <code>.../event</code> · รับคำสั่งอย่างน้อย 1 ชนิดจาก <code>.../cmd</code> · <strong>เน็ตหลุดแล้วบอร์ดยังตัดสินและเตือนได้</strong> · แอปของทีมต่อยอดจาก Session 2 เพิ่มอย่างน้อย 1 อย่าง: เก็บ CSV · กฎเตือนฝั่งแอป (เช่น บอร์ดเงียบเกิน 15 วิ) · ปุ่มสั่งกลับบอร์ด · กราฟ</td>
<td><a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/sf2_02_greenhouse_report.py"><code>sf2_02</code></a>–<a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/sf2_04_crop_alert.py"><code>sf2_04</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/farm_monitor.py"><code>farm_monitor.py</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s2/app/farm_web.html"><code>farm_web.html</code></a></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-scope-cQS1ssZ7="" data-paginate="true" data-theme="default" lang="C" data-marpit-pagination="39" style="--paginate:true;--theme:default;" data-marpit-pagination-total="48">
<h2 id="%E0%B9%84%E0%B8%AD%E0%B9%80%E0%B8%94%E0%B8%B5%E0%B8%A2%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%95%E0%B9%89%E0%B8%99-8-%E0%B9%80%E0%B8%A3%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%87--%E0%B9%80%E0%B8%A5%E0%B8%B7%E0%B8%AD%E0%B8%81-%E0%B8%94%E0%B8%B1%E0%B8%94%E0%B9%81%E0%B8%9B%E0%B8%A5%E0%B8%87-%E0%B8%AB%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B8%84%E0%B8%B4%E0%B8%94%E0%B9%80%E0%B8%AD%E0%B8%87%E0%B8%81%E0%B9%87%E0%B9%84%E0%B8%94%E0%B9%89">ไอเดียตั้งต้น 8 เรื่อง — เลือก ดัดแปลง หรือคิดเองก็ได้</h2>
<div class="tiles">
<div class="tile">
<b class="t">🧊 1 กล่องขนส่งผลไม้ห้องเย็น</b>
<span class="chip r">ปัญหา</span> ผลไม้เสียระหว่างขนส่ง ไม่รู้ว่าร้อนเกิน/ถูกกระแทกช่วงไหน<br />
<span class="chip s">วัด</span> SHT40 + BMI270 กระแทก · VR3 เกณฑ์ · SW5 เริ่มเที่ยว · SW6 รับทราบ<br />
<span class="chip a">ทำ</span> score = จำนวนกระแทก · event "too_hot" · แอปเก็บ CSV ต่อเที่ยว
</div>
<div class="tile">
<b class="t">🚚 2 รถส่งผลผลิตถึงตลาด</b>
<span class="chip r">ปัญหา</span> ลูกค้าอ้างว่าของมาช้า/ช้ำ ไม่มีหลักฐาน<br />
<span class="chip s">วัด</span> BMI270 ถนนขรุขระ + SHT40 ในกระบะ · SW6 "ส่งมอบแล้ว"<br />
<span class="chip a">ทำ</span> event "delivered" · matrix เขียว = ส่งแล้ว · แอปบันทึกเวลาส่งมอบ
</div>
<div class="tile">
<b class="t">🌾 3 ไซโลข้าวเปลือก/เมล็ดพันธุ์</b>
<span class="chip r">ปัญหา</span> ชื้นแล้วขึ้นรา · คนลงไซโลคนเดียวเสี่ยงอันตราย<br />

<p><strong>บอร์ดหรือเน็ตมีปัญหาหน้างาน:</strong> ใช้คลิปสำรองได้ แต่หมวด &quot;การนำเสนอ สาธิตสด และหลักฐานทดสอบ&quot; ได้ไม่เกินครึ่ง · ถ้าเน็ตล่มทั้งห้อง ผู้สอนประเมินเสา 5 จากคลิปโดยไม่หักคะแนน</p>
</div>
</div>
<div>
<p><strong>ช่อง 8 นาทีต่อทีม = สาธิต 5–6 นาที + ถาม-ตอบ 2 นาที</strong> · กริ่งเตือนที่ <strong>5:00</strong> · <strong>ตัดที่ 6:00</strong> · ทีมถัดไปเตรียมบอร์ด/Hotspot ระหว่างทีมก่อนหน้าตอบคำถาม</p>
<p><strong>ลำดับที่แนะนำ (ทุกคนในทีมต้องได้พูด)</strong></p>
<ul>
<li><strong>0:00–0:30 ปัญหา</strong> — ใครเสียอะไร เท่าไร</li>
<li><strong>0:30–1:15 ทางแก้</strong> — Canvas + ผังห้าเสา บอร์ด → broker → แอป → คำสั่งกลับ</li>
<li><strong>1:15–4:15 สาธิตสดบนบอร์ดจริง</strong> — ปกติ → เกิดเหตุ (เสียง + matrix + จอ) → กรณี &quot;ไม่ควรเตือน&quot; → ปรับ VR / กด SW5·SW6 → แอปเห็น telemetry + event → สั่งกลับจากแอป</li>
<li><strong>4:15–5:15 หลักฐาน</strong> — ตารางทดสอบ ตัวเลข &quot;วิธีวัดว่าได้ผล&quot; และสิ่งที่ยังไม่ดี</li>
<li><strong>5:15–6:00 คุณค่า</strong> — ใครจะจ่ายเงิน/ประหยัดอะไร ขยายได้แค่ไหน</li>
<li><strong>ถาม-ตอบ</strong> — ถามทุกคนในทีม อย่างน้อยหนึ่งคำถามเรื่องโค้ด</li>
</ul>
</div>
</div>
</section>

<h2 id="%E0%B8%AD%E0%B9%89%E0%B8%B2%E0%B8%87%E0%B8%AD%E0%B8%B4%E0%B8%87%E0%B9%81%E0%B8%A5%E0%B8%B0%E0%B9%80%E0%B8%84%E0%B8%A3%E0%B8%94%E0%B8%B4%E0%B8%95">อ้างอิงและเครดิต</h2>

<p><strong>ภาพที่ทำขึ้นเองสำหรับคอร์สนี้:</strong> ปก · อินโฟกราฟิกทุกภาพที่วาดด้วย SVG/HTML (ตัวกันเตือนผิด 4 แบบ, ช่องระยะของเรดาร์, ค่ากลาง + ยืนยัน N ครั้ง, ยอดเสียงกับความดัง, หน้าต่างเวลา 30 วินาที, ขนาดความเร่ง, เรียนรู้ค่าปกติ, Smart IoT Gateway, ห้าเสา) — <strong>เป็นภาพประกอบแนวคิด ไม่ใช่ค่าที่วัดจริง</strong></p>
<p><strong>ภาพหน้าจอทุกภาพจาก BENTO Emulator</strong> (ค่าเซนเซอร์และเสียงเป็นค่าจำลอง) ถ่ายจากไฟล์ตัวอย่าง <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_01_pen_guard.py"><code>sf3_01</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_02_coop_ears.py"><code>sf3_02</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_03_pump_vibration.py"><code>sf3_03</code></a> · <a href="https://github.com/Advance-Innovation-Centre-AIC/aiot-development-for-smart-farm/blob/main/s3/sf3_05_farm_all_in_one.py"><code>sf3_05</code></a></p>
<p><strong>วิดีโอ (YouTube — ลิขสิทธิ์เป็นของเจ้าของช่อง ใช้ด้วยการฝัง/ลิงก์)</strong></p>
<ul>
<li><a href="https://www.youtube.com/watch?v=XJ6JhB8wOPU">What is mmWave sensing? | Mouser Electronics | Texas Instruments</a> — Mouser · 2:14</li>

<style>
.bento-nav{position:fixed;z-index:99999;font-family:"IBM Plex Sans Thai","Noto Sans Thai",-apple-system,Segoe UI,sans-serif;
  font-weight:700;font-size:14px;line-height:1;text-decoration:none;padding:9px 15px;border-radius:999px;
  background:rgba(13,17,23,.82);color:#71C7EC;border:1px solid rgba(120,200,255,.42);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);box-shadow:0 3px 14px rgba(0,0,0,.35);
  transition:background .15s,color .15s,transform .15s;user-select:none}
.bento-nav:hover{background:#71C7EC;color:#0d1117;transform:translateY(-1px)}
.bento-nav.toc{top:14px;left:14px}
.bento-nav.next{bottom:16px;right:16px}
.bento-nav.prev{bottom:16px;left:16px;color:#93a0bd;border-color:rgba(147,160,189,.4)}
.bento-nav.prev:hover{background:#93a0bd;color:#0d1117}
@media print{.bento-nav{display:none !important}}
/* lightbox: คลิกภาพในเด็คเพื่อดูใหญ่ (คำสั่งอาจารย์ 2026-08-20) */
svg[data-marpit-svg] section img{cursor:zoom-in}
#bento-lightbox{position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,14,.9);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:zoom-out}
#bento-lightbox.open{display:flex}
#bento-lightbox img{max-width:94vw;max-height:92vh;border-radius:10px;box-shadow:0 12px 48px rgba(0,0,0,.6);
  background:#0d1117;cursor:default}
#bento-lightbox-close{position:fixed;top:14px;right:16px;z-index:100001;font:700 20px/1 sans-serif;
  color:#e6edf3;background:rgba(13,17,23,.82);border:1px solid rgba(120,200,255,.42);border-radius:999px;
  width:44px;height:44px;cursor:pointer}
#bento-lightbox-close:hover{background:#71C7EC;color:#0d1117}
@media print{#bento-lightbox{display:none !important}}
</style>


<div id="bento-lightbox" role="dialog" aria-modal="true" aria-label="ดูภาพขยาย">
  <button id="bento-lightbox-close" aria-label="ปิด" title="ปิด (Esc)">&#10005;</button>
  <img id="bento-lightbox-img" alt="">
</div>
<script>
(function(){
  var box = document.getElementById('bento-lightbox');
  var big = document.getElementById('bento-lightbox-img');
  function close(){ box.classList.remove('open'); big.src = ''; }
  document.addEventListener('click', function(e){
    var t = e.target;
    if (t === big) { e.stopPropagation(); return; }        /* คลิกบนภาพใหญ่ = เฉย ๆ */
    if (t.closest && t.closest('#bento-lightbox')) {       /* ฉากหลังหรือปุ่ม = ปิด */
      e.stopPropagation(); close(); return;
    }
    var img = t.closest ? t.closest('svg[data-marpit-svg] section img') : null;
    if (!img || !img.src) return;
    big.src = img.currentSrc || img.src;
    big.alt = img.alt || '';
    box.classList.add('open');
    e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && box.classList.contains('open')) { close(); e.stopPropagation(); }
  }, true);
})();
</script>
